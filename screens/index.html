<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1,000 Screens — the growing collection</title><style>body{background:#0b0e14;color:#e8e6df;font-family:system-ui,sans-serif;margin:0;padding:16px}h1{font-size:22px;margin:4px 0}p.sub{color:#9aa3b2;margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr;gap:18px}@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}figure{margin:0;background:#141926;border-radius:10px;overflow:hidden}figure img{width:100%;display:block;image-rendering:pixelated;background:#000}figcaption{padding:8px 12px;font-size:14px;color:#c9cfda}footer{color:#7c8494;font-size:12px;margin-top:24px;line-height:1.5}</style></head><body>
<h1>1,000 Screens</h1>
<p class="sub" id="count">Loading the collection…</p>
<div class="grid" id="grid"></div>
<footer>Reference gallery. All artwork © its respective owners; fan-archived screenshots and stage rips shown for reference and study. The Top 100 build queue lives on the <a href="../art/" style="color:#8ab4ff">Best Game Screens page</a>.</footer>
<script>
Promise.all([fetch('screens-a.json').then(r=>r.json()),fetch('screens-b.json').then(r=>r.json())]).then(([a,b])=>{
const all=a.concat(b);
document.getElementById('count').textContent=all.length+' verified screens banked — growing to 1,000. Every one is what the player sees; never a map.';
const g=document.getElementById('grid');
g.innerHTML=all.map(r=>'<figure><a href="'+r.image_url+'" target="_blank" rel="noopener"><img loading="lazy" src="'+r.image_url+'" onerror="this.closest(\'figure\').style.display=\'none\'"></a><figcaption>'+r.game+' — '+r.name+'</figcaption></figure>').join('');
});
</script></body></html>
