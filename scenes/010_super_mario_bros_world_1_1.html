<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World 1-1 — Super Mario Bros. Interactive</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071426;
      font-family: "Arial", sans-serif;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud {
      position: fixed; top: 18px; left: 18px; z-index: 10;
      padding: 14px 16px; color: #fff;
      background: rgba(10, 28, 48, .82);
      border: 2px solid #f5c75b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      user-select: none;
    }
    .hud h1 { margin: 0 0 5px; font-size: 19px; letter-spacing: .08em; }
    .hud p { margin: 0; color: #b9d9ee; font-size: 12px; }
    .controls {
      position: fixed; left: 18px; bottom: 18px; z-index: 10;
      padding: 10px 13px; color: #e8f6ff;
      background: rgba(10, 28, 48, .82);
      border: 2px solid #f5c75b;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
    .controls b { color: #ffe5a4; }
    .worlds {
      position: fixed; right: 18px; bottom: 18px; z-index: 10;
      display: flex; gap: 7px;
      padding: 8px;
      background: rgba(10, 28, 48, .82);
      border: 2px solid #f5c75b;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    .worlds button {
      min-width: 52px; padding: 8px 10px;
      color: #0b2339;
      background: #f5c75b;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 800;
    }
    .worlds button:hover { transform: translateY(-1px); }
    .worlds button.active { color: #071b2f; }
    .worlds button.done { opacity: .45; }
    .worlds button:disabled { cursor: default; }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      color: #fff;
      background: #071426;
      transition: opacity .5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .loader {
      text-align: center;
      font-size: 18px;
      letter-spacing: .15em;
    }
    .loader span {
      display: block; width: 100%; height: 4px;
      margin-top: 12px;
      overflow: hidden;
      background: #17314a;
    }
    .loader i {
      display: block; width: 50%; height: 100%;
      background: #ffca58;
      animation: load 1.2s ease-in-out infinite alternate;
    }
    @keyframes load { from { transform: translateX(-15%); } to { transform: translateX(135%); } }
    @media (max-width: 700px) {
      .hud { top: 10px; left: 10px; }
      .hud h1 { font-size: 15px; }
      .hud p { font-size: 10px; }
      .controls { left: 10px; bottom: 10px; max-width: calc(100vw - 20px); }
      .worlds { right: 10px; bottom: 10px; left: 10px; justify-content: center; }
      .worlds button { min-width: 44px; padding: 8px; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <h1>Super Mario Bros. — World 1-1</h1>
  <p id="story">Walk through the mushroom field, collect coins, grab mushrooms, and reach the Warp Zone.</p>
</div>

<div class="controls">
  <b>Drag</b> to orbit · <b>Scroll</b> to zoom<br />
  <b>WASD</b> / <b>Arrow keys</b> to move · <b>Q/E</b> or <b>Shift</b> to jump<br />
  <b>Space</b> to respawn · <b>R</b> to reset world
</div>

<div class="worlds" id="worlds">
  <button data-world="1-1" class="active">1-1</button>
  <button data-world="1-2">1-2</button>
  <button data-world="1-3">1-3</button>
  <button data-world="1-4">1-4</button>
  <button data-world="2-1">2-1</button>
  <button data-world="2-2">2-2</button>
  <button data-world="2-3">2-3</button>
  <button data-world="2-4">2-4</button>
  <button data-world="3-1">3-1</button>
  <button data-world="3-2">3-2</button>
  <button data-world="3-3">3-3</button>
  <button data-world="3-4">3-4</button>
  <button data-world="4-1">4-1</button>
  <button data-world="4-2">4-2</button>
  <button data-world="4-3">4-3</button>
  <button data-world="4-4">4-4</button>
</div>

<div id="loading">
  <div class="loader">
    WORLD 1-1
    <span><i></i></span>
  </div>
