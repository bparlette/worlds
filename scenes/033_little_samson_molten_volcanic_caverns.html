<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molten Volcanic Caverns — Little Samson</title>
<style>
  :root {
    color-scheme: dark;
    font-family: "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #080402;
  }

  #scene {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: #ffcf66;
    text-shadow: 0 2px 12px #000;
    user-select: none;
  }

  #title {
    position: absolute;
    top: 28px;
    left: 32px;
    padding: 12px 16px 10px;
    border: 1px solid rgba(255, 190, 70, .45);
    background: linear-gradient(180deg, rgba(255, 165, 25, .1), rgba(0, 0, 0, .7));
    font-size: 18px;
    font-weight: bold;
    letter-spacing: .08em;
  }

  #title span {
    display: block;
    margin-top: 5px;
    color: #ffd277;
    font-size: 9px;
    letter-spacing: .18em;
  }

  #help {
    position: absolute;
    right: 24px;
    bottom: 22px;
    font-size: 10px;
    line-height: 1.6;
    text-align: right;
  }

  #status {
    position: absolute;
    left: 32px;
    bottom: 24px;
    font-size: 10px;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(0,0,0,.22) 4px);
    mix-blend-mode: screen;
  }

  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 42%, rgba(0,0,0,.65) 100%);
  }

  @media (max-width: 700px) {
    #title { top: 14px; left: 14px; }
    #help { right: 12px; bottom: 12px; }
    #status { left: 14px; bottom: 14px; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div id="title">
    <div>MOLEVOLE</div>
    <span>Little Samson · Volcanic Caverns</span>
  </div>
  <div id="status">LEVEL 01 — HEAT 064% · DEEP UNDERGROUND</div>
  <div id="help">
    DRAG TO ORBIT<br>
    SCROLL TO ZOOM<br>
    WASD TO MOVE
  </div>
</div>

<div class="scanlines"></div>
<div id="vignette"></div>

<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090402);
scene.fog = new THREE.FogExp2(0x1b0b05, 0.072);

const camera = new THREE.PerspectiveCamera(
  48,
  innerWidth / innerHeight,
  0.1,
  120
);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);

const clock = new THREE.Clock();
const particles = [];
const embers = [];
const dust = [];
const rocks = [];
const stalactites = [];
const stalagmites = [];
const animatedLamps = [];
const movingPlatforms = [];
const hitTargets = [];

const materials = {
  rock: new THREE.MeshStandardMaterial({
    color: 0x351c16,
    roughness: .93,
    metalness: .02
  }),
  darkRock: new THREE.MeshStandardMaterial({
    color: 0x170d09,
    roughness: 1
  }),
  ash: new THREE.MeshStandardMaterial({
    color: 0x4a3027,
    roughness: .95
  }),
  coal: new THREE.MeshStandardMaterial({
    color: 0x24110e,
    roughness: .72,
    metalness: .12
  }),
  orange: new THREE.MeshStandardMaterial({
    color: 0xff6a13,
    emissive: 0xff2b00,
    emissiveIntensity: 2.2,
    roughness: .55
  }),
  yellow: new THREE.MeshStandardMaterial({
    color: 0xffd25b,
    emissive: 0xff7b12,
    emissiveIntensity: 1.7,
    roughness: .48
  }),
  caveWall: new THREE.MeshStandardMaterial({
    color: 0x28130d,
    roughness: 1
  })
};

function box(w, h, d, material, x, y, z, parent = world) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(rt, rb, h, material, x, y, z, parent = world, segments = 14) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segments), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cone(rt, rb, h, material, x, y, z, parent = world, segments = 10) {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(rt, h, segments), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function makeRock(x, y, z, scale, material = materials.rock, parent = world) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.scale.setScalar(scale);

  const main = cone(
    .75,
    1.35,
    1.8,
    material,
    0,
    0,
    0,
    group,
    7
  );
  main.rotation.y = Math.random() * Math.PI;

  const cap = cone(
    .45,
    .8,
    .8,
    materials.darkRock,
    0,
    .75,
    0,
    group,
    7
  );
  cap.rotation.y = main.rotation.y;

  const chunk = cone(
    .4,
    .65,
    1.1,
    materials.ash,
    .25,
    -.1,
    .12,
    group,
    6
  );
  chunk.rotation.z = (Math.random() - .5) * .8;

  group.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });

  world.add(group);
  rocks.push(group);
  return group;
}

function makeStalactite(x, y, z, length, material = materials.darkRock) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const shaft = cylinder(
    .08,
    .18,
    length,
    material,
    0,
    -length / 2,
    0,
    group,
    7
  );
  shaft.rotation.z = (Math.random() - .5) * .22;

  const tip = cone(
    .18,
    .04,
    .25,
    materials.ash,
    0,
    -length,
    0,
    group,
    7
  );
  tip.rotation.z = shaft.rotation.z;

  world.add(group);
  stalactites.push(group);
  return group;
}

function makeStalagmite(x, y, z, length, material = materials.darkRock) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const shaft = cylinder(
    .18,
    .08,
    length,
    material,
    0,
    length / 2,
    0,
    group,
    7
  );
  shaft.rotation.z = (Math.random() - .5) * .2;

  const tip = cone(
    .2,
    .04,
    .25,
    materials.ash,
    0,
    length,
    0,
    group,
    7
  );
  tip.rotation.z = shaft.rotation.z;

  world.add(group);
  stalagmites.push(group);
  return group;
}

function makeLamp(x, y, z, parent = world) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const stand = cylinder(.035, .06, .65, materials.coal, 0, .32, 0, group, 7);
  const cap = cylinder(.16, .08, .18, materials.coal, 0, .7, 0, group, 7);
  cap.rotation.y = .4;

  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(.12, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffb545 })
  );
  bulb.position.y = .86;
  group.add(bulb);

  const glow = new THREE.PointLight(0xff7a24, 4.2, 5.5, 2);
  glow.position.y = .88;
  group.add(glow);

  world.add(group);
  animatedLamps.push({ group, bulb, glow, phase: Math.random() * 6.28 });
  return group;
}

function makeMoltenBlob(x, y, z, radius, parent = world) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const blob = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 18, 12),
    materials.orange
  );
  blob.scale.set(1, .62, .72);
  blob.castShadow = true;
  group.add(blob);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(radius * .47, 12, 8),
    materials.yellow
  );
  core.position.y = .08;
  core.scale.set(1, .55, .7);
  group.add(core);

  world.add(group);
  animatedLamps.push({
    group,
    blob,
    core,
    glow: new THREE.PointLight(0xff3b08, 5, 6, 2),
    phase: Math.random() * 6.28
  });
  return group;
}

function makeEmber(parent = world) {
  const ember = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.06, 0),
    materials.yellow
  );
  ember.scale.set(1, .45, 1);
  parent.add(ember);

  const light = new THREE.PointLight(0xff5a0a, 1.4, 2.2, 2);
  parent.add(light);

  embers.push({
    mesh: ember,
    light,
    speed: .65 + Math.random() * 1.1,
    drift: Math.random() * Math.PI * 2,
    phase: Math.random() * 6.28
  });
  return ember;
}

function makeAshParticle(parent = world) {
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(.025 + Math.random() * .035, 0),
    materials.ash
  );
  parent.add(mesh);

  const light = new THREE.PointLight(0x7b3810, .35, 1.7, 2);
  parent.add(light);

  dust.push({
    mesh,
    light,
    speed: .18 + Math.random() * .3,
    drift: Math.random() * Math.PI * 2,
    phase: Math.random() * 6.28
  });
  return mesh;
}

function makeMoltenDrip(parent = world) {
  const group = new THREE.Group();

  const drop = new THREE.Mesh(
    new THREE.SphereGeometry(.12, 10, 8),
    materials.orange
  );
  drop.scale.set(.55, 1.8, .55);
  drop.position.y = -.35;
  group.add(drop);

  const glow = new THREE.PointLight(0xff3b08, 1.3, 1.8, 2);
  group.add(glow);

  parent.add(group);
  animatedLamps.push({ group, drop, glow, phase: Math.random() * 6.28 });
  return group;
}

function makePlatform(x, y, z, size, material = materials.ash) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const deck = box(size, .18, size, material, 0, 0, 0, group);
  deck.receiveShadow = true;

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(size * .38, .055, 6, 24),
    materials.orange
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = .12;
  group.add(ring);

  world.add(group);
  movingPlatforms.push({
    group,
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    speed: .18 + Math.random() * .25
  });
  return group;
}

function makeTallFlame(x, y, z, scale = 1) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.scale.setScalar(scale);

  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(.38, 1.8, 8),
    new THREE.MeshBasicMaterial({
      color: 0xff6b12,
      transparent: true,
      opacity: .82,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  flame.position.y = 1.1;
  group.add(flame);

  const inner = new THREE.Mesh(
    new THREE.ConeGeometry(.18, 1.2, 8),
    new THREE.MeshBasicMaterial({
      color: 0xffe06a,
      transparent: true,
      opacity: .78,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  inner.position.y = 1.25;
  group.add(inner);

  const light = new THREE.PointLight(0xff4b08, 7, 5, 2);
  light.position.y = .9;
  group.add(light);

  world.add(group);
  animatedLamps.push({ group, flame, inner, light, phase: Math.random() * 6.28 });
  return group;
}

function makeCaveWall(x, y, z, width, height, depth, material = materials.caveWall) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const wall = box(width, height, depth, material, 0, 0, 0, group);
  wall.receiveShadow = true;

  for (let i = 0; i < 7; i++) {
    const bump = cone(
      .18 + Math.random() * .25,
      .25 + Math.random() * .35,
      .35,
      materials.rock,
      (Math.random() - .5) * width,
      Math.random() * .25,
      depth / 2 + .05,
      group,
      7
    );
    bump.rotation.z = (Math.random() - .5) * .3;
  }

  world.add(group);
  return group;
}

function makeFloorMaze() {
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 28),
    materials.darkRock
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -.08;
  floor.receiveShadow = true;
  world.add(floor);

  const path = new THREE.Mesh(
    new THREE.PlaneGeometry(3.1, 23),
    materials.ash
  );
  path.rotation.x = -Math.PI / 2;
  path.position.set(0, -.055, 1);
  path.receiveShadow = true;
  world.add(path);

  const side = new THREE.Mesh(
    new THREE.PlaneGeometry(25, 3.2),
    materials.rock
  );
  side.rotation.x = -Math.PI / 2;
  side.position.set(0, -.05, -15.5);
  side.receiveShadow = true;
  world.add(side);

  const cross = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 3.2),
    materials.rock
  );
  cross.rotation.x = -Math.PI / 2;
  cross.position.set(0, -.045, 11.5);
  cross.receiveShadow = true;
  world.add(cross);

  for (let i = 0; i < 14; i++) {
    makeRock(
      (Math.random() - .5) * 31,
      .15 + Math.random() * .3,
      -19 + Math.random() * 35,
      .45 + Math.random() * 1.35
    );
  }

  for (let i = 0; i < 10; i++) {
    makeRock(
      (Math.random() - .5) * 26,
      .15,
      16 + Math.random() * 12,
      .45 + Math.random() * 1.2,
      materials.darkRock
    );
  }
}

function makeLamps() {
  makeLamp(-5.4, .55, -8.5);
  makeLamp(4.8, .55, -8.5);
  makeLamp(-4.8, .55, 9.5);
  makeLamp(4.8, .55, 9.5);
  makeLamp(-1.8, .55, 15.5);
  makeLamp(1.8, .55, 15.5);
}

function makeMoltenCavern() {
  makeMoltenBlob(-4.6, .5, -8.3, 2.2);
  makeMoltenBlob(4.6, .5, -8.3, 1.8);
  makeMoltenBlob(-4.8, .5, 8.4, 1.55);
  makeMoltenBlob(4.8, .5, 8.4, 1.35);
}

function makeFlames() {
  makeTallFlame(-2.8, 1.8, -11.5, 1.2);
  makeTallFlame(2.8, 1.8, -11.5, 1.2);
  makeTallFlame(-2.7, 1.8, 11.5, .95);
  makeTallFlame(2.7, 1.8, 11.5, .95);
  makeTallFlame(0, 1.8, 16.5, .75);
}

function makeDecorativeRocks() {
  for (let i = 0; i < 28; i++) {
    const side = Math.random() > .5 ? 1 : -1;
    makeRock(
      side * (6 + Math.random() * 11),
      .25 + Math.random() * .5,
      -17 + Math.random() * 31,
      .35 + Math.random() * .9,
      i % 3 === 0 ? materials.ash : materials.rock
    );
  }

  for (let i = 0; i < 12; i++) {
    makeRock(
      (Math.random() - .5) * 22,
      .2 + Math.random() * .4,
      17 + Math.random() * 8,
      .35 + Math.random() * .8,
      materials.darkRock
    );
  }
}

function makeStalactites() {
  for (let i = 0; i < 24; i++) {
    const side = Math.random() > .5 ? 1 : -1;
    makeStalactite(
      side * (3 + Math.random() * 10),
      4.4 + Math.random() * 2,
      -15 + Math.random() * 28,
      1.2 + Math.random() * 3.2,
      i % 4 === 0 ? materials.rock : materials.darkRock
    );
  }

  for (let i = 0; i < 12; i++) {
    makeStalagmite(
      (Math.random() - .5) * 20,
      3.5 + Math.random(),
      15 + Math.random() * 10,
      1 + Math.random() * 2.8,
      materials.darkRock
    );
  }
}

function makeAshAndEmbers() {
  for (let i = 0; i < 110; i++) {
    const x = (Math.random() - .5) * 26;
    const y = .2 + Math.random() * 6;
    const z = -18 + Math.random() * 32;
    makeAshParticle(world);
    embers.push(makeEmber(world));
    dust.push({
      mesh: makeAshParticle(world),
      light: new THREE.PointLight(0x7d3915, .22, 1.6, 2),
      speed: .1 + Math.random() * .25,
      drift: Math.random() * Math.PI * 2,
      phase: Math.random() * 6.28
    });
  }

  for (let i = 0; i < 18; i++) {
    makeMoltenDrip(world);
  }
}

function makeDistantWall() {
  makeCaveWall(0, 3.5, -18, 28, 7, 2.5);
  makeCaveWall(-14, 2.2, -18, 7, 5, 2.5);
  makeCaveWall(14, 2.2, -18, 7, 5, 2.5);
}

function makeForeground() {
  makeCaveWall(-11, 2.2, 15, 7, 5.5, 2.2);
  makeCaveWall(11, 2.2, 15, 7, 5.5, 2.2);
}

function makeMoltenBridge() {
  const bridge = new THREE.Group();
  bridge.position.set(0, 1.05, 10.5);

  const deck = box(4.3, .35, 2.4, materials.orange, 0, 0, 0, bridge);
  deck.receiveShadow = true;

  for (let i = 0; i < 8; i++) {
    const x = -1.8 + i * .45;
    const rail = box(.12, .25, 2.2, materials.yellow, x, .18, 0, bridge);
    rail.castShadow = true;
  }

  world.add(bridge);
  movingPlatforms.push({
    group: bridge,
    baseY: 1.05,
    phase: Math.random() * Math.PI * 2,
    speed: .13
  });
}

function makeCenterMoltenPool() {
  const pool = new THREE.Group();
  pool.position.set(0, .45, 3.8);

  const poolMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3.2, 24, 12),
    materials.orange
  );
  poolMesh.scale.set(1, .32, .72);
  poolMesh.castShadow = true;
  pool.add(poolMesh);

  const center = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 18, 10),
    materials.yellow
  );
  center.scale.set(1, .4, .65);
  pool.add(center);

  const glow = new THREE.PointLight(0xff4a08, 10, 8, 2);
  pool.add(glow);

  world.add(pool);
  animatedLamps.push({
    group: pool,
    poolMesh,
    center,
    glow,
    phase: 0
  });
}

function makeLamps() {
  makeLamp(-5.2, .55, -8.5);
  makeLamp(5.2, .55, -8.5);
  makeLamp(-5.2, .55, 9.5);
  makeLamp(5.2, .55, 9.5);
  makeLamp(-1.5, .55, 15.5);
  makeLamp(1.5, .55, 15.5);
}

function makeMoltenCavern() {
  makeMoltenBlob(-4.5, .5, -8.2, 2.05);
  makeMoltenBlob(4.5, .5, -8.2, 1.75);
  makeMoltenBlob(-4.7, .5, 8.4, 1.5);
  makeMoltenBlob(4.7, .5, 8.4, 1.35);
}

function makeFlames() {
  makeTallFlame(-3, 1.8, -11.5, 1.15);
  makeTallFlame(3, 1.8, -11.5, 1.15);
  makeTallFlame(-2.8, 1.8, 11.5, .9);
  makeTallFlame(2.8, 1.8, 11.5, .9);
  makeTallFlame(0, 1.8, 16.5, .7);
}

function makeDecorativeRocks() {
  for (let i = 0; i < 30; i++) {
    const side = Math.random() > .5 ? 1 : -1;
    makeRock(
      side * (6 + Math.random() * 12),
      .25 + Math.random() * .45,
      -18 + Math.random() * 34,
      .35 + Math.random() * 1.1,
      i % 4 === 0 ? materials.ash : materials.rock
    );
  }

  for (let i = 0; i < 14; i++) {
    makeRock(
      (Math.random() - .5) * 21,
      .2 + Math.random() * .4,
      17 + Math.random() * 8,
      .35 + Math.random() * .8,
      materials.darkRock
    );
  }
}

function makeStalactites() {
  for (let i = 0; i < 30; i++) {
    const side = Math.random() > .5 ? 1 : -1;
    makeStalactite(
      side * (3 + Math.random() * 11),
      4.2 + Math.random() * 2.2,
      -16 + Math.random() * 30,
      1.1 + Math.random() * 3.1,
      i % 4 === 0 ? materials.rock : materials.darkRock
    );
  }

  for (let i = 0; i < 14; i++) {
    makeStalagmite(
      (Math.random() - .5) * 20,
      3.4 + Math.random(),
      15 + Math.random() * 10,
      1 + Math.random() * 2.7,
      materials.darkRock
    );
  }
}

function makeAshAndEmbers() {
  for (let i = 0; i < 120; i++) {
    const x = (Math.random() - .5) * 27;
    const y = .2 + Math.random() * 6;
    const z = -18 + Math.random() * 34;
    makeAshParticle(world);
    embers.push(makeEmber(world));
    dust.push({
      mesh: makeAshParticle(world),
      light: new THREE.PointLight(0x804018, .24, 1.8, 2),
      speed: .12 + Math.random() * .28,
      drift: Math.random() * Math.PI * 2,
      phase: Math.random() * 6.28
    });
  }

  for (let i = 0; i < 20; i++) {
    makeMoltenDrip(world);
  }
