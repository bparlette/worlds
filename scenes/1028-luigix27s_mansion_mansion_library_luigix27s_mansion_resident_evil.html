<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Library — Three.js</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11100d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .title {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      color: #f1dfbd;
      pointer-events: none;
      text-shadow: 0 2px 12px #000;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 42px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title p {
      margin: 7px 0 0;
      color: #c8a977;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hint {
      position: fixed;
      right: 22px;
      bottom: 18px;
      z-index: 10;
      padding: 9px 12px;
      border: 1px solid rgba(241, 223, 189, 0.2);
      border-radius: 8px;
      color: #d8c39a;
      background: rgba(24, 20, 15, 0.62);
      backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .title {
        top: 16px;
        left: 18px;
      }

      .hint {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <div class="title">
    <h1>Library</h1>
    <p>A voxel mystery</p>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ------------------------------------------------------------
    // Renderer and scene
    // ------------------------------------------------------------
    const container = document.getElementById("scene");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x251e18);
    scene.fog = new THREE.FogExp2(0x251e18, 0.025);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    // ------------------------------------------------------------
    // Custom orbit controls
    // ------------------------------------------------------------
    const controls = {
      target: new THREE.Vector3(0, 2.2, 0),
      radius: 15.5,
      theta: 0.72,
      phi: 1.18,
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);
      camera.position.set(
        controls.target.x + controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z + controls.radius * sinPhi * Math.cos(controls.theta)
      );
      camera.lookAt(controls.target);
    }

    updateCamera();

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.dragging = true;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;

      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      controls.theta -= dx * 0.006;
      controls.phi = THREE.MathUtils.clamp(
        controls.phi - dy * 0.005,
        0.55,
        1.48
      );

      updateCamera();
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      controls.dragging = false;
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      controls.dragging = false;
    });

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius + event.deltaY * 0.012,
          8.5,
          24
        );
        updateCamera();
      },
      { passive: false }
    );

    // ------------------------------------------------------------
    // Materials
    // ------------------------------------------------------------
    const material = (color, roughness = 0.85, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    const mats = {
      wall: material(0x766044),
      wallDark: material(0x493a2b),
      trim: material(0xb39a68),
      trimLight: material(0xd4b982),
      floor: material(0x9b896b),
      floorDark: material(0x6e604d),
      rug: material(0x6e2632),
      rugGold: material(0xc78b3c),
      rugDark: material(0x35141c),
      wood: material(0x69452f),
      woodLight: material(0x9a6b43),
      woodDark: material(0x38271d),
      green: material(0x244d3d),
      greenDark: material(0x17362d),
      blue: material(0x29466b),
      blueDark: material(0x182c43),
      red: material(0x7e2d35),
      cream: material(0xe1d1aa),
      paper: material(0xf1e4bd),
      black: material(0x171714),
      orange: material(0xd87832),
      yellow: material(0xe5b84d)
    };

    // ------------------------------------------------------------
    // Helpers
    // ------------------------------------------------------------
    function addBox(
      parent,
      size,
      position,
      mat,
      castShadow = true,
      receiveShadow = true
    ) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        mat
      );
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      parent.add(mesh);
      return mesh;
    }

    function addBlock(parent, x, y, z, sx, sy, sz, mat) {
      return addBox(parent, [sx, sy, sz], [x, y, z], mat);
    }

    function addBook(
      parent,
      x,
      y,
      z,
      width,
      height,
      depth,
      spineMat,
      coverMat,
      rotationY = 0
    ) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotationY;

      addBox(
        group,
        [width + 0.08, height + 0.08, depth + 0.08],
        [0, 0, 0],
        spineMat
      );

      addBox(
        group,
        [width + 0.12, height + 0.12, 0.055],
        [0, 0, depth * 0.5 + 0.025],
        coverMat
      );

      const bandMat = new THREE.MeshStandardMaterial({
        color: 0xd4a54d,
        roughness: 0.9
      });

      addBox(
        group,
        [width + 0.13, 0.055, 0.07],
        [0, height * 0.28, depth * 0.5 + 0.05],
        bandMat
      );

      addBox(
        group,
        [width + 0.13, 0.055, 0.07],
        [0, height * 0.72, depth * 0.5 + 0.05],
        bandMat
      );

      parent.add(group);
      return group;
    }

    function addCandle(parent, x, y, z, height = 1.4) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      addBox(
        group,
        [0.22, height, 0.22],
        [0, height * 0.5, 0],
        mats.cream
      );

      addBox(
        group,
        [0.3, 0.09, 0.3],
        [0, height * 0.48, 0],
        mats.black
      );

      const flame = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffa23a })
      );
      flame.scale.set(0.75, 1.65, 0.75);
      flame.position.y = height;
      group.add(flame);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 12, 8),
        new THREE.MeshBasicMaterial({
          color: 0xff8b2e,
          transparent: true,
          opacity: 0.18,
          depthWrite: false
        })
      );
      glow.scale.set(1.5, 2.2, 1.5);
      glow.position.y = height;
      group.add(glow);

      parent.add(group);
      return group;
    }

    // ------------------------------------------------------------
    // Room shell
    // ------------------------------------------------------------
    const room = new THREE.Group();
    scene.add(room);

    // Floor
    const floor = addBox(
      room,
      [22, 0.25, 18],
      [0, -0.18, 0],
      mats.floorDark
    );
    floor.receiveShadow = true;

    // Tile pattern using thin raised blocks
    const tileSize = 1.75;
    for (let x = -10; x <= 10; x += tileSize) {
      for (let z = -8; z <= 8; z += tileSize) {
        const edge = Math.abs(x) > 9.2 || Math.abs(z) > 7.2;
        addBox(
          room,
          [tileSize - 0.09, 0.045, tileSize - 0.09],
          [x, 0.005, z],
          edge ? mats.floor : mats.floor
        );
      }
    }

    // Geometric inlay
    for (let x = -7.5; x <= 7.5; x += 1.5) {
      addBox(
        room,
        [0.07, 0.05, 15.5],
        [x, 0.035, 0],
        mats.woodDark
      );
    }

    for (let z = -6; z <= 6; z += 1.5) {
      addBox(
        room,
        [15.5, 0.05, 0.07],
        [0, 0.035, z],
        mats.woodDark
      );
    }

    // Back and side walls
    addBox(room, [22, 9, 0.5], [0, 4.3, -8.6], mats.wall);
    addBox(room, [0.5, 9, 18], [-10.8, 4.3, 0], mats.wall);
    addBox(room, [0.5, 9, 18], [10.8, 4.3, 0], mats.wall);

    // Wall panels
    for (let x = -9; x <= 9; x += 3) {
      addBox(room, [2.75, 6.5, 0.22], [x, 3.25, -8.34], mats.wallDark);
      addBox(room, [2.95, 0.18, 0.3], [x, 6.5, -8.2], mats.trim);
      addBox(room, [2.95, 0.18, 0.3], [x, 0.15, -8.2], mats.trim);
    }

    // Decorative wall arches
    for (const x of [-6.5, 6.5]) {
      addBox(room, [2.2, 0.25, 0.35], [x, 6.7, -8.15], mats.trimLight);
      addBox(room, [0.25, 2.1, 0.35], [x - 0.85, 5.7, -8.15], mats.trimLight);
      addBox(room, [0.25, 2.1, 0.35], [x + 0.85, 5.7, -8.15], mats.trimLight);
      addBox(room, [2.1, 0.25, 0.35], [x, 4.65, -8.15], mats.trimLight);
    }

    // Ceiling beams
    for (let x = -9; x <= 9; x += 3) {
      addBox(room, [0.35, 0.5, 17], [x, 8.55, 0], mats.woodDark);
    }

    addBox(room, [21, 0.35, 0.45], [0, 8.55, -8.2], mats.woodDark);

    // Door on the left
    const doorway = new THREE.Group();
    doorway.position.set(-7.25, 0, -7.85);
    room.add(doorway);

    addBox(doorway, [3.25, 6.6, 0.35], [0, 3.3, 0], mats.wood);
    addBox(doorway, [3.45, 0.22, 0.45], [0, 6.45, 0], mats.trim);
    addBox(doorway, [0.2, 6.4, 0.45], [-1.55, 3.2, 0], mats.trim);
    addBox(doorway, [0.2, 6.4, 0.45], [1.55, 3.2, 0], mats.trim);
    addBox(doorway, [3.1, 0.2, 0.45], [0, 1.1, 0], mats.trim);

    // Door with inset panels
    for (const y of [1.8, 3.25, 4.7]) {
      addBox(
        doorway,
        [2.8, 1.15, 0.12],
        [0, y, 0.24],
        mats.woodDark
      );
      addBox(
        doorway,
        [2.95, 0.12, 0.16],
        [0, y + 0.58, 0.3],
        mats.wood
      );
    }

    // Door handle
    addBox(
      doorway,
      [0.18, 0.55, 0.18],
      [1.3, 3.1, 0.55],
      mats.gold || mats.orange
    );

    // Window on the right back wall
    const windowGroup = new THREE.Group();
    windowGroup.position.set(6.55, 4.25, -8.15);
    room.add(windowGroup);

    addBox(windowGroup, [3.4, 3.6, 0.18], [0, 0, 0], mats.wood);
    addBox(windowGroup, [3.65, 0.16, 0.3], [0, 1.75, 0], mats.trimLight);
    addBox(windowGroup, [3.65, 0.16, 0.3], [0, -1.75, 0], mats.trimLight);
    addBox(windowGroup, [0.16, 3.6, 0.3], [-1.7, 0, 0], mats.trimLight);
    addBox(windowGroup, [0.16, 3.6, 0.3], [1.7, 0, 0], mats.trimLight);
    addBox(windowGroup, [3.4, 0.12, 0.3], [0, 0, 0], mats.trimLight);

    // Voxel landscape visible through the window
    const outside = new THREE.Group();
    outside.position.set(6.55, 4.25, -8.28);
    room.add(outside);

    const outsideMat = material(0x8aa56b);
    const outsideDark = material(0x4c6246);

    for (let x = -2.2; x <= 2.2; x += 0.55) {
      for (let z = -1.4; z <= 1.4; z += 0.55) {
        addBox(
          outside,
          [0.48, 0.48, 0.48],
          [x, 0.25, z],
          (x + z) % 2 === 0 ? outsideMat : outsideDark
        );
      }
    }

    const treeTrunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.18, 1.8, 6),
      mats.woodDark
    );
    treeTrunk.position.set(-1.6, 1.3, 0.3);
    treeTrunk.castShadow = true;
    outside.add(treeTrunk);

    const treeCanopy = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.05, 1),
      material(0x526b43)
    );
    treeCanopy.position.set(-1.6, 2.5, 0.3);
    treeCanopy.castShadow = true;
    outside.add(treeCanopy);

    // ------------------------------------------------------------
    // Bookshelves
    // ------------------------------------------------------------
    function buildBookcase(x, z, width = 3.4, depth = 1.2, height = 5.8) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      room.add(group);

      // Frame
      addBox(group, [width + 0.15, 0.25, depth], [0, height / 2, 0], mats.wood);
      addBox(group, [width + 0.15, 0.25, depth], [0, 0.18, 0], mats.wood);
      addBox(group, [0.2, height, depth], [-width / 2, height / 2, 0], mats.wood);
      addBox(group, [0.2, height, depth], [width / 2, height / 2, 0], mats.wood);
      addBox(group, [width, height, 0.15], [0, height / 2, -depth / 2], mats.wood);

      // Shelves
      for (let y = 0.55; y < height - 0.3; y += 1.35) {
        addBox(group, [width, 0.16, depth + 0.15], [0, y, 0], mats.woodLight);
      }

      // Books
      const bookColors = [
        mats.green,
        mats.blue,
        mats.red,
        mats.greenDark,
        mats.blueDark
      ];

      for (let shelf = 0; shelf < 4; shelf++) {
        const y = 0.85 + shelf * 1.35;
        let cursor = -width / 2 + 0.38;

        while (cursor < width / 2 - 0.4) {
          const widthBook = 0.32 + Math.random() * 0.22;
          const heightBook = 0.72 + Math.random() * 0.32;
          const bookMat = bookColors[Math.floor(Math.random() * bookColors.length)];
          const coverMat = bookColors[(Math.floor(Math.random() * bookColors.length) + 1) % bookColors.length];

          addBook(
            group,
            cursor + widthBook / 2,
            y + heightBook / 2,
            0.08,
            widthBook,
            heightBook,
            0.68,
            bookMat,
            coverMat,
            (Math.random() - 0.5) * 0.08
          );

          cursor += widthBook + 0.08;
        }
      }

      // Top books
      for (let i = 0; i < 4; i++) {
        addBook(
          group,
          -width / 2 + 0.55 + i * 0.7,
          height + 0.18,
          0.05,
          0.55,
          0.48,
          0.66,
          bookColors[i],
          bookColors[(i + 1) % bookColors.length]
        );
      }

      return group;
    }

    buildBookcase(-6.55, -5.75);
    buildBookcase(6.55, -5.75);
    buildBookcase(-8.9, 4.35, 2.8, 1.1, 5.1);
    buildBookcase(8.9, 4.35, 2.8, 1.1, 5.1);

    // Book stacks on the floor
    function bookStack(x, z, count = 5) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      room.add(group);

      for (let i = 0; i < count; i++) {
        const width = 1.05 + Math.random() * 0.25;
        const height = 0.28 + Math.random() * 0.12;
        const mat = [mats.green, mats.blue, mats.red][i % 3];
        const cover = mats.cream;

        addBook(
          group,
          0,
          0.16 + i * 0.34,
          0,
          width,
          height,
          0.75,
          mat,
          cover,
          (Math.random() - 0.5) * 0.12
        );
      }
    }

    bookStack(-4.8, 1.8, 6);
    bookStack(4.7, 1.8, 7);
    bookStack(-4.7, -2.8, 4);
    bookStack(4.9, -2.9, 5);

    // ------------------------------------------------------------
    // Central character — voxel adventurer
    // ------------------------------------------------------------
    const character = new THREE.Group();
    character.position.set(0, 0, 0.8);
    room.add(character);

    // Legs
    const leftLeg = addBox(
      character,
      [0.68, 1.25, 0.68],
      [-0.3, 0.72, 0],
      mats.blueDark
    );
    leftLeg.rotation.z = -0.08;

    const rightLeg = addBox(
      character,
      [0.68, 1.25, 0.68],
      [0.3, 0.72, 0],
      mats.blueDark
    );
    rightLeg.rotation.z = 0.08;

    // Shoes
    addBox(character, [0.82, 0.35, 0.8], [-0.32, 0.18, 0.12], mats.black);
    addBox(character, [0.82, 0.35, 0.8], [0.32, 0.18, 0.12], mats.black);

    // Belt
    addBox(character, [1.25, 0.28, 0.8], [0, 1.18, 0], mats.orange);
    addBox(character, [0.2, 0.75, 0.72], [-0.65, 1.05, 0], mats.orange);
    addBox(character, [0.2, 0.75, 0.72], [0.65, 1.05, 0], mats.orange);

    // Torso
    addBox(character, [1.25, 1.25, 0.85], [0, 2.05, 0], mats.green);
    addBox(character, [1.4, 0.2, 0.95], [0, 2.7, 0], mats.woodDark);
    addBox(character, [0.55, 0.72, 0.12], [0, 2.05, 0.46], mats.cream);

    // Arms
    const leftArm = addBox(
      character,
      [0.55, 1.25, 0.55],
      [-0.93, 2.05, 0],
      mats.green
    );
    leftArm.rotation.z = -0.45;

    const rightArm = addBox(
      character,
      [0.55, 1.25, 0.55],
      [0.93, 2.05, 0],
      mats.green
    );
    rightArm.rotation.z = 0.45;

    // White shirt sleeves
    addBox(character, [0.62, 0.75, 0.62], [-1.13, 1.8, 0], mats.cream);
    addBox(character, [0.62, 0.75, 0.62], [1.13, 1.8, 0], mats.cream);

    // Head
    const head = addBox(
      character,
      [1.12, 1.12, 1.0],
      [0, 3.42, 0],
      mats.cream
    );
    head.rotation.y = -0.12;

    // Hair
    addBox(character, [1.28, 0.55, 1.12], [0, 3.92, -0.08], mats.orange);
    addBox(character, [1.4, 0.3, 1.22], [0, 3.72, 0.05], mats.orange);
    addBox(character, [0.42, 0.72, 1.12], [0, 4.03, -0.08], mats.orange);

    // Face
    const eyeMat = material(0x171917);
    addBox(character, [0.16, 0.25, 0.12], [-0.39, 3.47, 0.53], eyeMat);
    addBox(character, [0.16, 0.25, 0.12], [0.39, 3.47, 0.53], eyeMat);
    addBox(character, [0.22, 0.15, 0.1], [0, 3.23, 0.54], mats.red);

    // Nose
    addBox(character, [0.15, 0.15, 0.15], [0, 3.31, 0.59], eyeMat);

    // Hair curls / side locks
    addBox(character, [0.32, 0.32, 0.34], [-0.78, 3.65, 0.23], mats.orange);
    addBox(character, [0.32, 0.32, 0.34], [0.78, 3.65, 0.23], mats.orange);

    // Backpack
    addBox(character, [0.72, 1.05, 0.5], [-0.48, 2.55, -0.35], mats.blue);
    addBox(character, [0.1, 0.7, 0.1], [-0.75, 2.55, -0.35], mats.orange);
    addBox(character, [0.1, 0.7, 0.1], [-0.21, 2.55, -0.35], mats.orange);

    // Utility belt pouches
    addBox(character, [0.48, 0.48, 0.38], [-0.72, 1.65, 0.08], mats.orange);
    addBox(character, [0.48, 0.48, 0.38], [0.72, 1.65, 0.08], mats.orange);

    // Torch
    addCandle(character, 0.75, 1.45, 0.22, 1.2);

    // Flashlight
    const flashlight = new THREE.Group();
    flashlight.position.set(0.85, 2.15, 0.45);
    flashlight.rotation.z = -0.35;
    flashlight.rotation.y = -0.25;
    character.add(flashlight);

    addBox(flashlight, [0.72, 0.28, 0.3], [0, 0, 0], mats.cream);
    addBox(flashlight, [0.18, 0.34, 0.38], [0.42, 0, 0], mats.orange);
    addBox(flashlight, [0.1, 0.1, 0.1], [0.55, 0, 0], mats.black);

    // Flashlight beam
    const beamMaterial = new THREE.MeshBasicMaterial({
      color: 0xffe3a0,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const beam = new THREE.Mesh(
      new THREE.ConeGeometry(1.8, 6.5, 24, 1, true),
      beamMaterial
    );
    beam.position.set(1.35, 2.15, 0.45);
    beam.rotation.z = -0.35;
    beam.rotation.y = -0.25;
    character.add(beam);

    // Small items on the floor
    addBox(character, [0.42, 0.08, 0.3], [1.25, 0.1, 0.55], mats.paper);
    addBox(character, [0.34, 0.07, 0.28], [1.65, 0.1, 0.3], mats.paper);

    // ------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0xd9c6a0, 0x29211c, 1.25);
    scene.add(hemi);

    const ambient = new THREE.AmbientLight(0xffd9a0, 0.35);
    scene.add(ambient);

    // Warm wall light
    const wallLight = new THREE.PointLight(0xffa446, 2.2, 13, 2);
    wallLight.position.set(-3.5, 5.8, -6.5);
    scene.add(wallLight);

    // Cool window light
    const windowLight = new THREE.PointLight(0xb8d4c2, 1.4, 11, 2);
    windowLight.position.set(6.5, 5.2, -6.5);
    scene.add(windowLight);

    // Flashlight point light
    const flashlightLight = new THREE.PointLight(0xffd99a, 4.5, 8, 2);
    flashlightLight.position.set(1.35, 2.15, 0.45);
    scene.add(flashlightLight);

    // ------------------------------------------------------------
    // Floating dust particles
    // ------------------------------------------------------------
    const dustCount = 180;
    const dustPositions = new Float32Array(dustCount * 3);

    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = (Math.random() - 0.5) * 19;
      dustPositions[i * 3 + 1] = 0.5 + Math.random() * 7.5;
      dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 14;
    }

    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(dustPositions, 3)
    );

    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xffd9a0,
        size: 0.035,
        transparent: true,
        opacity: 0.38,
        depthWrite: false
      })
    );
    scene.add(dust);

    // ------------------------------------------------------------
    // Animation
    // ------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Gentle flame flicker
      const flames = scene.querySelectorAll("[role=flame]");
      flames.forEach((flame, index) => {
        const scale = 0.9 + Math.sin(t * 7 + index) * 0.12;
        flame.scale.set(0.75 * scale, 1.65 * scale, 0.75 * scale);
      });

      // Dust drifts in the light
      dust.rotation.y = t * 0.015;
      dust.position.y = Math.sin(t * 0.25) * 0.08;

      // Character subtle breathing
      character.scale.y = 1 + Math.sin(t * 1.6) * 0.008;

      renderer.render(scene, camera);
    }

    animate();

    // ------------------------------------------------------------
    // Resize
    // ------------------------------------------------------------
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
