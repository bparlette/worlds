<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Convenience Store</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080b12;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 22px;
      left: 24px;
      padding: 12px 16px;
      color: #f7f4e8;
      background: rgba(13, 18, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      user-select: none;
    }

    .title h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title p {
      margin: 0;
      color: #9eb1c7;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      right: 20px;
      bottom: 18px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 600px) {
      .title {
        top: 12px;
        left: 12px;
      }

      .title h1 {
        font-size: 14px;
      }

      .title p {
        font-size: 10px;
      }

      .hint {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Pixel Market</h1>
    <p>A tiny convenience store in voxel city</p>
  </div>
  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b12);
    scene.fog = new THREE.Fog(0x080b12, 15, 30);

    const camera = new THREE.PerspectiveCamera(
      43,
      innerWidth / innerHeight,
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xb8d7ff, 0x241b16, 1.7));

    const keyLight = new THREE.DirectionalLight(0xffe5c4, 3.4);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0008;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x78baff, 1.2);
    fillLight.position.set(-6, 5, 3);
    scene.add(fillLight);

    const warmLight = new THREE.PointLight(0xffb56b, 24, 10, 2);
    warmLight.position.set(1.5, 3.8, 2.8);
    scene.add(warmLight);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      wall: new THREE.MeshStandardMaterial({
        color: 0x35485c,
        roughness: 0.88,
        metalness: 0.08
      }),
      wallDark: new THREE.MeshStandardMaterial({
        color: 0x202d3d,
        roughness: 0.9
      }),
      trim: new THREE.MeshStandardMaterial({
        color: 0x6b8194,
        roughness: 0.72,
        metalness: 0.25
      }),
      floor: new THREE.MeshStandardMaterial({
        color: 0x303a43,
        roughness: 0.9
      }),
      floorTile: new THREE.MeshStandardMaterial({
        color: 0x46535d,
        roughness: 0.86
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x11171c,
        roughness: 0.8
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xc93f35,
        roughness: 0.62
      }),
      redDark: new THREE.MeshStandardMaterial({
        color: 0x812523,
        roughness: 0.7
      }),
      cream: new THREE.MeshStandardMaterial({
        color: 0xe8d9b5,
        roughness: 0.7
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x38a65d,
        roughness: 0.65
      }),
      greenDark: new THREE.MeshStandardMaterial({
        color: 0x165b3a,
        roughness: 0.7
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x347ca8,
        roughness: 0.6
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xe2b545,
        roughness: 0.65
      }),
      orange: new THREE.MeshStandardMaterial({
        color: 0xe68b2e,
        roughness: 0.75
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xc98e61,
        roughness: 0.9
      }),
      hair: new THREE.MeshStandardMaterial({
        color: 0x603c28,
        roughness: 0.95
      }),
      shirt: new THREE.MeshStandardMaterial({
        color: 0x27343d,
        roughness: 0.85
      }),
      pants: new THREE.MeshStandardMaterial({
        color: 0x202a31,
        roughness: 0.9
      }),
      glass: new THREE.MeshStandardMaterial({
        color: 0x8bc7e8,
        roughness: 0.25,
        metalness: 0.15,
        transparent: true,
        opacity: 0.72
      }),
      cactus: new THREE.MeshStandardMaterial({
        color: 0x39b45f,
        roughness: 0.85
      }),
      pot: new THREE.MeshStandardMaterial({
        color: 0x8a5735,
        roughness: 0.95
      }),
      paper: new THREE.MeshStandardMaterial({
        color: 0xd8c59b,
        roughness: 0.95
      }),
      bottleBlue: new THREE.MeshStandardMaterial({
        color: 0x438bc3,
        roughness: 0.42
      }),
      bottlePink: new THREE.MeshStandardMaterial({
        color: 0xd46b73,
        roughness: 0.45
      })
    };

    // -------------------------------------------------------------------------
    // Voxel helpers
    // -------------------------------------------------------------------------

    function addBox(parent, size, position, material, castShadow = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      mesh.position.copy(position);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addVoxelColumn(parent, x, z, y, count, material, size = 1) {
      for (let i = 0; i < count; i++) {
        addBox(
          parent,
          new THREE.Vector3(size, size, size),
          new THREE.Vector3(x, y + i * size, z),
          material
        );
      }
    }

    function addCan(parent, x, y, z, material, lying = false) {
      const can = new THREE.Group();
      can.position.set(x, y, z);

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, 0.32, 12),
        material
      );
      body.rotation.z = Math.PI / 2;
      body.castShadow = true;
      can.add(body);

      const top = new THREE.Mesh(
        new THREE.CylinderGeometry(0.105, 0.105, 0.025, 12),
        materials.black
      );
      top.rotation.z = Math.PI / 2;
      top.position.x = 0.17;
      can.add(top);

      if (lying) {
        can.rotation.y = Math.PI / 2;
      }

      parent.add(can);
      return can;
    }

    function addPixelText(parent, text, width, height, position, material, rotationY = 0) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = material.color.getStyle();
      ctx.font = "bold 42px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, width / 2, height / 2);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.NearestFilter;
      texture.magFilter = THREE.NearestFilter;

      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          depthWrite: false
        })
      );

      mesh.position.copy(position);
      mesh.rotation.y = rotationY;
      parent.add(mesh);
      return mesh;
    }

    // -------------------------------------------------------------------------
    // Store building
    // -------------------------------------------------------------------------

    const store = new THREE.Group();
    scene.add(store);

    // Main structure and back wall.
    addBox(
      store,
      new THREE.Vector3(9.2, 5.2, 0.45),
      new THREE.Vector3(0, 2.55, -2.25),
      materials.wall
    );

    // Side walls.
    addBox(
      store,
      new THREE.Vector3(0.45, 5.2, 8.5),
      new THREE.Vector3(-4.45, 2.55, 0.1),
      materials.wall
    );

    addBox(
      store,
      new THREE.Vector3(0.45, 5.2, 8.5),
      new THREE.Vector3(4.45, 2.55, 0.1),
      materials.wall
    );

    // Front open frame.
    addBox(
      store,
      new THREE.Vector3(0.35, 5.2, 0.45),
      new THREE.Vector3(-4.45, 2.55, 4.1),
      materials.wallDark
    );

    addBox(
      store,
      new THREE.Vector3(0.35, 5.2, 0.45),
      new THREE.Vector3(4.45, 2.55, 4.1),
      materials.wallDark
    );

    addBox(
      store,
      new THREE.Vector3(9.2, 0.35, 0.45),
      new THREE.Vector3(0, 5.05, 4.1),
      materials.wallDark
    );

    // Horizontal wall trim.
    addBox(
      store,
      new THREE.Vector3(8.8, 0.22, 0.18),
      new THREE.Vector3(0, 3.4, -2.05),
      materials.trim
    );

    addBox(
      store,
      new THREE.Vector3(8.8, 0.22, 0.18),
      new THREE.Vector3(0, 1.25, -2.05),
      materials.trim
    );

    // Ceiling underside.
    addBox(
      store,
      new THREE.Vector3(9.1, 0.25, 8.4),
      new THREE.Vector3(0, 5.1, 0.15),
      materials.wallDark
    );

    // Ceiling panels with voxel edges.
    for (let i = 0; i < 6; i++) {
      addBox(
        store,
        new THREE.Vector3(1.28, 0.13, 1.28),
        new THREE.Vector3(-3.2 + i * 1.47, 4.96, 2.9),
        materials.trim
      );
    }

    // Ceiling fan housing.
    addBox(
      store,
      new THREE.Vector3(0.72, 0.32, 0.72),
      new THREE.Vector3(0, 4.82, 2.9),
      materials.black
    );

    // Back wall door.
    addBox(
      store,
      new THREE.Vector3(1.35, 2.65, 0.18),
      new THREE.Vector3(-0.65, 1.35, -1.94),
      materials.blue
    );

    addBox(
      store,
      new THREE.Vector3(1.5, 0.16, 0.25),
      new THREE.Vector3(-0.65, 2.7, -1.88),
      materials.trim
    );

    addBox(
      store,
      new THREE.Vector3(0.12, 0.38, 0.12),
      new THREE.Vector3(0.05, 1.45, -1.82),
      materials.yellow
    );

    // Side wall panels.
    for (let i = 0; i < 4; i++) {
      addBox(
        store,
        new THREE.Vector3(0.1, 3.6, 0.85),
        new THREE.Vector3(4.16, 2.35, -0.4 + i * 1.9),
        materials.wallDark
      );
    }

    // -------------------------------------------------------------------------
    // Vending machine
    // -------------------------------------------------------------------------

    const vendingMachine = new THREE.Group();
    vendingMachine.position.set(-2.85, 0, -1.55);
    store.add(vendingMachine);

    // Main cabinet.
    addBox(
      vendingMachine,
      new THREE.Vector3(1.65, 3.45, 0.72),
      new THREE.Vector3(0, 1.75, 0),
      materials.red
    );

    addBox(
      vendingMachine,
      new THREE.Vector3(1.78, 0.22, 0.82),
      new THREE.Vector3(0, 3.5, 0),
      materials.redDark
    );

    addBox(
      vendingMachine,
      new THREE.Vector3(1.8, 0.12, 0.84),
      new THREE.Vector3(0, 0.18, 0),
      materials.black
    );

    // Glass front.
    addBox(
      vendingMachine,
      new THREE.Vector3(1.35, 2.65, 0.08),
      new THREE.Vector3(0, 1.83, 0.39),
      materials.glass,
      false
    );

    // Header.
    addBox(
      vendingMachine,
      new THREE.Vector3(1.25, 0.42, 0.08),
      new THREE.Vector3(0, 3.15, 0.43),
      materials.cream
    );

    addPixelText(
      vendingMachine,
      "7-ELEVEN",
      1.08,
      0.24,
      new THREE.Vector3(0, 3.15, 0.48),
      new THREE.MeshBasicMaterial({ color: 0xffb347 })
    );

    // Product columns.
    const productColors = [
      materials.green,
      materials.blue,
      materials.yellow,
      materials.red
    ];

    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 4; col++) {
        const x = -0.47 + col * 0.32;
        const y = 0.72 + row * 0.72;
        const material = productColors[(row + col) % productColors.length];

        addBox(
          vendingMachine,
          new THREE.Vector3(0.22, 0.48, 0.18),
          new THREE.Vector3(x, y, 0.46),
          material
        );

        addBox(
          vendingMachine,
          new THREE.Vector3(0.18, 0.08, 0.03),
          new THREE.Vector3(x, y + 0.13, 0.56),
          materials.cream
        );
      }
    }

    // Price strip and selection buttons.
    addBox(
      vendingMachine,
      new THREE.Vector3(1.45, 0.24, 0.08),
      new THREE.Vector3(0, 0.72, 0.43),
      materials.black
    );

    for (let i = 0; i < 5; i++) {
      addBox(
        vendingMachine,
        new THREE.Vector3(0.18, 0.2, 0.08),
        new THREE.Vector3(-0.55 + i * 0.275, 1.25, 0.46),
        i === 2 ? materials.yellow : materials.black
      );
    }

    // Dispenser opening.
    addBox(
      vendingMachine,
      new THREE.Vector3(0.85, 0.3, 0.08),
      new THREE.Vector3(0, 0.35, 0.43),
      materials.black
    );

    addBox(
      vendingMachine,
      new THREE.Vector3(0.55, 0.08, 0.1),
      new THREE.Vector3(0, 0.35, 0.5),
      materials.red
    );

    // -------------------------------------------------------------------------
    // Potted cactus
    // -------------------------------------------------------------------------

    const cactus = new THREE.Group();
    cactus.position.set(-3.95, 0, -1.55);
    store.add(cactus);

    addBox(
      cactus,
      new THREE.Vector3(0.72, 0.48, 0.72),
      new THREE.Vector3(0, 0.24, 0),
      materials.pot
    );

    addBox(
      cactus,
      new THREE.Vector3(0.62, 0.08, 0.62),
      new THREE.Vector3(0, 0.49, 0),
      materials.wallDark
    );

    addVoxelColumn(cactus, 0, 0, 0.58, 3, materials.cactus, 0.34);

    addBox(
      cactus,
      new THREE.Vector3(0.38, 0.38, 0.38),
      new THREE.Vector3(0, 0.92, 0),
      materials.cactus
    );

    addBox(
      cactus,
      new THREE.Vector3(0.42, 0.22, 0.42),
      new THREE.Vector3(0, 1.16, 0),
      materials.cactus
    );

    // Cactus arms.
    addBox(
      cactus,
      new THREE.Vector3(0.3, 0.68, 0.3),
      new THREE.Vector3(-0.28, 1.08, 0),
      materials.cactus
    );

    addBox(
      cactus,
      new THREE.Vector3(0.3, 0.68, 0.3),
      new THREE.Vector3(0.28, 1.08, 0),
      materials.cactus
    );

    // Small flowers.
    const flowerMaterial = new THREE.MeshStandardMaterial({
      color: 0xf05c87,
      roughness: 0.7
    });

    for (const [x, y, z] of [
      [-0.28, 1.43, 0.08],
      [0.28, 1.43, 0.08]
    ]) {
      addBox(
        cactus,
        new THREE.Vector3(0.1, 0.1, 0.1),
        new THREE.Vector3(x, y, z),
        flowerMaterial
      );
    }

    // -------------------------------------------------------------------------
    // Newspaper stand
    // -------------------------------------------------------------------------

    const newsStand = new THREE.Group();
    newsStand.position.set(3.65, 0, -1.55);
    store.add(newsStand);

    addBox(
      newsStand,
      new THREE.Vector3(0.16, 1.7, 0.16),
      new THREE.Vector3(-0.55, 0.85, 0),
      materials.trim
    );

    addBox(
      newsStand,
      new THREE.Vector3(0.16, 1.7, 0.16),
      new THREE.Vector3(0.55, 0.85, 0),
      materials.trim
    );

    addBox(
      newsStand,
      new THREE.Vector3(1.3, 0.12, 0.12),
      new THREE.Vector3(0, 1.65, 0),
      materials.trim
    );

    addBox(
      newsStand,
      new THREE.Vector3(0.75, 0.95, 0.08),
      new THREE.Vector3(-0.2, 1.05, 0.08),
      materials.paper
    );

    addBox(
      newsStand,
      new THREE.Vector3(0.62, 0.8, 0.08),
      new THREE.Vector3(0.28, 1.0, 0.08),
      materials.paper
    );

    addPixelText(
      newsStand,
      "NEWS",
      0.45,
      0.18,
      new THREE.Vector3(-0.2, 1.05, 0.13),
      new THREE.MeshBasicMaterial({ color: 0x34434d })
    );

    // -------------------------------------------------------------------------
    // Floor details
    // -------------------------------------------------------------------------

    // Main floor slab.
    addBox(
      store,
      new THREE.Vector3(9.1, 0.35, 8.35),
      new THREE.Vector3(0, 0.12, 0.1),
      materials.floor
    );

    // Individual floor tiles.
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 5; col++) {
        addBox(
          store,
          new THREE.Vector3(1.78, 0.035, 1.78),
          new THREE.Vector3(
            -3.56 + col * 1.78,
            0.31,
            -2.7 + row * 1.78
          ),
          materials.floorTile
        );
      }
    }

    // Subtle grout lines.
    for (let row = 0; row < 4; row++) {
      addBox(
        store,
        new THREE.Vector3(8.7, 0.012, 0.025),
        new THREE.Vector3(0, 0.325, -2.7 + row * 1.78),
        materials.black,
        false
      );
    }

    for (let col = 0; col < 5; col++) {
      addBox(
        store,
        new THREE.Vector3(0.025, 0.012, 8.1),
        new THREE.Vector3(-3.56 + col * 1.78, 0.325, 0.1),
        materials.black,
        false
      );
    }

    // Trash / discarded items.
    addCan(store, -2.1, 0.34, -0.85, materials.bottlePink, true);
    addCan(store, -1.55, 0.34, -0.72, materials.bottleBlue, true);
    addCan(store, 0.25, 0.34, -0.8, materials.bottlePink, true);

    // A small stack of magazines.
    const magazine = new THREE.Group();
    magazine.position.set(2.25, 0.36, -0.65);
    magazine.rotation.y = -0.25;
    store.add(magazine);

    addBox(
      magazine,
      new THREE.Vector3(0.72, 0.08, 0.52),
      new THREE.Vector3(0, 0, 0),
      materials.paper
    );

    addBox(
      magazine,
      new THREE.Vector3(0.68, 0.06, 0.48),
      new THREE.Vector3(0, 0.08, 0),
      materials.red
    );

    addPixelText(
      magazine,
      "CITY",
      0.45,
      0.16,
      new THREE.Vector3(0, 0.015, 0.27),
      new THREE.MeshBasicMaterial({ color: 0x26323a })
    );

    // -------------------------------------------------------------------------
    // Pixel artist character
    // -------------------------------------------------------------------------

    const artist = new THREE.Group();
    artist.position.set(0.45, 0.34, 0.2);
    artist.rotation.y = -0.35;
    store.add(artist);

    // Legs.
    addBox(
      artist,
      new THREE.Vector3(0.32, 0.72, 0.38),
      new THREE.Vector3(-0.18, 0.36, 0),
      materials.pants
    );

    addBox(
      artist,
      new THREE.Vector3(0.32, 0.72, 0.38),
      new THREE.Vector3(0.18, 0.36, 0),
      materials.pants
    );

    // Shoes.
    addBox(
      artist,
      new THREE.Vector3(0.38, 0.16, 0.48),
      new THREE.Vector3(-0.18, 0.06, 0.14),
      materials.black
    );

    addBox(
      artist,
      new THREE.Vector3(0.38, 0.16, 0.48),
      new THREE.Vector3(0.18, 0.06, 0.14),
      materials.black
    );

    // Torso and vest.
    addBox(
      artist,
      new THREE.Vector3(0.72, 0.72, 0.42),
      new THREE.Vector3(0, 1.08, 0),
      materials.shirt
    );

    addBox(
      artist,
      new THREE.Vector3(0.62, 0.56, 0.44),
      new THREE.Vector3(0, 1.08, 0),
      materials.orange
    );

    addBox(
      artist,
      new THREE.Vector3(0.66, 0.08, 0.46),
      new THREE.Vector3(0, 1.08, 0),
      materials.yellow
    );

    // Arms.
    const leftArm = addBox(
      artist,
      new THREE.Vector3(0.25, 0.7, 0.3),
      new THREE.Vector3(-0.48, 1.05, 0),
      materials.shirt
    );
    leftArm.rotation.z = -0.18;

    const rightArm = addBox(
      artist,
      new THREE.Vector3(0.25, 0.7, 0.3),
      new THREE.Vector3(0.48, 1.05, 0),
      materials.shirt
    );
    rightArm.rotation.z = 0.18;

    // Hand holding a tool.
    addBox(
      artist,
      new THREE.Vector3(0.19, 0.19, 0.19),
      new THREE.Vector3(0.5, 0.72, 0.08),
      materials.skin
    );

    // Head, hair, face.
    addBox(
      artist,
      new THREE.Vector3(0.72, 0.68, 0.48),
      new THREE.Vector3(0, 1.72, 0),
      materials.hair
    );

    addBox(
      artist,
      new THREE.Vector3(0.57, 0.52, 0.49),
      new THREE.Vector3(0, 1.72, 0),
      materials.skin
    );

    addBox(
      artist,
      new THREE.Vector3(0.42, 0.12, 0.08),
      new THREE.Vector3(0, 1.88, 0.27),
      materials.hair
    );

    // Eyes.
    addBox(
      artist,
      new THREE.Vector3(0.09, 0.09, 0.08),
      new THREE.Vector3(-0.13, 1.72, 0.28),
      materials.black
    );

    addBox(
      artist,
      new THREE.Vector3(0.09, 0.09, 0.08),
      new THREE.Vector3(0.13, 1.72, 0.28),
      materials.black
    );

    // Glasses frame.
    addBox(
      artist,
      new THREE.Vector3(0.4, 0.07, 0.08),
      new THREE.Vector3(0, 1.72, 0.31),
      materials.black
    );

    // Nose.
    addBox(
      artist,
      new THREE.Vector3(0.1, 0.12, 0.08),
      new THREE.Vector3(0, 1.62, 0.29),
      materials.black
    );

    // Mouth.
    addBox(
      artist,
      new THREE.Vector3(0.16, 0.055, 0.05),
      new THREE.Vector3(0, 1.56, 0.285),
      materials.black
    );

    // Tool: shovel.
    const shovel = new THREE.Group();
    shovel.position.set(0.66, 0.8, 0.1);
    shovel.rotation.z = -0.28;
    artist.add(shovel);

    addBox(
      shovel,
      new THREE.Vector3(0.1, 0.62, 0.1),
      new THREE.Vector3(0, 0, 0),
      materials.trim
    );

    addBox(
      shovel,
      new THREE.Vector3(0.35, 0.08, 0.08),
      new THREE.Vector3(0, -0.35, 0),
      materials.black
    );

    addBox(
      shovel,
      new THREE.Vector3(0.25, 0.12, 0.12),
      new THREE.Vector3(0, -0.5, 0),
      materials.black
    );

    // -------------------------------------------------------------------------
    // Additional props
    // -------------------------------------------------------------------------

    // Wall-mounted clock.
    const clock = new THREE.Group();
    clock.position.set(3.65, 3.45, -1.98);
    store.add(clock);

    addBox(
      clock,
      new THREE.Vector3(0.62, 0.62, 0.12),
      new THREE.Vector3(0, 0, 0),
      materials.cream
    );

    addBox(
      clock,
      new THREE.Vector3(0.12, 0.12, 0.13),
      new THREE.Vector3(0, 0, 0.08),
      materials.black
    );

    addBox(
      clock,
      new THREE.Vector3(0.035, 0.22, 0.03),
      new THREE.Vector3(0, 0.06, 0.15),
      materials.black
    );

    addBox(
      clock,
      new THREE.Vector3(0.22, 0.035, 0.03),
      new THREE.Vector3(-0.06, -0.05, 0.15),
      materials.black
    );

    // Small wall shelf.
    addBox(
      store,
      new THREE.Vector3(2.1, 0.12, 0.45),
      new THREE.Vector3(2.5, 2.25, -1.72),
      materials.trim
    );

    for (let i = 0; i < 3; i++) {
      addBox(
        store,
        new THREE.Vector3(0.55, 0.38, 0.38),
        new THREE.Vector3(1.75 + i * 0.65, 2.55, -1.7),
        i === 1 ? materials.green : materials.yellow
      );
    }

    // -------------------------------------------------------------------------
    // Custom camera controls
    // -------------------------------------------------------------------------

    let target = new THREE.Vector3(0, 1.7, 0.2);
    let azimuth = 0.68;
    let polar = 1.16;
    let radius = 14.5;
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    function updateCamera() {
      const sinPolar = Math.sin(polar);

      camera.position.set(
        target.x + radius * sinPolar * Math.sin(azimuth),
        target.y + radius * Math.cos(polar),
        target.z + radius * sinPolar * Math.cos(azimuth)
      );

      camera.lookAt(target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
      renderer.domElement.style.cursor = "grabbing";
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      azimuth -= deltaX * 0.006;
      polar = THREE.MathUtils.clamp(polar - deltaY * 0.005, 0.55, 1.45);
      updateCamera();
    });

    function endDrag(event) {
      dragging = false;
      renderer.domElement.style.cursor = "grab";

      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.style.cursor = "grab";

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        radius = THREE.MathUtils.clamp(
          radius + event.deltaY * 0.008,
          8.5,
          22
        );
        updateCamera();
      },
      { passive: false }
    );

    updateCamera();

    // -------------------------------------------------------------------------
    // Resize and animation
    // -------------------------------------------------------------------------

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock3D = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock3D.getElapsedTime();

      // Gentle warm light pulse.
      warmLight.intensity = 22 + Math.sin(elapsed * 1.7) * 1.5;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
