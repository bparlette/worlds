<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Kirby's Rainbow Resort — Level 7-1</title>
  <style>
    :root {
      --pink: #ff71c8;
      --pink-dark: #c92f91;
      --blue: #2a8cff;
      --yellow: #ffd84a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b7d8ff;
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 12px 15px;
      border: 4px solid white;
      border-radius: 14px;
      color: #182b58;
      background: rgba(255, 247, 255, 0.88);
      box-shadow: 0 8px 24px rgba(30, 60, 100, 0.22);
      pointer-events: none;
      user-select: none;
    }

    #hud h1 {
      margin: 0 0 3px;
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    #hud p {
      margin: 0;
      color: #5570a8;
      font-size: 11px;
    }

    #status {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 10;
      min-width: 205px;
      padding: 13px 15px;
      border: 4px solid white;
      border-radius: 14px;
      color: #182b58;
      background: rgba(255, 247, 255, 0.9);
      box-shadow: 0 8px 24px rgba(30, 60, 100, 0.22);
      pointer-events: none;
      user-select: none;
    }

    #status .label {
      color: #687ca5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #status strong {
      display: block;
      margin-top: 4px;
      font-size: 13px;
    }

    #status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #43d99a;
      box-shadow: 0 0 0 3px rgba(67, 217, 154, 0.18);
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 10;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      color: #294175;
      background: rgba(255, 255, 255, 0.82);
      border: 3px solid white;
      box-shadow: 0 5px 18px rgba(30, 60, 100, 0.2);
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }

    button {
      appearance: none;
      border: 2px solid #fff;
      border-radius: 999px;
      padding: 7px 12px;
      color: white;
      background: #168dff;
      box-shadow: 0 3px 10px rgba(22, 141, 255, 0.3);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button:hover {
      background: #0b75d5;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      color: #182b58;
      background: #b7d8ff;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      text-align: center;
    }

    .loader span {
      display: block;
      margin-top: 10px;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      #hud {
        top: 8px;
        left: 8px;
      }

      #status {
        top: 80px;
        right: 8px;
        min-width: 175px;
      }

      #controls {
        bottom: 8px;
        max-width: calc(100% - 16px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader">
      <div style="font-size:34px">☔</div>
      <strong>Rainbow Resort</strong>
      <span>Loading the rainy world…</span>
    </div>
  </div>

  <div id="hud">
    <h1>LEVEL 7–1</h1>
    <p>RAINBOW RESORT · THE RAINBOW CUP</p>
  </div>

  <div id="status">
    <div><span class="dot"></span>World status</div>
    <strong id="statusText">Enter the rainy resort</strong>
  </div>

  <div id="controls">
    <span>Drag to orbit · Scroll to zoom</span>
    <button id="resetView" style="margin:0 12px 0 0">Reset view</button>
    <button id="laserButton">Acquire Laser</button>
    <button id="fireButton">Acquire Fire</button>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement: document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc8ef);
    scene.fog = new THREE.FogExp2(0x9bc8ef, 0.0115);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );

    const clock = new THREE.Clock();

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const standard = (color, roughness = 0.75, metalness = 0) =>
      new THREE.MeshStandardMaterial({ color, roughness, metalness });

    const mats = {
      cloud: standard(0xf8fbff, 0.95),
      cloudDark: standard(0xc9e3f1, 0.95),
      ground: standard(0x70b8d6, 0.9),
      groundLight: standard(0x9bd8ed, 0.9),
      cloudPink: standard(0xff9bd7, 0.9),
      cloudBlue: standard(0x9fdcff, 0.9),
      block: standard(0x297cff, 0.52),
      blockDark: standard(0x184f9b, 0.55),
      blockGold: standard(0xffe56a, 0.45),
      blockPink: standard(0xff70d4, 0.48),
      blockTeal: standard(0x58e0d0, 0.48),
      blockRed: standard(0xff638c, 0.48),
      blueBlock: standard(0x387cff, 0.4),
      laser: new THREE.MeshBasicMaterial({
        color: 0xffd24c,
        transparent: true,
        opacity: 0.95
      }),
      fire: new THREE.MeshBasicMaterial({
        color: 0xff4b3f,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      }),
      pep: new THREE.MeshBasicMaterial({
        color: 0x9dff8d,
        transparent: true,
        opacity: 0.95,
        depthWrite: false
      })
    };

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0xd9efff, 0x687e8b, 2.1);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff4df, 2.8);
    sun.position.set(-35, 45, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -45;
    sun.shadow.camera.right = 45;
    sun.shadow.camera.top = 40;
    sun.shadow.camera.bottom = -40;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 120;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x8bd6ff, 1.25);
    rim.position.set(30, 20, -35);
    scene.add(rim);

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------

    function mesh(geometry, material, position, rotation = null, castShadow = true) {
      const object = new THREE.Mesh(geometry, material);
      object.position.copy(position);
      if (rotation) object.rotation.set(...rotation);
      object.castShadow = castShadow;
      object.receiveShadow = true;
      scene.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, rotationY = 0) {
      const object = mesh(
        new THREE.BoxGeometry(w, h, d),
        material,
        new THREE.Vector3(x, y, z),
        [0, rotationY, 0]
      );
      return object;
    }

    function cylinder(radius, height, material, x, y, z, segments = 18) {
      const object = mesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material,
        new THREE.Vector3(x, y, z)
      );
      return object;
    }

    function makeTextSprite(text, color = "#ffffff", fontSize = 32) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const context = canvas.getContext("2d");

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = color;
      context.font = `900 ${fontSize}px Arial`;
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;

      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false
        })
      );

      sprite.scale.set(4.5, 1.125, 1);
      return sprite;
    }

    // -------------------------------------------------------------------------
    // Rainy resort environment
    // -------------------------------------------------------------------------

    const environment = new THREE.Group();
    scene.add(environment);

    // Ground platform and path.
    const ground = box(
      52,
      1.2,
      36,
      mats.ground,
      0,
      -0.7,
      0,
      0
    );

    const path = box(
      44,
      0.2,
      3.3,
      mats.groundLight,
      0,
      -0.02,
      0,
      0
    );

    // Main route, gently curving through the level.
    const routePoints = [
      new THREE.Vector3(-16, -0.02, 2),
      new THREE.Vector3(-10, -0.02, 0.5),
      new THREE.Vector3(-4, -0.02, -1),
      new THREE.Vector3(3, -0.02, -2),
      new THREE.Vector3(10, -0.02, 1),
      new THREE.Vector3(16, -0.02, 4)
    ];

    const routeCurve = new THREE.CatmullRomCurve3(routePoints);

    const routeSegments = [];
    for (let i = 0; i < routePoints.length - 1; i++) {
      const a = routePoints[i];
      const b = routePoints[i + 1];
      const length = a.distanceTo(b);
      const midpoint = a.clone().add(b).multiplyScalar(0.5);
      const direction = b.clone().sub(a).normalize();

      const segment = box(
        length + 0.12,
        0.24,
        2.4,
        mats.groundLight,
        midpoint.x,
        -0.01,
        midpoint.z,
        -Math.atan2(direction.x, direction.z)
      );
      routeSegments.push(segment);
    }

    // Curved rainbow arch over the path.
    const rainbowPoints = [];
    for (let i = 0; i <= 64; i++) {
      const t = i / 64;
      const x = -15 + t * 30;
      const z = Math.sin(t * Math.PI * 1.25) * 2.4;
      const y = 5.2 + Math.sin(t * Math.PI) * 7.5;
      rainbowPoints.push(new THREE.Vector3(x, y, z));
    }
    const rainbowCurve = new THREE.CatmullRomCurve3(rainbowPoints);

    for (let i = 0; i < 7; i++) {
      const tube = mesh(
        new THREE.TubeGeometry(rainbowCurve, 96, 0.78, 12, false),
        standard(i % 2 === 0 ? 0xffffff : 0xfaf8ff, 0.55),
        new THREE.Vector3(),
        null,
        false
      );
      tube.position.y = -4.2;
    }

    // Clouds.
    const clouds = [];
    function createCloud(x, y, z, scale, material) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);

      const puffs = [
        [-1.2, 0, 0, 1.0],
        [-0.45, 0.3, 0, 1.35],
        [0.55, 0.15, 0, 1.1],
        [1.25, -0.05, 0, 0.85],
        [0, -0.25, 0.1, 1.2]
      ];

      for (const [px, py, pz, s] of puffs) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(1, 16, 10),
          material
        );
        puff.position.set(px, py, pz);
        puff.scale.set(s * 1.4, s * 0.65, s);
        puff.castShadow = false;
        group.add(puff);
      }

      scene.add(group);
      clouds.push({ group, speed: 0.25 + Math.random() * 0.25 });
    }

    createCloud(-18, 10, -12, 1.6, mats.cloud);
    createCloud(15, 13, -16, 1.8, mats.cloudDark);
    createCloud(-10, 14, 15, 1.45, mats.cloudBlue);
    createCloud(20, 9, 8, 1.25, mats.cloud);

    // Rain streaks.
    const rain = new THREE.Group();
    scene.add(rain);

    for (let i = 0; i < 150; i++) {
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(
            Math.random() * 50 - 25,
            Math.random() * 22,
            Math.random() * 30 - 15
          ),
          new THREE.Vector3(
            Math.random() * 50 - 25,
            Math.random() * 22 - 1.5,
            Math.random() * 30 - 15
          )
        ]),
        new THREE.LineBasicMaterial({
          color: 0x8db9d2,
          transparent: true,
          opacity: 0.32
        })
      );
      rain.add(line);
    }

    // Large puddles.
    for (let i = 0; i < 25; i++) {
      const puddle = mesh(
        new THREE.CircleGeometry(0.6 + Math.random() * 1.8, 24),
        mats.cloudDark,
        new THREE.Vector3(
          Math.random() * 42 - 21,
          0.105,
          Math.random() * 18 - 9
        ),
        [-Math.PI / 2, 0, 0],
        false
      );
      puddle.rotation.z = Math.random() * Math.PI;
    }

    // Decorative resort buildings.
    const buildings = [];

    function createBuilding(x, z, width, height, colorMaterial) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 5),
        colorMaterial
      );
      body.position.y = height / 2 - 0.6;
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(width * 0.78, 2.4, 4),
        mats.cloudPink
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = height + 0.8;
      roof.castShadow = true;
      group.add(roof);

      const windowMaterial = new THREE.MeshStandardMaterial({
        color: 0xfff7c9,
        emissive: 0xffcf65,
        emissiveIntensity: 0.7,
        roughness: 0.35
      });

      const windows = [
        [-width * 0.28, height * 0.55, 2.55],
        [width * 0.28, height * 0.55, 2.55],
        [0, height * 0.8, 2.55]
      ];

      for (const [wx, wy, wz] of windows) {
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.2, 0.18),
          windowMaterial
        );
        windowMesh.position.set(wx, wy, wz);
        group.add(windowMesh);
      }

      scene.add(group);
      buildings.push({ group, baseY: group.position.y });
    }

    createBuilding(-19, -5, 7, 5.5, standard(0xff9bd7));
    createBuilding(19, -6, 7, 6.5, standard(0x9ed8ff));
    createBuilding(18, 12, 8, 4, standard(0xffe4c4));
    createBuilding(-20, 14, 6, 3.5, standard(0x9fdcff));

    // Fountain.
    const fountain = new THREE.Group();
    fountain.position.set(4, 0, 10);

    const fountainBase = new THREE.Mesh(
      new THREE.CylinderGeometry(3.2, 3.6, 0.7, 32),
      mats.cloudBlue
    );
    fountainBase.position.y = 0.35;
    fountainBase.castShadow = true;
    fountain.add(fountainBase);

    const fountainBowl = new THREE.Mesh(
      new THREE.CylinderGeometry(2.7, 3.2, 0.65, 32),
      mats.cloudPink
    );
    fountainBowl.position.y = 1.15;
    fountainBowl.castShadow = true;
    fountain.add(fountainBowl);

    const water = new THREE.Mesh(
      new THREE.CylinderGeometry(2.25, 2.4, 0.15, 32),
      new THREE.MeshStandardMaterial({
        color: 0x74dcf5,
        emissive: 0x167e9d,
        emissiveIntensity: 0.35,
        roughness: 0.2
      })
    );
    water.position.y = 1.55;
    fountain.add(water);

    const fountainJet = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 2.2, 12),
      new THREE.MeshBasicMaterial({ color: 0x9cefff })
    );
    fountainJet.position.y = 2.65;
    fountain.add(fountainJet);

    scene.add(fountain);
    buildings.push({ group: fountain, baseY: 0 });

    // Entrance sign.
    const sign = new THREE.Group();
    sign.position.set(-3, 0, 4.5);

    const signPost = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.2, 3.8, 12),
      mats.cloudBlue
    );
    signPost.position.y = 1.9;
    signPost.castShadow = true;
    sign.add(signPost);

    const signBoard = new THREE.Mesh(
      new THREE.BoxGeometry(4.8, 1.5, 0.35),
      mats.cloudPink
    );
    signBoard.position.y = 3.75;
    signBoard.castShadow = true;
    sign.add(signBoard);

    const signText = makeTextSprite("RAINBOW RESORT", "#fff6ff", 38);
    signText.position.set(0, 3.75, 0.2);
    sign.add(signText);

    scene.add(sign);
    buildings.push({ group: sign, baseY: 0 });

    // -------------------------------------------------------------------------
    // Skills and collectibles
    // -------------------------------------------------------------------------

    const skills = {
      laser: false,
      fire: false
    };

    const laser = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.12, 2.6, 12),
      mats.laser
    );
    laser.position.set(-9, 1.3, 3);
    scene.add(laser);

    const fire = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.12, 2.6, 12),
      mats.fire
    );
    fire.position.set(6, 1.3, -5);
    scene.add(fire);

    const pepDrink = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.28, 0.75, 16),
      mats.pep
    );
    pepDrink.position.set(12, 0.38, 5);
    scene.add(pepDrink);

    const pepLabel = makeTextSprite("PEP DRINK", "#a6ff9b", 30);
    pepLabel.scale.set(2.6, 0.65, 1);
    pepLabel.position.set(12, 1.1, 5);
    scene.add(pepLabel);

    function showSkillButton(material, label) {
      const button = document.createElement("button");
      button.textContent = label;
      button.addEventListener("click", () => {
        skills[material === mats.laser ? "laser" : "fire"] = true;
        const status = document.getElementById("statusText");
        if (material === mats.laser) {
          status.textContent = "Laser skill acquired · bounce enemies off surfaces";
        } else {
          status.textContent = "Fire or Spark skill acquired · move faster";
        }
      });
      document.getElementById("controls").appendChild(button);
    }

    showSkillButton(mats.laser, "Acquire Laser");
    showSkillButton(mats.fire, "Acquire Fire");

    // -------------------------------------------------------------------------
    // Enemies
    // -------------------------------------------------------------------------

    const enemies = [];
    const enemyMaterial = standard(0xff70c7, 0.75);
    const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x162148 });

    function createEnemy(x, z, scale = 1, type = 0) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.55, 16, 12),
        enemyMaterial
      );
      body.scale.set(1, 0.72, 1.25);
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.44, 16, 12),
        enemyMaterial
      );
      head.position.y = 0.62;
      head.castShadow = true;
      group.add(head);

      const eyeLeft = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 10, 8),
        eyeMaterial
      );
      eyeLeft.position.set(-0.16, 0.82, 0.36);
      group.add(eyeLeft);

      const eyeRight = eyeLeft.clone();
      eyeRight.position.x = 0.16;
      group.add(eyeRight);

      const mouth = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0x33124f })
      );
      mouth.position.set(0, 0.53, 0.42);
      mouth.scale.y = 0.45;
      group.add(mouth);

      scene.add(group);
      enemies.push({
        group,
        x,
        z,
        speed: 0.55 + Math.random() * 0.45,
        type
      });
    }

    createEnemy(-13, 1.5, 0.9, 0);
    createEnemy(-7, -0.2, 0.85, 1);
    createEnemy(-1, 0.8, 0.95, 0);
    createEnemy(5, -1.4, 0.8, 1);
    createEnemy(11, 0.6, 0.95, 0);
    createEnemy(17, 2.8, 0.85, 1);

    // -------------------------------------------------------------------------
    // Star blocks
    // -------------------------------------------------------------------------

    const starBlocks = [];
    const starGeometry = new THREE.OctahedronGeometry(0.38, 0);

    for (let i = 0; i < 18; i++) {
      const t = i / 17;
      const x = -15 + t * 30;
      const z = Math.sin(t * Math.PI * 1.25) * 2.4;
      const y = 3.8 + Math.sin(t * Math.PI * 2) * 1.3;

      const block = mesh(
        starGeometry,
        i % 3 === 0 ? mats.blockGold : mats.block,
        new THREE.Vector3(x, y, z),
        [0, 0, 0],
        false
      );

      starBlocks.push({
        block,
        baseY: y,
        phase: Math.random() * Math.PI * 2
      });
    }

    // -------------------------------------------------------------------------
    // Blue border blocks
    // -------------------------------------------------------------------------

    const blueBlocks = [];

    for (let i = 0; i < 28; i++) {
      const t = i / 27;
      const x = -15 + t * 30;
      const z = Math.sin(t * Math.PI * 1.25) * 2.4;

      const side = i % 2 === 0 ? -1 : 1;
      const zOffset = side * (2.8 + Math.sin(t * Math.PI * 2) * 0.35);

      const block = box(
        1.25,
        0.75,
        1.25,
        i % 4 === 0 ? mats.blockRed : mats.blueBlock,
        x,
        0.45,
        z + zOffset,
        -t * 0.18
      );

      blueBlocks.push({
        block,
        baseX: x,
        baseZ: z + zOffset,
        phase: Math.random() * Math.PI * 2
      });
    }

    // -------------------------------------------------------------------------
    // Animated elements
    // -------------------------------------------------------------------------

    const animated = [];

    function registerAnimated(object, type, value) {
      animated.push({ object, type, value });
    }

    for (const cloud of clouds) {
      registerAnimated(cloud.group, "cloud", 0);
    }

    for (const enemy of enemies) {
      registerAnimated(enemy.group, "enemy", 0);
    }

    for (const item of [laser, fire, pepDrink]) {
      registerAnimated(item, "item", 0);
    }

    // -------------------------------------------------------------------------
    // Orbit controls implemented directly
    // -------------------------------------------------------------------------

    const orbit = {
      target: new THREE.Vector3(0, 1.5, 0),
      radius: 29,
      theta: 0.72,
      phi: 1.1,
      dragging: false,
      pointerX: 0,
      pointerY: 0,
      previousX: 0,
      previousY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(orbit.phi);
      camera.position.set(
        orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
        orbit.target.y + orbit.radius * Math.cos(orbit.phi),
        orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.target);
    }

    function resetCamera() {
      orbit.target.set(0, 1.5, 0);
      orbit.radius = 29;
      orbit.theta = 0.72;
      orbit.phi = 1.1;
      updateCamera();
    }

    const canvas = renderer.domElement;
    canvas.style.touchAction = "none";

    canvas.addEventListener("pointerdown", (event) => {
      orbit.dragging = true;
      orbit.pointerX = event.clientX;
      orbit.pointerY = event.clientY;
      orbit.previousX = event.clientX;
      orbit.previousY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!orbit.dragging) return;

      const dx = event.clientX - orbit.previousX;
      const dy = event.clientY - orbit.previousY;
      orbit.previousX = event.clientX;
      orbit.previousY = event.clientY;

      orbit.theta -= dx * 0.006;
      orbit.phi = THREE.MathUtils.clamp(
        orbit.phi - dy * 0.005,
        0.32,
        1.48
      );

      updateCamera();
    });

    function endDrag(event) {
      orbit.dragging = false;
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        orbit.radius = THREE.MathUtils.clamp(
          orbit.radius + event.deltaY * 0.025,
          13,
          55
        );
        updateCamera();
      },
      { passive: false }
    );

    document.getElementById("resetView").addEventListener("click", resetCamera);

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const status = document.getElementById("statusText");
    const loading = document.getElementById("loading");

    if (!skills.laser) {
      status.textContent = "Enter the rainy resort";
    }

    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {

      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const delta = Math.min(clock.getDelta(), 0.05);

      // Rain movement.
      rain.children.forEach((line, index) => {
        line.position.x += delta * (0.8 + (index % 5) * 0.12);
        line.position.y -= delta * 1.6;
        if (line.position.y < -18) {
          line.position.y = 22;
          line.position.x = Math.random() * 50 - 25;
          line.position.z = Math.random() * 30 - 15;
        }
      });

      // Cloud drift.
      clouds.forEach(({ group, speed }) => {
        group.position.x += delta * speed;
        if (group.position.x > 34) group.position.x = -34;
      });

      // Fountain animation.
      fountainJet.rotation.z = Math.sin(elapsed * 3.2) * 0.12;
      water.rotation.y = elapsed * 0.12;
      water.material.emissiveIntensity = 0.28 + Math.sin(elapsed * 1.8) * 0.12;

      // Enemies move along the path, bounce off inclined surfaces when Laser is active.
      enemies.forEach(({ group, x, z, speed, type }, index) => {
        const along = (elapsed * speed + index * 0.7) % 1;
        const curve = routeCurve.getPointAt(along);
        const tangent = routeCurve.getTangentAt(along);
        const bounceAxis = type === 0 ? tangent.x : tangent.z;

        group.position.set(
          curve.x + bounceAxis * Math.sin(along * Math.PI * 2) * 0.65,
          0.28 + Math.sin(along * Math.PI * 4) * 0.1,
          curve.z + Math.cos(along * Math.PI * 2) * 0.65
        );

        group.rotation.y = -Math.atan2(tangent.x, tangent.z);
        group.rotation.z = Math.sin(along * Math.PI * 2) * 0.2;

        if (skills.laser) {
          const bounce = Math.sin(along * Math.PI * 2) * 0.75;
          group.position.x += bounceAxis * bounce;
          group.position.z += Math.cos(along * Math.PI * 2) * bounce;
        }
      });

      // Star blocks pulse and rotate.
      starBlocks.forEach(({ block, baseY, phase }) => {
        block.rotation.x = elapsed * 0.7 + phase;
        block.rotation.y = elapsed * 0.5 + phase;
        block.scale.setScalar(0.92 + Math.sin(elapsed * 1.5 + phase) * 0.08);
        block.position.y = baseY + Math.sin(elapsed * 1.3 + phase) * 0.22;
      });

      // Blue border blocks gently bob.
      blueBlocks.forEach(({ block, baseX, baseZ, phase }) => {
        block.position.y = 0.45 + Math.sin(elapsed * 0.9 + phase) * 0.08;
        block.rotation.y = -0.18 + Math.sin(elapsed * 0.55 + phase) * 0.05;
      });

      // Skill indicators.
      if (skills.laser) {
        laser.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.12);
        laser.rotation.z = Math.sin(elapsed * 3) * 0.12;
      }

      if (skills.fire) {
        fire.scale.setScalar(1 + Math.sin(elapsed * 5) * 0.12);
        fire.rotation.z = Math.sin(elapsed * 4) * 0.12;
      }

      // Small environmental motion.
      pepDrink.rotation.y = elapsed * 0.35;
      pepLabel.rotation.y = -elapsed * 0.35;

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    updateCamera();
    animate();

    requestAnimationFrame(() => {
      loading.classList.add("hidden");
      setTimeout(() => loading.remove(), 600);
    });
  </script>
</body>
</html>
