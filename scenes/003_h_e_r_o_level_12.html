<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.E.R.O. Level 12 — 3D Interactive World</title>
<style>
  :root {
    color-scheme: dark;
    --mint: #9fffe8;
    --cream: #fff4cf;
    --red: #ff6c6c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020507;
    font-family: "Courier New", monospace;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: var(--mint);
    text-shadow: 0 0 12px rgba(159, 255, 232, 0.28);
  }

  #hud .title {
    position: absolute;
    top: 22px;
    left: 24px;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 0.18em;
  }

  #hud .subtitle {
    position: absolute;
    top: 54px;
    left: 24px;
    color: rgba(159, 255, 232, 0.65);
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  #hud .score {
    position: absolute;
    top: 22px;
    right: 24px;
    color: var(--cream);
    font-size: 24px;
    letter-spacing: 0.1em;
    text-align: right;
  }

  #hud .hint {
    position: absolute;
    bottom: 18px;
    left: 24px;
    color: rgba(159, 255, 232, 0.55);
    font-size: 11px;
    letter-spacing: 0.06em;
  }

  #reticle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(159, 255, 232, 0.8);
    border-radius: 50%;
    box-shadow: 0 0 18px rgba(159, 255, 232, 0.4);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  @media (max-width: 600px) {
    #hud .title { font-size: 22px; }
    #hud .score { top: auto; bottom: 52px; right: 18px; font-size: 18px; }
    #hud .hint { bottom: 14px; left: 18px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="title">H.E.R.O.</div>
  <div class="subtitle">LEVEL 12 · THE DIGITAL LAB</div>
  <div class="score">SCORE <span id="score">00000</span></div>
  <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · R TO RESET</div>
  <div id="reticle"></div>
</div>

<script type="module">
import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020507);
scene.fog = new THREE.FogExp2(0x071013, 0.075);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 120);
camera.position.set(17, 15, 19);

const controls = {
  target: new THREE.Vector3(0, 1.2, 0),
  azimuth: 0.72,
  polar: 1.05,
  radius: 28,
  dragging: false,
  lastX: 0,
  lastY: 0
};

function updateCamera() {
  const sinPolar = Math.sin(controls.polar);
  camera.position.set(
    controls.target.x + controls.radius * sinPolar * Math.sin(controls.azimuth),
    controls.target.y + controls.radius * Math.cos(controls.polar),
    controls.target.z + controls.radius * sinPolar * Math.cos(controls.azimuth)
  );
  camera.lookAt(controls.target);
}
updateCamera();

const world = new THREE.Group();
scene.add(world);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(29.6, 29.6),
  new THREE.MeshStandardMaterial({
    color: 0x101b19,
    roughness: 0.93,
    metalness: 0.05
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
world.add(floor);

const grid = new THREE.GridHelper(29.6, 28, 0x263d36, 0x182724);
grid.position.y = 0.012;
grid.material.transparent = true;
grid.material.opacity = 0.25;
world.add(grid);

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x26322e,
  roughness: 0.88,
  metalness: 0.12
});
const wallTopMat = new THREE.MeshStandardMaterial({
  color: 0x34433b,
  roughness: 0.82,
  metalness: 0.16
});
const redMat = new THREE.MeshStandardMaterial({
  color: 0x8f2835,
  roughness: 0.72,
  metalness: 0.18
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x111917,
  roughness: 0.95,
  metalness: 0.05
});
const greenMat = new THREE.MeshStandardMaterial({
  color: 0x3b8c69,
  roughness: 0.68,
  emissive: 0x0a2518,
  emissiveIntensity: 0.45
});
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xe7b95f,
  roughness: 0.38,
  metalness: 0.72,
  emissive: 0x4a2c06,
  emissiveIntensity: 0.35
});

function box(w, h, d, material, x, y, z, parent = world) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(radius, height, material, x, y, z, parent = world, segments = 16) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, height, segments),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Four continuous outer walls, kept plain and solid.
box(29.6, 11.8, 0.55, wallMat, 0, 5.9, -14.5);
box(29.6, 11.8, 0.55, wallMat, 0, 5.9, 14.5);
box(0.55, 11.8, 29.6, wallMat, -14.5, 5.9, 0);
box(0.55, 11.8, 29.6, wallMat, 14.5, 5.9, 0);

for (const y of [2.6, 7.4, 11.3]) {
  box(29.0, 0.18, 0.65, wallTopMat, 0, y, -14.5);
  box(29.0, 0.18, 0.65, wallTopMat, 0, y, 14.5);
  box(0.65, 0.18, 29.0, wallTopMat, -14.5, y, 0);
  box(0.65, 0.18, 29.0, wallTopMat, 14.5, y, 0);
}

// Structural pillars and overhead beams.
for (const x of [-12, -6, 0, 6, 12]) {
  box(0.38, 11.5, 0.38, darkMat, x, 5.75, -14.1);
  box(0.38, 11.5, 0.38, darkMat, x, 5.75, 14.1);
}
for (const z of [-8, 0, 8]) {
  box(0.38, 11.5, 0.38, darkMat, -14.1, 5.75, z);
  box(0.38, 11.5, 0.38, darkMat, 14.1, 5.75, z);
}

// Main floor tile grid, with walkable paths and obstacles.
const tile = 1.5;
const floorTiles = [];

for (let x = -13.5; x <= 13.5; x += tile) {
  for (let z = -13.5; z <= 13.5; z += tile) {
    const isPath =
      (Math.abs(Math.abs(x + 7.5) - 9) < 0.15 && Math.abs(z + 2) < 1) ||
      (Math.abs(z + 2) < 0.15 && Math.abs(x + 7.5) < 1) ||
      (Math.abs(x - 7.5) < 0.15 && Math.abs(z + 2) < 1) ||
      (Math.abs(z - 2) < 0.15 && Math.abs(x - 7.5) < 1) ||
      ((x > -10 && x < 10) && (z > -4 && z < 0));

    const isWall =
      (x < -14 || x > 14 || z < -14 || z > 14);

    if (!isWall && !isPath) {
      box(tile, 0.12, tile, darkMat, x, 0.06, z);
      floorTiles.push({ x, z, type: "wall" });
    } else if (isPath) {
      box(tile, 0.12, tile, greenMat, x, 0.06, z);
      floorTiles.push({ x, z, type: "walk" });
    }
  }
}

// Cluster of low obstacle blocks.
const obstacleData = [
  [-10.8, 0.55, -8.2, 1.2, 1.1, 1.2],
  [-9.2, 0.45, -8.5, 1.0, 0.9, 1.0],
  [10.8, 0.55, 8.2, 1.2, 1.1, 1.2],
  [9.2, 0.45, 8.5, 1.0, 0.9, 1.0],
  [-7.0, 0.45, 7.0, 1.0, 0.9, 1.0],
  [7.0, 0.45, 7.0, 1.0, 0.9, 1.0],
  [-4.0, 0.45, -7.0, 1.0, 0.9, 1.0],
  [4.0, 0.45, -7.0, 1.0, 0.9, 1.0],
  [-1.0, 0.45, 7.0, 1.0, 0.9, 1.0],
  [1.0, 0.45, 7.0, 1.0, 0.9, 1.0],
  [-1.0, 0.45, -7.0, 1.0, 0.9, 1.0],
  [1.0, 0.45, -7.0, 1.0, 0.9, 1.0]
];

for (const [x, y, z, w, h, d] of obstacleData) {
  box(w, h, d, redMat, x, y, z);
  box(w * 0.72, 0.08, d * 0.72, darkMat, x, y + h * 0.48, z);
}

// Decorative wall panels and small hanging signs.
for (const x of [-12, -6, 0, 6, 12]) {
  box(2.1, 0.18, 0.18, redMat, x, 4.2, -14.2);
  box(0.18, 0.18, 1.2, redMat, x, 4.2, -14.2);
}
for (const x of [-12, -6, 0, 6, 12]) {
  box(2.1, 0.18, 0.18, redMat, x, 4.2, 14.2);
  box(0.18, 0.18, 1.2, redMat, x, 4.2, 14.2);
}

// Hanging lights.
const bulbMat = new THREE.MeshStandardMaterial({
  color: 0xffd78a,
  emissive: 0xffa62e,
  emissiveIntensity: 2.1
});

function hangingLight(x, z) {
  cylinder(0.025, 1.1, darkMat, x, 5.1, z);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), bulbMat);
  bulb.position.set(x, 4.45, z);
  world.add(bulb);
  const light = new THREE.PointLight(0xffbd68, 1.4, 7, 2);
  light.position.set(x, 4.1, z);
  world.add(light);
}

hangingLight(-6, -7);
hangingLight(0, -7);
hangingLight(6, -7);
hangingLight(-6, 7);
hangingLight(0, 7);
hangingLight(6, 7);

// Wall-mounted signs.
function sign(text, x, y, z, rotationY = 0) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = rotationY;

  const backing = new THREE.Mesh(
    new THREE.PlaneGeometry(2.1, 0.7),
    new THREE.MeshBasicMaterial({ color: 0x101916 })
  );
  backing.position.z = -0.04;
  group.add(backing);

  const letters = new THREE.Mesh(
    new THREE.PlaneGeometry(1.85, 0.55),
    new THREE.MeshBasicMaterial({
      color: 0x9fffe8,
      transparent: true,
      opacity: 0.85,
      depthWrite: false
    })
  );
  letters.position.z = 0.012;
  group.add(letters);

  world.add(group);
  return group;
}

sign("H.E.R.O.", -7.5, 3.8, -14.45);
sign("THE DIGITAL LAB", 7.5, 3.8, 14.45, Math.PI);

// Suspended objects and moving particles.
const animated = [];

const particleMat = new THREE.MeshBasicMaterial({
  color: 0x79ffc3,
  transparent: true,
  opacity: 0.55
});

for (let i = 0; i < 24; i++) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(0.045 + Math.random() * 0.045, 6, 4),
    particleMat
  );
  p.position.set(
    (Math.random() - 0.5) * 25,
    1 + Math.random() * 9,
    (Math.random() - 0.5) * 25
  );
  p.userData = {
    speed: 0.25 + Math.random() * 0.4,
    phase: Math.random() * Math.PI * 2,
    baseY: p.position.y
  };
  world.add(p);
  animated.push(p);
}

const floatingObjects = [];

function floatingObject(material, x, y, z, size = 1) {
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(size, 1),
    material
  );
  mesh.position.set(x, y, z);
  mesh.userData = {
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    speed: 0.45 + Math.random() * 0.5
  };
  world.add(mesh);
  floatingObjects.push(mesh);
  return mesh;
}

floatingObject(goldMat, -5, 3.1, -10, 0.45);
floatingObject(goldMat, 3, 3.5, 10, 0.42);
floatingObject(goldMat, 8, 2.8, -5, 0.38);
floatingObject(goldMat, -9, 3.2, 5, 0.35);

// A hidden treasure relic, placed off the direct beeline and at least six units from spawn.
const RELIC = new THREE.Group();
RELIC.position.set(-1.5, 0.15, 3.5);
RELIC.rotation.y = 0.45;

const relicBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.65, 0.85, 0.22, 12),
  goldMat
);
RELIC.add(relicBase);

const relicBowl = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2),
  goldMat
);
relicBowl.position.y = 0.23;
RELIC.add(relicBowl);

const relicCrown = new THREE.Mesh(
  new THREE.ConeGeometry(0.27, 0.55, 8),
  goldMat
);
relicCrown.position.y = 0.73;
RELIC.add(relicCrown);

const relicGlow = new THREE.PointLight(0xffbd5a, 2.2, 4.5, 2);
RELIC.add(relicGlow);

world.add(RELIC);

// Spawn marker.
const spawn = new THREE.Group();
spawn.position.set(-7.5, 0.13, 2.5);
spawn.rotation.y = Math.PI / 2;

const spawnRing = new THREE.Mesh(
  new THREE.RingGeometry(0.8, 1.05, 32),
  new THREE.MeshBasicMaterial({
    color: 0x9fffe8,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.75
  })
);
spawnRing.rotation.x = -Math.PI / 2;
spawn.add(spawnRing);

const spawnArrow = new THREE.Mesh(
  new THREE.ConeGeometry(0.35, 0.9, 3),
  new THREE.MeshBasicMaterial({ color: 0x9fffe8 })
);
spawnArrow.rotation.x = Math.PI;
spawnArrow.position.y = 0.2;
spawn.add(spawnArrow);
world.add(spawn);

// Small floor markers.
const markerMat = new THREE.MeshBasicMaterial({
  color: 0xffd38b,
  transparent: true,
  opacity: 0.65
});

for (const [x, z] of [[-13, -13], [13, -13], [-13, 13], [13, 13]]) {
  const marker = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.08, 12), markerMat);
  marker.position.set(x, 0.15, z);
  world.add(marker);
}

// Camera controls implemented directly in JS.
function onPointerDown(event) {
  controls.dragging = true;
  controls.lastX = event.clientX;
  controls.lastY = event.clientY;
  renderer.domElement.setPointerCapture(event.pointerId);
}

function onPointerMove(event) {
  if (!controls.dragging) return;
  const dx = event.clientX - controls.lastX;
  const dy = event.clientY - controls.lastY;
  controls.lastX = event.clientX;
  controls.lastY = event.clientY;

  controls.azimuth -= dx * 0.006;
  controls.polar = THREE.MathUtils.clamp(controls.polar - dy * 0.005, 0.28, 1.42);
  updateCamera();
}

function onPointerUp(event) {
  controls.dragging = false;
  if (renderer.domElement.hasPointerCapture(event.pointerId)) {
    renderer.domElement.releasePointerCapture(event.pointerId);
  }
}

renderer.domElement.addEventListener("pointerdown", onPointerDown);
renderer.domElement.addEventListener("pointermove", onPointerMove);
renderer.domElement.addEventListener("pointerup", onPointerUp);
renderer.domElement.addEventListener("pointercancel", onPointerUp);

function resetView() {
  controls.target.set(0, 1.2, 0);
  controls.azimuth = 0.72;
  controls.polar = 1.05;
  controls.radius = 28;
  updateCamera();
}

window.addEventListener("keydown", (event) => {
  if (event.key.toLowerCase() === "r") resetView();
});

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const scoreEl = document.getElementById("score");
let score = 0;
const clock = new THREE.Clock();

function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {

  const elapsed = clock.getElapsedTime();

  for (const p of animated) {
    p.position.y = p.userData.baseY + Math.sin(elapsed * p.userData.speed + p.userData.phase) * 0.18;
    p.rotation.y += 0.008;
  }

  for (const m of floatingObjects) {
    m.position.y = m.userData.baseY + Math.sin(elapsed * m.userData.speed + m.userData.phase) * 0.22;
    m.rotation.y += 0.012;
    m.rotation.x += 0.006;
  }

  RELIC.position.y = 0.15 + Math.sin(elapsed * 1.25) * 0.035;
  RELIC.rotation.y += 0.0025;
  relicGlow.intensity = 2.1 + Math.sin(elapsed * 2.4) * 0.45;

  spawnRing.material.opacity = 0.45 + Math.sin(elapsed * 2.2) * 0.2;
  spawnArrow.rotation.z = Math.sin(elapsed * 1.7) * 0.12;

  score = Math.floor(score + Math.sin(elapsed * 0.7) * 0.0015);
  scoreEl.textContent = score.toString().padStart(5, "0");

  
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
