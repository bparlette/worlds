<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadrant Fortresses — Warlords 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070d;
      font-family: "Courier New", monospace;
    }
    body {
      color: #f5d89a;
      user-select: none;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    #hud::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.025) 0 1px, transparent 1px);
      background-size: 100% 100%, 4px 4px, 7px 7px;
      mix-blend-mode: screen;
      opacity: .55;
    }
    .topbar {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    .eyebrow {
      color: #f2b84b;
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 5px 0 4px;
      color: #fff3bf;
      font-size: clamp(23px, 3vw, 42px);
      font-weight: 800;
      letter-spacing: .04em;
      text-shadow: 0 3px 12px #000;
    }
    .subtitle {
      color: rgba(245,216,154,.65);
      font-size: 11px;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .controls {
      padding: 12px 15px;
      border: 1px solid rgba(245,216,154,.24);
      background: rgba(5,8,15,.55);
      backdrop-filter: blur(8px);
      color: rgba(245,216,154,.72);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-align: right;
    }
    .controls b {
      color: #f2b84b;
      font-weight: 700;
    }
    #status {
      position: absolute;
      left: 24px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(245,216,154,.7);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    #status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64e6a4;
      box-shadow: 0 0 10px #64e6a4;
    }
    #retro {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: #05070d;
      filter: contrast(1.15) saturate(1.15);
    }
    @media (max-width: 600px) {
      .topbar { left: 14px; right: 14px; }
      .controls { display: none; }
      #status { left: 14px; bottom: 14px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="topbar">
      <div>
        <div class="eyebrow">ATARI 2600 / QUADRANT SECTOR</div>
        <h1>Quadrant Fortresses</h1>
        <div class="subtitle">Warlords · Interactive 3D World</div>
      </div>
      <div class="controls">
        <b>DRAG</b> ORBIT &nbsp;·&nbsp; <b>SCROLL</b> ZOOM<br />
        <b>CLICK</b> TO SCAN FORCES
      </div>
    </div>
    <div id="status">Sector 7Q · Military Survey Active</div>
  </div>
  <div id="retro"></div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement: document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b13);
    scene.fog = new THREE.FogExp2(0x0b1020, 0.017);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(38, 30, 48);

    const clock = new THREE.Clock();
    const world = new THREE.Group();
    scene.add(world);

    const materials = {
      darkMetal: new THREE.MeshStandardMaterial({ color: 0x26313b, metalness: .72, roughness: .58 }),
      metal: new THREE.MeshStandardMaterial({ color: 0x66707b, metalness: .8, roughness: .42 }),
      paleMetal: new THREE.MeshStandardMaterial({ color: 0xa6a9a4, metalness: .65, roughness: .48 }),
      red: new THREE.MeshStandardMaterial({ color: 0x9e251f, metalness: .55, roughness: .5 }),
      orange: new THREE.MeshStandardMaterial({ color: 0xd77824, metalness: .5, roughness: .52 }),
      black: new THREE.MeshStandardMaterial({ color: 0x101419, metalness: .25, roughness: .8 }),
      glass: new THREE.MeshStandardMaterial({ color: 0x7aa6b5, metalness: .35, roughness: .18, transparent: true, opacity: .52 }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xf2b84b, metalness: .25, roughness: .55 }),
      cyan: new THREE.MeshStandardMaterial({ color: 0x55d9d0, metalness: .3, roughness: .35 }),
      green: new THREE.MeshStandardMaterial({ color: 0x64e6a4, metalness: .2, roughness: .4 }),
      redLight: new THREE.MeshStandardMaterial({ color: 0xff4d3c, emissive: 0xff160d, emissiveIntensity: 2.2 }),
      warmLight: new THREE.MeshStandardMaterial({ color: 0xffd27c, emissive: 0xff9c24, emissiveIntensity: 1.8 })
    };

    function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = world, cast = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = world, segments = 12) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segments), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function sphere(r, mat, x = 0, y = 0, z = 0, parent = world) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function beamBetween(a, b, radius, mat, parent = world) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const mesh = cylinder(radius, radius, direction.length(), mat, 0, 0, 0, parent);
      mesh.position.copy(start).add(end).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return mesh;
    }

    function makeRadar(m, angle = 0) {
      const radar = new THREE.Group();
      radar.position.set(m.x, m.y, m.z);
      radar.rotation.y = angle;
      world.add(radar);

      const dish = new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), materials.paleMetal);
      dish.position.y = 1.2;
      dish.rotation.z = -Math.PI / 2;
      dish.castShadow = true;
      radar.add(dish);

      const rim = new THREE.Mesh(new THREE.TorusGeometry(2.15, .12, 8, 32), materials.red);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 2.4;
      radar.add(rim);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, .7, 12), materials.red);
      hub.position.y = 2.4;
      radar.add(hub);

      return radar;
    }

    function makeFortress(x, z, scale = 1, variant = 0) {
      const fortress = new THREE.Group();
      fortress.position.set(x, 0, z);
      fortress.scale.setScalar(scale);
      world.add(fortress);

      box(10, 1.2, 8, materials.darkMetal, 0, .6, 0, fortress);
      box(8.4, 6.8, 6.4, materials.metal, 0, 4.2, 0, fortress);
      box(9.2, .55, 7.2, materials.darkMetal, 0, 7.75, 0, fortress);
      box(1.1, 7.4, 1.1, materials.darkMetal, -3.9, 4.4, 0, fortress);
      box(1.1, 7.4, 1.1, materials.darkMetal, 3.9, 4.4, 0, fortress);
      box(1.2, .9, 1.2, materials.red, 0, 8.3, 0, fortress);

      const turretPositions = [
        [-2.8, 9.4, 1.2], [2.8, 9.4, 1.2], [0, 10.4, 1.5]
      ];
      turretPositions.forEach(([tx, ty, tsize], i) => {
        const turret = cylinder(.75, .95, tsize, materials.red, tx, ty, 0, fortress, 14);
        turret.rotation.y = i * 1.7;
        const barrel = cylinder(.18, .25, 2.2, materials.darkMetal, tx, ty + 1.0, 0, fortress, 10);
        barrel.rotation.z = Math.PI / 2;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(.32, .07, 6, 14), materials.yellow);
        ring.position.set(tx, ty + 1.0, 1.16);
        fortress.add(ring);
      });

      for (let i = 0; i < 5; i++) {
        const side = i % 2 ? 1 : -1;
        const angle = i * 1.25;
        const px = Math.cos(angle) * 4.8;
        const pz = Math.sin(angle) * 4.8;
        const p = cylinder(.26, .32, 1.2, materials.darkMetal, px, 2.2, pz, fortress, 10);
        p.rotation.z = Math.PI / 2;
        beamBetween([px, 2.4, pz], [px + Math.cos(angle) * .9, 2.4, pz + Math.sin(angle) * .9], .055, materials.yellow, fortress);
      }

      if (variant === 1) {
        box(3.2, .35, 2.6, materials.orange, 0, 2.0, 3.3, fortress);
        for (let i = 0; i < 4; i++) {
          const wheel = cylinder(.55, .55, .28, materials.darkMetal, -1.3 + i * .85, 1.3, 3.75, fortress, 12);
          wheel.rotation.z = Math.PI / 2;
        }
      }

      for (let i = 0; i < 7; i++) {
        const side = i % 2 ? 1 : -1;
        const x = side * (3.8 + (i % 3) * .65);
        const z = -2.5 + Math.floor(i / 3) * 2.8;
        const lamp = sphere(.12, i % 3 === 0 ? materials.redLight : materials.warmLight, x, 2.3, z, fortress);
        lamp.castShadow = false;
      }

      const beacon = sphere(.25, materials.redLight, 0, 8.95, 0, fortress);
      const beaconRing = new THREE.Mesh(new THREE.TorusGeometry(.45, .08, 8, 20), materials.red);
      beaconRing.rotation.x = Math.PI / 2;
      beaconRing.position.y = 8.9;
      fortress.add(beaconRing);

      return fortress;
    }

    const fortressA = makeFortress(-12, -18, 1.15, 0);
    const fortressB = makeFortress(14, -10, .95, 1);
    const fortressC = makeFortress(2, 24, .8, 0);
    const fortressD = makeFortress(-25, 10, .65, 1);

    function makeOutpost(x, z, scale = 1) {
      const outpost = new THREE.Group();
      outpost.position.set(x, 0, z);
      outpost.scale.setScalar(scale);
      world.add(outpost);

      box(4.5, .8, 4.5, materials.darkMetal, 0, .4, 0, outpost);
      box(3.1, 3.4, 3.1, materials.metal, 0, 2.35, 0, outpost);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(1.45, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), materials.paleMetal);
      dome.position.y = 4.1;
      dome.castShadow = true;
      outpost.add(dome);
      const antenna = cylinder(.06, .08, 3.5, materials.darkMetal, 0, 6.2, 0, outpost, 8);
      const tip = sphere(.16, materials.redLight, 0, 8, 0, outpost);
      tip.castShadow = false;
      return outpost;
    }

    makeOutpost(-28, -24, .8);
    makeOutpost(29, 28, .7);
    makeOutpost(-38, 29, .55);
    makeOutpost(38, -30, .6);

    function makeTurret(x, z, scale = 1) {
      const turret = new THREE.Group();
      turret.position.set(x, 0, z);
      turret.scale.setScalar(scale);
      world.add(turret);

      cylinder(.9, 1.15, 1.2, materials.darkMetal, 0, .6, 0, turret, 14);
      cylinder(.38, .5, 2.4, materials.red, 0, 2.2, 0, turret, 12);
      const barrel = cylinder(.18, .24, 2.8, materials.darkMetal, 0, 3.5, 0, turret, 10);
      barrel.rotation.z = Math.PI / 2;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(.34, .08, 6, 14), materials.yellow);
      ring.position.set(0, 3.5, 1.42);
      turret.add(ring);
      const light = sphere(.12, materials.redLight, 0, 1.55, .95, turret);
      light.castShadow = false;
      return turret;
    }

    makeTurret(-18, -15, .8);
    makeTurret(18, 16, .75);
    makeTurret(-7, -31, .65);
    makeTurret(31, -18, .7);

    function makeRoad(x1, z1, x2, z2, width = 2.4) {
      const length = Math.hypot(x2 - x1, z2 - z1);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const road = box(length, .12, width, materials.darkMetal, (x1 + x2) / 2, .08, (z1 + z2) / 2, world);
      road.rotation.y = -angle;
      const lane = box(length - .3, .025, .08, materials.yellow, (x1 + x2) / 2, .15, (z1 + z2) / 2, world);
      lane.rotation.y = -angle;
      return road;
    }

    makeRoad(-39, -37, -12, -18, 2.2);
    makeRoad(-12, -18, 14, -10, 2.2);
    makeRoad(14, -10, 30, 31, 2.0);
    makeRoad(-39, 25, -38, 29, 1.8);

    function makeBridge(x, z, rotation = 0, length = 10) {
      const bridge = new THREE.Group();
      bridge.position.set(x, 0, z);
      bridge.rotation.y = rotation;
      world.add(bridge);

      const deck = box(length, .55, 2.6, materials.darkMetal, 0, .35, 0, bridge);
      for (let i = 0; i < 9; i++) {
        const rail = box(.12, 1.2, 2.6, materials.red, -length / 2 + i * (length / 8), 1.1, 0, bridge);
        rail.rotation.z = Math.sin(i * 1.7) * .035;
      }
      for (let i = 0; i < 4; i++) {
        const support = cylinder(.35, .5, 2.4, materials.metal, -length / 2 + i * length / 4, 1.2, 0, bridge, 8);
        support.rotation.z = Math.sin(i * 1.7) * .04;
      }
      return bridge;
    }

    makeBridge(-25, -18, .12, 8);
    makeBridge(22, 2, -.15, 7);

    const antenna = new THREE.Group();
    antenna.position.set(-43, 0, 24);
    world.add(antenna);
    cylinder(.16, .3, 18, materials.darkMetal, 0, 9, 0, antenna, 10);
    for (let i = 0; i < 5; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2 + i * .25, .08, 6, 18), materials.red);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 4 + i * 2.8;
      antenna.add(ring);
    }
    const antennaTip = sphere(.2, materials.redLight, 0, 18, 0, antenna);
    antennaTip.castShadow = false;

    const lights = [];
    function addLamp(x, y, z, mat = materials.warmLight) {
      const lamp = sphere(.18, mat, x, y, z);
      lamp.castShadow = false;
      lights.push(lamp);
    }

    addLamp(-12, 8.3, 4.2);
    addLamp(-12, 8.3, -4.2);
    addLamp(14, 8.3, 4.2);
    addLamp(14, 8.3, -4.2);
    addLamp(2, 10.1, 3.4);
    addLamp(-25, 3.4, 8);
    addLamp(29, 3.4, -7);

    const sky = new THREE.Mesh(new THREE.SphereGeometry(100, 32, 18), new THREE.MeshBasicMaterial({ color: 0x080b13, side: THREE.BackSide }));
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0x7f9ac4, 0x16100d, 1.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffd6a0, 2.4);
    sun.position.set(-35, 55, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 140;
    sun.shadow.bias = -.0003;
    scene.add(sun);

    const rimLight = new THREE.DirectionalLight(0x4ca9ff, 1.4);
    rimLight.position.set(40, 25, -45);
    scene.add(rimLight);

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111822, metalness: .15, roughness: .92 });
    const ground = new THREE.Mesh(new THREE.CylinderGeometry(95, 100, 1.5, 64), groundMat);
    ground.position.y = -.85;
    ground.receiveShadow = true;
    world.add(ground);

    const ring = new THREE.Mesh(new THREE.TorusGeometry(65, .12, 6, 96), materials.darkMetal);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -.05;
    world.add(ring);

    for (let i = 0; i < 20; i++) {
      const a = i / 20 * Math.PI * 2;
      const r = 48 + (i % 5) * 3.5;
      const marker = box(.18, .08, 1.2, materials.red, Math.cos(a) * r, .02, Math.sin(a) * r);
      marker.rotation.y = -a;
    }

    const particles = [];
    const particleMat = new THREE.MeshBasicMaterial({ color: 0x7ea2bd, transparent: true, opacity: .35 });
    for (let i = 0; i < 180; i++) {
      const p = new THREE.Mesh(new THREE.SphereGeometry(.035, 4, 4), particleMat);
      const a = Math.random() * Math.PI * 2;
      const r = 35 + Math.random() * 50;
      p.position.set(Math.cos(a) * r, 5 + Math.random() * 30, Math.sin(a) * r);
      particles.push(p);
    }

    const scanRing = new THREE.Mesh(new THREE.TorusGeometry(28, .08, 6, 96), materials.cyan);
    scanRing.rotation.x = Math.PI / 2;
    scanRing.position.y = .12;
    world.add(scanRing);

    const scanLight = new THREE.Mesh(new THREE.RingGeometry(26, 29, 96), materials.cyan);
    scanLight.rotation.x = -Math.PI / 2;
    scanLight.position.y = .13;
    world.add(scanLight);

    const scanBeacon = new THREE.Mesh(new THREE.SphereGeometry(.35, 12, 8), materials.cyan);
    scanBeacon.position.set(0, 0, 0);
    world.add(scanBeacon);

    const scanTarget = new THREE.Mesh(new THREE.SphereGeometry(.08, 8, 6), materials.yellow);
    world.add(scanTarget);

    const scanAngle = new THREE.Group();
    scanAngle.position.y = .18;
    world.add(scanAngle);
    const scanBeam = new THREE.Mesh(new THREE.ConeGeometry(2.8, 30, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x66d9d0, transparent: true, opacity: .055, side: THREE.DoubleSide, depthWrite: false }));
    scanBeam.rotation.z = -Math.PI / 2;
    scanAngle.add(scanBeam);

    const scanOrigin = new THREE.Mesh(new THREE.SphereGeometry(.2, 10, 8), materials.cyan);
    scanOrigin.position.y = 15;
    scanAngle.add(scanOrigin);

    const movingBeacons = [];
    function makeBeacon(x, z, color = materials.cyan) {
      const beacon = new THREE.Group();
      beacon.position.set(x, 0, z);
      world.add(beacon);
      const mast = cylinder(.09, .14, 5, materials.darkMetal, 0, 2.5, 0, beacon, 8);
      const light = sphere(.3, color, 0, 5.2, 0, beacon);
      light.castShadow = false;
      movingBeacons.push(light);
    }

    makeBeacon(-42, 14, materials.cyan);
    makeBeacon(42, 18, materials.cyan);
    makeBeacon(-44, -35, materials.orange);

    const scanRotator = new THREE.Group();
    scanRotator.position.y = .18;
    world.add(scanRotator);
    const scanBeam = new THREE.Mesh(new THREE.ConeGeometry(2.8, 30, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x66d9d0, transparent: true, opacity: .055, side: THREE.DoubleSide, depthWrite: false }));
    scanBeam.rotation.z = -Math.PI / 2;
    scanRotator.add(scanBeam);

    const scanOrigin = new THREE.Mesh(new THREE.SphereGeometry(.2, 10, 8), materials.cyan);
    scanOrigin.position.y = 15;
    scanRotator.add(scanOrigin);

    const movingBeacons = [];
    function makeBeacon(x, z, color = materials.cyan) {
      const beacon = new THREE.Group();
      beacon.position.set(x, 0, z);
      world.add(beacon);
      const mast = cylinder(.09, .14, 5, materials.darkMetal, 0, 2.5, 0, beacon, 8);
      const light = sphere(.3, color, 0, 5.2, 0, beacon);
      light.castShadow = false;
      movingBeacons.push(light);
    }

    makeBeacon(-42, 14, materials.cyan);
    makeBeacon(42, 18, materials.cyan);
    makeBeacon(-44, -35, materials.orange);

    const scanRotator = new THREE.Group();
    scanRotator.position.y = .18;
    world.add(scanRotator);
    const scanBeam = new THREE.Mesh(new THREE.ConeGeometry(2.8, 30, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x66d9d0, transparent: true, opacity: .055, side: THREE.DoubleSide, depthWrite: false }));
    scanBeam.rotation.z = -Math.PI / 2;
    scanRotator.add(scanBeam);

    const scanOrigin = new THREE.Mesh(new THREE.SphereGeometry(.2, 10, 8), materials.cyan);
    scanOrigin.position.y = 15;
    scanRotator.add(scanOrigin);

    const scanTarget = new THREE.Mesh(new THREE.SphereGeometry(.08, 8, 6), materials.yellow);
    world.add(scanTarget);

    const scanAngle = new THREE.Group();
    scanAngle.position.y = .18;
    world.add(scanAngle);
    const scanBeam = new THREE.Mesh(new THREE.ConeGeometry(2.8, 30, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0x66d9d0, transparent: true, opacity: .055, side: THREE.DoubleSide, depthWrite: false }));
    scanBeam.rotation.z = -Math.PI / 2;
    scanAngle.add(scanBeam);

    const scanOrigin = new THREE.Mesh(new THREE.SphereGeometry(.2, 10, 8), materials.cyan);
    scanOrigin.position.y = 15;
    scanAngle.add(scanOrigin);

    const radarRotors = [];
    for (const m of [fortressA, fortressB, fortressC]) {
      const rotor = makeRadar(m, Math.random() * Math.PI * 2);
      radarRotors.push(rotor);
    }

    const scanTarget = new THREE.Mesh(new THREE.SphereGeometry(.08, 8, 6), materials.yellow);
    world.add(scanTarget);

    const scanAngle = new THREE.Group();
