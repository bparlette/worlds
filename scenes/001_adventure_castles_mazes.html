<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castles & Mazes — Adventure 3D</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090b12;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f5e8ca;
    }

    .title {
      position: absolute;
      top: 22px;
      left: 24px;
      max-width: 390px;
      text-shadow: 0 2px 14px #000;
    }

    .title h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 3vw, 42px);
      font-weight: 500;
      letter-spacing: 0.025em;
    }

    .title p {
      margin: 5px 0 0;
      color: #cbb583;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .help {
      position: absolute;
      right: 22px;
      bottom: 20px;
      padding: 10px 13px;
      border: 1px solid rgba(255, 232, 190, 0.15);
      border-radius: 8px;
      background: rgba(12, 15, 22, 0.66);
      backdrop-filter: blur(8px);
      color: #d7c49c;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .hint {
      position: absolute;
      left: 24px;
      bottom: 22px;
      color: rgba(245, 232, 202, 0.68);
      font-size: 11px;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #090b12;
      color: #e5c78b;
      font-family: Georgia, serif;
      font-size: 22px;
      transition: opacity 0.5s ease;
    }

    @media (max-width: 600px) {
      .title { left: 16px; top: 16px; }
      .help { right: 12px; bottom: 12px; }
      .hint { left: 16px; bottom: 16px; max-width: 180px; line-height: 1.5; }
    }
  </style>
</head>
<body>
  <div id="loading">Preparing the castle…</div>
  <div id="ui">
    <div class="title">
      <h1>Castles &amp; Mazes</h1>
      <p>Adventure · Three-dimensional replay</p>
    </div>
    <div class="hint">Drag to orbit · Scroll to zoom</div>
    <div class="help">Drag to orbit · Scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b12);
    scene.fog = new THREE.FogExp2(0x090b12, 0.027);

    const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const world = new THREE.Group();
    scene.add(world);

    const materials = {
      floor: new THREE.MeshStandardMaterial({ color: 0x73736d, roughness: 0.94 }),
      wall: new THREE.MeshStandardMaterial({ color: 0x514b48, roughness: 0.92 }),
      wallDark: new THREE.MeshStandardMaterial({ color: 0x302f31, roughness: 0.95 }),
      wallWarm: new THREE.MeshStandardMaterial({ color: 0x715037, roughness: 0.9 }),
      roof: new THREE.MeshStandardMaterial({ color: 0x302c29, roughness: 0.88 }),
      gold: new THREE.MeshStandardMaterial({ color: 0xd6a84e, metalness: 0.72, roughness: 0.28 }),
      goldLight: new THREE.MeshStandardMaterial({ color: 0xf0c66d, metalness: 0.65, roughness: 0.24 }),
      blue: new THREE.MeshStandardMaterial({ color: 0x414b58, roughness: 0.9 }),
      purple: new THREE.MeshStandardMaterial({ color: 0x60455a, roughness: 0.9 }),
      green: new THREE.MeshStandardMaterial({ color: 0x42513b, roughness: 0.95 }),
      black: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 }),
      water: new THREE.MeshStandardMaterial({
        color: 0x244b56,
        roughness: 0.2,
        metalness: 0.25,
        transparent: true,
        opacity: 0.82
      }),
      candle: new THREE.MeshStandardMaterial({
        color: 0xffd48a,
        emissive: 0xff9d3c,
        emissiveIntensity: 1.6,
        roughness: 0.7
      }),
      light: new THREE.MeshStandardMaterial({
        color: 0xffe2a3,
        emissive: 0xffb84d,
        emissiveIntensity: 3.5,
        roughness: 0.4
      })
    };

    const orbit = {
      target: new THREE.Vector3(-1.4, 1.45, 1.3),
      azimuth: Math.PI * 0.22,
      polar: Math.PI * 0.31,
      radius: 25.5,
      dragging: false,
      pointerX: 0,
      pointerY: 0,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPolar = Math.sin(orbit.polar);
      camera.position.set(
        orbit.target.x + orbit.radius * sinPolar * Math.sin(orbit.azimuth),
        orbit.target.y + orbit.radius * Math.cos(orbit.polar),
        orbit.target.z + orbit.radius * sinPolar * Math.cos(orbit.azimuth)
      );
      camera.lookAt(orbit.target);
    }

    updateCamera();

    function addBox(parent, x, y, z, sx, sy, sz, material, cast = true, receive = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, x, y, z, radius, height, material, segments = 12) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Lighting: a restrained, atmospheric castle interior.
    scene.add(new THREE.HemisphereLight(0xb8d1df, 0x261b13, 1.25));

    const sun = new THREE.DirectionalLight(0xffd5a0, 2.4);
    sun.position.set(-8, 14, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -18;
    sun.shadow.camera.right = 18;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -18;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 55;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x6ea8c7, 0.85);
    rim.position.set(10, 7, -12);
    scene.add(rim);

    // Compact rectangular world, approximately 26 × 22 units.
    const worldMinX = -13;
    const worldMinZ = -11;
    const worldMaxX = 13;
    const worldMaxZ = 11;

    // Four continuous boundary walls, kept plain and solid.
    addBox(world, (worldMinX + worldMaxX) / 2, 2.3, worldMinZ, 26, 4.6, 0.8, materials.wall);
    addBox(world, (worldMinX + worldMaxX) / 2, 2.3, worldMaxZ, 26, 4.6, 0.8, materials.wall);
    addBox(world, worldMinX, 2.3, (worldMinZ + worldMaxZ) / 2, 0.8, 4.6, 22, materials.wall);
    addBox(world, worldMaxX, 2.3, (worldMinZ + worldMaxZ) / 2, 0.8, 4.6, 22, materials.wall);

    // Ground plane and subtle path tiles.
    addBox(world, 0, -0.16, 0, 26, 0.2, 22, materials.floor, false, true);

    const pathMat = new THREE.MeshStandardMaterial({ color: 0x817c6e, roughness: 1 });
    const pathPoints = [
      [-10.8, 5.8], [-7.2, 5.8], [-3.6, 5.8], [0, 5.8], [3.6, 5.8], [7.2, 5.8], [10.8, 5.8],
      [-10.8, -5.8], [-7.2, -5.8], [-3.6, -5.8], [0, -5.8], [3.6, -5.8], [7.2, -5.8], [10.8, -5.8],
      [3.8, 2.8], [3.8, -2.8], [-3.8, 2.8], [-3.8, -2.8]
    ];

    for (const [x, z] of pathPoints) {
      addBox(world, x, 0.015, z, 0.48, 0.035, 0.48, pathMat, false, true);
    }

    // Main north tower and upper chambers.
    const northTower = new THREE.Group();
    northTower.position.set(-1.2, 0, -7.2);
    world.add(northTower);

    addBox(northTower, 0, 2.1, 0, 5.4, 4.2, 5.4, materials.wall);
    addBox(northTower, 0, 4.35, 0, 6.0, 0.45, 6.0, materials.roof);
    addBox(northTower, 0, 4.72, 0, 4.6, 0.15, 4.6, materials.wallWarm);

    // Tower entrance, placed well away from the boundary and relic.
    addBox(northTower, 0, 1.35, 2.8, 1.8, 2.5, 0.25, materials.wallDark);
    addBox(northTower, 0, 1.35, 3.03, 1.25, 1.85, 0.08, materials.black);
    addBox(northTower, 0, 2.25, 3.1, 1.45, 0.12, 0.1, materials.gold);

    // Upper balcony and crenellated parapet.
    addBox(northTower, 0, 4.65, 1.2, 4.6, 0.25, 1.4, materials.wallDark);
    for (let i = 0; i < 9; i++) {
      addBox(northTower, -1.9 + i * 0.5, 5.02, 1.2, 0.28, 0.45, 0.28, materials.wallDark);
    }

    // Main central hall.
    addBox(world, -1.2, 2.1, 0, 6.4, 4.2, 12.4, materials.wall);
    addBox(world, -1.2, 4.35, 0, 7.1, 0.45, 13.1, materials.roof);
    addBox(world, -1.2, 4.72, 0, 5.8, 0.16, 11.8, materials.wallWarm);

    // Hall doorway on the east side.
    addBox(world, 2.05, 1.35, 0, 1.8, 2.5, 0.25, materials.wallDark);
    addBox(world, 2.05, 1.35, 0.15, 1.25, 1.85, 0.08, materials.black);
    addBox(world, 2.05, 2.25, 0.25, 1.45, 0.12, 0.1, materials.gold);

    // Side rooms and branching corridors.
    addBox(world, -9.0, 2.1, 0, 4.8, 4.2, 4.8, materials.wall);
    addBox(world, -9.0, 2.1, 6.6, 4.8, 4.2, 4.8, materials.wall);
    addBox(world, 7.2, 2.1, 0, 4.4, 4.2, 11.2, materials.wallWarm);

    addBox(world, -9.0, 4.35, 0, 5.2, 0.45, 5.6, materials.roof);
    addBox(world, -9.0, 4.35, 6.6, 5.2, 0.45, 5.6, materials.roof);
    addBox(world, 7.2, 4.35, 0, 5.1, 0.45, 12.0, materials.roof);

    // Doorways.
    addBox(world, -11.4, 1.35, 0, 1.8, 2.5, 0.25, materials.wallDark);
    addBox(world, -11.4, 1.35, 2.4, 1.25, 1.85, 0.08, materials.black);
    addBox(world, -11.4, 2.25, 2.5, 1.45, 0.12, 0.1, materials.gold);

    addBox(world, 4.8, 1.35, 2.7, 1.8, 2.5, 0.25, materials.wallDark);
    addBox(world, 4.8, 1.35, 2.85, 1.25, 1.85, 0.08, materials.black);
    addBox(world, 4.8, 2.25, 2.95, 1.45, 0.12, 0.1, materials.gold);

    // Water feature in the southeast.
    const pool = addBox(world, 9.0, 0.45, 7.8, 6.4, 0.7, 4.8, materials.water, false, true);
    pool.receiveShadow = true;
    for (let i = 0; i < 11; i++) {
      const ripple = addBox(
        world,
        7.25 + i * 0.54,
        0.82,
        7.8 + Math.sin(i * 1.7) * 0.2,
        0.32,
        0.025,
        0.08,
        new THREE.MeshStandardMaterial({
          color: 0x78b4bd,
          emissive: 0x123c43,
          emissiveIntensity: 0.8,
          roughness: 0.2
        }),
        false,
        false
      );
      ripple.rotation.y = Math.sin(i) * 0.3;
    }

    // Small fountain and statue.
    addCylinder(world, 10.1, 0.95, 7.8, 0.75, 0.75, materials.wallWarm, 20);
    addCylinder(world, 10.1, 1.55, 7.8, 0.42, 0.35, materials.wallDark, 16);
    addCylinder(world, 10.1, 1.82, 7.8, 0.18, 0.25, materials.gold, 12);
    addCylinder(world, 10.1, 2.0, 7.8, 0.08, 0.32, materials.goldLight, 10);

    // Candle sconces and small point lights.
    const sconces = [];
    function addSconce(x, y, z, intensity = 1.4) {
      addCylinder(world, x, y, z, 0.12, 0.42, materials.candle, 8);
      const glow = new THREE.PointLight(0xffb45c, intensity, 5, 2);
      glow.position.set(x, y, z);
      world.add(glow);
      sconces.push(glow);
    }

    addSconce(-4.0, 2.9, 1.65, 1.4);
    addSconce(-4.0, 2.9, -1.65, 1.4);
    addSconce(5.9, 2.9, 1.65, 1.2);
    addSconce(5.9, 2.9, -1.65, 1.2);

    // Decorative banners.
    function addBanner(x, y, z, color) {
      const banner = addBox(world, x, y, z, 0.85, 1.7, 0.12, new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
      banner.rotation.y = 0.12;
      addCylinder(world, x, y - 0.95, z, 0.035, 0.55, materials.gold, 6);
    }

    addBanner(-6.3, 3.2, 1.8, 0x6d3958);
    addBanner(-6.3, 3.2, -1.8, 0x6d3958);
    addBanner(6.3, 3.2, 1.8, 0x415b50);
    addBanner(6.3, 3.2, -1.8, 0x415b50);

    // A few benches and crates.
    addBox(world, -7.2, 0.65, -4.8, 2.2, 0.25, 0.75, materials.wood || materials.wallDark);
    addBox(world, 6.7, 0.55, -5.2, 1.8, 0.22, 0.7, materials.wood || materials.wallDark);
    addBox(world, 8.0, 0.45, 5.6, 1.1, 0.9, 1.1, materials.wood || materials.wallDark);

    // The hidden relic: the Amber Heart of the Old Keep.
    const relic = new THREE.Group();
    relic.position.set(3.1, 0, -3.8);
    relic.rotation.y = -0.28;
    world.add(relic);

    const heart = addCylinder(relic, 0, 1.25, 0, 0.48, 0.72, materials.gold, 18);
    heart.rotation.z = -0.08;

    const heartCore = addCylinder(relic, 0, 1.25, 0.02, 0.2, 0.62, materials.candle, 14);
    heartCore.rotation.z = -0.08;

    addCylinder(relic, 0, 0.08, 0, 0.72, 0.16, materials.wallDark, 16);
    addCylinder(relic, 0, 0.25, 0, 0.62, 0.12, materials.gold, 16);
    addCylinder(relic, 0, 0.42, 0, 0.52, 0.1, materials.goldLight, 16);

    // A small animated halo above the relic.
    const halo = new THREE.Mesh(
      new THREE.RingGeometry(0.65, 0.95, 48),
      new THREE.MeshBasicMaterial({
        color: 0xffbd62,
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    halo.rotation.x = -Math.PI / 2;
    halo.position.set(3.1, 2.25, -3.8);
    world.add(halo);

    // Hanging lanterns.
    const lanterns = [];
    function addLantern(x, y, z, scale = 1) {
      addCylinder(world, x, y, z, 0.11 * scale, 0.55 * scale, materials.candle, 8);
      const cap = addCylinder(world, x, y + 0.35 * scale, z, 0.25 * scale, 0.16 * scale, materials.gold, 8);
      cap.castShadow = true;
      const light = new THREE.PointLight(0xffa84d, 0.75 * scale, 4.5, 2);
      light.position.set(x, y, z);
      world.add(light);
      lanterns.push(light);
    }

    addLantern(-1.2, 3.7, 4.7, 0.9);
    addLantern(-1.2, 3.7, -4.7, 0.9);
    addLantern(7.2, 3.7, 3.7, 0.8);

    // Animated environmental elements.
    const particles = [];
    const particleMaterial = new THREE.MeshBasicMaterial({
      color: 0xd7a85d,
      transparent: true,
      opacity: 0.45,
      depthWrite: false
    });

    function addParticle(x, y, z, size) {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(size, 8, 6),
        particleMaterial
      );
      particle.position.set(x, y, z);
      world.add(particle);
      particles.push({
        mesh: particle,
        origin: new THREE.Vector3(x, y, z),
        phase: Math.random() * Math.PI * 2,
        speed: 0.25 + Math.random() * 0.45
      });
    }

    for (let i = 0; i < 22; i++) {
      addParticle(
        -11 + Math.random() * 22,
        0.6 + Math.random() * 4.2,
        -9 + Math.random() * 18,
        0.025 + Math.random() * 0.055
      );
    }

    // Floating dust near the relic.
    for (let i = 0; i < 10; i++) {
      addParticle(
        3.1 + (Math.random() - 0.5) * 1.5,
        2.1 + Math.random() * 0.5,
        -3.8 + (Math.random() - 0.5) * 1.1,
        0.035 + Math.random() * 0.035
      );
    }

    // Spawn marker and relic marker.
    const spawnMarker = new THREE.Mesh(
      new THREE.CylinderGeometry(0.38, 0.38, 0.08, 24),
      new THREE.MeshBasicMaterial({ color: 0x76d4d0 })
    );
    spawnMarker.position.set(-1.2, 0.12, 0);
    world.add(spawnMarker);

    const relicMarker = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.08, 24),
      new THREE.MeshBasicMaterial({ color: 0xffc46a })
    );
    relicMarker.position.set(3.1, 0.12, -3.8);
    world.add(relicMarker);

    // Sparse exterior trees and shrubs.
    const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x382b22, roughness: 1 });
    const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x263b2d, roughness: 1 });

    function addTree(x, z, scale = 1) {
      addCylinder(world, x, 1.1 * scale, z, 0.18 * scale, 2.2 * scale, trunkMaterial, 7);
      const crown = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.05 * scale, 1),
        leafMaterial
      );
      crown.position.set(x, 2.7 * scale, z);
      crown.scale.y = 1.15;
      crown.castShadow = true;
      world.add(crown);
    }

    addTree(-11.8, 3.2, 0.9);
    addTree(-11.8, -3.6, 0.75);
    addTree(11.6, 3.0, 0.85);
    addTree(11.6, -3.4, 0.7);
    addTree(-2.7, 10.7, 0.75);
    addTree(2.0, 10.7, 0.65);

    // Low hedges around the water's edge.
    for (let i = 0; i < 8; i++) {
      addBox(
        world,
        8.0 + i * 0.75,
        0.35,
        9.55,
        0.65,
        0.7,
        0.55,
        materials.green
      );
    }

    // Small exterior gate-like wall sections, but no freestanding portals.
    addBox(world, -12.95, 1.1, 0, 0.45, 2.2, 3.2, materials.wallDark);
    addBox(world, 12.95, 1.1, 0, 0.45, 2.2, 3.2, materials.wallDark);

    // World labels as simple in-scene markers rather than sprites.
    addBox(world, -1.2, 0.2, 5.9, 0.7, 0.16, 0.45, materials.gold);
    addBox(world, 9.0, 0.2, 4.9, 0.7, 0.16, 0.45, materials.gold);

    // Custom orbit controls: mouse drag and touch drag; wheel zoom.
    const canvas = renderer.domElement;

    canvas.addEventListener("pointerdown", (event) => {
      orbit.dragging = true;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor = "grabbing";
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!orbit.dragging) return;
      const dx = event.clientX - orbit.lastX;
      const dy = event.clientY - orbit.lastY;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      orbit.azimuth -= dx * 0.006;
      orbit.polar = THREE.MathUtils.clamp(orbit.polar - dy * 0.005, 0.22, 1.25);
      updateCamera();
    });

    function stopDragging(event) {
      orbit.dragging = false;
      canvas.style.cursor = "grab";
      if (event && canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    }

    canvas.addEventListener("pointerup", stopDragging);
    canvas.addEventListener("pointercancel", stopDragging);
    canvas.style.cursor = "grab";

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      orbit.radius = THREE.MathUtils.clamp(orbit.radius + event.deltaY * 0.012, 13, 36);
      updateCamera();
    }, { passive: false });

    // Responsive resize.
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    // Animation loop.
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {

      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      const t = elapsed;

      // Gentle relic shimmer and floating dust.
      heartCore.material.emissiveIntensity = 2.2 + Math.sin(t * 2.1) * 0.55;
      halo.material.opacity = 0.48 + Math.sin(t * 1.7) * 0.18;
      halo.rotation.z = t * 0.35;

      for (const particle of particles) {
        const angle = t * particle.speed + particle.phase;
        particle.mesh.position.x = particle.origin.x + Math.cos(angle) * 0.18;
        particle.mesh.position.z = particle.origin.z + Math.sin(angle) * 0.18;
        particle.mesh.position.y = particle.origin.y + Math.sin(angle * 1.3) * 0.1;
        particle.mesh.rotation.y += dt * 0.4;
      }

      for (const light of lanterns) {
        light.intensity = 0.65 + Math.sin(t * 1.4 + light.position.x) * 0.09;
      }

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    animate();

    const loading = document.getElementById("loading");
    requestAnimationFrame(() => {
      loading.style.opacity = "0";
      setTimeout(() => loading.remove(), 600);
    });
  </script>
