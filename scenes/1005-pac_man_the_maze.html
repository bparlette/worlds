<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Maze — Three.js</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080b12;
    }

    body {
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .brand {
      position: absolute;
      top: clamp(20px, 4vw, 48px);
      left: clamp(20px, 4vw, 52px);
      color: #eef8ff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 52px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .brand p {
      margin: 10px 0 0;
      color: #8ca3b7;
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .help {
      position: absolute;
      right: clamp(18px, 3vw, 42px);
      bottom: clamp(18px, 3vw, 36px);
      padding: 10px 14px;
      border: 1px solid rgba(170, 216, 255, 0.16);
      border-radius: 10px;
      background: rgba(10, 17, 29, 0.58);
      color: #9eb5ca;
      font-size: 11px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(12px);
    }

    .credit {
      position: absolute;
      left: clamp(20px, 4vw, 52px);
      bottom: clamp(20px, 3vw, 36px);
      color: rgba(170, 216, 255, 0.42);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .help {
        right: 14px;
        bottom: 14px;
      }

      .credit {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="hud">
    <div class="brand">
      <h1>VOXEL<br />MAZE</h1>
      <p>Three-dimensional puzzle</p>
    </div>

    <div class="credit">Procedural voxel art · Three.js</div>
    <div class="help">Drag to orbit · Scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ------------------------------------------------------------
    // Renderer and scene
    // ------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b12);
    scene.fog = new THREE.FogExp2(0x080b12, 0.027);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    // ------------------------------------------------------------
    // Camera controls implemented directly
    // ------------------------------------------------------------

    const controls = {
      theta: -0.55,
      phi: 1.18,
      radius: 13.5,
      target: new THREE.Vector3(0, 1.3, 0),
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);
      camera.position.set(
        controls.target.x + controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z + controls.radius * sinPhi * Math.cos(controls.theta)
      );
      camera.lookAt(controls.target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.dragging = true;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
      renderer.domElement.style.cursor = "grabbing";
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;

      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      controls.theta -= dx * 0.006;
      controls.phi = THREE.MathUtils.clamp(
        controls.phi - dy * 0.005,
        0.42,
        Math.PI - 0.42
      );

      updateCamera();
    });

    function endDrag(event) {
      controls.dragging = false;
      renderer.domElement.style.cursor = "grab";

      if (event.pointerId !== undefined &&
          renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.style.cursor = "grab";

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius + event.deltaY * 0.012,
          8.2,
          21
        );
        updateCamera();
      },
      { passive: false }
    );

    updateCamera();

    // ------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x91baff, 0x11131c, 1.65));

    const keyLight = new THREE.DirectionalLight(0xd9f2ff, 3.2);
    keyLight.position.set(-4, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x358dff, 2.1);
    rimLight.position.set(6, 3, -7);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xff8b52, 24, 12, 2);
    warmLight.position.set(-4, 2.5, 3);
    scene.add(warmLight);

    // ------------------------------------------------------------
    // Voxel materials
    // ------------------------------------------------------------

    const darkVoxelMaterial = new THREE.MeshStandardMaterial({
      color: 0x101827,
      roughness: 0.62,
      metalness: 0.18
    });

    const darkEdgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x18263a,
      roughness: 0.5,
      metalness: 0.25
    });

    const cyanMaterial = new THREE.MeshStandardMaterial({
      color: 0x35d7ff,
      emissive: 0x087ca5,
      emissiveIntensity: 1.3,
      roughness: 0.35,
      metalness: 0.25
    });

    const blueMaterial = new THREE.MeshStandardMaterial({
      color: 0x247dff,
      emissive: 0x06378c,
      emissiveIntensity: 0.9,
      roughness: 0.45,
      metalness: 0.2
    });

    const redMaterial = new THREE.MeshStandardMaterial({
      color: 0xff355f,
      emissive: 0x8d0828,
      emissiveIntensity: 1.15,
      roughness: 0.38,
      metalness: 0.1
    });

    const yellowMaterial = new THREE.MeshStandardMaterial({
      color: 0xffd34b,
      emissive: 0x7b4b00,
      emissiveIntensity: 0.9,
      roughness: 0.4,
      metalness: 0.15
    });

    const pinkMaterial = new THREE.MeshStandardMaterial({
      color: 0xff63d8,
      emissive: 0x8c126e,
      emissiveIntensity: 1.1,
      roughness: 0.35,
      metalness: 0.12
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x0a0f18,
      roughness: 0.88,
      metalness: 0.05
    });

    // ------------------------------------------------------------
    // Maze generation
    //
    // The maze is generated as a 3D grid of cubes.
    // A randomized depth-first path leaves corridors through the maze.
    // ------------------------------------------------------------

    const GRID = 13;
    const CELL = 0.72;
    const maze = new Map();
    const start = new THREE.Vector3();
    const goal = new THREE.Vector3();

    function hash(x, z) {
      const n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
      return n - Math.floor(n);
    }

    function carveMaze() {
      const cells = [];

      for (let x = 0; x < GRID; x++) {
        for (let z = 0; z < GRID; z++) {
          cells.push({ x, z, y: 0 });
        }
      }

      // Begin at a known location.
      const current = cells[0];
      maze.set(`${current.x},${current.z}`, {
        x: current.x,
        z: current.z,
        y: 0,
        open: true
      });

      const path = [current];

      while (path.length < 58) {
        const candidates = [];

        for (const neighbor of [
          { dx: 0, dz: -1 },
          { dx: 0, dz: 1 },
          { dx: -1, dz: 0 },
          { dx: 1, dz: 0 }
        ]) {
          const nx = current.x + neighbor.dx;
          const nz = current.z + neighbor.dz;

          if (nx >= 0 && nx < GRID && nz >= 0 && nz < GRID) {
            if (!maze.has(`${nx},${nz}`)) {
              candidates.push({
                cell: { x: nx, z: nz },
                distance: hash(nx, nz)
              });
            }
          }
        }

        if (candidates.length === 0) {
          const last = path[path.length - 1];
          goal.set(last.x, 0, last.z);
          break;
        }

        const next = candidates[
          candidates.reduce(
            (sum, candidate) =>
              candidate.distance - sum < 0 ? candidate : sum,
            0
          )
        ];

        current = next.cell;
        maze.set(`${current.x},${current.z}`, {
          x: current.x,
          z: current.z,
          y: 0,
          open: true
        });

        path.push(current);
      }

      // Build the voxel structure from the maze path.
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < GRID; x++) {
          for (let z = 0; z < GRID; z++) {
            const key = `${x},${z}`;
            const record = maze.get(key);

            if (!record) continue;

            const insidePath = path.some(
              (point) => point.x === x && point.z === z
            );

            const isWall = y > 0 && !insidePath;
            const isOuterWall =
              x === 0 || x === GRID - 1 || z === 0 || z === GRID - 1;

            let material;

            if (y === 0 && insidePath) {
              material = darkEdgeMaterial;
            } else if (isOuterWall || isWall) {
              material = darkVoxelMaterial;
            } else {
              material = darkEdgeMaterial;
            }

            const voxel = new THREE.Mesh(
              new THREE.BoxGeometry(CELL, CELL, CELL),
              material
            );

            voxel.position.set(
              x * CELL - (GRID - 1) * CELL * 0.5,
              y * CELL,
              z * CELL - (GRID - 1) * CELL * 0.5
            );

            voxel.castShadow = true;
            voxel.receiveShadow = true;
            scene.add(voxel);

            // Bright cyan edge on the top of every voxel.
            const edge = new THREE.Mesh(
              new THREE.BoxGeometry(CELL * 0.93, 0.025, CELL * 0.93),
              cyanMaterial
            );

            edge.position.copy(voxel.position);
            edge.position.y += CELL * 0.49;
            edge.castShadow = false;
            scene.add(edge);
          }
        }
      }

      start.set(0, 0, 0);

      // ------------------------------------------------------------
      // Decorative particles
      // ------------------------------------------------------------

      const particles = [];
      const particleGeometry = new THREE.SphereGeometry(0.055, 10, 8);

      for (let i = 0; i < 120; i++) {
        const material =
          i % 3 === 0
            ? cyanMaterial
            : i % 3 === 1
              ? blueMaterial
              : darkEdgeMaterial;

        const particle = new THREE.Mesh(
          particleGeometry,
          material
        );

        const x = (hash(i, 1) - 0.5) * 11.5;
        const z = (hash(i, 2) - 0.5) * 11.5;
        const y = 0.4 + hash(i, 3) * 5.2;

        particle.position.set(x, y, z);
        particle.userData = {
          baseY: y,
          phase: hash(i, 4) * Math.PI * 2,
          speed: 0.45 + hash(i, 5) * 0.55
        };

        scene.add(particle);
        particles.push(particle);
      }

      // ------------------------------------------------------------
      // Animated glowing marker
      // ------------------------------------------------------------

      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 20, 16),
        yellowMaterial
      );

      marker.position.set(
        start.x * CELL - (GRID - 1) * CELL * 0.5,
        0.42,
        start.z * CELL - (GRID - 1) * CELL * 0.5
      );

      marker.castShadow = true;
      scene.add(marker);

      const goalMarker = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 18, 14),
        pinkMaterial
      );

      goalMarker.position.set(
        goal.x * CELL - (GRID - 1) * CELL * 0.5,
        0.42,
        goal.z * CELL - (GRID - 1) * CELL * 0.5
      );

      goalMarker.castShadow = true;
      scene.add(goalMarker);

      // ------------------------------------------------------------
    // Animation
    // ------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();

      for (const particle of particles) {
        const data = particle.userData;
        particle.position.y =
          data.baseY + Math.sin(elapsed * data.speed + data.phase) * 0.16;
        particle.position.x +=
          Math.sin(elapsed * 0.35 + data.phase) * 0.00055;
        particle.position.z +=
          Math.cos(elapsed * 0.3 + data.phase) * 0.00045;
      }

      marker.position.y = 0.42 + Math.sin(elapsed * 2.2) * 0.08;
      goalMarker.position.y = 0.42 + Math.sin(elapsed * 1.7 + 1.2) * 0.08;

      const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.5);
      marker.scale.setScalar(0.85 + pulse * 0.35);
      goalMarker.scale.setScalar(0.85 + (1 - pulse) * 0.35);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // ------------------------------------------------------------
    // Resize handling
    // ------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
