<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Forest Hideaway</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9eb68f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 2;
      padding: 12px 15px;
      color: #243528;
      background: rgba(247, 241, 215, 0.82);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(32,52,32,.18);
      backdrop-filter: blur(8px);
      pointer-events: none;
      user-select: none;
    }
    #hud h1 {
      margin: 0 0 4px;
      font-size: 15px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #hud p {
      margin: 0;
      font-size: 12px;
      opacity: .72;
    }
    #help {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 2;
      padding: 8px 11px;
      color: #f4e9c8;
      background: rgba(30,48,34,.68);
      border-radius: 9px;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Voxel Forest Hideaway</h1>
    <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
  </div>
  <div id="help">WASD to move · R to reset</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ---------------------------------------------------------------------
    // Renderer and scene
    // ---------------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9eb68f);
    scene.fog = new THREE.Fog(0x9eb68f, 31, 78);

    const camera = new THREE.PerspectiveCamera(
      43,
      innerWidth / innerHeight,
      0.1,
      150
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xd9e8c9, 0x52623d, 2.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1c4, 3.2);
    sun.position.set(18, 28, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -25;
    sun.shadow.camera.right = 25;
    sun.shadow.camera.top = 25;
    sun.shadow.camera.bottom = -25;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9fc8d2, 0.75);
    fill.position.set(-15, 10, -18);
    scene.add(fill);

    // ---------------------------------------------------------------------
    // Materials
    // ---------------------------------------------------------------------
    const mat = {
      grass: new THREE.MeshStandardMaterial({
        color: 0x78955a, roughness: 0.96
      }),
      grassLight: new THREE.MeshStandardMaterial({
        color: 0x91aa64, roughness: 1
      }),
      grassDark: new THREE.MeshStandardMaterial({
        color: 0x526f3c, roughness: 1
      }),
      earth: new THREE.MeshStandardMaterial({
        color: 0x8a6845, roughness: 1
      }),
      rock: new THREE.MeshStandardMaterial({
        color: 0x8f8064, roughness: 0.98
      }),
      rockLight: new THREE.MeshStandardMaterial({
        color: 0xb1a07d, roughness: 0.98
      }),
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x655d4b, roughness: 1
      }),
      path: new THREE.MeshStandardMaterial({
        color: 0xa88b61, roughness: 1
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x705035, roughness: 0.95
      }),
      woodLight: new THREE.MeshStandardMaterial({
        color: 0x9a7146, roughness: 0.95
      }),
      vine: new THREE.MeshStandardMaterial({
        color: 0x4f7136, roughness: 1
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x567c3b, roughness: 1
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x78984e, roughness: 1
      }),
      leafDark: new THREE.MeshStandardMaterial({
        color: 0x3f6533, roughness: 1
      }),
      gem: new THREE.MeshStandardMaterial({
        color: 0x44e49a,
        emissive: 0x0b8b4c,
        emissiveIntensity: 0.7,
        roughness: 0.35
      }),
      trunk: new THREE.MeshStandardMaterial({
        color: 0x66503a, roughness: 1
      })
    };

    // ---------------------------------------------------------------------
    // Voxel helpers
    // ---------------------------------------------------------------------
    const voxel = (x, y, z, sx, sy, sz, material, cast = true) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, sy, sz),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    const block = (x, y, z, material, size = 1) => {
      return voxel(x, y, z, size, size, size, material);
    };

    const slab = (x, y, z, material, sx, sz) => {
      return voxel(x, y, z, sx, 1, sz, material);
    };

    const addGrassPatch = (x, y, z, sx, sz, seed = 0) => {
      const count = Math.floor(sx * sz / 2);
      for (let i = 0; i < count; i++) {
        const px = x - sx * 0.5 + Math.random() * sx;
        const pz = z - sz * 0.5 + Math.random() * sz;
        const material = (i + seed) % 4 < 2 ? mat.grass : mat.grassLight;
        voxel(px, y + 0.5, pz, 0.34 + Math.random() * 0.28, 1, 0.34 + Math.random() * 0.28, material);
      }
    };

    const addRock = (x, y, z, size, material = mat.rock) => {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(size, 0),
        material
      );
      rock.position.set(x, y, z);
      rock.scale.set(1.3, 0.8, 1);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
      return rock;
    };

    const addTree = (x, z, scale = 1) => {
      const h = 5.5 * scale;
      for (let y = 0; y < h; y += 1) {
        const radius = 0.72 * (1 - y / h * 0.48);
        for (let ix = -2; ix <= 2; ix++) {
          for (let iz = -2; iz <= 2; iz++) {
            const dist = Math.abs(ix) + Math.abs(iz);
            if (dist > 1.6 || (ix === 0 && iz === 0)) continue;
            const leafMat = (ix * iz + y) % 5 === 0 ? mat.leafLight : mat.leaf;
            voxel(
              x + ix * 0.55 * scale,
              y + 0.5,
              z + iz * 0.55 * scale,
              0.5,
              0.5,
              0.5,
              leafMat
            );
          }
        }
      }
      for (let y = 0; y < 4; y++) {
        voxel(
          x,
          1.25 + y * 1.15 * scale,
          z,
          0.7 * scale,
          1.15 * scale,
          0.7 * scale,
          mat.trunk
        );
      }
    };

    // ---------------------------------------------------------------------
    // Terrain: layered floating islands, banks, and paths
    // ---------------------------------------------------------------------
    const terrain = new THREE.Group();
    scene.add(terrain);

    function terrainBlock(x, y, z, material, size = 1) {
      return terrain.add(block(x, y, z, material, size));
    }

    // Left island
    for (let x = -12; x <= 1; x += 1) {
      for (let z = -8; z <= 8; z += 1) {
        const edge = Math.max(0, Math.abs(x) - 2);
        const height = Math.max(0, 2 - edge);
        for (let y = 0; y < height; y++) {
          const material = (x + y + z) % 4 === 0 ? mat.rockDark : mat.rock;
          terrainBlock(x, y, z, material);
        }
        if (y === height - 1) {
          addGrassPatch(x, height, z, 1, 1, x * z);
        }
      }
    }

    // Right island, the main hideaway
    for (let x = 4; x <= 15; x += 1) {
      for (let z = -7; z <= 8; z += 1) {
        const edge = Math.max(0, Math.abs(x - 10) - 2);
        const height = Math.max(0, 4 - edge);
        for (let y = 0; y < height; y++) {
          const material = (x + y + z) % 5 === 0 ? mat.rockDark : mat.rock;
          terrainBlock(x, y, z, material);
        }
        if (y === height - 1) {
          addGrassPatch(x, height, z, 1, 1, x * 3 + z);
        }
      }
    }

    // Foreground island
    for (let x = -7; x <= 7; x += 1) {
      for (let z = -5; z <= 5; z += 1) {
        const edge = Math.max(0, Math.abs(x) - 2, Math.abs(z) - 2);
        const height = Math.max(0, 3 - edge);
        for (let y = 0; y < height; y++) {
          const material = (x + z + y) % 4 === 0 ? mat.rockDark : mat.rock;
          terrainBlock(x, y, z, material);
        }
        if (y === height - 1) {
          addGrassPatch(x, height, z, 1, 1, x + z);
        }
      }
    }

    // Distant island
    for (let x = -10; x <= 10; x += 1) {
      for (let z = -10; z <= -2; z += 1) {
        const edge = Math.max(0, Math.abs(x) - 2, Math.abs(z + 6) - 2);
        const height = Math.max(0, 3 - edge);
        for (let y = 0; y < height; y++) {
          terrainBlock(x, y, z, (x + z + y) % 3 === 0 ? mat.rockDark : mat.rock);
        }
        if (y === height - 1) addGrassPatch(x, height, z, 1, 1, x * z);
      }
    }

    // Winding path made of individual path voxels
    const pathPoints = [
      [-12, 0, -7], [-9, 0, -7], [-7, 0, -6], [-5, 0, -4],
      [-3, 0, -2], [-1, 0, 0], [1, 0, 2], [3, 0, 4],
      [5, 0, 6], [7, 0, 8], [9, 0, 8], [11, 0, 7],
      [13, 0, 5], [14, 0, 2], [14, 0, -1], [13, 0, -3],
      [11, 0, -5], [9, 0, -7], [7, 0, -9], [5, 0, -10],
      [3, 0, -10], [1, 0, -9], [-1, 0, -7], [-3, 0, -5],
      [-5, 0, -3], [-7, 0, -1], [-9, 0, 1], [-11, 0, 3],
      [-12, 0, 5], [-10, 0, 7], [-8, 0, 9], [-6, 0, 11],
      [-4, 0, 13], [-2, 0, 14], [0, 0, 15], [2, 0, 15],
      [4, 0, 14], [6, 0, 12], [8, 0, 10], [10, 0, 8],
      [12, 0, 6], [14, 0, 4], [15, 0, 1], [15, 0, -2],
      [14, 0, -5], [12, 0, -7], [10, 0, -9], [8, 0, -11],
      [6, 0, -12], [4, 0, -12], [2, 0, -11], [0, 0, -9],
      [-2, 0, -7], [-4, 0, -5], [-6, 0, -3], [-8, 0, -1],
      [-10, 0, 1], [-12, 0, 3], [-13, 0, 6], [-12, 0, 9],
      [-10, 0, 12], [-8, 0, 14], [-6, 0, 16], [-4, 0, 17],
      [-2, 0, 18], [0, 0, 19], [2, 0, 19], [4, 0, 18],
      [6, 0, 16], [8, 0, 14], [10, 0, 12], [12, 0, 10],
      [14, 0, 8], [15, 0, 5], [15, 0, 2], [15, 0, -1],
      [15, 0, -4], [14, 0, -7], [12, 0, -9], [10, 0, -11],
      [8, 0, -12], [6, 0, -12], [4, 0, -11], [2, 0, -9],
      [0, 0, -7], [-2, 0, -5], [-4, 0, -3], [-6, 0, -1],
      [-8, 0, 1], [-10, 0, 3], [-12, 0, 5], [-13, 0, 8],
      [-12, 0, 11], [-10, 0, 14], [-8, 0, 16], [-6, 0, 17],
      [-4, 0, 18], [-2, 0, 19], [0, 0, 20], [2, 0, 20],
      [4, 0, 19], [6, 0, 17], [8, 0, 15], [10, 0, 13],
      [12, 0, 11], [14, 0, 9], [15, 0, 6], [15, 0, 3],
      [15, 0, 0], [15, 0, -3], [15, 0, -6], [14, 0, -9],
      [12, 0, -11], [10, 0, -13], [8, 0, -14], [6, 0, -14],
      [4, 0, -13], [2, 0, -12], [0, 0, -10], [-2, 0, -8],
      [-4, 0, -6], [-6, 0, -4], [-8, 0, -2], [-10, 0, 0],
      [-12, 0, 2], [-14, 0, 4], [-14, 0, 7], [-13, 0, 10],
      [-11, 0, 13], [-9, 0, 15], [-7, 0, 17], [-5, 0, 18],
      [-3, 0, 19], [-1, 0, 20], [1, 0, 20], [3, 0, 19],
      [5, 0, 17], [7, 0, 15], [9, 0, 13], [11, 0, 11],
      [13, 0, 9], [15, 0, 7], [16, 0, 4], [16, 0, 1],
      [16, 0, -2], [16, 0, -5], [15, 0, -8], [13, 0, -10],
      [11, 0, -12], [9, 0, -14], [7, 0, -15], [5, 0, -15],
      [3, 0, -14], [1, 0, -12], [-1, 0, -10], [-3, 0, -8],
      [-5, 0, -6], [-7, 0, -4], [-9, 0, -2], [-11, 0, 0],
      [-13, 0, 2], [-15, 0, 4], [-15, 0, 7], [-14, 0, 10],
      [-12, 0, 13], [-10, 0, 15], [-8, 0, 17], [-6, 0, 18],
      [-4, 0, 19], [-2, 0, 20], [0, 0, 21], [2, 0, 21],
      [4, 0, 20], [6, 0, 18], [8, 0, 16], [10, 0, 14],
      [12, 0, 12], [14, 0, 10], [15, 0, 8], [15, 0, 5],
      [15, 0, 2], [15, 0, -1], [15, 0, -4], [15, 0, -7],
      [15, 0, -10], [15, 0, -13], [15, 0, -16], [15, 0, -19],
      [15, 0, -22], [15, 0, -25], [15, 0, -28], [15, 0, -31]
    ];

    for (const p of pathPoints) {
      terrainBlock(p[0], p[1], p[2], mat.path);
    }

    // Sand patches
    for (const [x, z, sx, sz] of [
      [-10, 12, 4, 5], [-6, 15, 3, 4], [8, 13, 4, 5],
      [12, 10, 3, 4], [-11, -4, 3, 4], [10, -5, 3, 4]
    ]) {
      for (let ix = 0; ix < sx; ix++) {
        for (let iz = 0; iz < sz; iz++) {
          terrainBlock(x + ix, 0, z + iz, mat.earth, 0.8);
        }
      }
    }

    // ---------------------------------------------------------------------
    // Main cliff hideaway with a voxel face
    // ---------------------------------------------------------------------
    const hideaway = new THREE.Group();
    scene.add(hideaway);

    // Broad cliff mass
    for (let x = 3; x <= 15; x += 1) {
      for (let z = -8; z <= 8; z += 1) {
        const taper = Math.max(0, 3 - Math.abs(x - 10));
        for (let y = 0; y < 7 + taper; y++) {
          const material = (x + y + z) % 6 === 0 ? mat.rockDark : mat.rock;
          hideaway.add(block(x, y, z, material));
        }
        if (y === 6 + taper - 1) {
          addGrassPatch(x, 7 + taper, z, 1, 1, x + z);
        }
      }
    }

    // Tower-like upper cliff
    for (let x = 7; x <= 12; x += 1) {
      for (let z = -5; z <= 1; z += 1) {
        const height = 8 + ((x + z) % 3);
        for (let y = 0; y < height; y++) {
          const material = (x + y + z) % 4 === 0 ? mat.rockDark : mat.rockLight;
          hideaway.add(block(x, y, z, material));
        }
        if (y === height - 1) addGrassPatch(x, height, z, 1, 1, x * z);
      }
    }

    // The face: brow, nose, cheek, eyes, mouth
    hideaway.add(block(9.2, 11.8, 0.7, mat.rockDark, 1.15));
    hideaway.add(block(10.1, 11.9, 0.65, mat.rockDark, 0.95));
    hideaway.add(block(9.4, 10.7, 1.1, mat.rockDark, 1.1));
    hideaway.add(block(9.55, 9.45, 1.2, mat.rockDark, 0.85));
    hideaway.add(block(8.9, 8.55, 1.3, mat.rockDark, 0.7));
    hideaway.add(block(10.0, 8.45, 1.3, mat.rockDark, 0.7));
    hideaway.add(block(9.45, 7.75, 1.35, mat.rockDark, 1.5));
    hideaway.add(block(9.05, 8.65, 1.45, mat.gem, 0.46));
    hideaway.add(block(9.85, 8.65, 1.45, mat.gem, 0.46));
    hideaway.add(block(9.45, 6.55, 1.5, mat.rockDark, 1.75));
    hideaway.add(block(9.45, 7.0, 1.62, mat.rockDark, 0.55));
    hideaway.add(block(9.45, 6.05, 1.6, mat.rockDark, 1.6));
    hideaway.add(block(9.45, 5.3, 1.6, mat.rockDark, 1.45));

    // Big leaf-shaped canopy made from stacked voxel layers
    for (let y = 0; y < 5; y++) {
      const layer = 5 - y;
      for (let ix = -3; ix <= 3; ix++) {
        for (let iz = -3; iz <= 3; iz++) {
          const d = Math.abs(ix) + Math.abs(iz);
          if (d > 3) continue;
          if (y === 0 && d > 2) continue;
          const material = (ix + iz + y) % 4 === 0 ? mat.leafDark : mat.leaf;
          hideaway.add(block(9.4 + ix * 0.65, 14.1 + y * 0.65, 0.3 + iz * 0.65, material, 0.62));
        }
      }
    }

    // Hanging vines
    for (const [x, y, z, length] of [
      [8.0, 13.5, 0.0, 3.2], [9.6, 13.4, 0.1, 4.0],
      [10.8, 13.2, 0.0, 3.4], [8.6, 12.4, 0.1, 2.7],
      [10.2, 12.3, 0.0, 2.9], [9.0, 11.2, 0.1, 2.2]
    ]) {
      for (let i = 0; i < length; i++) {
        hideaway.add(block(
          x + (Math.random() - 0.5) * 0.2,
          y - i * 0.42,
          z + (Math.random() - 0.5) * 0.18,
          0.12,
          0.42,
          0.12,
          mat.vine
        ));
      }
    }

    // Small entrance tunnel
    hideaway.add(block(9.4, 6.2, 2.1, mat.rockDark, 1.2));
    hideaway.add(block(9.4, 5.65, 2.15, mat.rockDark, 0.9));

    // ---------------------------------------------------------------------
    // Bridge
    // ---------------------------------------------------------------------
    const bridge = new THREE.Group();
    scene.add(bridge);

    const bridgeStartX = 3.2;
    const bridgeEndX = 7.0;
    const bridgeY = 5.65;

    for (let i = 0; i <= 14; i++) {
      const x = THREE.MathUtils.lerp(bridgeStartX, bridgeEndX, i / 14);
      const plank = block(x, bridgeY, 0, mat.woodLight, 0.72);
      plank.rotation.y = (Math.random() - 0.5) * 0.08;
    }

    for (const x of [bridgeStartX, bridgeEndX]) {
      block(x, bridgeY + 0.55, -0.55, mat.wood, 0.45);
      block(x, bridgeY + 0.55, 0.55, mat.wood, 0.45);
    }

    for (let i = 0; i < 10; i++) {
      const t = i / 9;
      const x = THREE.MathUtils.lerp(bridgeStartX, bridgeEndX, t);
      const side = -1;
      const top = block(
        x,
        bridgeY + 0.7 + Math.sin(t * Math.PI) * 0.12,
        side * 0.42,
        mat.wood,
        0.12
      );
      top.rotation.z = (Math.random() - 0.5) * 0.15;
    }

    // ---------------------------------------------------------------------
    // Trees and bushes
    // ---------------------------------------------------------------------
    const treePositions = [
      [-9, 3, -4, 0.9], [-7, 3, -6, 1.1], [-5, 3, -5, 0.8],
      [-1, 3, -7, 1.0], [1, 3, -5, 0.85], [5, 3, -6, 1.0],
      [7, 3, -4, 0.85], [11, 3, -6, 1.1], [13, 3, -4, 0.9],
      [14, 3, 1, 0.8], [13, 3, 3, 1.0], [11, 3, 5, 0.85],
      [7, 3, 6, 1.0], [4, 3, 7, 0.8], [1, 3, 6, 0.9],
      [-2, 3, 7, 1.0], [-5, 3, 6, 0.85], [-8, 3, 5, 0.9],
      [-11, 3, 2, 1.0], [-13, 3, 5, 0.8], [16, 3, -1, 0.9],
      [17, 3, 2, 1.0], [-3, 3, 10, 0.9], [5, 3, 10, 0.8],
      [10, 3, 10, 0.9], [14, 3, 11, 0.8], [-9, 3, 10, 0.8],
      [2, 3, 11, 0.9], [-4, 3, 12, 0.8], [7, 3, 12, 0.9],
      [12, 3, 13, 0.8], [16, 3, 14, 0.9]
    ];

    for (const [x, z, s, i] of treePositions) {
      addTree(x, z, s);
    }

    // Low bushes
    function addBush(x, y, z, scale = 1) {
      for (let i = 0; i < 7; i++) {
        const bx = x + (Math.random() - 0.5) * 1.2 * scale;
        const bz = z + (Math.random() - 0.5) * 1.2 * scale;
        const material = i % 3 === 0 ? mat.leafLight : mat.leaf;
        voxel(bx, y + 0.35, bz, 0.55 * scale, 0.7 * scale, 0.55 * scale, material);
      }
    }

    [
      [-11, 0.5, -2, 1.2], [-8, 0.5, 1, 1.0], [-6, 0.5, 3, 0.9],
      [-4, 0.5, 4, 1.1], [-2, 0.5, 5, 0.8], [0, 0.5, 4, 1.0],
      [2, 0.5, 6, 0.9], [4, 0.5, 8, 1.1], [6, 0.5, 10, 0.8],
      [8, 0.5, 12, 1.0], [10, 0.5, 14, 0.9], [12, 0.5, 16, 1.1],
      [14, 0.5, 18, 0.8], [16, 0.5, 20, 1.0], [-10, 0.5, 8, 0.9],
      [-12, 0.5, 10, 1.1], [-14, 0.5, 12, 0.8], [3, 0.5, 10, 0.8],
      [6, 0.5, 12, 1.0], [9, 0.5, 14, 0.8], [12, 0.5, 16, 1.0],
      [-6, 0.5, 10, 0.9], [1, 0.5, 12, 0.8], [5, 0.5, 14, 0.9],
      [8, 0.5, 16, 0.8], [11, 0.5, 18, 1.0], [-13, 0.5, 16, 0.9]
    ].forEach(([x, y, z, s]) => addBush(x, y, z, s));

    // Small stone lantern / marker near the bridge
    const marker = new THREE.Group();
    marker.position.set(5.0, 0, 7.0);
    scene.add(marker);

    block(0, 0.25, 0, mat.rockLight, 0.65);
    block(0, 0.75, 0, mat.rock, 0.48);
    block(0, 1.2, 0, mat.rockLight, 0.6);
    block(0, 1.7, 0, mat.rock, 0.42);
    block(0, 2.05, 0, mat.gem, 0.25);

    // ---------------------------------------------------------------------
    // Small voxel details
    // ---------------------------------------------------------------------
    // Rocks scattered around the scene
    [
      [-14, 1.1, 2], [-15, 1.0, 6], [-14, 1.0, 10], [-12, 1.0, 13],
      [-10, 1.0, 16], [-8, 1.0, 19], [-6, 1.0, 22], [-4, 1.0, 25],
      [-2, 1.0, 28], [0, 1.0, 31], [2, 1.0, 34], [4, 1.0, 37],
      [6, 1.0, 40], [8, 1.0, 43], [10, 1.0, 46], [12, 1.0, 49],
      [14, 1.0, 52], [16, 1.0, 55], [-16, 1.0, -2], [-18, 1.0, 1],
      [-16, 1.0, 4], [-14, 1.0, 7], [-12, 1.0, 10], [17, 1.0, -3],
      [19, 1.0, 1], [18, 1.0, 4], [16, 1.0, 7], [14, 1.0, 10],
      [12, 1.0, 13], [10, 1.0, 16], [8, 1.0, 19], [6, 1.0, 22],
      [4, 1.0, 25], [2, 1.0, 28], [0, 1.0, 31], [-2, 1.0, 34],
      [-4, 1.0, 37], [-6, 1.0, 40], [-8, 1.0, 43], [-10, 1.0, 46],
      [-12, 1.0, 49], [-14, 1.0, 52], [-16, 1.0, 55], [3, 0.6, -10],
      [6, 0.6, -12], [9, 0.6, -15], [12, 0.6, -18], [15, 0.6, -21],
      [18, 0.6, -24], [21, 0.6, -27], [-3, 0.6, 13], [0, 0.6, 16],
      [3, 0.6, 19], [6, 0.6, 22], [9, 0.6, 25], [12, 0.6, 28],
      [15, 0.6, 31], [18, 0.6, 34], [21, 0.6, 37], [-4, 0.6, 10],
      [1, 0.6, 9], [4, 0.6, 12], [7, 0.6, 15], [10, 0.6, 18],
      [13, 0.6, 21], [16, 0.6, 24], [19, 0.6, 27], [22, 0.6, 30]
    ].forEach(([x, y, z, s = 1]) => addRock(x, y, z, s * 0.45));

    // A few glowing crystals near the entrance
    for (const [x, y, z] of [[10.2, 6.0, 2.0], [10.7, 5.7, 1.8], [8.9, 5.8, 2.0]]) {
      const crystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.32),
        mat.gem
      );
      crystal.position.set(x, y, z);
      crystal.scale.set(0.7, 1.4, 0.7);
      crystal.castShadow = true;
      scene.add(crystal);
    }

    // ---------------------------------------------------------------------
    // Camera controls implemented directly
    // ---------------------------------------------------------------------
    const controls = {
      target: new THREE.Vector3(2.5, 7.2, 0.5),
      radius: 29,
      theta: 0.72,
      phi: 1.12,
      dragging: false,
      panning: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);
      camera.position.set(
        controls.target.x + controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z + controls.radius * sinPhi * Math.cos(controls.theta)
      );
      camera.lookAt(controls.target);
    }

    function resetCamera() {
      controls.target.set(2.5, 7.2, 0.5);
      controls.radius = 29;
      controls.theta = 0.72;
      controls.phi = 1.12;
      updateCamera();
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.dragging = true;
      controls.panning = event.button === 2 || event.shiftKey;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      if (controls.panning) {
        const right = new THREE.Vector3();
        const up = new THREE.Vector3();
        camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
        const scale = controls.radius * 0.0015;
        controls.target.addScaledVector(right, -dx * scale);
        controls.target.addScaledVector(up, dy * scale);
        controls.target.x = THREE.MathUtils.clamp(controls.target.x, -12, 16);
        controls.target.y = THREE.MathUtils.clamp(controls.target.y, 2, 18);
        controls.target.z = THREE.MathUtils.clamp(controls.target.z, -12, 14);
      } else {
        controls.theta -= dx * 0.006;
        controls.phi = THREE.MathUtils.clamp(controls.phi - dy * 0.005, 0.28, 1.48);
      }
      updateCamera();
    });

    function endDrag(event) {
      controls.dragging = false;
      controls.panning = false;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.addEventListener("contextmenu", (event) => event.preventDefault());

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      controls.radius = THREE.MathUtils.clamp(
        controls.radius * Math.exp(event.deltaY * 0.001),
        12,
        58
      );
      updateCamera();
    }, { passive: false });

    // ---------------------------------------------------------------------
    // WASD movement
    // ---------------------------------------------------------------------
    const keys = new Set();

    addEventListener("keydown", (event) => {
      keys.add(event.key.toLowerCase());
      if (event.key.toLowerCase() === "r") resetCamera();
    });

    addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    const movement = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    function updateMovement() {
      const forwardInput =
        Number(keys.has("arrowup") || keys.has("w")) -
        Number(keys.has("arrowdown") || keys.has("s"));

      const rightInput =
        Number(keys.has("arrowright") || keys.has("d")) -
        Number(keys.has("arrowleft") || keys.has("a"));

      camera.getWorldDirection(forward);
      right.crossVectors(forward, camera.up).normalize();

      movement.addScaledVector(forward, forwardInput);
      movement.addScaledVector(right, rightInput);
      movement.y = 0;
      movement.normalize().multiplyScalar(0.12);
    }

    function animate() {
      requestAnimationFrame(animate);
      updateMovement();
      scene.add(movement);

      // Gentle animated gem pulse
      mat.gem.emissiveIntensity = 0.62 + Math.sin(performance.now() * 0.002) * 0.18;

      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    resetCamera();
    animate();
  </script>
</body>
</html>
