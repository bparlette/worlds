<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jungle Waterfall — Contra Stage 1</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02090d;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #e8fff0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .topbar {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .title {
      font-size: clamp(22px, 3vw, 42px);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .title span {
      color: #8fffc0;
      font-weight: 500;
    }

    .telemetry {
      min-width: 220px;
      padding: 13px 15px;
      border: 1px solid rgba(133, 255, 180, 0.25);
      border-radius: 10px;
      background: rgba(3, 19, 17, 0.68);
      backdrop-filter: blur(12px);
      font-size: 12px;
      line-height: 1.7;
    }

    .telemetry strong {
      display: block;
      color: #9effc1;
      font-size: 13px;
    }

    .telemetry b {
      color: #d9fff4;
      font-weight: 600;
    }

    .bottom-left {
      position: absolute;
      left: 24px;
      bottom: 22px;
      padding: 10px 13px;
      border-left: 2px solid #75e7a3;
      background: rgba(3, 16, 15, 0.58);
      color: rgba(225, 255, 236, 0.78);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .bottom-right {
      position: absolute;
      right: 24px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .reticle {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(170, 255, 218, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(130, 255, 190, 0.7);
    }

    .reticle::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 7px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #a9ffe0;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #071315;
      color: #8fffc0;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      .topbar {
        top: 14px;
        left: 14px;
        right: 14px;
      }

      .telemetry {
        min-width: 170px;
      }

      .bottom-left {
        left: 14px;
        bottom: 14px;
      }

      .bottom-right {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="loading">Loading jungle mission…</div>

  <div id="hud">
    <div class="topbar">
      <div class="title">JUNGLE <span>WATERFALL</span></div>
      <div class="telemetry">
        <strong>Mission stage</strong>
        <b>01 / Jungle infiltration</b>
        <br />
        <strong>Weapon</strong>
        <b id="weaponName">LASER GUN</b>
        <br />
        <strong>Score</strong>
        <b id="scoreValue">000000</b>
      </div>
    </div>

    <div class="bottom-left">
      Drag to orbit · Mouse wheel to zoom · Right-drag to pan
    </div>

    <div class="bottom-right">
      <div class="reticle"></div>
      <span>Follow the falling soldier</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, camera
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071518);
    scene.fog = new THREE.FogExp2(0x173c36, 0.018);

    const camera = new THREE.PerspectiveCamera(
      62,
      innerWidth / innerHeight,
      0.1,
      180
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const clock = new THREE.Clock();
    const world = new THREE.Group();
    scene.add(world);

    // -------------------------------------------------------------------------
    // Materials and procedural textures
    // -------------------------------------------------------------------------

    const materials = {
      leaf: new THREE.MeshStandardMaterial({
        color: 0x174c32,
        roughness: 0.94
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x39754a,
        roughness: 0.9
      }),
      leafDark: new THREE.MeshStandardMaterial({
        color: 0x0c3426,
        roughness: 1
      }),
      trunk: new THREE.MeshStandardMaterial({
        color: 0x3a251b,
        roughness: 1
      }),
      rock: new THREE.MeshStandardMaterial({
        color: 0x38443e,
        roughness: 1
      }),
      cliff: new THREE.MeshStandardMaterial({
        color: 0x34463d,
        roughness: 1
      }),
      vine: new THREE.MeshStandardMaterial({
        color: 0x285c35,
        roughness: 1
      }),
      water: new THREE.MeshStandardMaterial({
        color: 0x3aa9a4,
        emissive: 0x0b3332,
        emissiveIntensity: 0.55,
        roughness: 0.25,
        metalness: 0.12,
        transparent: true,
        opacity: 0.88
      }),
      soldier: new THREE.MeshStandardMaterial({
        color: 0x393c38,
        roughness: 0.82
      }),
      soldierDark: new THREE.MeshStandardMaterial({
        color: 0x202622,
        roughness: 0.9
      }),
      soldierHead: new THREE.MeshStandardMaterial({
        color: 0x8f7053,
        roughness: 0.95
      }),
      weapon: new THREE.MeshStandardMaterial({
        color: 0x69746f,
        metalness: 0.55,
        roughness: 0.45
      }),
      weaponGreen: new THREE.MeshStandardMaterial({
        color: 0x73948a,
        metalness: 0.5,
        roughness: 0.4
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xd7b84d,
        emissive: 0x4b3305,
        emissiveIntensity: 0.35,
        roughness: 0.55
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0x9e2727,
        emissive: 0x450808,
        emissiveIntensity: 0.55,
        roughness: 0.55
      })
    };

    function makeTexture(type) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      if (type === "leaf") {
        ctx.fillStyle = "#174b31";
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 1800; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          const size = 2 + Math.random() * 12;
          ctx.strokeStyle = Math.random() > 0.5
            ? "rgba(112,165,100,0.22)"
            : "rgba(8,35,24,0.3)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.random() * 5, y - size);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#173e35";
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 900; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          ctx.fillStyle = Math.random() > 0.5
            ? "rgba(130,194,130,0.18)"
            : "rgba(5,20,18,0.35)";
          ctx.fillRect(x, y, 2 + Math.random() * 3, 2 + Math.random() * 8);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    materials.leaf.map = makeTexture("leaf");
    materials.leafLight.map = makeTexture("leaf");
    materials.leafDark.map = makeTexture("leaf");

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x8bc5ae, 0x17251d, 1.35));

    const sun = new THREE.DirectionalLight(0xffe7b0, 2.15);
    sun.position.set(-20, 32, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -40;
    sun.shadow.camera.right = 40;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 90;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const waterfallLight = new THREE.PointLight(0x65e8d0, 18, 35, 2);
    waterfallLight.position.set(8, 5, -10);
    scene.add(waterfallLight);

    // -------------------------------------------------------------------------
    // Helpers
    // -------------------------------------------------------------------------

    function mesh(geometry, material, position, parent = world) {
      const object = new THREE.Mesh(geometry, material);
      object.position.copy(position);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, parent = world) {
      return mesh(
        new THREE.BoxGeometry(w, h, d),
        material,
        new THREE.Vector3(x, y, z),
        parent
      );
    }

    function cylinder(radius, height, material, x, y, z, parent = world, radialSegments = 12) {
      return mesh(
        new THREE.CylinderGeometry(radius, radius, height, radialSegments),
        material,
        new THREE.Vector3(x, y, z),
        parent
      );
    }

    function branchBetween(a, b, radius, material, parent = world) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const object = cylinder(radius, length, material, 0, 0, 0, parent);
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return object;
    }

    // -------------------------------------------------------------------------
    // Terrain, cliffs, and waterfall
    // -------------------------------------------------------------------------

    const terrain = new THREE.Group();
    world.add(terrain);

    const ground = box(
      100,
      1.2,
      52,
      materials.leafDark,
      0,
      -0.8,
      0,
      terrain
    );
    ground.receiveShadow = true;

    const groundTop = box(
      100,
      0.18,
      52,
      materials.leaf,
      0,
      -0.12,
      0,
      terrain
    );
    groundTop.receiveShadow = true;

    // A large cliff on the right, with a weapon sensor niche.
    const cliff = box(
      24,
      28,
      18,
      materials.cliff,
      17,
      7,
      -7,
      terrain
    );

    const cliffTop = box(
      25,
      1,
      19,
      materials.leafDark,
      17,
      22,
      -7,
      terrain
    );

    // Sensor wall and recessed niche.
    const sensorWall = box(
      8,
      6,
      2,
      materials.rock,
      14.5,
      9,
      -1.5,
      terrain
    );

    const niche = box(
      4.2,
      4.8,
      1.1,
      materials.leafDark,
      14.5,
      9,
      -0.4,
      terrain
    );

    const sensorFrame = new THREE.Group();
    sensorFrame.position.set(14.5, 9, 0.15);
    terrain.add(sensorFrame);

    const sensorBack = box(
      3.2,
      3.2,
      0.25,
      materials.yellow,
      0,
      0,
      0,
      sensorFrame
    );

    const sensorLeft = box(
      0.25,
      3.6,
      0.35,
      materials.yellow,
      -1.45,
      0,
      0.2,
      sensorFrame
    );

    const sensorRight = box(
      0.25,
      3.6,
      0.35,
      materials.yellow,
      1.45,
      0,
      0.2,
      sensorFrame
    );

    const sensorTop = box(
      3.15,
      0.25,
      0.35,
      materials.yellow,
      0,
      1.65,
      0.2,
      sensorFrame
    );

    const sensorBeam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.025, 20, 8),
      materials.yellow
    );
    sensorBeam.rotation.z = Math.PI / 2;
    sensorBeam.position.set(8, 9, 0.2);
    terrain.add(sensorBeam);

    const sensorGlow = new THREE.PointLight(0xffc85c, 2.5, 7, 2);
    sensorGlow.position.set(14.5, 9, 0.8);
    terrain.add(sensorGlow);

    // Famous bridge.
    const bridge = new THREE.Group();
    bridge.position.set(0, 0, 0);
    terrain.add(bridge);

    const bridgeDeck = box(
      18,
      0.65,
      3.5,
      materials.trunk,
      0,
      0.45,
      0,
      bridge
    );

    for (let i = 0; i < 13; i++) {
      const x = -8.2 + i * 1.46;
      box(
        0.22,
        0.45,
        0.32,
        materials.yellow,
        x,
        0.78,
        -1.55,
        bridge
      );
      box(
        0.22,
        0.45,
        0.32,
        materials.yellow,
        x,
        0.78,
        1.55,
        bridge
      );
    }

    for (let i = 0; i < 8; i++) {
      const x = -7.5 + i * 2.25;
      cylinder(0.11, 0.55, materials.yellow, x, 1.05, 0, bridge, 8);
    }

    // Waterfall.
    const waterfall = new THREE.Group();
    waterfall.position.set(-7, 0, -14);
    terrain.add(waterfall);

    const fallBase = box(
      5.2,
      25,
      3.2,
      materials.water,
      0,
      11,
      0,
      waterfall
    );
    fallBase.castShadow = false;

    const fallTop = box(
      6.5,
      1,
      4.2,
      materials.water,
      0,
      25.5,
      0,
      waterfall
    );
    fallTop.castShadow = false;

    const fallRim = box(
      7,
      1.5,
      5,
      materials.rock,
      0,
      25,
      0,
      waterfall
    );

    const mist = new THREE.Mesh(
      new THREE.SphereGeometry(3, 12, 8),
      new THREE.MeshBasicMaterial({
        color: 0xbce8d7,
        transparent: true,
        opacity: 0.09,
        depthWrite: false
      })
    );
    mist.position.set(-7, 3, -12);
    world.add(mist);

    // -------------------------------------------------------------------------
    // Vegetation
    // -------------------------------------------------------------------------

    const trees = [];

    function createTree(x, z, scale = 1, parent = terrain) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);
      parent.add(tree);

      const trunk = cylinder(
        0.38,
        6.5,
        materials.trunk,
        0,
        3.2,
        0,
        tree,
        9
      );

      const crown = new THREE.Group();
      crown.position.y = 6;
      tree.add(crown);

      const clusters = [
        [-1.7, 0.2, 0, 3.2],
        [1.7, 0.1, 0, 3.5],
        [0, 1.1, 0, 4.2],
        [0, -0.2, 1.2, 3.2],
        [0, -0.2, -1.3, 3.4]
      ];

      clusters.forEach((data, index) => {
        const material = index % 2 === 0 ? materials.leaf : materials.leafLight;
        const foliage = mesh(
          new THREE.IcosahedronGeometry(data[3], 1),
          material,
          new THREE.Vector3(data[0], data[1], data[2]),
          crown
        );
        foliage.rotation.set(Math.random(), Math.random(), Math.random());
      });

      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const length = 2.5 + Math.random() * 2.5;
        const end = new THREE.Vector3(
          Math.cos(angle) * length,
          Math.sin(angle) * length,
          Math.sin(angle) * length
        );
        branchBetween(
          new THREE.Vector3(0, 4.5, 0),
          end,
          0.11,
          materials.trunk,
          tree
        );
      }

      trees.push(tree);
    }

    createTree(-16, 6, 1.1);
    createTree(-12, -11, 0.9);
    createTree(-7, 13, 1.25);
    createTree(1, 12, 0.85);
    createTree(7, -12, 1.1);
    createTree(16, 4, 0.95);
    createTree(22, -13, 1.2);
    createTree(-22, -16, 1.1);
    createTree(14, 16, 0.9);
    createTree(-2, 18, 0.8);

    // Hanging vines.
    for (let i = 0; i < 34; i++) {
      const x = (Math.random() - 0.5) * 58;
      const z = (Math.random() - 0.5) * 44;
      const length = 1.5 + Math.random() * 4;
      const vine = cylinder(
        0.035,
        length,
        materials.vine,
        x,
        length * 0.5,
        z,
        terrain,
        6
      );
      vine.rotation.z = (Math.random() - 0.5) * 0.25;
    }

    // Leaves and small plants.
    const leafParticles = [];

    for (let i = 0; i < 120; i++) {
      const leaf = mesh(
        new THREE.CircleGeometry(0.35, 7),
        Math.random() > 0.5 ? materials.leafLight : materials.leaf,
        new THREE.Vector3(
          (Math.random() - 0.5) * 58,
          0.2 + Math.random() * 1.5,
          (Math.random() - 0.5) * 44
        )
      );
      leaf.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      leaf.castShadow = false;
      leafParticles.push({
        object: leaf,
        speed: 0.15 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2
      });
    }

    // -------------------------------------------------------------------------
    // Soldiers
    // -------------------------------------------------------------------------

    const enemies = [];
    const bullets = [];
    const spreadBullets = [];

    function createSoldier(x, z, scale = 1, facing = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      group.rotation.y = facing > 0 ? Math.PI : 0;
      world.add(group);

      // Legs.
      const leftLeg = box(0.34, 0.9, 0.38, materials.soldierDark, -0.15, 0.45, 0, group);
      const rightLeg = box(0.34, 0.9, 0.38, materials.soldierDark, 0.15, 0.45, 0, group);

      // Torso.
      const torso = box(0.72, 1.05, 0.48, materials.soldier, 0, 1.35, 0, group);
      torso.rotation.z = 0.05;

      // Head.
      const head = mesh(
        new THREE.SphereGeometry(0.26, 12, 8),
        materials.soldierHead,
        new THREE.Vector3(0, 2.08, 0),
        group
      );

      // Helmet.
      const helmet = mesh(
        new THREE.SphereGeometry(0.28, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        materials.yellow,
        new THREE.Vector3(0, 2.08, 0),
        group
      );

      // Arms.
      const leftArm = box(0.25, 0.85, 0.28, materials.soldier, -0.55, 1.38, 0, group);
      const rightArm = box(0.25, 0.85, 0.28, materials.soldier, 0.55, 1.38, 0, group);
      leftArm.rotation.z = -0.12;
      rightArm.rotation.z = 0.12;

      // Weapon.
      const weapon = box(0.85, 0.2, 0.25, materials.weaponGreen, 0.63, 1.35, 0, group);
      weapon.rotation.z = -0.18;

      // Face.
      const face = mesh(
        new THREE.CircleGeometry(0.09, 10),
        materials.soldierHead,
        new THREE.Vector3(0.25, 2.08, 0.28),
        group
      );
      face.rotation.y = Math.PI;

      enemies.push({
        group,
        leftLeg,
        rightLeg,
        leftArm,
        rightArm,
        weapon,
        face,
        speed: 0.7 + Math.random() * 0.45,
        offset: Math.random() * Math.PI * 2
      });
    }

    // Enemies spawn immediately after the player begins moving.
    const spawnTimer = new THREE.Group();
    world.add(spawnTimer);

    function spawnEnemy(index) {
      const x = 18 + index * 1.25;
      createSoldier(x, -3 + index * 0.18, 0.9, 1);
    }

    for (let i = 0; i < 5; i++) spawnEnemy(i);

    function updateEnemies(time) {
      enemies.forEach((enemy, index) => {
        const t = time * enemy.speed + enemy.offset;
        const x = 18 + t * 1.7 + index * 0.22;

        enemy.group.position.x = x;
        enemy.group.position.z = -3 + index * 0.18 + Math.sin(t * 1.2) * 0.12;
        enemy.group.rotation.z = Math.sin(t * 3) * 0.025;

        const stride = t * 3.2;
        enemy.leftLeg.rotation.x = Math.sin(stride) * 0.75;
        enemy.rightLeg.rotation.x = -Math.sin(stride) * 0.75;
        enemy.leftArm.rotation.x = -Math.sin(stride) * 0.45;
        enemy.rightArm.rotation.x = Math.sin(stride) * 0.45;
      });
    }

    // -------------------------------------------------------------------------
    // Weapons
    // -------------------------------------------------------------------------

    const laser = new THREE.Group();
    const spread = new THREE.Group();
    world.add(laser, spread);

    function createLaser() {
      laser.visible = true;
      spread.visible = false;
      document.getElementById("weaponName").textContent = "LASER GUN";

      const body = box(0.65, 0.34, 0.28, materials.weapon, 0, 1.32, 0, laser);
      body.rotation.z = -0.18;

      const barrel = cylinder(
        0.09,
        1.1,
        materials.yellow,
        0.65,
        1.32,
        0,
        laser,
        10
      );
      barrel.rotation.z = -0.18;

      const scope = box(0.2, 0.18, 0.45, materials.weaponGreen, 0.18, 1.65, 0, laser);
      scope.rotation.z = -0.18;

      const handle = box(0.16, 0.65, 0.2, materials.soldierDark, -0.28, 1.05, 0, laser);
      handle.rotation.z = 0.28;

      const laserLight = new THREE.PointLight(0x64ff9a, 1.2, 4, 2);
      laserLight.position.set(0.65, 1.32, 0.4);
      laser.add(laserLight);
    }

    function createSpread() {
      spread.visible = true;
      laser.visible = false;
      document.getElementById("weaponName").textContent = "SPREAD GUN";

      const body = box(0.8, 0.34, 0.32, materials.weapon, 0, 1.32, 0, spread);
      body.rotation.z = -0.14;

      const barrel = cylinder(
        0.11,
        1.25,
        materials.yellow,
        0.65,
        1.32,
        0,
        spread,
        10
      );
      barrel.rotation.z = -0.14;

      const scope = box(0.22, 0.2, 0.48, materials.weaponGreen, 0.16, 1.66, 0, spread);
      scope.rotation.z = -0.14;

      const handle = box(0.18, 0.7, 0.22, materials.soldierDark, -0.3, 1.04, 0, spread);
      handle.rotation.z = 0.3;

      const spreadHousing = box(0.4, 0.34, 0.38, materials.soldier, -0.15, 1.32, 0, spread);
      spreadHousing.rotation.z = -0.14;

      const glow = new THREE.PointLight(0xffbd55, 1.4, 5, 2);
      glow.position.set(0.65, 1.32, 0.4);
      spread.add(glow);
    }

    // -------------------------------------------------------------------------
    // Bullets and effects
    // -------------------------------------------------------------------------

    const laserBullets = [];
    spreadBullets = [];
    const impactRings = [];

    function makeLaserBullet(color = 0x79ff9d) {
      const bullet = mesh(
        new THREE.CylinderGeometry(0.025, 0.025, 0.8, 6),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.95
        }),
        new THREE.Vector3()
      );
      bullet.castShadow = false;
      return bullet;
    }

    function makeSpreadBullet(color = 0xffc35c) {
      const bullet = mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 0.6, 7),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.9
        }),
        new THREE.Vector3()
      );
      bullet.castShadow = false;
      return bullet;
    }

    function launchLaser(x, y, z, direction, speed) {
      const bullet = makeLaserBullet();
      bullet.position.set(x, y, z);
      bullet.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(direction, 0, 0).normalize()
      );
      world.add(bullet);
      laserBullets.push({
        object: bullet,
        speed,
        phase: Math.random() * Math.PI * 2
      });
    }

    function launchSpread(x, y, z, direction, speed) {
      for (let i = 0; i < 5; i++) {
        const bullet = makeSpreadBullet();
        const angle = (i / 4 - 0.5) * Math.PI * 0.72;
        bullet.position.set(
          x + Math.cos(angle) * 0.18,
          y,
          z + Math.sin(angle) * 0.18
        );
        bullet.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(
            direction + Math.cos(angle) * 0.18,
            0,
            Math.sin(angle) * 0.18
          ).normalize()
        );
        world.add(bullet);
        spreadBullets.push({
          object: bullet,
          speed,
          phase: Math.random() * Math.PI * 2,
          angle
        });
      }
    }

    function impact(x, y, z, color = 0x63ff9a) {
      const ring = mesh(
        new THREE.RingGeometry(0.35, 0.65, 32),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.8,
          side: THREE.DoubleSide,
          depthWrite: false
        }),
        new THREE.Vector3(x, y, z)
      );
      ring.rotation.x = -Math.PI / 2;
      ring.castShadow = false;
      ring.receiveShadow = false;
      impactRings.push({
        object: ring,
        speed: 2.2,
        phase: Math.random() * Math.PI * 2
      });
    }

    // -------------------------------------------------------------------------
    // Animated overhead capsule with Spread gun
    // -------------------------------------------------------------------------

    const capsule = new THREE.Group();
    world.add(capsule);

    const capsuleBody = mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 2.1, 12),
      materials.yellow,
      new THREE.Vector3()
    );
    capsuleBody.castShadow = true;

    const capsuleCap = mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.35, 12),
      materials.soldier,
      new THREE.Vector3(0, 1.25, 0),
      capsule
    );

    const capsuleCap2 = mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.35, 12),
      materials.soldier,
      new THREE.Vector3(0, -1.25, 0),
      capsule
    );

    const capsuleWindow = mesh(
      new THREE.CircleGeometry(0.32, 16),
      materials.leafDark,
      new THREE.Vector3(0, 0, 0.49),
      capsule
    );
    capsuleWindow.rotation.x = Math.PI;

    // -------------------------------------------------------------------------
    // Fireflies / environmental particles
    // -------------------------------------------------------------------------

    const fireflies = [];
    const fireflyMaterial = new THREE.MeshBasicMaterial({
      color: 0x9effb5,
      transparent: true,
      opacity: 0.75
    });

    for (let i = 0; i < 35; i++) {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 6, 4),
        fireflyMaterial
      );
      particle.position.set(
        (Math.random() - 0.5) * 55,
        0.5 + Math.random() * 12,
        (Math.random() - 0.5) * 42
      );
      world.add(particle);
      fireflies.push({
        object: particle,
        speed: 0.35 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        radius: 0.25 + Math.random() * 0.5
      });
    }

    // -------------------------------------------------------------------------
    // Camera controls: orbit, pan, zoom
    // -------------------------------------------------------------------------

    const controls = {
      target: new THREE.Vector3(1, 5, 0),
      radius: 27,
      theta: -0.78,
      phi: 1.13,
      dragging: false,
      panning: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);
      camera.position.set(
        controls.target.x + controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z + controls.radius * sinPhi * Math.cos(controls.theta)
      );
      camera.lookAt(controls.target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.dragging = true;
      controls.panning = event.button === 2 || event.shiftKey;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      if (controls.panning) {
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
        const scale = controls.radius * 0.0014;
        controls.target.addScaledVector(right, -dx * scale);
        controls.target.addScaledVector(up, dy * scale);
        controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 20);
      } else {
        controls.theta -= dx * 0.005;
        controls.phi = THREE.MathUtils.clamp(
          controls.phi - dy * 0.004,
          0.28,
          Math.PI * 0.48
        );
      }

      updateCamera();
    });

    function endDrag(event) {
      controls.dragging = false;
      controls.panning = false;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.addEventListener("contextmenu", (event) => event.preventDefault());

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      controls.radius = THREE.MathUtils.clamp(
        controls.radius * Math.exp(event.deltaY * 0.001),
        11,
        58
      );
      updateCamera();
    }, { passive: false });

    // Mobile pinch zoom.
    const activePointers = new Map();
    let pinchDistance = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        pinchDistance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;

      const previous = activePointers.get(event.pointerId);
      activePointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      if (activePointers.size === 2) {
        const points = [...activePointers.values()];
        const distance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );

        if (pinchDistance > 0) {
          controls.radius = THREE.MathUtils.clamp(
            controls.radius * (pinchDistance / Math.max(distance, 1)),
            11,
            58
          );
          updateCamera();
        }

        pinchDistance = distance;
      }
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      activePointers.delete(event.pointerId);
      if (activePointers.size < 2) pinchDistance = 0;
    });

    updateCamera();

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    let score = 0;
    let elapsed = 0;
    let firstEnemySpawned = false;

    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {

      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      // Gentle environmental motion.
      waterfallLight.intensity = 16 + Math.sin(elapsed * 1.7) * 2.5;
      mist.position.x = Math.sin(elapsed * 0.35) * 0.5;
      mist.scale.setScalar(1 + Math.sin(elapsed * 0.8) * 0.08);

      for (const item of leafParticles) {
        item.object.position.y += Math.sin(elapsed * item.speed + item.phase) * dt * 0.08;
        item.object.rotation.y += dt * 0.035;
        item.object.rotation.z += Math.sin(elapsed * item.speed + item.phase) * dt * 0.04;
      }

      for (const item of fireflies) {
        item.object.position.x += Math.sin(elapsed * item.speed + item.phase) * dt * 0.13;
        item.object.position.y += Math.cos(elapsed * item.speed * 0.8 + item.phase) * dt * 0.1;
        item.object.position.z += Math.sin(elapsed * item.speed * 0.6 + item.phase) * dt * 0.1;
        item.object.scale.setScalar(0.7 + Math.sin(elapsed * 2 + item.phase) * 0.3);
      }

      updateEnemies(elapsed);

      // Enemies spawn as soon as the player starts moving.
      if (!firstEnemySpawned) {
        firstEnemySpawned = true;
        for (let i = 0; i < 5; i++) spawnEnemy(i);
      }

      // Laser and spread bullets.
      const now = elapsed % 1.35;
      const fireRate = now > 0.45 ? 0.72 : 0;

      if (laser.visible) {
        if (now > 0.45) {
          launchLaser(0.66, 1.32, 0.1, 1, 1.5);
        }

        for (const bullet of laserBullets) {
          bullet.object.position.x += bullet.speed * dt;
          bullet.object.material.opacity -= dt * 0.35;
          bullet.object.scale.setScalar(1 - bullet.object.material.opacity * 0.3);

          if (bullet.object.material.opacity <= 0.01) {
            world.remove(bullet.object);
            bullet.object.geometry.dispose();
            bullet.object.material.dispose();
          }
        }

        const nextImpact = 0.45 + Math.floor(elapsed / 1.35) * 0.72;
        if (elapsed >= nextImpact) {
          impact(6.2, 0.55, -1.5, 0x65ff9a);
        }
      }

      if (spread.visible) {
        for (const bullet of spreadBullets) {
          const t = (elapsed * bullet.speed + bullet.phase) % 1.2;
          bullet.object.position.x += 1.7 * dt;
          bullet.object.position.y += Math.sin(elapsed * 8 + bullet.phase) * dt * 0.08;
          bullet.object.material.opacity -= dt * 0.28;
          bullet.object.scale.setScalar(1 - bullet.object.material.opacity * 0.3);

          if (bullet.object.material.opacity <= 0.01) {
            world.remove(bullet.object);
            bullet.object.geometry.dispose();
            bullet.object.material.dispose();
          }
        }

        const spreadDuration = 1.2;
        if (elapsed >= 0.45 + spreadDuration) {
          impact(6.5, 0.55, -1.5, 0xffc35c);
        }
      }

      for (const item of impactRings) {
        const t = (elapsed * item.speed + item.phase) % 1;
        item.object.scale.setScalar(0.2 + t * 2.2);
        item.object.material.opacity = (1 - t) * 0.8;

        if (t > 0.94) {
          world.remove(item.object);
          item.object.geometry.dispose();
          item.object.material.dispose();
        }
      }

      score = Math.floor(10000 + elapsed * 1800);
      document.getElementById("scoreValue").textContent = score.toString().padStart(6, "0");

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();

    setTimeout(() => {
      document.getElementById("loading").classList.add("hidden");
    }, 350);
  </script>
</body>
</html>
