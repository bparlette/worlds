<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario Bros. World 1-1</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #5b91d8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 2;
      padding: 12px 15px;
      color: #f7e9c2;
      background: rgba(15, 34, 65, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      user-select: none;
    }
    #hud strong { display: block; }
    #help {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 2;
      padding: 9px 12px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(15, 34, 65, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Super Mario Bros.</strong>
    <strong>World 1–1</strong>
  </div>
  <div id="help">Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x5b91d8);
    scene.fog = new THREE.Fog(0x5b91d8, 28, 58);

    const camera = new THREE.PerspectiveCamera(
      48,
      innerWidth / innerHeight,
      0.1,
      120
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xcceeff, 0x715233, 2.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1cf, 3.1);
    sun.position.set(-18, 30, 15);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 75;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8ec7ff, 0.8);
    fill.position.set(18, 14, -22);
    scene.add(fill);

    const clock = new THREE.Clock();

    const materials = {
      sky: new THREE.MeshStandardMaterial({ color: 0x5b91d8, roughness: 1 }),
      cloud: new THREE.MeshStandardMaterial({
        color: 0xf6fbff, roughness: 1
      }),
      cloudEdge: new THREE.MeshStandardMaterial({
        color: 0xddebf1, roughness: 1
      }),
      ground: new THREE.MeshStandardMaterial({
        color: 0x8b6b3f, roughness: 0.96
      }),
      groundDark: new THREE.MeshStandardMaterial({
        color: 0x654b2f, roughness: 1
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x55aa55, roughness: 0.9
      }),
      grassLight: new THREE.MeshStandardMaterial({
        color: 0x78b85c, roughness: 0.9
      }),
      dirt: new THREE.MeshStandardMaterial({
        color: 0xa96f42, roughness: 1
      }),
      stone: new THREE.MeshStandardMaterial({
        color: 0x8a7967, roughness: 0.95
      }),
      stoneDark: new THREE.MeshStandardMaterial({
        color: 0x665e50, roughness: 1
      }),
      brick: new THREE.MeshStandardMaterial({
        color: 0xa95636, roughness: 0.92
      }),
      brickDark: new THREE.MeshStandardMaterial({
        color: 0x713a2b, roughness: 1
      }),
      brickLight: new THREE.MeshStandardMaterial({
        color: 0xc26743, roughness: 0.9
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xe4b83f, roughness: 0.7
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xd63c35, roughness: 0.7
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x4289d4, roughness: 0.7
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x47b968, roughness: 0.7
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xd89a68, roughness: 0.8
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x20252b, roughness: 0.8
      }),
      mushroom: new THREE.MeshStandardMaterial({
        color: 0xc94437, roughness: 0.85
      }),
      mushroomTop: new THREE.MeshStandardMaterial({
        color: 0xe76b45, roughness: 0.75
      }),
      shell: new THREE.MeshStandardMaterial({
        color: 0xb9773e, roughness: 0.8
      }),
      shellDark: new THREE.MeshStandardMaterial({
        color: 0x87502f, roughness: 0.9
      }),
      eye: new THREE.MeshStandardMaterial({
        color: 0x171719, roughness: 0.45
      })
    };

    function mesh(geometry, material, position, rotation = null, cast = true) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(...position);
      if (rotation) m.rotation.set(...rotation);
      m.castShadow = cast;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    }

    function box(w, h, d, material, x, y, z, rotation = null) {
      return mesh(
        new THREE.BoxGeometry(w, h, d),
        material,
        [x, y, z],
        rotation
      );
    }

    // Compact, fully enclosed 30 x 30 world.
    const WORLD_HALF = 15;
    const WORLD_HEIGHT = 13;

    // Four continuous, plain boundary walls. BackSide makes them solid from inside.
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x705b45,
      roughness: 1,
      side: THREE.BackSide
    });

    box(30, WORLD_HEIGHT, 1.15, wallMat, 0, WORLD_HEIGHT / 2, -14.55);
    box(30, WORLD_HEIGHT, 1.15, wallMat, 0, WORLD_HEIGHT / 2, 14.55);
    box(1.15, WORLD_HEIGHT, 29, wallMat, -14.55, WORLD_HEIGHT / 2, 0);
    box(1.15, WORLD_HEIGHT, 29, wallMat, 14.55, WORLD_HEIGHT / 2, 0);

    // Main platform and stepped foreground.
    box(29, 1.25, 29, materials.ground, 0, 0.625, 0);
    box(29, 0.18, 29, materials.grass, 0, 1.32, 0);
    box(12, 1.0, 11, materials.groundDark, 0, 0.5, 1.7);
    box(12, 0.12, 11, materials.grass, 0, 1.05, 1.7);

    // Main foreground brick platform, aligned with the screenshot's hero ledge.
    box(11.5, 1.35, 5.8, materials.brick, 0, 1.68, -7.1);
    box(12.0, 0.16, 6.2, materials.grass, 0, 2.42, -7.1);

    // Brick columns and capstones.
    const brickColumnPositions = [
      [-5.6, 2.65, -7.1],
      [5.6, 2.65, -7.1],
      [-5.6, 2.65, 0.8],
      [5.6, 2.65, 0.8],
      [-5.6, 2.65, -12.7],
      [5.6, 2.65, -12.7]
    ];

    for (const p of brickColumnPositions) {
      box(1.25, 1.2, 1.25, materials.brickDark, p[0], p[1], p[2]);
      box(1.55, 0.22, 1.55, materials.brick, p[0], p[1] + 0.72, p[2]);
    }

    // Upper floating brick platform.
    box(10.5, 1.15, 3.2, materials.brick, 2.8, 7.05, -7.0);
    box(10.9, 0.18, 3.5, materials.grass, 2.8, 7.68, -7.0);

    // Side platforms.
    box(4.6, 1.1, 3.2, materials.brick, -9.2, 3.75, -10.8);
    box(4.9, 0.16, 3.5, materials.grass, -9.2, 4.38, -10.8);
    box(4.4, 1.0, 2.8, materials.brick, 9.3, 4.1, -9.8);
    box(4.7, 0.16, 3.1, materials.grass, 9.3, 4.68, -9.8);

    // Small distant island.
    box(5.4, 1.0, 4.0, materials.brick, -10.5, 5.65, 7.0);
    box(5.7, 0.16, 4.3, materials.grass, -10.5, 6.2, 7.0);

    // Clouds, made from low-poly spheres.
    function cloud(x, y, z, scale = 1) {
      const group = new THREE.Group();
      const pieces = [
        [-1.25, 0, 0, 0.85],
        [-0.45, 0.22, 0, 1.05],
        [0.55, 0.12, 0, 1.0],
        [1.35, -0.02, 0, 0.75],
        [0, -0.28, 0, 1.15]
      ];
      for (const [px, py, pz, s] of pieces) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(s, 14, 10),
          materials.cloud
        );
        puff.position.set(px, py, pz);
        puff.scale.y = 0.72;
        puff.castShadow = false;
        group.add(puff);
      }
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);
      return group;
    }

    const clouds = [
      [-12, 11.5, -10, 1.15],
      [8, 12.0, -11, 1.0],
      [13, 9.2, 7, 0.9],
      [-9, 7.8, 10, 0.8]
    ];
    for (const [x, y, z, s] of clouds) cloud(x, y, z, s);

    // Trees: trunks and clustered low-poly foliage.
    function tree(x, z, scale = 1) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.34, 2.4, 8),
        materials.brickDark
      );
      trunk.position.y = 1.2;
      trunk.castShadow = true;
      group.add(trunk);

      const leafMat = materials.grass;
      const leafPositions = [
        [-0.75, 2.35, 0, 0.9],
        [0.72, 2.45, 0.05, 0.95],
        [0, 3.05, 0, 1.0],
        [-0.18, 2.65, 0.35, 0.82],
        [0.4, 2.7, -0.25, 0.85]
      ];
      for (const [px, py, pz, s] of leafPositions) {
        const leaf = new THREE.Mesh(
          new THREE.IcosahedronGeometry(s, 1),
          leafMat
        );
        leaf.position.set(px, py, pz);
        leaf.scale.y = 0.88;
        leaf.castShadow = true;
        group.add(leaf);
      }
      group.position.set(x, 1.55, z);
      group.scale.setScalar(scale);
      scene.add(group);
    }

    tree(-11.6, -12.8, 1.05);
    tree(11.8, -12.2, 0.95);
    tree(-11.7, 9.2, 0.82);
    tree(11.7, 9.0, 0.9);
    tree(0.4, 12.7, 0.75);

    // Small house on the right side.
    const house = new THREE.Group();
    const houseMat = new THREE.MeshStandardMaterial({
      color: 0xe4c66b,
      roughness: 0.86
    });
    const roofMat = new THREE.MeshStandardMaterial({
      color: 0x9e3f32,
      roughness: 0.88
    });

    const houseBody = new THREE.Mesh(
      new THREE.BoxGeometry(3.0, 2.0, 2.4),
      houseMat
    );
    houseBody.position.y = 2.0;
    houseBody.castShadow = true;
    house.add(houseBody);

    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(2.15, 1.25, 4),
      roofMat
    );
    roof.rotation.y = Math.PI / 4;
    roof.position.y = 3.2;
    roof.scale.z = 0.8;
    roof.castShadow = true;
    house.add(roof);

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(0.72, 1.45, 0.09),
      materials.brickDark
    );
    door.position.set(0, 0.73, 1.23);
    house.add(door);

    const window = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.55, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xf3e5a4,
        emissive: 0x8b6b18,
        emissiveIntensity: 0.25
      })
    );
    window.position.set(-0.95, 2.05, 1.23);
    house.add(window);

    house.position.set(10.0, 1.5, 3.0);
    scene.add(house);

    // A small flagpole and flag near the house.
    const flagPole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.07, 3.2, 8),
      materials.yellow
    );
    flagPole.position.set(12.0, 3.1, 3.0);
    flagPole.castShadow = true;
    scene.add(flagPole);

    const flag = new THREE.Mesh(
      new THREE.PlaneGeometry(1.0, 0.55),
      new THREE.MeshStandardMaterial({
        color: 0xe63b32,
        roughness: 0.8,
        side: THREE.DoubleSide
      })
    );
    flag.position.set(13.45, 4.25, 3.0);
    flag.rotation.y = Math.PI / 2;
    flag.castShadow = true;
    scene.add(flag);

    // Question blocks.
    function questionBlock(x, y, z) {
      const group = new THREE.Group();
      box(1.05, 1.15, 1.05, materials.brickDark, 0, 0, 0, [0, 0, 0]);
      box(1.22, 0.18, 1.22, materials.brick, 0, 0.67, 0);

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(0.48, 0.48),
        new THREE.MeshBasicMaterial({
          color: 0xe5b83f,
          side: THREE.DoubleSide
        })
      );
      face.position.set(0, 0.04, 0.531);
      face.rotation.y = Math.PI;
      group.add(face);
      group.position.set(x, y, z);
      scene.add(group);
      return group;
    }

    questionBlock(-5.6, 2.45, -7.1);
    questionBlock(5.6, 2.45, -7.1);
    questionBlock(-9.2, 4.45, -10.8);
    questionBlock(9.3, 4.85, -9.8);

    // Mushrooms.
    function mushroom(x, y, z, scale = 1) {
      const group = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.24, 0.65, 8),
        materials.white || materials.skin
      );
      stem.position.y = 0.32;
      stem.castShadow = true;
      group.add(stem);

      const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        materials.mushroomTop
      );
      cap.position.y = 0.67;
      cap.scale.y = 0.62;
      cap.castShadow = true;
      group.add(cap);

      const spot = new THREE.Mesh(
        new THREE.CircleGeometry(0.18, 12),
        new THREE.MeshBasicMaterial({ color: 0xf4d683 })
      );
      spot.rotation.x = -Math.PI / 2;
      spot.position.set(0.08, 0.78, 0.12);
      group.add(spot);

      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);
      return group;
    }

    mushroom(-3.8, 2.48, -5.7, 0.8);
    mushroom(3.7, 2.48, -5.7, 0.8);
    mushroom(-8.0, 4.46, -11.4, 0.65);
    mushroom(7.9, 4.86, -8.2, 0.65);
    mushroom(-11.3, 6.22, 5.8, 0.55);

    // Goombas: simple voxel enemies with eyes, ears, and tiny arms.
    const goombas = [];

    function goomba(x, y, z, rotation = 0, scale = 1) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.95, 0.58, 0.58),
        materials.mushroom
      );
      body.position.y = 0.4;
      body.castShadow = true;
      group.add(body);

      const top = new THREE.Mesh(
        new THREE.BoxGeometry(0.75, 0.16, 0.38),
        materials.mushroomTop
      );
      top.position.set(0, 0.72, 0);
      group.add(top);

      const eyeMat = materials.eye;
      const eyeL = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 6),
        eyeMat
      );
      eyeL.position.set(-0.2, 0.78, 0.305);
      group.add(eyeL);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.2;
      group.add(eyeR);

      const earL = new THREE.Mesh(
        new THREE.ConeGeometry(0.13, 0.28, 5),
        materials.mushroom
      );
      earL.rotation.z = -0.55;
      earL.position.set(-0.43, 0.83, 0);
      group.add(earL);
      const earR = earL.clone();
      earR.position.x = 0.43;
      group.add(earR);

      const armL = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.22, 0.2),
        materials.mushroom
      );
      armL.position.set(-0.62, 0.35, 0);
      armL.rotation.z = -0.55;
      group.add(armL);
      const armR = armL.clone();
      armR.position.x = 0.62;
      group.add(armR);

      group.position.set(x, y, z);
      group.rotation.y = rotation;
      group.scale.setScalar(scale);
      group.userData = { armL, armR };
      scene.add(group);
      goombas.push(group);
      return group;
    }

    goomba(-7.2, 2.48, -7.1, 0.4, 0.9);
    goomba(7.2, 2.48, -7.1, -0.5, 0.9);
    goomba(2.0, 7.72, -7.0, 0.8, 0.9);
    goomba(-9.2, 4.48, -10.8, -0.6, 0.85);
    goomba(9.3, 4.9, -9.8, 0.5, 0.85);

    // Tiny animated environmental details.
    const fireflies = [];
    const fireflyMat = new THREE.MeshBasicMaterial({
      color: 0xffe6a3,
      transparent: true,
      opacity: 0.85
    });

    function firefly(x, y, z, phase) {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 8, 6),
        fireflyMat
      );
      particle.position.set(x, y, z);
      scene.add(particle);
      fireflies.push({
        mesh: particle,
        phase,
        base: new THREE.Vector3(x, y, z),
        speed: 0.65 + phase * 0.12
      });
    }

    firefly(-4.5, 3.5, -10.5, 0.2);
    firefly(4.0, 3.8, -10.0, 1.4);
    firefly(-10.5, 5.0, 4.0, 2.1);
    firefly(10.0, 5.3, 4.5, 3.0);

    // Small butterflies.
    const butterflies = [];
    const butterflyMat = new THREE.MeshBasicMaterial({
      color: 0xf4c75d,
      side: THREE.DoubleSide
    });

    function butterfly(x, y, z, phase) {
      const wings = new THREE.Group();
      const left = new THREE.Mesh(
        new THREE.CircleGeometry(0.16, 10),
        butterflyMat
      );
      left.rotation.x = -Math.PI / 2;
      left.position.x = -0.12;
      wings.add(left);
      const right = left.clone();
      right.position.x = 0.12;
      wings.add(right);
      wings.position.set(x, y, z);
      wings.userData.phase = phase;
      scene.add(wings);
      butterflies.push(wings);
    }

    butterfly(-2.4, 5.0, -4.0, 0.4);
    butterfly(3.0, 5.3, -5.0, 1.8);
    butterfly(-9.0, 6.3, 0.0, 2.7);

    // Tiny flowers.
    const flowers = [];
    const flowerMat = new THREE.MeshStandardMaterial({
      color: 0xe95b91,
      roughness: 0.8
    });
    const flowerCenter = new THREE.MeshStandardMaterial({
      color: 0xf4c54b,
      roughness: 0.8
    });

    function flower(x, y, z, scale = 1) {
      const group = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.05, 0.22, 6),
        materials.green
      );
      stem.position.y = 0.11;
      group.add(stem);
      const petals = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.14, 0.08, 5),
        flowerMat
      );
      petals.position.y = 0.25;
      petals.scale.z = 0.45;
      group.add(petals);
      const center = new THREE.Mesh(
        new THREE.CylinderGeometry(0.065, 0.065, 0.09, 6),
        flowerCenter
      );
      center.position.y = 0.32;
      group.add(center);
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);
      flowers.push(group);
    }

    flower(-1.0, 2.48, -3.8, 0.8);
    flower(1.4, 2.48, -3.8, 0.65);
    flower(-6.0, 4.48, -8.0, 0.55);
    flower(6.2, 4.88, -7.0, 0.6);

    // A few small rocks.
    const rockMat = materials.stoneDark;
    for (let i = 0; i < 12; i++) {
      const rock = mesh(
        new THREE.DodecahedronGeometry(0.18 + (i % 3) * 0.05, 0),
        rockMat,
        [
          -13 + (i * 2.37) % 26,
          1.72,
          12 - (i * 1.73) % 24
        ],
        [0.2, i * 0.7, 0.1],
        false
      );
      rock.scale.y = 0.65;
    }

    // Camera controls implemented directly with pointer events.
    const target = new THREE.Vector3(0, 3.0, 0);
    const spherical = new THREE.Spherical(23, Math.PI / 2, Math.PI / 2);
    spherical.makeSafe();

    function updateCamera() {
      camera.position.setFromSpherical(spherical).add(target);
      camera.lookAt(target);
    }
    updateCamera();

    let dragging = false;
    let previousX = 0;
    let previousY = 0;
    let pointerId = null;

    renderer.domElement.addEventListener("pointerdown", event => {
      dragging = true;
      pointerId = event.pointerId;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(pointerId);
      renderer.domElement.style.cursor = "grabbing";
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (!dragging || event.pointerId !== pointerId) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;
      previousX = event.clientX;
      previousY = event.clientY;

      spherical.theta -= dx * 0.006;
      spherical.phi -= dy * 0.005;
      spherical.phi = THREE.MathUtils.clamp(
        spherical.phi,
        0.22,
        Math.PI - 0.22
      );
      updateCamera();
    });

    function endDrag(event) {
      if (event.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      renderer.domElement.style.cursor = "grab";
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.style.cursor = "grab";

    renderer.domElement.addEventListener("wheel", event => {
      event.preventDefault();
      spherical.radius = THREE.MathUtils.clamp(
        spherical.radius + event.deltaY * 0.012,
        12,
        38
      );
      updateCamera();
    }, { passive: false });

    // Animation.
    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {


      const elapsed = clock.getElapsedTime();

      for (const goomba of goombas) {
        goomba.userData.armL.rotation.z = Math.sin(elapsed * 1.5) * 0.3;
        goomba.userData.armR.rotation.z = -Math.sin(elapsed * 1.5) * 0.3;
        goomba.position.y += Math.sin(elapsed * 2.1 + goomba.position.x) * 0.0008;
      }

      for (const particle of fireflies) {
        particle.mesh.position.x =
          particle.base.x + Math.sin(elapsed * particle.speed + particle.phase) * 0.22;
        particle.mesh.position.y =
          particle.base.y + Math.cos(elapsed * particle.speed * 0.8 + particle.phase) * 0.18;
        particle.mesh.position.z =
          particle.base.z + Math.sin(elapsed * particle.speed * 0.7 + particle.phase) * 0.16;
        particle.mesh.scale.setScalar(0.8 + Math.sin(elapsed * 2 + particle.phase) * 0.25);
      }

      for (const butterfly of butterflies) {
        const phase = butterfly.userData.phase;
        butterfly.position.x += Math.sin(elapsed * 0.7 + phase) * 0.0008;
        butterfly.position.y += Math.cos(elapsed * 0.55 + phase) * 0.0007;
        butterfly.rotation.y = elapsed * 0.9 + phase;
        butterfly.scale.setScalar(0.85 + Math.sin(elapsed * 2 + phase) * 0.15);
      }

      flag.rotation.z = Math.sin(elapsed * 1.8) * 0.035;
      flag.position.y = 4.25 + Math.sin(elapsed * 2.4) * 0.035;

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
<script>/* touch-guard */(function(){var o={passive:false};document.addEventListener('touchmove',function(e){var t=e.target;if(t&&t.tagName==='CANVAS')e.preventDefault();},o);['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},o);});})();</script></body>
