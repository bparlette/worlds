<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitfall II: Vertical Caverns</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080b12;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f4dfb2;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    .title {
      position: absolute;
      top: 24px;
      left: 28px;
      max-width: min(460px, calc(100vw - 56px));
    }

    .eyebrow {
      margin-bottom: 7px;
      color: #d8ad68;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 4vw, 48px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 11px;
      color: rgba(244, 223, 178, 0.72);
      font-size: 12px;
      line-height: 1.55;
    }

    .hint {
      position: absolute;
      right: 24px;
      bottom: 22px;
      padding: 10px 13px;
      border: 1px solid rgba(244, 223, 178, 0.18);
      border-radius: 8px;
      background: rgba(12, 15, 20, 0.65);
      color: rgba(244, 223, 178, 0.72);
      font-size: 11px;
      letter-spacing: 0.05em;
      backdrop-filter: blur(8px);
    }

    .legend {
      position: absolute;
      left: 28px;
      bottom: 24px;
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .legend i {
      width: 7px;
      height: 7px;
      display: inline-block;
      border-radius: 50%;
      background: #f4c56e;
      box-shadow: 0 0 10px #f4c56e;
    }

    .legend .water {
      background: #59b9e8;
      box-shadow: 0 0 10px #59b9e8;
    }

    .legend .danger {
      background: #df534f;
      box-shadow: 0 0 10px #df534f;
    }

    @media (max-width: 620px) {
      .title { top: 18px; left: 18px; }
      .subtitle { max-width: 280px; }
      .legend { left: 18px; bottom: 18px; }
      .hint { right: 14px; bottom: 14px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="title">
      <div class="eyebrow">Pitfall II · Lost Caverns</div>
      <h1>Vertical<br>Rivers of Caverns</h1>
      <div class="subtitle">
        Explore the compact subterranean labyrinth. Follow the river,
        cross the chasm, and locate the <b>The Sunken Idol</b>.
      </div>
    </div>

    <div class="legend">
      <span><i></i> Treasure</span>
      <span><i class="water"></i> River</span>
      <span><i class="danger"></i> Pit</span>
    </div>

    <div class="hint">Drag to orbit · Scroll to zoom · WASD to move</div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b12);
    scene.fog = new THREE.FogExp2(0x0b111a, 0.035);

    const camera = new THREE.PerspectiveCamera(
      45,
      innerWidth / innerHeight,
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const world = new THREE.Group();
    scene.add(world);

    const clock = new THREE.Clock();

    const palette = {
      clay: 0x704632,
      clayDark: 0x3e2820,
      clayLight: 0x8a5b43,
      rock: 0x56463a,
      rockLight: 0x776253,
      floor: 0x513b2d,
      sand: 0xb28a5b,
      gold: 0xf4c56e,
      blue: 0x3e9bd1,
      blueDark: 0x184e72,
      green: 0x66784b,
      red: 0xb94438,
      yellow: 0xe6b94b
    };

    const materials = {
      clay: new THREE.MeshStandardMaterial({ color: palette.clay, roughness: 0.96 }),
      clayDark: new THREE.MeshStandardMaterial({ color: palette.clayDark, roughness: 1 }),
      clayLight: new THREE.MeshStandardMaterial({ color: palette.clayLight, roughness: 0.95 }),
      rock: new THREE.MeshStandardMaterial({ color: palette.rock, roughness: 1 }),
      rockLight: new THREE.MeshStandardMaterial({ color: palette.rockLight, roughness: 0.98 }),
      floor: new THREE.MeshStandardMaterial({ color: palette.floor, roughness: 0.94 }),
      sand: new THREE.MeshStandardMaterial({ color: palette.sand, roughness: 0.95 }),
      gold: new THREE.MeshStandardMaterial({
        color: palette.gold,
        metalness: 0.72,
        roughness: 0.28,
        emissive: 0x4b2600,
        emissiveIntensity: 0.35
      }),
      blue: new THREE.MeshStandardMaterial({
        color: palette.blue,
        metalness: 0.15,
        roughness: 0.3,
        emissive: 0x062b3d,
        emissiveIntensity: 0.45
      }),
      blueDark: new THREE.MeshStandardMaterial({
        color: palette.blueDark,
        metalness: 0.2,
        roughness: 0.38,
        emissive: 0x041421,
        emissiveIntensity: 0.35
      }),
      green: new THREE.MeshStandardMaterial({ color: palette.green, roughness: 0.95 }),
      red: new THREE.MeshStandardMaterial({ color: palette.red, roughness: 0.8 }),
      yellow: new THREE.MeshStandardMaterial({ color: palette.yellow, roughness: 0.75 }),
      black: new THREE.MeshStandardMaterial({ color: 0x090b10, roughness: 1 })
    };

    function box(w, h, d, material, x = 0, y = 0, z = 0, parent = world, castShadow = false) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(radius, height, material, x, y, z, parent = world, radialSegments = 12) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, radialSegments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function torus(radius, tube, material, x, y, z, parent = world, arc = Math.PI * 2) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, 8, 32, arc),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Compact rectangular world, roughly 25 x 21.
    const WORLD = {
      minX: -12.5,
      maxX: 12.5,
      minZ: -10,
      maxZ: 10,
      levels: 10
    };

    const levels = [];

    // Four continuous, unobstructed outer walls.
    box(25, 12, 0.65, materials.clayDark, 0, 6, WORLD.maxZ + 0.15);
    box(25, 12, 0.65, materials.clayDark, 0, 6, WORLD.minZ + 0.15);
    box(0.65, 12, 20, materials.clayDark, WORLD.maxX + 0.15, 6, 0);
    box(0.65, 12, 20, materials.clayDark, WORLD.minX + 0.15, 6, 0);

    // Main river, split into two broad bands with a central waterfall-like break.
    const riverSegments = [
      { x: -1.1, w: 7.1, z: 1.25, d: 4.4 },
      { x: 8.4, w: 5.7, z: 1.25, d: 4.4 }
    ];

    for (const s of riverSegments) {
      box(
        s.w,
        0.12,
        s.d,
        materials.blue,
        s.x,
        0.12,
        s.z,
        world
      );
      box(
        s.w - 0.25,
        0.035,
        s.d - 0.15,
        materials.blueDark,
        s.x,
        0.19,
        s.z,
        world
      );
    }

    // Lower river.
    box(24.4, 0.12, 3.4, materials.blue, 0, 0.11, -7.15);
    box(24.1, 0.035, 3.15, materials.blueDark, 0, 0.19, -7.15);

    // Subterranean floors at several depths.
    const floorYs = [0.12, 2.1, 4.15, 6.15, 8.15, 10.15];

    for (let level = 0; level < floorYs.length; level++) {
      const y = floorYs[level];
      const z = level % 2 === 0 ? 5.2 : -5.2;
      const w = level === 0 ? 23 : 18;

      box(w, 0.22, 2.5, materials.floor, 0, y, z);
      box(w - 0.4, 0.045, 2.25, materials.sand, 0, y + 0.13, z);

      // Irregular rock ledges along the river banks.
      for (let i = 0; i < 8; i++) {
        const x = -9 + i * 2.5;
        const rock = cylinder(
          0.38 + (i % 2) * 0.12,
          0.38,
          materials.rockLight,
          x,
          y + 0.2,
          z + 1.35,
          world,
          7
        );
        rock.rotation.y = (i * 0.7) % Math.PI;
      }
    }

    // Upper walkway and bridge.
    box(22.5, 0.35, 1.25, materials.clayLight, 0, 10.6, 6.4);
    box(7.2, 0.35, 1.55, materials.clayLight, 0, 10.6, 1.2);
    box(0.22, 0.45, 7.2, materials.clayLight, -3.6, 10.6, 3.8);
    box(0.22, 0.45, 7.2, materials.clayLight, 3.6, 10.6, 3.8);

    // Tall, close-set columns around the central chasm.
    for (let z = -8.5; z <= 8.5; z += 2.5) {
      box(0.45, 11.7, 0.45, materials.clayDark, -4.25, 5.85, z);
      box(0.45, 11.7, 0.45, materials.clayDark, 4.25, 5.85, z);
      box(0.65, 0.25, 0.65, materials.clayLight, -4.25, 11.7, z);
      box(0.65, 0.25, 0.65, materials.clayLight, 4.25, 11.7, z);
    }

    // Vertical waterfall in the center, a narrow glowing blue stream.
    box(0.65, 3.1, 0.7, materials.blue, 0, 6.45, 1.25);
    box(0.85, 0.12, 0.9, materials.blueDark, 0, 5.0, 1.25);
    box(0.75, 0.12, 0.8, materials.blue, 0, 4.9, 1.25);

    // Stair-like ledges and small platforms.
    for (let i = 0; i < 8; i++) {
      const y = 1.6 + i * 1.15;
      const z = 5.25;
      const w = 1.55 - i * 0.07;
      box(w, 0.28, 0.8, materials.clayLight, -2.1 + i * 0.18, y, z);
      box(w - 0.18, 0.04, 0.64, materials.sand, -2.1 + i * 0.18, y + 0.16, z);
    }

    // Pillars and carved supports.
    for (let z = -8.5; z <= 8.5; z += 2.5) {
      box(0.45, 11.7, 0.45, materials.clayDark, -4.25, 5.85, z);
      box(0.45, 11.7, 0.45, materials.clayDark, 4.25, 5.85, z);
      box(0.65, 0.25, 0.65, materials.clayLight, -4.25, 11.7, z);
      box(0.65, 0.25, 0.65, materials.clayLight, 4.25, 11.7, z);
    }

    // Plants and hanging vines.
    const vines = [];

    function makePlant(x, y, z, scale = 1, parent = world) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      parent.add(group);

      const stem = cylinder(0.035, 0.65, materials.green, 0, 0.32, 0, group, 6);
      stem.rotation.z = 0.1;

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6843, roughness: 1 });
      for (let i = 0; i < 5; i++) {
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.13, 6, 4), leafMat);
        leaf.scale.set(0.45, 1.25, 0.22);
        leaf.position.set(
          Math.sin(i * 1.7) * 0.1,
          0.22 + i * 0.12,
          Math.cos(i * 1.4) * 0.1
        );
        leaf.rotation.z = Math.sin(i * 2.1) * 0.8;
        group.add(leaf);
      }

      vines.push(group);
    }

    makePlant(-8.3, 2.1, 3.7, 1.2);
    makePlant(8.2, 2.1, 3.7, 1.1);
    makePlant(-8.4, 4.15, -4.2, 0.9);
    makePlant(8.4, 4.15, -4.2, 0.9);
    makePlant(-5.4, 6.15, 3.7, 0.75);
    makePlant(5.4, 6.15, 3.7, 0.75);

    // Cave stalactites and stalagmites.
    for (let i = 0; i < 18; i++) {
      const x = -11.4 + i * 1.34;
      const z = (i % 3 === 0) ? -8.6 : 6.8;
      const h = 0.8 + (i % 4) * 0.25;
      const stal = cylinder(0.09, h, materials.rockLight, x, 11.45 - h / 2, z, world, 6);
      stal.rotation.z = (i % 2 ? 1 : -1) * 0.08;
    }

    for (let i = 0; i < 10; i++) {
      const x = -8.5 + i * 2.3;
      const z = 3.8;
      const h = 0.55 + (i % 3) * 0.2;
      const stal = cylinder(0.1, h, materials.rock, x, 2.1 + h / 2, z, world, 7);
      stal.rotation.y = i * 0.35;
    }

    // Treasures: golden idol-like objects on small plinths.
    const treasures = [];

    function makeTreasure(x, y, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      world.add(group);

      box(0.48, 0.18, 0.48, materials.clayLight, 0, 0.09, 0, group);
      box(0.32, 0.16, 0.32, materials.sand, 0, 0.22, 0, group);

      const idol = new THREE.Group();
      group.add(idol);

      cylinder(0.16, 0.2, materials.gold, 0, 0.42, 0, idol, 10);
      cylinder(0.09, 0.3, materials.gold, 0, 0.67, 0, idol, 10);
      cylinder(0.19, 0.12, materials.gold, 0, 0.88, 0, idol, 12);

      const crown = torus(0.14, 0.035, materials.gold, 0, 0.96, 0, idol, Math.PI * 1.4);
      crown.rotation.x = Math.PI / 2;

      const halo = torus(0.3, 0.025, materials.gold, 0, 1.02, 0, idol, Math.PI * 1.8);
      halo.rotation.x = Math.PI / 2;

      const glow = new THREE.PointLight(0xffb84d, 1.4, 3.5, 2);
      glow.position.set(0, 0.9, 0);
      group.add(glow);

      const entry = { group, glow, phase: Math.random() * Math.PI * 2 };
      treasures.push(entry);
      return entry;
    }

    makeTreasure(-7.2, 2.1, 3.7, 0.95);
    makeTreasure(7.2, 2.1, 3.7, 0.95);
    makeTreasure(-3.4, 4.15, -4.2, 0.85);
    makeTreasure(3.4, 4.15, -4.2, 0.85);
    makeTreasure(-5.8, 6.15, 3.7, 0.72);
    makeTreasure(5.8, 6.15, 3.7, 0.72);
    makeTreasure(0.8, 8.15, -4.2, 0.65);

    // Hazard pits: dark recessed boxes with glowing red rims.
    function makePit(x, y, z, w = 1.1, d = 1.1) {
      box(w, 0.08, d, materials.black, x, y + 0.04, z);
      const rimMat = new THREE.MeshBasicMaterial({ color: 0x6b1715 });
      box(w + 0.12, 0.08, 0.1, rimMat, x, y + 0.08, z - d / 2 - 0.04);
      box(w + 0.12, 0.08, 0.1, rimMat, x, y + 0.08, z + d / 2 + 0.04);
      box(0.1, 0.08, d + 0.12, rimMat, x - w / 2 - 0.04, y + 0.08, z);
      box(0.1, 0.08, d + 0.12, rimMat, x + w / 2 + 0.04, y + 0.08, z);
    }

    makePit(-1.1, 2.1, -3.6, 1.3, 1.3);
    makePit(8.4, 2.1, -3.6, 1.3, 1.3);
    makePit(-7.5, 4.15, 3.7, 1.0, 1.0);
    makePit(7.5, 4.15, 3.7, 1.0, 1.0);
    makePit(-3.7, 6.15, -4.2, 0.9, 0.9);
    makePit(3.7, 6.15, -4.2, 0.9, 0.9);

    // A small waterfall and water particles.
    const waterParticles = [];
    const particleMat = new THREE.MeshBasicMaterial({
      color: 0x9fe7ff,
      transparent: true,
      opacity: 0.75
    });

    for (let i = 0; i < 20; i++) {
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(0.035 + Math.random() * 0.045, 5, 4),
        particleMat
      );
      particle.position.set(
        -0.15 + Math.random() * 0.3,
        4.5 + Math.random() * 2.8,
        1.25 + (Math.random() - 0.5) * 0.4
      );
      world.add(particle);
      waterParticles.push({
        mesh: particle,
        speed: 0.22 + Math.random() * 0.25,
        phase: Math.random() * Math.PI * 2
      });
    }

    // Warm underground lights.
    const lanterns = [];

    function makeLantern(x, y, z, color = 0xffb45b, intensity = 1.2) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      world.add(group);

      box(0.13, 0.25, 0.13, materials.gold, 0, 0.12, 0, group);
      const lamp = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 6),
        new THREE.MeshBasicMaterial({ color })
      );
      lamp.position.y = 0.3;
      group.add(lamp);
      const cap = new THREE.Mesh(
        new THREE.ConeGeometry(0.13, 0.16, 6),
        materials.gold
      );
      cap.position.y = 0.44;
      group.add(cap);

      const light = new THREE.PointLight(color, intensity, 3.2, 2);
      light.position.y = 0.3;
      group.add(light);

      lanterns.push({ group, light, color, phase: Math.random() * Math.PI * 2 });
    }

    makeLantern(-8.7, 2.1, 3.7, 0xffb14b, 1.6);
    makeLantern(8.7, 2.1, 3.7, 0xffb14b, 1.6);
    makeLantern(-8.5, 4.15, -4.1, 0xff7b45, 1.2);
    makeLantern(8.5, 4.15, -4.1, 0xff7b45, 1.2);
    makeLantern(-4.2, 6.15, 3.7, 0xffd08a, 1.4);
    makeLantern(4.2, 6.15, 3.7, 0xffd08a, 1.4);

    // Surface-like top and distant green bank.
    box(25, 0.3, 20, materials.clay, 0, 11.4, 0);
    box(25.0, 0.14, 20.0, materials.green, 0, 11.62, 0);
    box(25.0, 0.08, 20.0, materials.clayLight, 0, 11.73, 0);

    // Sparse surface vegetation.
    for (let i = 0; i < 32; i++) {
      const x = -11.8 + Math.random() * 23.6;
      const z = -9.6 + Math.random() * 19.2;
      const shrub = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.18 + Math.random() * 0.15, 0),
        materials.green
      );
      shrub.position.set(x, 11.8, z);
      shrub.scale.y = 0.55;
      world.add(shrub);
    }

    // Surface tree inside upper terrace.
    const tree = new THREE.Group();
    tree.position.set(-9.5, 8.15, -5.2);
    world.add(tree);

    const trunk = cylinder(0.16, 2.2, materials.clayDark, 0, 1.1, 0, tree, 7);
    trunk.rotation.z = 0.08;

    const foliage = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.15, 1),
      materials.green
    );
    foliage.position.y = 2.15;
    foliage.scale.set(1, 1.15, 0.9);
    foliage.castShadow = true;
    tree.add(foliage);

    const crown = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.85, 1),
      materials.green
    );
    crown.position.set(0.35, 2.65, 0.1);
    crown.castShadow = true;
    tree.add(crown);

    // Main cavern light.
    const cavernLight = new THREE.HemisphereLight(0x7893b8, 0x26170f, 1.15);
    scene.add(cavernLight);

    const sun = new THREE.DirectionalLight(0xffd39a, 2.3);
    sun.position.set(-7, 18, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -16;
    sun.shadow.camera.right = 16;
    sun.shadow.camera.top = 16;
    sun.shadow.camera.bottom = -16;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 45;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const blueFill = new THREE.DirectionalLight(0x67b9ff, 0.85);
    blueFill.position.set(10, 8, -12);
    scene.add(blueFill);

    // Custom orbit camera controls.
    const orbit = {
      theta: 0.65,
      phi: 1.18,
      radius: 24,
      target: new THREE.Vector3(0, 4.2, 0),
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(orbit.phi);
      camera.position.set(
        orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
        orbit.target.y + orbit.radius * Math.cos(orbit.phi),
        orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.target);
    }

    renderer.domElement.addEventListener("pointerdown", event => {
      orbit.dragging = true;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (!orbit.dragging) return;
      const dx = event.clientX - orbit.lastX;
      const dy = event.clientY - orbit.lastY;
      orbit.lastX = event.clientX;
      orbit.lastY = event.clientY;
      orbit.theta -= dx * 0.005;
      orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.004, 0.28, 1.48);
      updateCamera();
    });

    function endDrag() {
      orbit.dragging = false;
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);
    renderer.domElement.addEventListener("lostpointercapture", endDrag);

    renderer.domElement.addEventListener("wheel", event => {
      event.preventDefault();
      orbit.radius = THREE.MathUtils.clamp(
        orbit.radius + event.deltaY * 0.012,
        10,
        37
      );
      updateCamera();
    }, { passive: false });

    const keys = new Set();

    addEventListener("keydown", event => {
      keys.add(event.code.toLowerCase());
    });

    addEventListener("keyup", event => {
      keys.delete(event.code.toLowerCase());
    });

    function updateMovement(delta) {
      const speed = 4.2;
      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();

      camera.getWorldDirection(forward);
      right.crossVectors(forward, camera.up).normalize();

      const move = new THREE.Vector3();
      if (keys.has("arrowup") || keys.has("w")) move.add(forward);
      if (keys.has("arrowdown") || keys.has("s")) move.sub(forward);
      if (keys.has("arrowleft") || keys.has("a")) move.add(right);
      if (keys.has("arrowright") || keys.has("d")) move.sub(right);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(speed * delta);
        const x = THREE.MathUtils.clamp(world.minX + move.x, WORLD.minX + 0.35, WORLD.maxX - 0.35);
        const z = THREE.MathUtils.clamp(world.minZ + move.y, WORLD.minZ + 0.35, WORLD.maxZ - 0.35);
        camera.position.x = x;
        camera.position.z = z;
        camera.position.y = 13.15;
        updateCamera();
      }
    }

    // The single required relic: The Sunken Idol.
    const relic = makeTreasure(0.8, 8.15, -4.2, 0.68);

    // Ambient particles.
    const ambientDust = [];
    const dustMat = new THREE.MeshBasicMaterial({
      color: 0xd7b47b,
      transparent: true,
      opacity: 0.25
    });

    for (let i = 0; i < 80; i++) {
      const dust = new THREE.Mesh(
        new THREE.SphereGeometry(0.025 + Math.random() * 0.045, 4, 3),
        dustMat
      );
      dust.position.set(
        -11 + Math.random() * 22,
        1 + Math.random() * 11,
        -9 + Math.random() * 18
      );
      world.add(dust);
      ambientDust.push({
        mesh: dust,
        speed: 0.04 + Math.random() * 0.08,
        phase: Math.random() * Math.PI * 2
      });
    }

    // A subtle central beacon.
    const beacon = new THREE.PointLight(0xffa84d, 2.4, 9, 2);
    beacon.position.set(0, 8.15, -4.2);
    world.add(beacon);

    const relicGlow = new THREE.PointLight(0xffb54d, 3.2, 5.5, 2);
    relic.group.add(relicGlow);

    updateCamera();

    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {

      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      updateMovement(delta);

      // Gentle water shimmer.
      for (const p of waterParticles) {
        p.mesh.position.y += p.speed * delta;
        p.mesh.position.x += Math.sin(elapsed * 1.2 + p.phase) * delta * 0.08;
        p.mesh.scale.setScalar(0.75 + Math.sin(elapsed * 2 + p.phase) * 0.25);
        if (p.mesh.position.y > 7.6) p.mesh.position.y = 4.4;
      }

      // Lantern flicker.
      for (const l of lanterns) {
        l.light.intensity = l.color === 0xffd08a ? 1.2 : 1.35;
        l.light.intensity += Math.sin(elapsed * 2.1 + l.phase) * 0.08 * delta;
      }

      // Idol breathing and halo pulse.
      relic.group.position.y = 8.15 + Math.sin(elapsed * 1.35) * 0.025;
      relic.glow.intensity = 2.8 + Math.sin(elapsed * 2.2) * 0.35;

      // Slow drifting dust.
      for (const d of ambientDust) {
        d.mesh.position.y += d.speed * delta;
        d.mesh.rotation.y += delta * 0.08;
        if (d.mesh.position.y > 12) d.mesh.position.y = 0.5;
      }

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
