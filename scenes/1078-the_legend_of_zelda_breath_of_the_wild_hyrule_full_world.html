<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel World Map</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070a;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #eef4ff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
    }

    .title {
      position: absolute;
      top: 28px;
      left: 32px;
      font-size: clamp(20px, 3vw, 38px);
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      position: absolute;
      top: 74px;
      left: 32px;
      color: rgba(224, 235, 255, 0.62);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .legend {
      position: absolute;
      right: 28px;
      bottom: 26px;
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(8, 13, 21, 0.58);
      backdrop-filter: blur(12px);
      color: rgba(230, 240, 255, 0.72);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      box-shadow: 0 0 10px currentColor;
    }

    .swatch.water { color: #72c8ff; background: #72c8ff; }
    .swatch.hills { color: #8fb86a; background: #8fb86a; }
    .swatch.snow { color: #e4f2ff; background: #e4f2ff; }
    .swatch.danger { color: #ff745f; background: #ff745f; }

    .hint {
      position: absolute;
      left: 32px;
      bottom: 30px;
      color: rgba(220, 232, 255, 0.42);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .title { top: 20px; left: 20px; }
      .subtitle { top: 57px; left: 20px; }
      .legend { right: 16px; bottom: 16px; gap: 10px; padding: 10px 12px; }
      .hint { left: 20px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="title">Aetheria</div>
    <div class="subtitle">Procedural Voxel World</div>
    <div class="hint">Drag to orbit · Scroll to zoom</div>
    <div class="legend">
      <div class="legend-item"><span class="swatch water"></span>Water</div>
      <div class="legend-item"><span class="swatch hills"></span>Mountains</div>
      <div class="legend-item"><span class="swatch snow"></span>Snow</div>
      <div class="legend-item"><span class="swatch danger"></span>Volcano</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.018);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      200
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Deterministic pseudo-random generator.
    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(81723);

    // Camera controls implemented directly.
    let target = new THREE.Vector3(0, 0, 0);
    let azimuth = -0.62;
    let polar = 0.91;
    let radius = 31;

    function updateCamera() {
      const sinPolar = Math.sin(polar);
      camera.position.set(
        target.x + radius * sinPolar * Math.sin(azimuth),
        target.y + radius * Math.cos(polar),
        target.z + radius * sinPolar * Math.cos(azimuth)
      );
      camera.lookAt(target);
    }

    updateCamera();

    const orbit = new THREE.Vector3();
    const waterPoint = new THREE.Vector3();

    renderer.domElement.addEventListener("pointerdown", (event) => {
      orbit.set(event.clientX, event.clientY);
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      const dx = event.clientX - orbit.x;
      const dy = event.clientY - orbit.y;
      orbit.x = event.clientX;
      orbit.y = event.clientY;

      azimuth -= dx * 0.006;
      polar = THREE.MathUtils.clamp(polar - dy * 0.005, 0.22, 1.35);
      updateCamera();
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    });

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      radius = THREE.MathUtils.clamp(radius + event.deltaY * 0.018, 15, 55);
      updateCamera();
    }, { passive: false });

    // Lighting.
    scene.add(new THREE.HemisphereLight(0x91b9e5, 0x3a3124, 1.55));

    const sun = new THREE.DirectionalLight(0xffe5bc, 3.1);
    sun.position.set(-15, 25, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28;
    sun.shadow.camera.bottom = -28;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x68a9ff, 1.25);
    rim.position.set(18, 10, -20);
    scene.add(rim);

    const warmFill = new THREE.PointLight(0xffa85c, 22, 45, 2);
    warmFill.position.set(-8, 6, 12);
    scene.add(warmFill);

    // Shared materials.
    const materials = {
      dark: new THREE.MeshStandardMaterial({
        color: 0x18212b,
        roughness: 0.95
      }),
      rock: new THREE.MeshStandardMaterial({
        color: 0x8a8170,
        roughness: 0.96
      }),
      rockLight: new THREE.MeshStandardMaterial({
        color: 0xb6aa8d,
        roughness: 0.95
      }),
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x4b4942,
        roughness: 1
      }),
      soil: new THREE.MeshStandardMaterial({
        color: 0x65503a,
        roughness: 1
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x78955a,
        roughness: 1
      }),
      grassLight: new THREE.MeshStandardMaterial({
        color: 0x91aa67,
        roughness: 1
      }),
      grassDark: new THREE.MeshStandardMaterial({
        color: 0x4f6c43,
        roughness: 1
      }),
      water: new THREE.MeshStandardMaterial({
        color: 0x397da6,
        roughness: 0.28,
        metalness: 0.18,
        transparent: true,
        opacity: 0.88
      }),
      waterDeep: new THREE.MeshStandardMaterial({
        color: 0x173f62,
        roughness: 0.3,
        metalness: 0.2
      }),
      snow: new THREE.MeshStandardMaterial({
        color: 0xe4f1f7,
        roughness: 0.8
      }),
      snowShade: new THREE.MeshStandardMaterial({
        color: 0xaebfcb,
        roughness: 0.9
      }),
      path: new THREE.MeshStandardMaterial({
        color: 0xc2aa78,
        roughness: 1
      }),
      ruin: new THREE.MeshStandardMaterial({
        color: 0x9a8770,
        roughness: 1
      }),
      ruinDark: new THREE.MeshStandardMaterial({
        color: 0x5e5143,
        roughness: 1
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xf1b85b,
        roughness: 0.55,
        metalness: 0.35
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xff654f,
        emissive: 0x6d1005,
        emissiveIntensity: 0.8,
        roughness: 0.72
      }),
      orange: new THREE.MeshStandardMaterial({
        color: 0xff9a43,
        emissive: 0x5b2000,
        emissiveIntensity: 0.65,
        roughness: 0.8
      })
    };

    const world = new THREE.Group();
    scene.add(world);

    // Instanced voxel terrain.
    const cell = 1.25;
    const terrainMinX = -19;
    const terrainMaxX = 19;
    const terrainMinZ = -17;
    const terrainMaxZ = 17;

    const terrainData = new Map();
    const terrainStats = {
      height: [],
      water: 0,
      land: 0,
      snow: 0,
      mountain: 0,
      ruin: 0
    };

    function hash2D(x, z) {
      const value = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
      return value - Math.floor(value);
    }

    function classifyTerrain(x, z) {
      const h = terrainData.get(`${x},${z}`)?.height ?? 0;
      const edgeDistance = Math.max(
        Math.abs(x) - 18,
        Math.abs(z) - 16,
        0
      );

      // Coast and inland water.
      if (h < 0.12) {
        const waterNoise = hash2D(x * 2, z * 2);
        return {
          type: "water",
          shade: waterNoise > 0.5 ? 1 : 0,
          edge: edgeDistance < 2.2
        };
      }

      // High, rugged mountains.
      if (h > 4.2) {
        return {
          type: "mountain",
          shade: hash2D(x, z) > 0.5 ? 1 : 0
        };
      }

      // Snow caps on high peaks.
      if (h > 3.1 && hash2D(x * 1.7, z * 1.7) > 0.38) {
        return {
          type: "snow",
          shade: hash2D(x * 0.7, z * 0.7) > 0.5 ? 1 : 0
        };
      }

      // Ruins in the central valley.
      if (h > 0.3 && h < 1.4 && Math.abs(x) < 4 && Math.abs(z) < 5) {
        return {
          type: "ruin",
          shade: hash2D(x + 9, z - 4) > 0.5 ? 1 : 0
        };
      }

      // Plains and rolling hills.
      const hill = hash2D(x, z) > 0.52;
      return {
        type: hill ? "grass" : "soil",
        shade: hill ? 1 : 0
      };
    }

    // Generate terrain height with procedural noise.
    function terrainHeight(x, z) {
      const broad =
        Math.sin(x * 0.23 + z * 0.12) * 0.8 +
        Math.cos(z * 0.31 - x * 0.07) * 0.55;

      const detail =
        Math.sin(x * 1.25 + z * 0.43) * 0.28 +
        Math.cos(z * 1.55 - x * 0.37) * 0.2;

      const edgeFall = Math.max(0, 18 - Math.abs(x)) * 0.16;
      const edgeFallZ = Math.max(0, 16 - Math.abs(z)) * 0.14;

      let height = broad + detail + edgeFall + edgeFallZ;

      // A broad central basin.
      height -= Math.exp((x * x) / 55 + (z * z) / 48) * 0.55;

      // Scattered mountain peaks.
      const peakCenters = [
        [-8, -7, 4.8],
        [7, -8, 5.2],
        [12, 6, 4.1],
        [-13, 8, 3.6],
        [4, 10, 3.2]
      ];

      for (const [cx, cz, amp] of peakCenters) {
        const dx = x - cx;
        const dz = z - cz;
        const distance = Math.sqrt(dx * dx + dz * dz);
        const peak = Math.max(0, 1 - distance / 4);
        height += amp * peak * peak;
      }

      // Volcano cone.
      const volcanoX = 8;
      const volcanoZ = -7;
      const volcanoDistance = Math.sqrt(
        Math.pow(x - volcanoX, 2) + Math.pow(z - volcanoZ, 2)
      );
      const volcanoProfile = Math.max(0, 1 - volcanoDistance / 3.2);
      height += volcanoProfile * volcanoProfile * 4.4;
      height += volcanoProfile * 0.75;

      return THREE.MathUtils.clamp(height, -0.22, 6.5);
    }

    // Build terrain as individual visible cubes.
    const terrainCells = [];

    for (let x = Math.floor(terrainMinX / cell); x <= Math.ceil(terrainMaxX / cell); x++) {
      for (let z = Math.floor(terrainMinZ / cell); z <= Math.ceil(terrainMaxZ / cell); z++) {
        const px = x * cell;
        const pz = z * cell;
        const h = terrainHeight(px, pz);
        const classification = classifyTerrain(px, pz);

        terrainData.set(`${x},${z}`, { height: h, ...classification });
        terrainCells.push({ x, z, h, classification });
      }
    }

    const terrainGeometry = new THREE.BoxGeometry(cell * 0.94, 1, cell * 0.94);
    const terrain = new THREE.InstancedMesh(
      terrainGeometry,
      materials.rock,
      terrainCells.length
    );

    terrain.castShadow = true;
    terrain.receiveShadow = true;

    const dummy = new THREE.Object3D();

    terrainCells.forEach((cell, index) => {
      const { x, z, h, classification } = cell;
      const baseY = h * 0.5;

      dummy.position.set(
        x * cell,
        baseY,
        z * cell
      );
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();

      terrain.setMatrixAt(index, dummy.matrix);

      let material;

      if (classification.type === "water") {
        material = materials.water;
      } else if (classification.type === "mountain") {
        material = h > 4.8 ? materials.rock : materials.rockDark;
      } else if (classification.type === "snow") {
        material = materials.snow;
      } else if (classification.type === "ruin") {
        material = materials.ruin;
      } else {
        material = classification.shade > 0.5
          ? materials.grass
          : materials.soil;
      }

      terrain.setMaterialIndex(index, material);
    });

    terrain.instanceMatrix.needsUpdate = true;
    terrain.instanceColor.needsUpdate = true;
    world.add(terrain);

    // Water tiles: slightly smaller, translucent square tiles.
    const waterCells = [];

    for (const cell of terrainCells) {
      if (cell.classification.type === "water") {
        waterCells.push(cell);
      }
    }

    const waterGeometry = new THREE.BoxGeometry(cell * 0.83, 0.08, cell * 0.83);
    const water = new THREE.InstancedMesh(
      waterGeometry,
      materials.water,
      waterCells.length
    );

    water.receiveShadow = true;

    waterCells.forEach((cell, index) => {
      const { x, z } = cell;
      dummy.position.set(x * cell, 0.02, z * cell);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      water.setMatrixAt(index, dummy.matrix);
      water.setColorAt(
        index,
        new THREE.Color().setHSL(
          0.53 + cell.x * 0.003,
          0.48,
          0.37 + cell.z * 0.025
        )
      );
    });

    water.instanceMatrix.needsUpdate = true;
    water.instanceColor.needsUpdate = true;
    world.add(water);

    // Voxel trees.
    const treeCells = [];

    for (const cell of terrainCells) {
      const { x, z, h } = cell;
      const hill = cell.classification.type === "grass";
      const nearRuin =
        h > 0.2 &&
        h < 1.4 &&
        Math.abs(x) < 4 &&
        Math.abs(z) < 5;

      if (!hill && !nearRuin) continue;

      const treeChance = hash2D(x * 3.1, z * 3.7);
      if (treeChance < 0.16) {
        treeCells.push({
          ...cell,
          type: treeChance < 0.09 ? "pine" : "deciduous",
          scale: 0.75 + hash2D(x, z) * 0.55
        });
      }
    }

    const treeGeometry = new THREE.BoxGeometry(0.75, 1.25, 0.75);
    const treeTrunkGeometry = new THREE.BoxGeometry(0.32, 1.05, 0.32);
    const tree = new THREE.InstancedMesh(treeGeometry, materials.grassDark, treeCells.length);
    const trunks = new THREE.InstancedMesh(treeTrunkGeometry, materials.rockDark, treeCells.length);

    tree.castShadow = true;
    tree.receiveShadow = true;
    trunks.castShadow = true;

    treeCells.forEach((cell, index) => {
      const { x, z, scale } = cell;
      const y = terrainHeight(x * cell, z * cell);

      dummy.position.set(x * cell, y + 0.52 * scale, z * cell);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(scale, scale, scale);
      dummy.updateMatrix();
      trunks.setMatrixAt(index, dummy.matrix);

      if (cell.type === "pine") {
        dummy.position.set(x * cell, y + 1.25 * scale, z * cell);
        dummy.scale.set(scale * 0.9, scale * 1.25, scale * 0.9);
        dummy.updateMatrix();
        tree.setMatrixAt(index, dummy.matrix);
      } else {
        dummy.position.set(x * cell, y + 1.1 * scale, z * cell);
        dummy.scale.set(scale, scale, scale);
        dummy.updateMatrix();
        tree.setMatrixAt(index, dummy.matrix);
      }
    });

    tree.instanceMatrix.needsUpdate = true;
    trunks.instanceMatrix.needsUpdate = true;
    world.add(tree, trunks);

    // Small voxel buildings in the central ruins.
    const buildingCells = [
      { x: 1, z: 0, w: 2, d: 2, h: 1.3 },
      { x: 2, z: 1, w: 1, d: 1, h: 0.8 },
      { x: 0, z: 1, w: 1, d: 1, h: 1.0 },
      { x: 1, z: 2, w: 1, d: 1, h: 0.65 }
    ];

    const buildings = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, 1, 1),
      materials.ruin,
      buildingCells.length
    );

    buildings.castShadow = true;
    buildings.receiveShadow = true;

    buildingCells.forEach((cell, index) => {
      dummy.position.set(
        cell.x * cell,
        terrainHeight(cell.x * cell, cell.z * cell) + cell.h * 0.5,
        cell.z * cell
      );
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(cell.w * cell, cell.h, cell.d * cell);
      dummy.updateMatrix();
      buildings.setMatrixAt(index, dummy.matrix);
    });

    buildings.instanceMatrix.needsUpdate = true;
    world.add(buildings);

    // Volcano glow and ash.
    const volcanoCenter = new THREE.Vector3(8 * cell, 0, -7 * cell);
    const volcanoGlow = new THREE.PointLight(0xff4e24, 18, 13, 2);
    volcanoGlow.position.copy(volcanoCenter);
    scene.add(volcanoGlow);

    const ashCells = [];

    for (const cell of terrainCells) {
      const { x, z } = cell;
      const distance = Math.sqrt(
        Math.pow(x - 8, 2) + Math.pow(z + 7, 2)
      );

      if (distance > 3.7) continue;

      const ash = hash2D(x * 4.3, z * 4.7);
      if (ash > 0.72) {
        ashCells.push(cell);
      }
    }

    const ash = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.75, 0.35, 0.75),
      materials.rockDark,
      ashCells.length
    );

    ash.castShadow = true;

    ashCells.forEach((cell, index) => {
      dummy.position.set(
        cell.x * cell,
        terrainHeight(cell.x * cell, cell.z * cell) + 0.18,
        cell.z * cell
      );
      dummy.rotation.set(0, hash2D(cell.x, cell.z) * Math.PI, 0);
      dummy.scale.set(0.8, 0.55, 0.8);
      dummy.updateMatrix();
      ash.setMatrixAt(index, dummy.matrix);
    });

    ash.instanceMatrix.needsUpdate = true;
    world.add(ash);

    // Small glowing crystals around the volcano.
    const crystalCells = [];

    for (const cell of terrainCells) {
      const { x, z } = cell;
      const distance = Math.sqrt(
        Math.pow(x - 8, 2) + Math.pow(z + 7, 2)
      );

      if (distance > 4.1) continue;
      if (hash2D(x * 5, z * 5) > 0.84) {
        crystalCells.push(cell);
      }
    }

    const crystals = new THREE.InstancedMesh(
      new THREE.OctahedronGeometry(0.28, 0),
      materials.orange,
      crystalCells.length
    );

    crystals.castShadow = true;

    crystalCells.forEach((cell, index) => {
      dummy.position.set(
        cell.x * cell,
        terrainHeight(cell.x * cell, cell.z * cell) + 0.45,
        cell.z * cell
      );
      dummy.rotation.set(
        hash2D(cell.x, cell.z) * 1.2,
        hash2D(cell.x + 1, cell.z + 1) * 1.2,
        hash2D(cell.x - 1, cell.z - 1) * 1.2
      );
      dummy.scale.set(
        0.8,
        1.8,
        0.8
      );
      dummy.updateMatrix();
      crystals.setMatrixAt(index, dummy.matrix);
      crystals.setColorAt(
        index,
        new THREE.Color().setHSL(
          0.065 + hash2D(cell.x, cell.z) * 0.04,
          0.95,
          0.55 + hash2D(cell.x, cell.z) * 0.2
        )
      );
    });

    crystals.instanceMatrix.needsUpdate = true;
    crystals.instanceColor.needsUpdate = true;
    world.add(crystals);

    // Small path markers.
    const markerCells = [];

    for (const cell of terrainCells) {
      const { x, z } = cell;
      if (
        (x === 2 && z === 1) ||
        (x === 1 && z === 2) ||
        (x === 0 && z === 1)
      ) {
        markerCells.push(cell);
      }
    }

    const markers = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.22, 0.3, 0.55, 6),
      materials.gold,
      markerCells.length
    );

    markerCells.forEach((cell, index) => {
      dummy.position.set(
        cell.x * cell,
        terrainHeight(cell.x * cell, cell.z * cell) + 0.28,
        cell.z * cell
      );
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      markers.setMatrixAt(index, dummy.matrix);
    });

    markers.instanceMatrix.needsUpdate = true;
    world.add(markers);

    // Distant island.
    const island = new THREE.Group();
    const islandCells = [];

    for (let x = -3; x <= 3; x++) {
      for (let z = -3; z <= 3; z++) {
        const distance = Math.sqrt(x * x + z * z);
        if (distance < 2.6) {
          islandCells.push({ x, z, height: 0.6 + hash2D(x, z) * 0.45 });
        }
      }
    }

    const islandMesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.9, 0.9, 0.9),
      materials.grass,
      islandCells.length
    );

    islandCells.forEach((cell, index) => {
      dummy.position.set(
        cell.x * 1.6,
        cell.height * 0.5,
        cell.z * 1.6
      );
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      islandMesh.setMatrixAt(index, dummy.matrix);
    });

    islandMesh.instanceMatrix.needsUpdate = true;
    islandMesh.castShadow = true;
    islandMesh.receiveShadow = true;
    island.position.set(-14, -1, 9);
    scene.add(island);

    // A few foreground rocks.
    const foregroundRocks = [
      { x: -10.5, z: 8.5, size: 1.8 },
      { x: 11.5, z: 10.5, size: 1.3 },
      { x: 14, z: 3, size: 0.9 },
      { x: -15, z: -10, size: 1.1 }
    ];

    const foregroundRocksMesh = new THREE.InstancedMesh(
      new THREE.DodecahedronGeometry(1, 0),
      materials.rockDark,
      foregroundRocks.length
    );

    foregroundRocks.forEach((rock, index) => {
      dummy.position.set(
        rock.x,
        terrainHeight(rock.x, rock.z) + rock.size * 0.35,
        rock.z
      );
      dummy.rotation.set(
        random() * 0.4,
        random() * Math.PI,
        random() * 0.3
      );
      dummy.scale.set(
        rock.size,
        rock.size * 0.65,
        rock.size * 0.8
      );
      dummy.updateMatrix();
      foregroundRocksMesh.setMatrixAt(index, dummy.matrix);
    });

    foregroundRocksMesh.instanceMatrix.needsUpdate = true;
    foregroundRocksMesh.castShadow = true;
    foregroundRocksMesh.receiveShadow = true;
    world.add(foregroundRocksMesh);

    // Add a subtle world border / frame.
    const frame = new THREE.Group();

    const left = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.12, 36),
      materials.ruin
    );
    left.position.set(-19.1, 0, 0);
    frame.add(left);

    const right = left.clone();
    right.position.x = 19.1;
    frame.add(right);

    const top = new THREE.Mesh(
      new THREE.BoxGeometry(38, 0.12, 0.12),
      materials.ruin
    );
    top.position.set(0, 0, -17.1);
    frame.add(top);

    const bottom = top.clone();
    bottom.position.z = 17.1;
    frame.add(bottom);

    frame.position.y = 0.15;
    scene.add(frame);

    // Add a subtle vignette overlay.
    const vignette = document.createElement("div");
    vignette.style.position = "fixed";
    vignette.style.inset = "0";
    vignette.style.background = "radial-gradient(circle at 50% 44%, transparent 48%, rgba(0,0,0,0.42) 100%)";
    vignette.pointerEvents = "none";
    document.body.appendChild(vignette);

    // Resize handling.
    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }

    addEventListener("resize", resize);

    // Gentle atmospheric motion.
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      water.instanceMatrix.needsUpdate = false;

      // Animate the volcano light subtly.
      volcanoGlow.intensity = 16 + Math.sin(elapsed * 2.3) * 3;

      // Slowly rotate the distant island.
      island.rotation.y = elapsed * 0.035;

      // Very subtle camera breathing.
      const breathing = Math.sin(elapsed * 0.45) * 0.015;
      radius += (radius - (31 + breathing)) * 0.0005;
      updateCamera();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
