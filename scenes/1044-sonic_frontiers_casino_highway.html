<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Casino</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050714;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 2;
      color: #fff;
      pointer-events: none;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
    }

    .hud h1 {
      margin: 0 0 5px;
      font-size: clamp(20px, 3vw, 38px);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hud p {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      z-index: 2;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(10, 12, 35, 0.64);
      backdrop-filter: blur(10px);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .hud {
        top: 12px;
        left: 12px;
      }

      .controls {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud">
      <h1>Voxel Casino</h1>
      <p>Drag to look · Scroll to move</p>
    </div>
    <div class="controls">
      Arrow keys to move · WASD to move · R to reset
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const app = document.querySelector("#app");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07091f);
    scene.fog = new THREE.FogExp2(0x07091f, 0.018);

    const camera = new THREE.PerspectiveCamera(
      68,
      window.innerWidth / window.innerHeight,
      0.1,
      120
    );

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      gold: new THREE.MeshStandardMaterial({
        color: 0xffcf57,
        roughness: 0.58,
        metalness: 0.22
      }),
      brightGold: new THREE.MeshStandardMaterial({
        color: 0xfff1a0,
        roughness: 0.45,
        metalness: 0.15
      }),
      darkGold: new THREE.MeshStandardMaterial({
        color: 0x8f5d13,
        roughness: 0.7,
        metalness: 0.25
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xff2b3f,
        roughness: 0.55,
        metalness: 0.08
      }),
      redDark: new THREE.MeshStandardMaterial({
        color: 0x8f1026,
        roughness: 0.72
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x17b65a,
        roughness: 0.5,
        metalness: 0.08
      }),
      greenDark: new THREE.MeshStandardMaterial({
        color: 0x08733b,
        roughness: 0.65
      }),
      white: new THREE.MeshStandardMaterial({
        color: 0xfff9db,
        roughness: 0.65
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x10121f,
        roughness: 0.7
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x239cff,
        roughness: 0.42,
        metalness: 0.18
      }),
      blueDark: new THREE.MeshStandardMaterial({
        color: 0x125d9c,
        roughness: 0.55
      }),
      palm: new THREE.MeshStandardMaterial({
        color: 0x35e26a,
        roughness: 0.58,
        metalness: 0.08
      }),
      palmDark: new THREE.MeshStandardMaterial({
        color: 0x159b45,
        roughness: 0.65
      }),
      trunk: new THREE.MeshStandardMaterial({
        color: 0xd4a04f,
        roughness: 0.85
      }),
      carpet: new THREE.MeshStandardMaterial({
        color: 0x701738,
        roughness: 0.88
      }),
      floor: new THREE.MeshStandardMaterial({
        color: 0x18192b,
        roughness: 0.78,
        metalness: 0.18
      })
    };

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x86b8ff, 0x1a0818, 1.45));

    const keyLight = new THREE.DirectionalLight(0xfff0cf, 3.2);
    keyLight.position.set(5, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 12;
    keyLight.shadow.camera.bottom = -12;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 35;
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x398cff, 2.2);
    rimLight.position.set(-7, 5, -6);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xff7a32, 28, 22, 2);
    warmLight.position.set(0, 6, 2);
    scene.add(warmLight);

    // -------------------------------------------------------------------------
    // Voxel helper functions
    // -------------------------------------------------------------------------

    function box(w, h, d, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function voxelTree(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);
      scene.add(group);

      // Trunk is a stepped voxel column.
      for (let i = 0; i < 5; i++) {
        box(
          0.42,
          0.48,
          0.42,
          materials.trunk,
          0,
          0.25 + i * 0.5,
          0,
          group
        );
      }

      // Crown made from many small leaf blocks.
      const leafShape = [
        [-1.05, 0.25, 0.05],
        [-0.72, 0.58, 0.05],
        [-0.35, 0.42, 0.12],
        [0.35, 0.42, 0.12],
        [0.72, 0.58, 0.05],
        [1.05, 0.25, 0.05],
        [-0.48, 0.72, -0.12],
        [0.48, 0.72, -0.12],
        [0, 0.95, -0.16]
      ];

      for (const [lx, ly, lz] of leafShape) {
        const leaf = box(
          0.62,
          0.28,
          0.38,
          i % 3 === 0 ? materials.palmDark : materials.palm,
          lx,
          ly,
          lz,
          group
        );
        leaf.rotation.z = (Math.random() - 0.5) * 0.15;
      }

      // Crown top.
      box(0.7, 0.3, 0.5, materials.palm, 0, 1.02, 0, group);
      box(0.48, 0.25, 0.4, materials.palmDark, 0, 1.28, 0, group);
    }

    function voxelArrow(x, z, rotation = 0, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      group.scale.setScalar(scale);
      scene.add(group);

      const shaft = box(
        0.28,
        0.22,
        2.4,
        materials.darkGold,
        0,
        0.11,
        0,
        group
      );

      const head = box(
        1.35,
        0.22,
        0.45,
        materials.gold,
        0,
        0.11,
        1.25,
        group
      );

      head.rotation.x = -Math.PI / 2;

      const cap = box(
        0.35,
        0.22,
        0.55,
        materials.brightGold,
        0,
        0.11,
        2.45,
        group
      );

      cap.rotation.x = -Math.PI / 2;
    }

    function voxelSign(text, x, y, z, width = 4, height = 1.25) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      scene.add(group);

      // Backboard.
      box(width + 0.35, height + 0.35, 0.25, materials.darkGold, 0, 0, 0, group);

      // Frame.
      const frame = new THREE.LineSegments(
        new THREE.EdgesGeometry(
          new THREE.BoxGeometry(width, height, 0.28)
        ),
        new THREE.LineBasicMaterial({
          color: 0xffe6a0,
          transparent: true,
          opacity: 0.8
        })
      );
      frame.position.z = 0.16;
      group.add(frame);

      // Canvas-like voxel letters.
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff0a8";
      ctx.strokeStyle = "#ff9b35";
      ctx.lineWidth = 10;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);
      ctx.fillStyle = "#111026";
      ctx.font = "900 142px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 8);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true
        })
      );
      face.position.z = 0.17;
      group.add(face);

      return group;
    }

    // -------------------------------------------------------------------------
    // Architecture: striped tunnel
    // -------------------------------------------------------------------------

    const floor = box(
      42,
      0.25,
      28,
      materials.floor,
      0,
      -0.15,
      0
    );

    const carpet = box(
      25,
      0.05,
      7.2,
      materials.carpet,
      0,
      0.015,
      0
    );

    // Side checkerboard walkways.
    for (const side of [-1, 1]) {
      const checker = new THREE.Group();
      checker.position.set(side * 4.55, 0.02, 0);
      scene.add(checker);

      for (let x = -9; x <= 9; x += 1.5) {
        for (let z = -10; z <= 10; z += 1.5) {
          const material =
            (x / 1.5 + z / 1.5) % 2 === 0
              ? materials.black
              : materials.white;

          box(
            1.38,
            0.05,
            1.38,
            material,
            x,
            0,
            z,
            checker
          );
        }
      }

      // Low side rail.
      box(0.18, 0.18, 22, materials.gold, side * 7.8, 0.12, 0);
    }

    // Curved tunnel made from vertical voxel ribs.
    const ribs = [];

    for (let side = 0; side < 10; side++) {
      const angle = (side / 10) * Math.PI * 2;
      const radius = 8.8;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const rib = box(
        0.38,
        11.5,
        0.38,
        side % 2 === 0 ? materials.red : materials.redDark,
        x,
        5.75,
        z
      );

      rib.rotation.y = -angle;
      ribs.push(rib);
    }

    // Upper alternating luminous panels.
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const radius = 8.7;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const panel = box(
        2.5,
        0.34,
        0.34,
        i % 2 === 0 ? materials.blue : materials.blueDark,
        x,
        10.35,
        z
      );

      panel.rotation.y = -angle;
    }

    // Hanging light fixtures.
    for (const x of [-4.5, 0, 4.5]) {
      box(0.12, 1.4, 0.12, materials.gold, x, 9.4, 0);
      box(2.3, 0.18, 0.55, materials.gold, x, 8.65, 0);

      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xfff0a8 })
      );
      bulb.position.set(x, 8.48, 0);
      scene.add(bulb);
    }

    // -------------------------------------------------------------------------
    // Main entrance sign
    // -------------------------------------------------------------------------

    const sign = voxelSign("CASINO", 0, 6.8, 0, 6.2, 1.7);
    sign.rotation.y = -0.05;

    // -------------------------------------------------------------------------
    // Casino tables
    // -------------------------------------------------------------------------

    function createRouletteTable(z, rotation = 0) {
      const group = new THREE.Group();
      group.position.set(0, 0, z);
      group.rotation.y = rotation;
      scene.add(group);

      // Table surface.
      box(7.8, 0.22, 5.1, materials.green, 0, 0.3, 0, group);

      // Inner border.
      box(7.05, 0.06, 4.45, materials.greenDark, 0, 0.44, 0, group);

      // Outer gold border.
      box(8.05, 0.12, 5.65, materials.gold, 0, 0.2, 0, group);

      // Number grid, built from individual square voxels.
      const numberLayout = [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9]
      ];

      let cursor = 0;

      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const x = (col - 1) * 0.82;
          const z = 1.55 - row * 0.82;

          const cell = box(
            0.65,
            0.08,
            0.65,
            cursor % 2 === 0 ? materials.red : materials.black,
            x,
            0.5,
            z,
            group
          );

          cell.rotation.y = cursor % 4 === 0 ? Math.PI / 2 : 0;

          const number = numberLayout[row][col];

          const numberMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(0.45, 0.45),
            new THREE.MeshBasicMaterial({
              color: cursor % 2 === 0 ? 0xffd86a : 0x11111f
            })
          );

          numberMesh.rotation.x = -Math.PI / 2;
          numberMesh.position.set(x, 0.55, z);
          group.add(numberMesh);

          cursor++;
        }
      }

      // Bottom betting area.
      box(8.15, 0.18, 1.65, materials.green, 0, 0.25, -2.2, group);

      for (const side of [-1, 1]) {
        box(
          0.16,
          0.16,
          1.55,
          materials.gold,
          side * 3.95,
          0.3,
          -2.2,
          group
        );
      }

      // Even / odd blocks.
      for (let i = 0; i < 5; i++) {
        box(
          0.65,
          0.08,
          0.38,
          i % 2 === 0 ? materials.red : materials.black,
          -2.65 + i * 0.7,
          0.5,
          -2.2,
          group
        );
      }

      // Small chip stack.
      for (let i = 0; i < 5; i++) {
        const chip = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.16, 0.08, 16),
          i % 2 === 0 ? materials.red : materials.gold
        );
        chip.position.set(2.2, 0.58 + i * 0.085, -1.85);
        chip.castShadow = true;
        group.add(chip);
      }

      // Decorative front plaque.
      box(2.3, 0.32, 0.18, materials.gold, 0, 0.4, -2.67, group);
      box(1.5, 0.12, 0.03, materials.red, 0, 0.4, -2.76, group);

      return group;
    }

    createRouletteTable(0, 0.03);

    // Second table further down the aisle.
    createRouletteTable(-8.5, -0.04);

    // -------------------------------------------------------------------------
    // Side decorations and directional arrows
    // -------------------------------------------------------------------------

    voxelTree(-4.6, 2.6, 0.8);
    voxelTree(4.6, 2.6, 0.8);
    voxelTree(-4.6, -4.4, 0.7);
    voxelTree(4.6, -4.4, 0.7);

    voxelArrow(-4.5, 3.6, Math.PI, 0.72);
    voxelArrow(4.5, 3.6, -Math.PI, 0.72);
    voxelArrow(-4.5, -3.8, Math.PI, 0.65);
    voxelArrow(4.5, -3.8, -Math.PI, 0.65);

    // Hanging banners.
    for (const x of [-6.1, 6.1]) {
      box(0.12, 2.2, 0.12, materials.gold, x, 7.4, 0);
      box(1.25, 0.22, 0.28, materials.blue, x, 6.25, 0);
    }

    // -------------------------------------------------------------------------
    // Foreground chips and decorative blocks
    // -------------------------------------------------------------------------

    const chipMaterial = new THREE.MeshStandardMaterial({
      color: 0xe73964,
      roughness: 0.42,
      metalness: 0.18
    });

    const chip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.12, 24),
      chipMaterial
    );
    chip.position.set(-3.2, 0.16, 5.2);
    chip.rotation.y = 0.4;
    chip.castShadow = true;
    scene.add(chip);

    const chip2 = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.25, 0.1, 20),
      materials.gold
    );
    chip2.position.set(-2.9, 0.27, 5.25);
    chip2.rotation.y = -0.2;
    chip2.castShadow = true;
    scene.add(chip2);

    // Voxel lamp posts.
    for (const x of [-7.2, 7.2]) {
      box(0.22, 4.2, 0.22, materials.gold, x, 2.1, 5.8);
      box(0.8, 0.18, 0.8, materials.gold, x, 4.2, 5.8);

      const lamp = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffd88a })
      );
      lamp.position.set(x, 4.05, 5.8);
      scene.add(lamp);
    }

    // -------------------------------------------------------------------------
    // Camera controls, implemented directly without addons
    // -------------------------------------------------------------------------

    const controls = {
      yaw: 0,
      pitch: 0,
      target: new THREE.Vector3(0, 1.6, -1.2),
      distance: 12.8,
      moving: false,
      moveSpeed: 0,
      keys: new Set()
    };

    const defaultView = {
      yaw: 0,
      pitch: 0,
      target: new THREE.Vector3(0, 1.6, -1.2),
      distance: 12.8
    };

    function updateCamera() {
      const horizontal = Math.cos(controls.pitch) * controls.distance;

      camera.position.set(
        controls.target.x + Math.sin(controls.yaw) * horizontal,
        controls.target.y + Math.sin(controls.pitch) * controls.distance,
        controls.target.z - Math.cos(controls.yaw) * horizontal
      );

      camera.lookAt(controls.target);
    }

    function resetCamera() {
      controls.yaw = defaultView.yaw;
      controls.pitch = defaultView.pitch;
      controls.target.copy(defaultView.target);
      controls.distance = defaultView.distance;
      updateCamera();
    }

    window.addEventListener("keydown", (event) => {
      controls.keys.add(event.key.toLowerCase());

      if (event.key.toLowerCase() === "r") {
        resetCamera();
      }
    });

    window.addEventListener("keyup", (event) => {
      controls.keys.delete(event.key.toLowerCase());
    });

    window.addEventListener("blur", () => {
      controls.keys.clear();
    });

    // Pointer camera look.
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      dragging = false;
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragging = false;
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      controls.yaw -= dx * 0.003;
      controls.pitch = THREE.MathUtils.clamp(
        controls.pitch + dy * 0.0025,
        -0.75,
        0.75
      );

      updateCamera();
    });

    // Scroll camera movement.
    let scrollDirection = 0;
    let lastScrollY = 0;

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();

        const delta = event.deltaY - lastScrollY;
        lastScrollY = event.deltaY;

        if (Math.abs(delta) > 2) {
          scrollDirection = Math.sign(delta);
          controls.moving = true;
          controls.moveSpeed = 0.55;
        }
      },
      { passive: false }
    );

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      // Keyboard movement.
      const forward = new THREE.Vector3(0, 0, -1);
      const right = new THREE.Vector3(1, 0, 0);

      forward.applyAxisAngle(
        new THREE.Vector3(0, 1, 0),
        controls.yaw
      );

      right.applyAxisAngle(
        new THREE.Vector3(0, 1, 0),
        controls.yaw
      );

      const movement = new THREE.Vector3();

      if (controls.keys.has("arrowup") || controls.keys.has("w")) {
        movement.add(forward);
      }

      if (controls.keys.has("arrowdown") || controls.keys.has("s")) {
        movement.sub(forward);
      }

      if (controls.keys.has("arrowleft") || controls.keys.has("a")) {
        movement.add(right);
      }

      if (controls.keys.has("arrowright") || controls.keys.has("d")) {
        movement.sub(right);
      }

      if (controls.moving) {
        movement.normalize().multiplyScalar(controls.moveSpeed * dt);
        controls.target.add(movement);

        const limit = -11;
        if (controls.target.z < limit) {
          controls.target.z = limit;
        }
      }

      // Gentle sign pulse.
      sign.rotation.z = Math.sin(elapsed * 1.35) * 0.012;

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetCamera();
    animate();
  </script>
</body>
</html>
