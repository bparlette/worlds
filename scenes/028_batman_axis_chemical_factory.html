<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axis Chemical Factory — Batman NES</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #05070d;
      --cream: #f1eadb;
      --red: #ff352f;
      --green: #8be7c3;
      --amber: #ffc857;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #scene:active {
      cursor: grabbing;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .title-block {
      position: absolute;
      top: 28px;
      left: 30px;
      max-width: 440px;
      padding: 15px 18px 13px;
      border-left: 4px solid var(--red);
      background: linear-gradient(90deg, rgba(8, 12, 24, 0.93), rgba(8, 12, 24, 0.5));
      box-shadow: 8px 0 25px rgba(0, 0, 0, 0.45);
    }

    .title-block h1 {
      margin: 0;
      color: var(--cream);
      font-size: clamp(22px, 3vw, 38px);
      line-height: 0.95;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px #000;
    }

    .title-block p {
      margin: 10px 0 0;
      color: #aeb9c8;
      font-size: 12px;
      line-height: 1.5;
    }

    .status {
      position: absolute;
      top: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(5, 8, 16, 0.72);
      color: var(--green);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: blink 1.8s infinite;
    }

    .controls {
      position: absolute;
      left: 30px;
      bottom: 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls span {
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: rgba(5, 8, 16, 0.68);
      color: #b9c3d0;
      font-size: 10px;
      letter-spacing: 0.08em;
      backdrop-filter: blur(7px);
    }

    .controls b {
      color: var(--amber);
      font-weight: 700;
    }

    .retro-corner {
      position: absolute;
      right: 28px;
      bottom: 24px;
      width: 80px;
      height: 80px;
      border: 4px solid var(--red);
      border-right-color: transparent;
      border-bottom-color: transparent;
      transform: rotate(45deg);
      opacity: 0.8;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 42%, rgba(0, 0, 0, 0.3) 100%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.15), transparent 25%, transparent 75%, rgba(0, 0, 0, 0.35));
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #05070d;
      color: var(--cream);
      font-size: 12px;
      letter-spacing: 0.18em;
      transition: opacity 0.7s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @media (max-width: 650px) {
      .title-block {
        top: 16px;
        left: 16px;
        right: 16px;
        max-width: none;
        padding: 12px 14px;
      }

      .title-block p {
        font-size: 10px;
      }

      .status {
        top: 112px;
        right: 16px;
      }

      .controls {
        left: 16px;
        bottom: 16px;
      }

      .retro-corner {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="loading">INITIALIZING AXIS CHEMICAL... <span style="color:#ff352f">●</span></div>

  <div class="hud">
    <div class="title-block">
      <h1>Axis Chemical<br />Factory</h1>
      <p>THE DARKNESS BEGINS HERE…<br />BATMAN'S ORIGINAL NES MISSION</p>
    </div>

    <div class="status">
      <span class="status-dot"></span>
      <span>AXIS SECURE · NIGHT SHIFT</span>
    </div>

    <div class="controls">
      <span><b>DRAG</b> ORBIT</span>
      <span><b>SCROLL</b> ZOOM</span>
      <span><b>CLICK</b> OBJECTS</span>
    </div>

    <div class="retro-corner"></div>
  </div>

  <div class="vignette"></div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ---------------------------------------------------------------------
    // Renderer and scene
    // ---------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement: document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07101c);
    scene.fog = new THREE.FogExp2(0x07101c, 0.025);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      180
    );

    clock = new THREE.Clock();

    // ---------------------------------------------------------------------
    // Materials
    // ---------------------------------------------------------------------

    const mat = {
      concrete: new THREE.MeshStandardMaterial({
        color: 0x343b42,
        roughness: 0.94,
        metalness: 0.04
      }),
      darkConcrete: new THREE.MeshStandardMaterial({
        color: 0x171d23,
        roughness: 0.98,
        metalness: 0.02
      }),
      wall: new THREE.MeshStandardMaterial({
        color: 0x667078,
        roughness: 0.88,
        metalness: 0.05
      }),
      wallDark: new THREE.MeshStandardMaterial({
        color: 0x343d45,
        roughness: 0.92,
        metalness: 0.08
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xa91512,
        roughness: 0.62,
        metalness: 0.28
      }),
      redDark: new THREE.MeshStandardMaterial({
        color: 0x49100f,
        roughness: 0.75,
        metalness: 0.2
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x287c5d,
        roughness: 0.62,
        metalness: 0.25
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xd7a62d,
        roughness: 0.55,
        metalness: 0.25
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x080a0d,
        roughness: 0.9,
        metalness: 0.05
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x4a5661,
        roughness: 0.48,
        metalness: 0.75
      }),
      rust: new THREE.MeshStandardMaterial({
        color: 0x7e2e20,
        roughness: 0.95,
        metalness: 0.15
      }),
      window: new THREE.MeshStandardMaterial({
        color: 0x152a38,
        roughness: 0.25,
        metalness: 0.55,
        emissive: 0x071522,
        emissiveIntensity: 0.8
      }),
      lamp: new THREE.MeshStandardMaterial({
        color: 0xffe4a0,
        emissive: 0xffbd55,
        emissiveIntensity: 2.3,
        roughness: 0.35
      }),
      greenLamp: new THREE.MeshStandardMaterial({
        color: 0x8cffb4,
        emissive: 0x4dff86,
        emissiveIntensity: 2.6,
        roughness: 0.3
      }),
      redLamp: new THREE.MeshStandardMaterial({
        color: 0xff655d,
        emissive: 0xff1814,
        emissiveIntensity: 2.5,
        roughness: 0.3
      }),
      pipe: new THREE.MeshStandardMaterial({
        color: 0x73818a,
        roughness: 0.4,
        metalness: 0.8
      })
    };

    // ---------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------

    function box(w, h, d, material, x = 0, y = 0, z = 0, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(radius, height, material, x = 0, y = 0, z = 0, segments = 12) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function pipeBetween(a, b, radius = 0.09, material = mat.pipe) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, direction.length(), 10),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addTextSprite(text, color = "#f1eadb", background = null) {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      if (background) {
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      ctx.fillStyle = color;
      ctx.font = "bold 62px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 512, 66);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false
      }));
      scene.add(sprite);
      return sprite;
    }

    // ---------------------------------------------------------------------
    // Lighting
    // ---------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0x7891aa, 0x10131a, 0.72));

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(4.5, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0x9cb5d1 })
    );
    moon.position.set(-38, 27, -42);
    scene.add(moon);

    const moonLight = new THREE.DirectionalLight(0x8fb7ff, 1.45);
    moonLight.position.set(-25, 38, -18);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -55;
    moonLight.shadow.camera.right = 55;
    moonLight.shadow.camera.top = 55;
    moonLight.shadow.camera.bottom = -55;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 120;
    moonLight.shadow.bias = -0.0004;
    scene.add(moonLight);

    const factoryLight = new THREE.PointLight(0xff7b2c, 38, 75, 2);
    factoryLight.position.set(18, 22, 0);
    scene.add(factoryLight);

    const sideLight = new THREE.PointLight(0x36d7c8, 22, 55, 2);
    sideLight.position.set(-28, 15, 12);
    scene.add(sideLight);

    // ---------------------------------------------------------------------
    // Factory grounds and building
    // ---------------------------------------------------------------------

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(140, 140),
      mat.darkConcrete
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.03;
    ground.receiveShadow = true;
    scene.add(ground);

    const yard = new THREE.Mesh(
      new THREE.PlaneGeometry(72, 52),
      new THREE.MeshStandardMaterial({
        color: 0x252c31,
        roughness: 1
      })
    );
    yard.rotation.x = -Math.PI / 2;
    yard.position.set(0, 0.005, 3);
    yard.receiveShadow = true;
    scene.add(yard);

    const factory = new THREE.Group();
    scene.add(factory);

    // Main building shell
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(42, 18, 24),
      mat.wallDark
    );
    building.position.set(0, 9, -3);
    building.castShadow = true;
    building.receiveShadow = true;
    factory.add(building);

    // Side walls and roof
    const leftWall = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 18, 24),
      mat.wallDark
    );
    leftWall.position.set(-21, 9, -3);
    leftWall.castShadow = true;
    leftWall.receiveShadow = true;
    factory.add(leftWall);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(43, 1.2, 25),
      mat.darkConcrete
    );
    roof.position.set(0, 18.2, -3);
    roof.castShadow = true;
    roof.receiveShadow = true;
    factory.add(roof);

    // Roof ribs
    for (let i = 0; i < 8; i++) {
      const rib = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, 0.3, 24),
        mat.steel
      );
      rib.position.set(-18 + i * 5.25, 18.9, -3);
      rib.castShadow = true;
      factory.add(rib);
    }

    // Front facade
    const facade = new THREE.Group();
    facade.position.set(0, 0, 9);
    factory.add(facade);

    box(42, 18, 0.5, mat.wall, 0, 9, 0, false, true);

    // Structural columns
    for (let i = 0; i < 8; i++) {
      const x = -18 + i * 5.25;
      box(0.65, 17.5, 0.8, mat.steel, x, 8.75, 0.6);
    }

    // Red upper trim
    box(42.5, 0.65, 0.8, mat.red, 0, 15.7, 0.8);
    box(42.5, 0.16, 0.9, mat.redDark, 0, 16.2, 0.8);

    // Entrance canopy
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(10, 0.35, 5),
      mat.red
    );
    canopy.position.set(0, 12.2, 2.2);
    canopy.castShadow = true;
    facade.add(canopy);

    for (const x of [-4.2, 4.2]) {
      cylinder(0.12, 12.1, mat.steel, x, 6.05, 2.4, 10);
    }

    // Main sign
    const sign = new THREE.Mesh(
      new THREE.BoxGeometry(10.5, 2.1, 0.35),
      mat.black
    );
    sign.position.set(0, 13.2, 1.05);
    sign.castShadow = true;
    facade.add(sign);

    const signSprite = addTextSprite("AXIS CHEMICAL", "#f1eadb", "#b41513");
    signSprite.scale.set(11.7, 2.5, 1);
    signSprite.position.set(0, 13.2, 1.25);
    facade.add(signSprite);

    // Side windows
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 7; col++) {
        const x = -16.5 + col * 5.5;
        const y = 5.2 + row * 4.6;
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(2.6, 2.1, 0.2),
          mat.window
        );
        windowMesh.position.set(x, y, 0.55);
        facade.add(windowMesh);

        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(2.95, 2.45, 0.28),
          mat.steel
        );
        frame.position.set(x, y, 0.42);
        facade.add(frame);
      }
    }

    // Side windows on left wall
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 4; col++) {
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 2.1, 2.6),
          mat.window
        );
        windowMesh.position.set(-21.35, 5.2 + row * 4.6, -10.5 + col * 5.25);
        factory.add(windowMesh);
      }
    }

    // ---------------------------------------------------------------------
    // Pipes, tanks, barrels, crates
    // ---------------------------------------------------------------------

    pipeBetween([-22, 2.5, -18], [-8, 2.5, -18], 0.16, mat.pipe);
    pipeBetween([-22, 2.5, -18], [-22, 12, -18], 0.16, mat.pipe);
    pipeBetween([-22, 12, -18], [15, 12, -18], 0.16, mat.pipe);
    pipeBetween([15, 12, -18], [15, 2.5, -18], 0.16, mat.pipe);

    pipeBetween([-7, 2.5, -18], [7, 2.5, -18], 0.11, mat.redDark);
    pipeBetween([-7, 2.5, -18], [-7, 10, -18], 0.11, mat.redDark);
    pipeBetween([-7, 10, -18], [16, 10, -18], 0.11, mat.redDark);
    pipeBetween([-7, 10, -18], [-7, 2.5, -18], 0.11, mat.redDark);

    for (const y of [2.5, 10]) {
      pipeBetween([-22, y, -18], [20, y, -18], 0.09, mat.steel);
    }

    // Storage tanks
    const tanks = [];
    for (let i = 0; i < 3; i++) {
      const x = 25 + i * 6.5;
      const z = -15;
      const tank = cylinder(2.15, 7, mat.wall, x, 3.5, z, 24);
      tanks.push(tank);

      const top = new THREE.Mesh(
        new THREE.ConeGeometry(2.2, 1.2, 24),
        mat.steel
      );
      top.position.set(x, 7.6, z);
      top.castShadow = true;
      scene.add(top);

      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(2.23, 2.23, 0.18, 24),
        mat.redDark
      );
      band.position.set(x, 2.2, z);
      scene.add(band);

      const ladder = new THREE.Group();
      ladder.position.set(x + 2.25, 3.5, z);
      for (let i = 0; i < 6; i++) {
        const rung = new THREE.Mesh(
          new THREE.BoxGeometry(0.5, 0.055, 0.055),
          mat.steel
        );
        rung.position.set(0, 0.45 + i * 0.75, 0);
        ladder.add(rung);
      }
      for (const dx of [-0.12, 0.12]) {
        const rail = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.035, 6.5, 6),
          mat.steel
        );
        rail.rotation.z = Math.PI / 2;
        rail.position.set(dx, 3.25, 0);
        ladder.add(rail);
      }
      scene.add(ladder);
    }

    // Barrel ring
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const x = 19.5 + Math.cos(angle) * 3.2;
      const z = -5.5 + Math.sin(angle) * 3.2;
      const barrel = cylinder(0.55, 1.5, i % 2 ? mat.rust : mat.green, x, 0.75, z, 12);
      barrel.rotation.z = angle + 0.08;

      for (const y of [0.3, 1.2]) {
        const band = new THREE.Mesh(
          new THREE.CylinderGeometry(0.57, 0.57, 0.09, 12),
          mat.steel
        );
        band.position.set(x, y, z);
        scene.add(band);
      }
    }

    // Crates
    for (let i = 0; i < 9; i++) {
      const x = 24 + (i % 3) * 3;
      const z = 1.5 + Math.floor(i / 3) * 3.2;
      const crate = new THREE.Group();
      crate.position.set(x, 0, z);
      crate.rotation.y = (Math.random() - 0.5) * 0.35;

      const side = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 1.2, 1.2),
        i % 2 ? mat.redDark : mat.wallDark
      );
      side.castShadow = true;
      side.receiveShadow = true;
      crate.add(side);

      for (const y of [0.18, 0.82]) {
        const band = new THREE.Mesh(
          new THREE.BoxGeometry(1.48, 0.09, 1.28),
          mat.steel
        );
        band.position.y = y;
        crate.add(band);
      }

      scene.add(crate);
    }

    // ---------------------------------------------------------------------
    // Entrance gate and warning signs
    // ---------------------------------------------------------------------

    const gate = new THREE.Group();
    gate.position.set(0, 0, 24);
    scene.add(gate);

    for (const x of [-7.2, 7.2]) {
      const post = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 8, 0.55),
        mat.redDark
      );
      post.position.set(x, 4, 0);
      post.castShadow = true;
      gate.add(post);

      const cap = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.25, 1.2),
        mat.red
      );
      cap.position.set(x, 8.1, 0);
      cap.castShadow = true;
      gate.add(cap);
    }

    const gateBar = new THREE.Mesh(
      new THREE.BoxGeometry(15, 0.45, 0.45),
      mat.red
    );
    gateBar.position.set(0, 4.8, 0);
    gateBar.castShadow = true;
    gate.add(gateBar);

    const gateSign = new THREE.Mesh(
      new THREE.BoxGeometry(3.3, 1.25, 0.22),
      mat.black
    );
    gateSign.position.set(0, 7.1, 0.3);
    gate.add(gateSign);

    const gateSprite = addTextSprite("AUTHORIZED PERSONNEL ONLY", "#f1eadb", "#3b100e");
    gateSprite.scale.set(4.6, 1.65, 1);
    gateSprite.position.set(0, 7.1, 0.45);
    gate.add(gateSprite);

    // Warning beacon
    const beaconBase = cylinder(0.5, 0.35, mat.steel, 11.7, 0.18, 24, 12);
    const beacon = new THREE.Mesh(
      new THREE.ConeGeometry(0.48, 1.3, 12),
      mat.redLamp
    );
    beacon.position.set(11.7, 1.2, 24);
    beacon.castShadow = true;
    scene.add(beacon);

    const beaconLight = new THREE.PointLight(0xff2418, 4, 13, 2);
    beaconLight.position.set(11.7, 1.2, 24);
    scene.add(beaconLight);

    // ---------------------------------------------------------------------
    // Trees
    // ---------------------------------------------------------------------

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x35271d,
      roughness: 1
    });

    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x183a2b, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x244c35, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x31573b, roughness: 1 })
    ];

    function addTree(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.scale.setScalar(scale);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.4, 4.2, 8),
        trunkMaterial
      );
      trunk.position.y = 2.1;
      trunk.castShadow = true;
      group.add(trunk);

      const leafGeometry = new THREE.ConeGeometry(2.4, 5.5, 8);
      for (let i = 0; i < 3; i++) {
        const leaf = new THREE.Mesh(
          leafGeometry,
          leafMaterials[i % leafMaterials.length]
        );
        leaf.position.y = 4.2 + i * 1.15;
        leaf.rotation.y = i * 0.6;
        leaf.castShadow = true;
        leaf.receiveShadow = true;
        group.add(leaf);
      }

      scene.add(group);
    }

    addTree(-29, 18, 1.2);
    addTree(-32, 33, 1.45);
    addTree(31, 20, 1.25);
    addTree(36, 35, 1.5);
    addTree(-38, -10, 1.35);
    addTree(39, -15, 1.4);
    addTree(-12, 39, 1.05);
    addTree(14, 41, 1.15);

    // ---------------------------------------------------------------------
    // Animated elements
    // ---------------------------------------------------------------------

    const animated = [];

    const clouds = [];
    const cloudMaterial = new THREE.MeshBasicMaterial({
      color: 0x52657a,
      transparent: true,
      opacity: 0.28,
      depthWrite: false
    });

    for (let i = 0; i < 9; i++) {
      const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(2.5 + Math.random() * 2, 12, 8),
        cloudMaterial
      );
      cloud.scale.y = 0.42;
      cloud.position.set(
        -55 + Math.random() * 110,
        24 + Math.random() * 10,
        -45 - Math.random() * 40
      );
      scene.add(cloud);
      clouds.push(cloud);
    }

    const fallingDrops = [];
    for (let i = 0; i < 65; i++) {
      const drop = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 5, 4),
        new THREE.MeshBasicMaterial({
          color: 0x6fb7d2,
          transparent: true,
          opacity: 0.65
        })
      );
      drop.position.set(
        -38 + Math.random() * 76,
        1 + Math.random() * 17,
        -20 + Math.random() * 48
      );
      scene.add(drop);
      fallingDrops.push(drop);
    }

    const fireflies = [];
    for (let i = 0; i < 22; i++) {
      const firefly = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 6, 4),
        new THREE.MeshBasicMaterial({
          color: 0xffd35c,
          transparent: true,
          opacity: 0.8
        })
      );
      const x = -34 + Math.random() * 68;
      const z = 12 + Math.random() * 35;
      firefly.position.set(x, 1 + Math.random() * 13, z);
      scene.add(firefly);
      fireflies.push({
        mesh: firefly,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.7,
        baseY: 1 + Math.random() * 13,
        baseX: x,
        baseZ: z
      });
    }

    // ---------------------------------------------------------------------
    // Camera controls
    // ---------------------------------------------------------------------

    const orbit = {
      target: new THREE.Vector3(0, 7, 1),
      radius: 48,
      theta: 0.72,
      phi: 1.18,
      minRadius: 18,
      maxRadius: 82,
      minPhi: 0.35,
      maxPhi: 1.48
    };

    function updateCamera() {
      const sinPhi = Math.sin(orbit.phi);
      camera.position.set(
        orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
        orbit.target.y + orbit.radius * Math.cos(orbit.phi),
        orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.target);
    }

    updateCamera();

    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;
      previousX = event.clientX;
      previousY = event.clientY;

      orbit.theta -= dx * 0.006;
      orbit.phi = THREE.MathUtils.clamp(orbit.phi - dy * 0.005, orbit.minPhi, orbit.maxPhi);
      updateCamera();
    });

    function endDrag(event) {
      dragging = false;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      orbit.radius = THREE.MathUtils.clamp(
        orbit.radius + event.deltaY * 0.035,
        orbit.minRadius,
        orbit.maxRadius
      );
      updateCamera();
    }, { passive: false });

    // Click picking
    const pickables = [];

    function registerPickable(mesh, label, type) {
      mesh.userData.pickLabel = label;
      mesh.userData.pickType = type;
      pickables.push(mesh);
      return mesh;
    }

    const mainSign = registerPickable(gateSign, "AXIS CONTROL", "danger");
    const beacon = registerPickable(beacon, "WARNING BEACON", "danger");
    const entranceCanopy = registerPickable(canopy, "RESTRICTED ENTRANCE", "danger");

    renderer.domElement.addEventListener("click", (event) => {
      if (dragging) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(pickables, false);
      if (!hits.length) return;

      const hit = hits[0];
      const label = hit.object.userData.pickLabel;
      const type = hit.object.userData.pickType;

      if (type === "danger") {
        alert(`DANGER DETECTED: ${label.toUpperCase()}\nAXIS SECURITY PROTOCOL INITIATED.`);
      } else {
        alert(`INSPECTION REQUIRED: ${label.toUpperCase()}`);
      }
    });

    // ---------------------------------------------------------------------
    // Animation
    // ---------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
    /* [SHIELD] */
    requestAnimationFrame(animate);
    try {



      const elapsed = clock.getElapsedTime();

      // Rain
      for (const drop of fallingDrops) {
        drop.position.y -= 0.055;
        drop.position.x += Math.sin(elapsed * 2 + drop.position.z) * 0.0008;

        if (drop.position.y < -4) {
          drop.position.y = 18 + Math.random() * 3;
          drop.position.x = -38 + Math.random() * 76;
          drop.position.z = -20 + Math.random() * 48;
        }
      }

      // Firefly movement
      for (const item of fireflies) {
        item.mesh.position.y =
          item.baseY + Math.sin(elapsed * item.speed + item.phase) * 0.55;
        item.mesh.position.x =
          item.baseX + Math.cos(elapsed * item.speed * 0.7 + item.phase) * 0.65;
        item.mesh.position.z =
          item.baseZ + Math.sin(elapsed * item.speed * 0.55 + item.phase) * 0.55;
        item.mesh.material.opacity = 0.45 + (Math.sin(elapsed * 2 + item.phase) + 1) * 0.22;
      }

      // Warning beacon pulse
      beaconLight.intensity = 2.8 + Math.sin(elapsed * 5.2) * 1.8;
      beacon.material.emissiveIntensity = 2.2 + Math.sin(elapsed * 5.2) * 1.1;

      // Cloud drift
      for (let i = 0; i < clouds.length; i++) {
        const cloud = clouds[i];
        cloud.position.x += 0.0007 + i * 0.00005;
        if (cloud.position.x > 65) cloud.position.x = -65;
      }

      
    } catch (e) {
      console.warn('Animation tick suppressed:', e.message);
    }
    renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // Remove loading screen after first frame.
    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById("loading").classList.add("hidden");
      }, 250);
    });
  </script>
</body>
</html>
