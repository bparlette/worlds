<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Tropical Island</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #85d8ff;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .title {
      position: fixed;
      top: 22px;
      left: 24px;
      z-index: 2;
      pointer-events: none;
      color: #163852;
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.45);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 38px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .title p {
      margin: 6px 0 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.72;
    }

    .help {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 2;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #173c5a;
      background: rgba(246, 255, 255, 0.62);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .title {
        top: 16px;
        left: 16px;
      }

      .help {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Voxel Paradise</h1>
    <p>Island Builder</p>
  </div>
  <div class="help">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // ------------------------------------------------------------
    // Renderer and scene
    // ------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x85d8ff);
    scene.fog = new THREE.Fog(0x85d8ff, 34, 78);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      150
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xc9f3ff, 0x66705d, 2.25);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2cf, 3.25);
    sun.position.set(18, 30, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28;
    sun.shadow.camera.bottom = -28;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 70;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8bcfff, 0.75);
    fill.position.set(-16, 10, -18);
    scene.add(fill);

    // ------------------------------------------------------------
    // Materials
    // ------------------------------------------------------------
    const material = (color, options = {}) =>
      new THREE.MeshStandardMaterial({
        color,
        roughness: 0.82,
        metalness: 0,
        ...options
      });

    const mats = {
      water: material(0x369bd4),
      waterLight: material(0x58b9e8),
      waterDark: material(0x1f76a9),
      sand: material(0xe8c98d),
      sandDark: material(0xc99b5e),
      cliff: material(0x788b91),
      cliffLight: material(0x93a39f),
      cliffDark: material(0x566c70),
      wood: material(0x9a6339),
      woodDark: material(0x65432d),
      woodLight: material(0xc48a50),
      roof: material(0xd8a64e),
      roofDark: material(0xa96e35),
      leaf: material(0x74b957),
      leafLight: material(0x91c96b),
      leafDark: material(0x528f49),
      trunk: material(0x805139),
      white: material(0xf4f2df),
      rope: material(0xd7b979)
    };

    // ------------------------------------------------------------
    // Voxel helpers
    // ------------------------------------------------------------
    const voxel = (w, h, d, mat, x, y, z, cast = true) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    const cube = (size, mat, x, y, z, cast = true) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size, size, size),
        mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    const addBox = (w, h, d, mat, x, y, z, cast = true) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    const addCylinder = (
      radius,
      height,
      mat,
      x,
      y,
      z,
      segments = 1
    ) => {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius,
          radius,
          height,
          segments
        ),
        mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    // ------------------------------------------------------------
    // Island: layered voxel terrain
    // ------------------------------------------------------------
    const island = new THREE.Group();
    scene.add(island);

    const landZones = [
      { x: -10, z: -5, w: 17, d: 16 },
      { x: 10, z: -5, w: 19, d: 18 },
      { x: 5, z: 8, w: 20, d: 14 }
    ];

    // Main landmass: broad, stepped terraces.
    for (let y = 0; y < 7; y++) {
      const w = 39 - y * 1.15;
      const d = 35 - y * 1.05;
      const x = y % 2 === 0 ? 0 : 1;
      const z = -1;
      const mat = y < 2 ? mats.cliffDark : mats.cliff;

      addBox(
        w,
        0.85,
        d,
        mat,
        x,
        y * 1.05,
        z,
        false
      );
    }

    // Top surfaces and rounded-looking stepped shoulders.
    addBox(20, 0.55, 18, mats.sandDark, -9, 6.7, -5, false);
    addBox(22, 0.5, 20, mats.sandDark, 9, 6.7, -5, false);
    addBox(24, 0.5, 15, mats.sand, 4, 6.7, 7, false);

    // Left and right cliff shoulders.
    for (let y = 1; y < 6; y++) {
      addBox(
        7,
        0.7,
        11,
        y % 2 ? mats.cliff : mats.cliffDark,
        -17,
        y * 0.9,
        -5,
        false
      );
      addBox(
        7,
        0.7,
        11,
        y % 2 ? mats.cliff : mats.cliffDark,
        17,
        y * 0.9,
        -5,
        false
      );
    }

    // Front lower shore.
    for (let i = 0; i < 11; i++) {
      const x = -10 + i;
      const z = 11 + Math.sin(i * 0.8) * 2.4;
      const w = 2.1 + Math.sin(i * 0.65) * 0.25;
      addBox(
        w,
        0.5,
        2.5,
        i % 3 === 0 ? mats.sand : mats.sandDark,
        x,
        5.8,
        z,
        false
      );
    }

    // Scattered cliff rocks.
    const rockMaterials = [mats.cliffDark, mats.cliff, mats.cliffLight];
    for (let i = 0; i < 30; i++) {
      const side = i % 2 ? -1 : 1;
      const rock = cube(
        0.8 + (i % 4) * 0.28,
        rockMaterials[i % 3],
        side * (12 + (i % 5) * 2.1),
        4.2 + (i % 3) * 0.8,
        -7 + (i % 4) * 2.3
      );
      rock.rotation.y = (i * 0.73) % Math.PI;
    }

    // ------------------------------------------------------------
    // Water: broad base plus animated-looking voxel waves
    // ------------------------------------------------------------
    const water = new THREE.Group();
    scene.add(water);

    // Main ocean slab.
    addBox(72, 2.4, 54, mats.water, 0, 0.8, 0, false);

    // Water rings around the island.
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      const radius = 15 + (i % 4) * 2.1;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const ring = addBox(
        0.36,
        0.12,
        4.8,
        i % 3 === 0 ? mats.waterLight : mats.water,
        x,
        2.25,
        z,
        false
      );
      ring.rotation.y = angle;
    }

    // Fine wave tiles.
    const waveMaterials = [mats.waterLight, mats.waterDark];
    for (let i = 0; i < 95; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 18 + Math.random() * 29;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const w = 0.4 + Math.random() * 1.4;
      const d = 0.35 + Math.random() * 0.8;
      const tile = addBox(
        w,
        0.08,
        d,
        waveMaterials[i % 2],
        x,
        2.12 + Math.random() * 0.035,
        z,
        false
      );
      tile.rotation.y = angle;
    }

    // ------------------------------------------------------------
    // Houses
    // ------------------------------------------------------------
    function buildHouse({
      x,
      y,
      z,
      w = 4,
      d = 4,
      rotation = 0,
      walls = mats.wood,
      roof = mats.roof
    }) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotation;
      scene.add(group);

      const wallMat = material(walls);
      const roofMat = material(roof);

      // Platform.
      addBox(
        w + 0.5,
        0.35,
        d + 0.5,
        mats.woodDark,
        0,
        0.18,
        0,
        false
      );

      // Main body.
      addBox(
        w,
        1.55,
        d,
        wallMat,
        0,
        0.95,
        0
      );

      // Front and side inset panels.
      addBox(
        w * 0.55,
        0.75,
        0.12,
        mats.woodDark,
        0,
        0.95,
        d / 2 + 0.06
      );
      addBox(
        0.12,
        0.75,
        d * 0.55,
        mats.woodDark,
        w / 2 + 0.06,
        0.95,
        0
      );

      // Door.
      addBox(
        0.72,
        1.25,
        0.13,
        mats.roofDark,
        0,
        0.65,
        d / 2 + 0.15
      );

      // Windows.
      addBox(
        0.55,
        0.48,
        0.12,
        mats.white,
        -w * 0.22,
        1.45,
        d / 2 + 0.1,
        false
      );
      addBox(
        0.55,
        0.48,
        0.12,
        mats.white,
        w * 0.22,
        1.45,
        d / 2 + 0.1,
        false
      );
      addBox(
        0.12,
        0.48,
        0.55,
        mats.white,
        w / 2 + 0.1,
        1.45,
        0,
        false
      );

      // Two-tier voxel roof.
      addBox(
        w + 1.25,
        0.45,
        d + 1.25,
        roofMat,
        0,
        1.8,
        0
      );
      addBox(
        w + 0.65,
        0.42,
        d + 0.65,
        roofMat,
        0,
        2.18,
        0
      );

      // Roof trim.
      addBox(
        w + 1.45,
        0.13,
        0.18,
        mats.roofDark,
        0,
        1.58,
        (d + 1.25) / 2,
        false
      );
      addBox(
        w + 1.45,
        0.13,
        0.18,
        mats.roofDark,
        0,
        1.58,
        -(d + 1.25) / 2,
        false
      );

      // Corner posts.
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addBox(
            0.18,
            2.15,
            0.18,
            mats.woodDark,
            sx * (w / 2 + 0.22),
            1.1,
            sz * (d / 2 + 0.22)
          );
        }
      }

      return group;
    }

    // Main resort houses.
    buildHouse({
      x: -4.5,
      y: 7.15,
      z: 0.5,
      w: 5.2,
      d: 5.2,
      rotation: -0.12
    });

    buildHouse({
      x: 8.5,
      y: 7.15,
      z: 0.5,
      w: 4.7,
      d: 4.7,
      rotation: 0.16
    });

    buildHouse({
      x: 11.8,
      y: 5.8,
      z: -4.8,
      w: 4.1,
      d: 4.1,
      rotation: 0.2
    });

    // Small beach pavilions.
    buildHouse({
      x: -13.8,
      y: 6.25,
      z: -1.4,
      w: 3.4,
      d: 3.4,
      rotation: 0.2,
      walls: mats.woodLight
    });

    buildHouse({
      x: 2.4,
      y: 6.25,
      z: 10.5,
      w: 3.2,
      d: 3.2,
      rotation: -0.35,
      walls: mats.woodLight
    });

    // Overwater pavilion.
    const pavilion = new THREE.Group();
    pavilion.position.set(-6.5, 4.3, 3.8);
    pavilion.rotation.y = -0.18;
    scene.add(pavilion);

    addBox(5.4, 0.3, 5.4, mats.woodDark, 0, 0.15, 0);
    addBox(4.7, 1.45, 4.7, mats.wood, 0, 0.95, 0);
    addBox(5.7, 0.42, 5.7, mats.roof, 0, 1.8, 0);
    addBox(4.8, 0.4, 4.8, mats.roof, 0, 2.16, 0);

    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        addBox(
          0.2,
          2.1,
          0.2,
          mats.woodDark,
          sx * 2.35,
          1.1,
          sz * 2.35
        );
      }
    }

    // ------------------------------------------------------------
    // Palm trees
    // ------------------------------------------------------------
    function buildPalm({
      x,
      y,
      z,
      scale = 1,
      rotation = 0
    }) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotation;
      group.scale.setScalar(scale);
      scene.add(group);

      addCylinder(
        0.18,
        2.2,
        mats.trunk,
        0,
        1.1,
        0,
        7
      );

      // Crown.
      const crown = new THREE.Group();
      crown.position.y = 2.25;
      group.add(crown);

      for (let i = 0; i < 7; i++) {
        const angle = (i / 7) * Math.PI * 2;
        const leaf = addBox(
          1.25,
          0.18,
          0.28,
          i % 2 ? mats.leaf : mats.leafLight,
          Math.cos(angle) * 0.52,
          0,
          Math.sin(angle) * 0.52,
          false
        );
        leaf.rotation.z = Math.cos(angle) * 0.28;
        leaf.rotation.x = Math.sin(angle) * 0.28;
        leaf.rotation.y = -angle;
      }

      // Small crown cap.
      addBox(
        0.65,
        0.28,
        0.65,
        mats.leafDark,
        0,
        0.12,
        0,
        false
      );

      // Trunk bands.
      for (let i = 0; i < 4; i++) {
        addBox(
          0.38,
          0.13,
          0.38,
          mats.woodDark,
          0,
          0.28 + i * 0.48,
          0,
          false
        );
      }
    }

    // Island palms.
    const palmPositions = [
      [-15.5, 6.45, -6.8, 1.05],
      [-12.4, 6.45, -8.2, 0.88],
      [-7.8, 6.45, -9.2, 0.95],
      [16.8, 6.45, -8.5, 1.08],
      [14.2, 6.45, -10.1, 0.9],
      [9.4, 6.45, -10.2, 0.85],
      [4.8, 6.45, -10.7, 0.95],
      [-1.5, 6.45, -10.2, 0.88],
      [6.2, 6.45, 11.4, 0.9],
      [13.4, 6.45, 11.2, 0.86],
      [-12.8, 6.45, 10.5, 0.9],
      [2.6, 6.45, 12.2, 0.88],
      [-8.5, 5.4, 8.8, 0.8],
      [8.8, 5.4, 8.8, 0.8],
      [15.2, 5.4, 4.2, 0.75],
      [-14.2, 5.4, 4.2, 0.75]
    ];

    palmPositions.forEach((p) => buildPalm(p));

    // ------------------------------------------------------------
    // Bridges
    // ------------------------------------------------------------
    function buildBridge({
      x1,
      z1,
      x2,
      z2,
      y = 6.7,
      width = 1.4,
      rotation = 0
    }) {
      const group = new THREE.Group();
      group.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
      group.rotation.y = rotation;
      scene.add(group);

      const length = Math.hypot(x2 - x1, z2 - z1);
      const segments = Math.max(5, Math.ceil(length / 1.15));

      // Plank deck.
      for (let i = 0; i < segments; i++) {
        const t = i / (segments - 1);
        const x = THREE.MathUtils.lerp(x1, x2, t);
        const z = THREE.MathUtils.lerp(z1, z2, t);
        addBox(
          0.78,
          0.16,
          width,
          i % 3 === 0 ? mats.woodLight : mats.wood,
          x,
          0.08,
          z,
          false
        );
      }

      // Rails and posts.
      for (let i = 0; i <= segments; i += 2) {
        const t = i / segments;
        const x = THREE.MathUtils.lerp(x1, x2, t);
        const z = THREE.MathUtils.lerp(z1, z2, t);

        for (const side of [-1, 1]) {
          addBox(
            0.12,
            0.75,
            0.12,
            mats.woodDark,
            x + side * width * 0.48,
            0.5,
            z,
            false
          );
          addBox(
            0.09,
            0.09,
            width * 0.9,
            mats.rope,
            x + side * width * 0.48,
            0.95,
            z,
            false
          );
        }
      }

      // Support posts.
      const supports = Math.max(2, Math.floor(length / 3));
      for (let i = 0; i <= supports; i++) {
        const t = i / supports;
        const x = THREE.MathUtils.lerp(x1, x2, t);
        const z = THREE.MathUtils.lerp(z1, z2, t);
        addBox(
          0.2,
          1.3,
          0.2,
          mats.woodDark,
          x,
          -0.65,
          z
        );
      }
    }

    // Suspended bridge between left and right shores.
    buildBridge({
      x1: -10.4,
      z1: -2.7,
      x2: 10.4,
      z2: -2.7,
      y: 6.65,
      width: 1.25,
      rotation: 0
    });

    // Bridge from upper right plateau to middle right house.
    buildBridge({
      x1: 15.2,
      z1: -3.6,
      x2: 11.8,
      z2: -1.5,
      y: 6.65,
      width: 1.15,
      rotation: Math.atan2(-1.9, -13.4)
    });

    // Short connecting bridge.
    buildBridge({
      x1: -2.2,
      z1: 1.5,
      x2: 1.5,
      z2: 1.5,
      y: 6.65,
      width: 1.1,
      rotation: 0
    });

    // ------------------------------------------------------------
    // Docks
    // ------------------------------------------------------------
    function buildDock({
      x,
      z,
      length = 8,
      width = 1.5,
      rotation = 0
    }) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      scene.add(group);

      // Floating pilings.
      for (let i = 0; i < 7; i++) {
        addBox(
          0.24,
          2.2,
          0.24,
          mats.woodDark,
          -length * 0.36 + i * length * 0.18,
          0.8,
          0
        );
      }

      // Deck.
      for (let i = 0; i < 13; i++) {
        addBox(
          0.62,
          0.18,
          width,
          i % 3 === 0 ? mats.woodLight : mats.wood,
          -length * 0.36 + i * length * 0.18,
          1.65,
          0,
          false
        );
      }

      // Handrail.
      for (let i = 0; i <= 12; i += 2) {
        const px = -length * 0.36 + i * length * 0.18;
        addBox(
          0.1,
          0.85,
          0.1,
          mats.woodDark,
          px,
          2.15,
          width * 0.48
        );
      }
      addBox(
        length,
        0.1,
        0.1,
        mats.rope,
        0,
        2.55,
        width * 0.48,
        false
      );
    }

    buildDock({
      x: -6.5,
      z: 3.8,
      length: 9,
      width: 1.5,
      rotation: -0.18
    });

    buildDock({
      x: 15.2,
      z: 3.4,
      length: 8.5,
      width: 1.45,
      rotation: 0.24
    });

    buildDock({
      x: -14.2,
      z: 4.8,
      length: 5.5,
      width: 1.25,
      rotation: 0.5
    });

    // Small floating raft.
    const raft = new THREE.Group();
    raft.position.set(3.6, 2.65, 8.7);
    raft.rotation.y = 0.4;
    scene.add(raft);

    addBox(2.7, 0.28, 1.3, mats.wood, 0, 0, 0);
    addBox(0.22, 0.65, 1.4, mats.woodDark, -1.05, 0.3, 0);
    addBox(0.22, 0.65, 1.4, mats.woodDark, 1.05, 0.3, 0);
    addBox(2.3, 0.16, 0.22, mats.woodDark, 0, 0.3, 0);

    // ------------------------------------------------------------
    // Lanterns and small details
    // ------------------------------------------------------------
    function buildLantern(x, y, z) {
      addCylinder(
        0.16,
        0.35,
        mats.white,
        x,
        y,
        z,
        6
      );
      addCylinder(
        0.22,
        0.12,
        mats.roofDark,
        x,
        y + 0.23,
        z,
        6
      );
    }

    buildLantern(-5.2, 7.35, 3.5);
    buildLantern(10.3, 7.35, 3.4);
    buildLantern(14.2, 6.3, 1.3);
    buildLantern(-12.7, 6.2, -2.7);

    // Small rocks around the shore.
    for (let i = 0; i < 28; i++) {
      const side = i % 2 ? -1 : 1;
      const rock = cube(
        0.35 + (i % 3) * 0.18,
        i % 2 ? mats.cliffDark : mats.cliffLight,
        side * (11 + (i % 4) * 1.5),
        5.3 + (i % 2) * 0.35,
        9 + (i % 5) * 1.3
      );
      rock.rotation.y = (i * 0.67) % Math.PI;
    }

    // ------------------------------------------------------------
    // Camera controls implemented directly
    // ------------------------------------------------------------
    const controls = {
      target: new THREE.Vector3(0, 5.5, 0),
      radius: 42,
      theta: Math.PI * 0.25,
      phi: Math.PI * 0.28,
      dragging: false,
      lastX: 0,
      lastY: 0
    };

    function updateCamera() {
      const sinPhi = Math.sin(controls.phi);
      camera.position.set(
        controls.target.x + controls.radius * sinPhi * Math.sin(controls.theta),
        controls.target.y + controls.radius * Math.cos(controls.phi),
        controls.target.z + controls.radius * sinPhi * Math.cos(controls.theta)
      );
      camera.lookAt(controls.target);
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      controls.dragging = true;
      controls.lastX = event.clientX;
      controls.lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!controls.dragging) return;

      const dx = event.clientX - controls.lastX;
      const dy = event.clientY - controls.lastY;

      controls.lastX = event.clientX;
      controls.lastY = event.clientY;

      controls.theta -= dx * 0.006;
      controls.phi = THREE.MathUtils.clamp(
        controls.phi - dy * 0.005,
        0.18,
        Math.PI * 0.48
      );

      updateCamera();
    });

    function endDrag(event) {
      controls.dragging = false;
      if (
        event.pointerId !== undefined &&
        renderer.domElement.hasPointerCapture(event.pointerId)
      ) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", endDrag);
    renderer.domElement.addEventListener("pointercancel", endDrag);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        controls.radius = THREE.MathUtils.clamp(
          controls.radius + event.deltaY * 0.025,
          22,
          65
        );
        updateCamera();
      },
      { passive: false }
    );

    updateCamera();

    // ------------------------------------------------------------
    // Animation
    // ------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();

      // Subtle water movement.
      water.rotation.z = Math.sin(elapsed * 0.32) * 0.004;
      water.rotation.x = Math.cos(elapsed * 0.26) * 0.003;

      // Gentle palm sway.
      const palms = scene.children.filter((child) => child.isGroup);
      for (const palm of palms) {
        if (palm.userData.baseRotation !== undefined) {
          palm.rotation.z = Math.sin(elapsed * 0.7 + palm.userData.phase) * 0.018;
          palm.rotation.x = Math.cos(elapsed * 0.55 + palm.userData.phase) * 0.012;
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // ------------------------------------------------------------
    // Resize
    // ------------------------------------------------------------
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
