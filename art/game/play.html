<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="data:," />
<title>Back Roms — walk the 900 retro worlds</title>
<style>
  :root {
    --cream: #f5e6bd;
    --amber: #f3b744;
    --ink: rgba(12, 8, 5, 0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #0a0705;
    font-family: "Courier New", Courier, monospace;
    color: var(--cream);
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .hud { transition: opacity .25s ease; }
  body.photo .hud { opacity: 0; pointer-events: none !important; }

  /* World title card */
  #titlecard {
    position: fixed; top: 15%; left: 0; right: 0;
    text-align: center; pointer-events: none; z-index: 20;
    opacity: 0; transform: translateY(10px) scale(.985);
    transition: opacity .45s ease, transform .45s ease;
    text-shadow: 0 3px 18px #000, 0 0 42px rgba(0,0,0,.6);
  }
  #titlecard.show { opacity: 1; transform: translateY(0) scale(1); }
  #titlecard .big {
    font-size: clamp(30px, 6vw, 62px); font-weight: bold;
    letter-spacing: .1em; line-height: 1;
  }
  #titlecard .big .num { color: var(--amber); }
  #titlecard .sub {
    margin-top: 10px; font-size: clamp(12px, 1.8vw, 17px);
    letter-spacing: .3em; text-transform: uppercase; opacity: .92;
  }
  #titlecard .rule {
    width: 120px; height: 2px; margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  #titlecard .whisper {
    margin-top: 12px; font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: .3em; text-transform: uppercase; color: var(--amber);
    opacity: .95;
  }

  /* Relic signal dot (pulse rate is driven from JS by distance) */
  #status .relics { margin-top: 5px; font-size: 13px; letter-spacing: .14em; }
  #status .relics b { color: var(--amber); }
  #signalRow {
    margin-top: 6px; display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; opacity: .9;
  }
  #signalDot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 10px var(--amber), 0 0 22px rgba(243,183,68,.6);
    flex: none;
  }
  #signalRow.found { opacity: .45; }
  #signalRow.found #signalDot { background: #8a7a52; box-shadow: none; }

  /* Walker's Journal panel */
  #journalPanel {
    position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
    width: min(500px, 92vw); max-height: 76vh; overflow-y: auto;
    z-index: 25; display: none; pointer-events: auto;
    background: var(--ink); border: 1px solid rgba(245, 230, 189, .35);
    border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(6px);
    text-shadow: 0 1px 4px #000;
  }
  #journalPanel.open { display: block; }
  #journalPanel .jhead { font-size: 16px; letter-spacing: .14em; margin-bottom: 10px; }
  #journalPanel .jrow {
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 0; border-top: 1px solid rgba(245, 230, 189, .14);
    font-size: 13px; letter-spacing: .06em;
  }
  #journalPanel .jid { color: var(--amber); flex: none; }
  #journalPanel .jworld { flex: none; }
  #journalPanel .jrelic { flex: 1; text-align: right; opacity: .55; }
  #journalPanel .jrelic.got { opacity: 1; color: var(--amber); }
  #journalPanel .jmark { flex: none; width: 20px; text-align: center; }
  #journalPanel .jfoot { margin-top: 10px; font-size: 10.5px; letter-spacing: .12em; opacity: .7; text-transform: uppercase; }

  /* Bottom-left status */
  #status {
    position: fixed; left: 22px; bottom: 20px; z-index: 15; pointer-events: none;
    text-shadow: 0 2px 8px #000;
  }
  #status .where { font-size: 15px; letter-spacing: .14em; }
  #status .where b { color: var(--amber); }
  #status .hint { margin-top: 5px; font-size: 10.5px; letter-spacing: .12em; opacity: .75; text-transform: uppercase; }

  /* Top-right buttons */
  #buttons { position: fixed; top: 18px; right: 18px; z-index: 16; display: flex; gap: 8px; }
  #buttons button {
    pointer-events: auto; cursor: pointer;
    font-family: inherit; font-size: 12px; letter-spacing: .08em;
    color: var(--cream); background: var(--ink);
    border: 1px solid rgba(245, 230, 189, .35); border-radius: 8px;
    padding: 9px 13px; backdrop-filter: blur(6px);
  }
  #buttons button:hover { border-color: var(--amber); color: var(--amber); }
  #buttons button.on { background: rgba(243, 183, 68, .25); border-color: var(--amber); color: var(--amber); }

  /* Favorite star — one big touch target in the top-right cluster */
  #favBtn { font-size: 22px; line-height: 1; min-width: 48px; min-height: 44px; padding: 9px 11px; }

  /* Rift transition flash (tinted by destination fog color via JS) */
  #riftflash {
    position: fixed; inset: 0; z-index: 30; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center,
      rgba(255,255,255,.85) 0%, var(--flash, #7a6cff) 42%, transparent 78%);
    mix-blend-mode: screen;
  }

  /* Touch joystick */
  #joy {
    position: fixed; z-index: 18; width: 116px; height: 116px; border-radius: 50%;
    border: 2px solid rgba(245, 230, 189, .4); background: rgba(10, 8, 6, .3);
    display: none; pointer-events: none; transform: translate(-50%, -50%);
  }
  #joyNub {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(245, 230, 189, .45); transform: translate(-50%, -50%);
  }

  #loading {
    position: fixed; inset: 0; z-index: 40; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: #0a0705; letter-spacing: .25em; font-size: 13px; text-transform: uppercase;
    transition: opacity .5s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .dot {
    width: 10px; height: 10px; border: 2px solid var(--amber); border-radius: 50%;
    box-shadow: 0 0 16px var(--amber); animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }

  @media (max-width: 650px) {
    #status { left: 14px; bottom: 14px; }
    #buttons { top: 12px; right: 12px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="titlecard" class="hud">
    <div class="big"><span class="num" id="tcNum">#001</span> · <span id="tcTitle">ADVENTURE</span></div>
    <div class="sub" id="tcSub">Castles &amp; Mazes</div>
    <div class="rule"></div>
    <div class="whisper" id="tcWhisper"></div>
  </div>

  <div id="status" class="hud">
    <div class="where">World <b id="stIdx">#--- / -</b> · <span id="stName">—</span></div>
    <div class="relics">🏆 Relics <b id="stRelics">0 / 0</b></div>
    <div id="signalRow"><span id="signalDot"></span><span id="signalText">Relic signal</span></div>
    <div class="hint">WASD / stick to walk · drag to look · walk through a glowing wall to travel · ☆ favorite · P photo mode · J journal</div>
  </div>

  <div id="buttons" class="hud">
    <button id="favBtn" type="button" aria-label="Favorite this world" title="Favorite this world">☆</button>
    <button id="journalBtn" type="button">📖 Journal</button>
    <button id="mapBtn" type="button">🗺 Map</button>
    <button id="photoBtn" type="button">📷 Photo</button>
    <button id="snapBtn" type="button">💾 Snap</button>
  </div>

  <div id="journalPanel" class="hud">
    <div class="jhead">📖 Walker's Journal</div>
    <div id="journalList"></div>
    <div class="jfoot">J or 📖 to close · relics persist between visits</div>
  </div>

  <div id="riftflash"></div>
  <div id="joy"><div id="joyNub"></div></div>
  <div id="loading"><div class="dot"></div><div>Opening the first world…</div></div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";
    import { buildRelic } from "../../walk/relics.js";

    const CDN = "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";
    const EYE = 1.7;
    const BASE_FOV = 62;
    const WALK_SPEED = 6.0;
    const RUN_SPEED = 9.5;
    const PRELOAD_DIST = 15;
    const TRIGGER_DIST = 1.2;
    const REARM_DIST = 3.0;
    const BEND_MS = 600;
    const SWAP_AT = 0.5; // fraction of the bend where the world swap happens
    const RIFT_W = 2.2;
    const RIFT_H = 3.0;
    const RIFT_DEFAULT_TINT = 0x7a6cff;
    // Whole-wall passages (Cherie, 2026-11-01): the Walker skins each
    // assigned boundary wall with a host-drawn membrane (see makeWallRift).
    const WALL_INSET = 0.3;     // membrane sits this far inside the wall plane
    const WALL_ARM_DEPTH = 1.0; // a wall portal arms once the player is this far inside it

    // ---------------------------------------------------------------------
    // Renderer / scene / camera
    // ---------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("app").appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.rotation.order = "YXZ";

    const raycaster = new THREE.Raycaster();
    raycaster.camera = camera;
    const DOWN = new THREE.Vector3(0, -1, 0);

    // ---------------------------------------------------------------------
    // DOM refs
    // ---------------------------------------------------------------------
    const el = id => document.getElementById(id);
    const titlecard = el("titlecard"), tcNum = el("tcNum"), tcTitle = el("tcTitle"), tcSub = el("tcSub");
    const tcWhisper = el("tcWhisper");
    const stIdx = el("stIdx"), stName = el("stName"), stRelics = el("stRelics");
    const signalRow = el("signalRow"), signalDot = el("signalDot"), signalText = el("signalText");
    const journalPanel = el("journalPanel"), journalList = el("journalList");
    const flashEl = el("riftflash");
    const joyEl = el("joy"), joyNub = el("joyNub");

    // ---------------------------------------------------------------------
    // Manifest + world instance management (streaming)
    // ---------------------------------------------------------------------
    let defs = [];
    const defById = new Map();
    const moduleCache = new Map();   // id -> module namespace (JS stays cached)
    const loadPromises = new Map();  // id -> Promise
    const instances = new Map();     // id -> instance record (BUILT worlds)
    let disposeCount = 0;

    const idxOf = id => defs.findIndex(d => d.id === id);
    // Traversal ring (Lane A): canonical manifest order by default. When a
    // custom route is active, the ring IS that route's world order and rift
    // destinations follow it. ringIds is settled at boot and on every route
    // change, BEFORE any world is (re)built — portals bake their destination
    // at build time (see applyRingChange). A world outside the ring gets
    // rifts to the ring's ends, so resuming outside a route still walks.
    let ringIds = null; // null = canonical (defs order)
    function ringOrder() { return ringIds || defs.map(d => d.id); }
    // The active route's world list, or null for the canonical ring.
    // activeRoute's primary form (Lane B writes it) is an integer index
    // into save.routes; a raw [ids] array, a numeric string, and a route
    // name are all tolerated.
    function activeRouteWorlds() {
      const ar = save.activeRoute;
      if (ar === null || ar === undefined) return null;
      if (Array.isArray(ar)) return ar;
      let idx = null;
      if (typeof ar === "number" && Number.isInteger(ar)) idx = ar;
      else if (typeof ar === "string" && ar.trim() !== "" && Number.isInteger(Number(ar))) idx = Number(ar);
      else if (typeof ar === "string") {
        const i = save.routes.findIndex(r => r.name === ar);
        if (i !== -1) idx = i;
      }
      if (idx === null || !save.routes[idx]) return null;
      return save.routes[idx].worlds;
    }
    function computeRing() {
      const worlds = activeRouteWorlds();
      if (Array.isArray(worlds)) {
        const ids = [...new Set(worlds.filter(id => defById.has(id)))];
        if (ids.length >= 1) return ids;
      }
      return null;
    }
    const nextId = id => {
      const r = ringOrder();
      const i = r.indexOf(id);
      return i === -1 ? r[0] : r[(i + 1) % r.length];
    };
    const prevId = id => {
      const r = ringOrder();
      const i = r.indexOf(id);
      return i === -1 ? r[r.length - 1] : r[(i - 1 + r.length) % r.length];
    };
    // ---------------------------------------------------------------------
    // The 4-wall grid (this game): the manifest order is laid out row-major
    // on a torus grid; every world's four boundary walls lead to its four
    // grid neighbours (E/W wrap within the row, N/S within the column).
    // ---------------------------------------------------------------------
    const OPP_WALL = { E: "W", W: "E", N: "S", S: "N" };
    function gridNeighbor(id, wall) {
      const ids = defs.map(d => d.id);
      const i = ids.indexOf(id);
      if (i === -1) return ids[0];
      const cols = Math.max(2, Math.ceil(Math.sqrt(ids.length)));
      const rows = Math.ceil(ids.length / cols);
      const r = Math.floor(i / cols), c = i % cols;
      const rowStart = r * cols, rowLen = Math.min(cols, ids.length - rowStart);
      let colH = 0;
      for (let rr = 0; rr < rows; rr++) if (rr * cols + c < ids.length) colH++;
      if (wall === "E") return ids[rowStart + ((c + 1) % rowLen)];
      if (wall === "W") return ids[rowStart + ((c - 1 + rowLen) % rowLen)];
      if (wall === "S") return ids[(((r + 1) % colH) * cols) + c];
      if (wall === "N") return ids[(((r - 1 + colH) % colH) * cols) + c];
      return ids[0];
    }
    function neighborIds(id) { return ["E", "W", "N", "S"].map(w => gridNeighbor(id, w)); }
    function preloadNeighbors(id) { for (const nid of neighborIds(id)) ensureLoaded(nid); }
    function wallSet(bounds) {
      return {
        E: { axis: "x", plane: bounds.max.x, sign: -1, a0: bounds.min.z, a1: bounds.max.z },
        W: { axis: "x", plane: bounds.min.x, sign: 1, a0: bounds.min.z, a1: bounds.max.z },
        N: { axis: "z", plane: bounds.max.z, sign: -1, a0: bounds.min.x, a1: bounds.max.x },
        S: { axis: "z", plane: bounds.min.z, sign: 1, a0: bounds.min.x, a1: bounds.max.x }
      };
    }
    // The module door anchor whose direction from the bounds centre best
    // matches a wall — arrivals land just inside it, facing the heart.
    function anchorForWall(inst, bounds, wallName) {
      const cx = (bounds.min.x + bounds.max.x) / 2;
      const cz = (bounds.min.z + bounds.max.z) / 2;
      const want = { E: [1, 0], W: [-1, 0], N: [0, 1], S: [0, -1] }[wallName];
      let best = null, bestScore = -Infinity;
      for (const key of ["next", "prev", "east", "west"]) {
        const d = inst.doors[key];
        if (!d) continue;
        const vx = d.x - cx, vz = d.z - cz;
        const len = Math.hypot(vx, vz) || 1;
        const score = (vx / len) * want[0] + (vz / len) * want[1];
        if (score > bestScore) { bestScore = score; best = d; }
      }
      return best || inst.doors.next;
    }
    function allowedIds(id) { return new Set([id, ...neighborIds(id)]); }

    async function loadModule(id) {
      if (moduleCache.has(id)) return moduleCache.get(id);
      if (!loadPromises.has(id)) {
        const def = defById.get(id);
        const url = new URL(def.module, window.location.href).href;
        loadPromises.set(id, import(url).then(ns => { moduleCache.set(id, ns); return ns; }));
      }
      return loadPromises.get(id);
    }

    async function ensureLoaded(id) {
      if (instances.has(id)) return instances.get(id);
      const ns = await loadModule(id);
      if (instances.has(id)) return instances.get(id);
      const inst = ns.createWorld(THREE);
      inst.group.updateMatrixWorld(true);
      const rec = {
        id, def: defById.get(id), inst,
        group: inst.group, t: 0,
        portals: [],
        meshes: []
      };
      // Ground raycasts only ever test real meshes (sprites/points excluded —
      // sprite raycasting also requires a camera on the raycaster).
      inst.group.traverse(o => { if (o.isMesh) rec.meshes.push(o); });
      // Portals are built after the group exists. Each door anchor picks
      // its boundary wall from the group's bounds (assignWalls) and the
      // Walker skins that whole wall with a membrane; if the bounds are
      // unusable, the legacy point rift at the door anchor is kept.
      const bounds = worldBounds(rec);
      rec.bounds = bounds;
      if (bounds) {
        const walls = wallSet(bounds);
        for (const wname of ["E", "W", "N", "S"]) {
          const destId = gridNeighbor(id, wname);
          const portal = makeWallRift(defById.get(destId), destId, walls[wname], bounds);
          if (!portal) continue;
          portal.side = wname;
          portal.wallName = wname;
          portal.destId = destId;
          rec.group.add(portal.group);
          rec.portals.push(portal);
        }
      }
      if (!rec.portals.length) {
        // Bounds unusable: legacy oval rifts at the next/prev door anchors.
        for (const side of ["next", "prev"]) {
          const door = inst.doors[side];
          const destId = side === "next" ? gridNeighbor(id, "E") : gridNeighbor(id, "W");
          const gy = sampleGround(rec, door.x, door.z, 40, 15);
          const portal = makeRift(defById.get(destId), destId);
          portal.group.position.set(door.x, gy === null ? 0 : gy, door.z);
          portal.armed = true;
          portal.side = side;
          portal.destId = destId;
          rec.group.add(portal.group);
          rec.portals.push(portal);
        }
      }
      // The world's relic (if the module declares one): walker-owned prop
      // riding inside the world group, so it streams and disposes with the
      // world. Already-found relics never respawn.
      if (inst.relic) {
        const gy = sampleGround(rec, inst.relic.x, inst.relic.z, 40, 15);
        rec.relicGroundY = gy === null ? 0 : gy;
        rec.relicProp = makeRelicProp(inst.relic.id);
        rec.relicProp.group.position.set(inst.relic.x, rec.relicGroundY + 1.05, inst.relic.z);
        rec.relicProp.group.visible = !relicFound(id);
        rec.group.add(rec.relicProp.group);
      }
      rec.group.visible = false;
      scene.add(rec.group);
      instances.set(id, rec);
      refreshRiftTints();
      sweepLoaded();
      return rec;
    }

    function disposeWorld(id) {
      const rec = instances.get(id);
      if (!rec) return;
      scene.remove(rec.group);
      rec.group.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            for (const k in m) { if (m[k] && m[k].isTexture) m[k].dispose(); }
            m.dispose();
          }
        }
      });
      instances.delete(id);
      disposeCount++;
    }

    // Keep at most {current, next, prev} built.
    function sweepLoaded() {
      if (!current) return;
      const allowed = allowedIds(current.id);
      for (const id of [...instances.keys()]) {
        if (!allowed.has(id)) disposeWorld(id);
      }
    }

    // ---------------------------------------------------------------------
    // Back Roms save v2 (persisted in localStorage) — Lane A.
    //
    // ONE store for everything durable: the Walker's Journal (found
    // relics) plus position resume, visited worlds, star favorites and
    // custom routes. It lives under the ORIGINAL journal key
    // ("backroms-journal-v1"), and the stored value carries BOTH
    // representations, kept consistent on every write:
    //   - the v2 schema fields (below), and
    //   - the v1 per-world relic map { "<id>": { found, name, at } }.
    // Readers of either shape (Lane B reads relics as v2 relics[] union
    // v1 found entries) stay correct, v1 entries are never deleted, and a
    // legacy v1-only value is migrated forward on first load.
    //
    // Schema: { v: 2, world, pos: [x, groundY, z], yaw, relics: [ids],
    //           relicMeta: { id: { name, at } }, visited: [ids],
    //           favorites: [ids], routes: [{ name, worlds: [ids] }],
    //           activeRoute: null | integer index into routes (primary,
    //           Lane B's form) | [ids] (tolerated raw form) }
    //
    // Field ownership: the walker owns world/pos/yaw/visited/favorites/
    // relics; Lane B owns routes/activeRoute and writes them with its own
    // read-modify-write. saveNow() therefore syncs FROM storage first
    // (adoptStored) so this page's throttled snapshots can never clobber
    // a fresher map write — and picks up outside relic entries the same
    // way. BackRomsState.set() persists through persistSave() directly,
    // so a patch is never stomped by its own sync.
    // ---------------------------------------------------------------------
    const SAVE_KEY = "backroms-rendered-v1";
    const SAVE_VERSION = 2;
    const SAVE_FIELDS = new Set([
      "v", "world", "pos", "yaw", "relics", "relicMeta",
      "visited", "favorites", "routes", "activeRoute"
    ]);
    let pendingRingRebuild = false;

    function defaultSave() {
      return {
        v: SAVE_VERSION,
        world: null, pos: null, yaw: 0,
        relics: [], relicMeta: {},
        visited: [], favorites: [],
        routes: [], activeRoute: null
      };
    }

    function normalizeRoutes(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object" && Array.isArray(r.worlds))
        .map(r => ({ ...r, name: String(r.name || "Route"),
                     worlds: r.worlds.filter(x => typeof x === "string") }));
    }

    function normalizeActiveRoute(v) {
      if (v === null || v === undefined) return null;
      if (Array.isArray(v)) return v.filter(x => typeof x === "string");
      if (typeof v === "number" && Number.isFinite(v)) return Math.trunc(v);
      if (typeof v === "string") {
        const t = v.trim();
        if (t !== "" && Number.isInteger(Number(t))) return Number(t);
        return v; // a route name — resolved against routes at ring time
      }
      if (typeof v === "object" && Number.isInteger(v.index)) return v.index;
      return null;
    }

    // The v1 per-world relic entries riding inside the stored object:
    // any non-schema key whose value has the { found: bool, ... } shape.
    function extractLegacyEntries(raw) {
      const out = {};
      for (const [k, val] of Object.entries(raw)) {
        if (SAVE_FIELDS.has(k)) continue;
        if (val && typeof val === "object" && typeof val.found === "boolean") out[k] = val;
      }
      return out;
    }

    function loadSave() {
      const s = defaultSave();
      let raw = null;
      try { raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { raw = null; }
      if (!raw || typeof raw !== "object") return { save: s, legacy: {} };
      const legacy = extractLegacyEntries(raw);
      if (raw.v === SAVE_VERSION) {
        if (typeof raw.world === "string") s.world = raw.world;
        if (Array.isArray(raw.pos) && raw.pos.length === 3 && raw.pos.every(n => Number.isFinite(n))) {
          s.pos = raw.pos.slice();
        }
        if (Number.isFinite(raw.yaw)) s.yaw = raw.yaw;
        for (const k of ["relics", "visited", "favorites"]) {
          if (Array.isArray(raw[k])) s[k] = raw[k].filter(x => typeof x === "string");
        }
        if (raw.relicMeta && typeof raw.relicMeta === "object") {
          for (const [id, m] of Object.entries(raw.relicMeta)) {
            if (m && typeof m === "object") {
              s.relicMeta[id] = { name: String(m.name || "Relic"), at: Number(m.at) || 0 };
            }
          }
        }
        s.routes = normalizeRoutes(raw.routes);
        s.activeRoute = normalizeActiveRoute(raw.activeRoute);
      }
      // Relics are the UNION of the v2 list and v1 found entries, for
      // both stored shapes — a v1-only value migrates through this loop.
      for (const [id, e] of Object.entries(legacy)) {
        if (e.found && !s.relics.includes(id)) {
          s.relics.push(id);
          if (!s.relicMeta[id]) s.relicMeta[id] = { name: e.name || "Relic", at: e.at || 0 };
        }
      }
      return { save: s, legacy };
    }

    const _loaded = loadSave();
    const save = _loaded.save;
    const legacyEntries = _loaded.legacy; // v1 per-world entries, kept verbatim

    // Merge a stored object into the in-memory save: Lane-B-owned fields
    // (routes/activeRoute) are adopted wholesale; relics union in from
    // every representation; relicMeta fills gaps. Session-owned scalar
    // state (world/pos/yaw/visited/favorites) is NOT adopted — this page
    // is its only writer.
    function adoptStored(stored) {
      if (Array.isArray(stored.routes)) save.routes = normalizeRoutes(stored.routes);
      if ("activeRoute" in stored) save.activeRoute = normalizeActiveRoute(stored.activeRoute);
      if (Array.isArray(stored.relics)) {
        for (const id of stored.relics) {
          if (typeof id === "string" && !save.relics.includes(id)) save.relics.push(id);
        }
      }
      if (stored.relicMeta && typeof stored.relicMeta === "object") {
        for (const [id, m] of Object.entries(stored.relicMeta)) {
          if (!save.relicMeta[id] && m && typeof m === "object") {
            save.relicMeta[id] = { name: String(m.name || "Relic"), at: Number(m.at) || 0 };
          }
        }
      }
      for (const [id, e] of Object.entries(extractLegacyEntries(stored))) {
        legacyEntries[id] = e;
        if (e.found && !save.relics.includes(id)) {
          save.relics.push(id);
          if (!save.relicMeta[id]) save.relicMeta[id] = { name: e.name || "Relic", at: e.at || 0 };
        }
      }
    }

    // Read storage and adopt what other writers changed. If adopting
    // changed the effective ring, schedule a portal rebuild for the next
    // calm frame (tick performs it). Returns the stored object (or null).
    function syncFromStorage() {
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { stored = null; }
      if (!stored || typeof stored !== "object") return null;
      const before = (defs.length && current) ? JSON.stringify(ringOrder()) : null;
      adoptStored(stored);
      if (before !== null &&
          JSON.stringify(computeRing() || defs.map(d => d.id)) !== before) {
        pendingRingRebuild = true;
      }
      return stored;
    }

    // Serialize the save with BOTH representations: unknown stored keys
    // ride along, schema fields come from memory, and every found relic
    // is (re)written as a v1 per-world entry next to the v2 fields.
    function persistSave(stored) {
      try {
        const out = {};
        if (stored && typeof stored === "object") {
          for (const [k, v] of Object.entries(stored)) {
            if (!SAVE_FIELDS.has(k) && !(k in legacyEntries)) out[k] = v;
          }
        }
        Object.assign(out, save);
        for (const [id, e] of Object.entries(legacyEntries)) out[id] = e;
        for (const id of save.relics) {
          const m = save.relicMeta[id] || {};
          out[id] = { found: true, name: m.name || "Relic", at: m.at || 0 };
        }
        localStorage.setItem(SAVE_KEY, JSON.stringify(out));
      } catch (e) {}
    }

    function saveNow() { persistSave(syncFromStorage()); }
    // Kept name for the existing journal call sites.
    function journalSave() { saveNow(); }
    function relicFound(id) { return save.relics.includes(id); }

    // Snapshot the live position into the save and persist it. Runs on
    // every world entry (boot / rift crossing / travel), on a ~5 s throttle
    // while playing, and on pagehide — so the worst case after a crash is
    // a few seconds of walking lost, never a corrupted save.
    function snapshotSave() {
      if (!current) return;
      save.world = current.id;
      save.pos = [player.x, player.groundY, player.z];
      save.yaw = player.yaw;
      saveNow();
    }

    function markVisited(id) {
      if (!save.visited.includes(id)) save.visited.push(id);
    }
    function isFavorite(id) { return save.favorites.includes(id); }
    function foundCount() { return defs.filter(d => relicFound(d.id)).length; }
    function updateRelicCounter() { stRelics.textContent = `${foundCount()} / ${defs.length}`; }

    function renderJournal() {
      journalList.innerHTML = defs.map(d => {
        const got = relicFound(d.id);
        const name = got ? ((save.relicMeta[d.id] || {}).name || "Relic") : "· · · hidden";
        return `<div class="jrow"><span class="jid">#${d.id}</span>` +
          `<span class="jworld">${d.title}</span>` +
          `<span class="jrelic ${got ? "got" : ""}">${got ? "✦ " : "✧ "}${name}</span>` +
          `<span class="jmark">${got ? "🏆" : "—"}</span></div>`;
      }).join("");
    }

    function toggleJournal() {
      const open = journalPanel.classList.toggle("open");
      el("journalBtn").classList.toggle("on", open);
      if (open) renderJournal();
    }
    el("journalBtn").addEventListener("click", toggleJournal);

    // ---------------------------------------------------------------------
    // Star favorite (Lane A) — ONE button, top-right, big touch target.
    // Filled ★ + .on when the current world is a favorite, ☆ otherwise.
    // No thumbs, no other rating UI (Cherie's call, 2026-11-01).
    // ---------------------------------------------------------------------
    const favBtn = el("favBtn");
    function refreshStar() {
      const on = !!current && isFavorite(current.id);
      favBtn.textContent = on ? "★" : "☆";
      favBtn.classList.toggle("on", on);
    }
    function toggleFavorite() {
      if (!current) return;
      const i = save.favorites.indexOf(current.id);
      if (i === -1) save.favorites.push(current.id); else save.favorites.splice(i, 1);
      saveNow();
      refreshStar();
    }
    favBtn.addEventListener("click", toggleFavorite);

    // ---------------------------------------------------------------------
    // Relic prop — PURE 3D GEOMETRY ONLY (hard constraint: no sprites, no
    // textured planes/billboards, no glow quads, no transparent textures —
    // nothing that can read as a square halo around it). The "glow" is an
    // emissive material plus a real (invisible) PointLight, nothing else.
    // A golden core inside two crossing rings reads "relic" in any world.
    // ---------------------------------------------------------------------
    function makeRelicProp(id) {
      // Host-built relic visuals live in relics.js (R8): the module only
      // names an id; the Walker builds the object. Any failure (unknown
      // shape, bad build) falls back to the legacy core-and-rings below.
      try {
        const built = buildRelic(THREE, id);
        if (built && built.group && built.core && built.light) return built;
      } catch (e) { /* fall through to the legacy prop */ }
      const g = new THREE.Group();
      const coreMat = new THREE.MeshStandardMaterial({
        color: 0xd9a43b, emissive: 0xffae2e, emissiveIntensity: 0.9,
        metalness: 0.65, roughness: 0.3
      });
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 0), coreMat);
      g.add(core);
      const ringMat = new THREE.MeshStandardMaterial({
        color: 0xf3d27a, emissive: 0xcc8a1e, emissiveIntensity: 0.55,
        metalness: 0.8, roughness: 0.25
      });
      const ringA = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.045, 10, 44), ringMat);
      g.add(ringA);
      const ringB = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.045, 10, 44), ringMat);
      ringB.rotation.x = Math.PI / 2;
      g.add(ringB);
      const light = new THREE.PointLight(0xffbe4a, 7, 10, 1.8);
      g.add(light);
      return { group: g, core, ringA, ringB, light };
    }

    // ---------------------------------------------------------------------
    // Time-rift portal prop: wavy oval membrane + destination label.
    // ---------------------------------------------------------------------
    function makeLabelSprite(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 512; canvas.height = 112;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 512, 112);
      ctx.font = "bold 44px 'Courier New', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 10;
      ctx.fillStyle = "#f5e6bd";
      ctx.fillText(text, 256, 46);
      ctx.font = "bold 25px 'Courier New', monospace";
      ctx.fillStyle = "#f3b744";
      ctx.fillText("— TIME RIFT —", 256, 88);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
      sprite.scale.set(4.6, 1.0, 1);
      return sprite;
    }

    function wobbleBase(geometry) {
      const pos = geometry.attributes.position;
      const base = new Float32Array(pos.array.length);
      base.set(pos.array);
      const ang = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        ang[i] = Math.atan2(base[i * 3 + 1], base[i * 3]);
      }
      return { base, ang };
    }

    function makeRift(destDef, destId) {
      const g = new THREE.Group();

      const membraneGeo = new THREE.CircleGeometry(1, 56);
      const membraneMat = new THREE.MeshBasicMaterial({
        color: RIFT_DEFAULT_TINT, transparent: true, opacity: 0.5,
        side: THREE.DoubleSide, depthWrite: false
      });
      const membrane = new THREE.Mesh(membraneGeo, membraneMat);
      membrane.scale.set(RIFT_W / 2, RIFT_H / 2, 1);
      membrane.position.y = RIFT_H / 2;
      membrane.userData = { rift: true, shape: "oval", width: RIFT_W, height: RIFT_H, dest: destId };
      g.add(membrane);

      const coreGeo = new THREE.CircleGeometry(0.62, 40);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.28,
        side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.scale.set(RIFT_W / 2, RIFT_H / 2, 1);
      core.position.set(0, RIFT_H / 2, 0.01);
      g.add(core);

      const rimGeo = new THREE.RingGeometry(0.93, 1.05, 56);
      const rimMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.9,
        side: THREE.DoubleSide, depthWrite: false
      });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.scale.set(RIFT_W / 2, RIFT_H / 2, 1);
      rim.position.set(0, RIFT_H / 2, 0.02);
      g.add(rim);

      const label = makeLabelSprite(`#${destDef.id} · ${destDef.title}`);
      label.position.set(0, RIFT_H + 0.85, 0);
      g.add(label);

      return {
        group: g, membrane, core, rim, label,
        memWobble: wobbleBase(membraneGeo),
        rimWobble: wobbleBase(rimGeo),
        phase: Math.random() * Math.PI * 2,
        yaw: 0
      };
    }

    function applyWobble(geometry, wb, t, phase, amp) {
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const bx = wb.base[i * 3], by = wb.base[i * 3 + 1];
        const r = Math.hypot(bx, by);
        if (r < 0.001) continue;
        const s = 1 + amp * Math.sin(t * 2.6 + wb.ang[i] * 3 + phase)
                  + amp * 0.7 * Math.sin(t * 4.3 + wb.ang[i] * 5 + phase * 1.7);
        pos.array[i * 3] = bx * s;
        pos.array[i * 3 + 1] = by * s;
      }
      pos.needsUpdate = true;
    }

    // Tint a rift with its destination world's fog color once that world is
    // built (before that it keeps the generic rift violet).
    function refreshRiftTints() {
      for (const rec of instances.values()) {
        for (const p of rec.portals) {
          const dest = instances.get(p.destId);
          if (dest) {
            const c = new THREE.Color(dest.inst.env.fogColor);
            p.membrane.material.color.copy(c);
            p.core.material.color.copy(c).lerp(new THREE.Color(0xffffff), 0.55);
            p.rim.material.color.copy(c).lerp(new THREE.Color(0xffffff), 0.35);
          }
        }
      }
    }

    // ---------------------------------------------------------------------
    // Whole-wall passages (Cherie, 2026-11-01) — HOST-LAYERED membranes.
    // Qwen builds plain solid boundary walls (generator rule 9 / spec R5);
    // the passage surface is drawn by the Walker, exactly the way the
    // relic prop and the old oval rift are host-drawn: for each neighbor
    // (ring next/prev, or route neighbors), the door anchor's direction
    // from the bounds centre picks one of the four boundary walls, and
    // that wall's segment — corner to corner from the module group's
    // bounds — is skinned with a membrane inset WALL_INSET inside the
    // wall plane. Unassigned walls get no membrane and no trigger.
    // Travel = crossing the wall plane within the span (see tick).
    // ---------------------------------------------------------------------
    function worldBounds(rec) {
      const finite = b => [b.min.x, b.min.y, b.min.z, b.max.x, b.max.y, b.max.z].every(Number.isFinite);
      const whole = new THREE.Box3().setFromObject(rec.group);
      if (!whole.isEmpty() && finite(whole)) return whole;
      // A NaN-poisoned object (seen in the wild) must not poison the box:
      // fall back to a per-mesh union that skips non-finite boxes.
      const acc = new THREE.Box3(); const tmp = new THREE.Box3();
      for (const m of rec.meshes) {
        tmp.setFromObject(m);
        if (!tmp.isEmpty() && finite(tmp)) acc.union(tmp);
      }
      return acc.isEmpty() || !finite(acc) ? null : acc;
    }

    function assignWalls(rec, bounds) {
      const cx = (bounds.min.x + bounds.max.x) / 2;
      const cz = (bounds.min.z + bounds.max.z) / 2;
      if (!(bounds.max.x - bounds.min.x > 0) || !(bounds.max.z - bounds.min.z > 0)) return null;
      // sign: inside-positive direction — sd = sign * (coord - plane) is
      // the player's depth inside the wall (positive = inside the world).
      const walls = {
        E: { axis: "x", plane: bounds.max.x, sign: -1, a0: bounds.min.z, a1: bounds.max.z },
        W: { axis: "x", plane: bounds.min.x, sign: 1, a0: bounds.min.z, a1: bounds.max.z },
        N: { axis: "z", plane: bounds.max.z, sign: -1, a0: bounds.min.x, a1: bounds.max.x },
        S: { axis: "z", plane: bounds.min.z, sign: 1, a0: bounds.min.x, a1: bounds.max.x }
      };
      const doors = ["next", "prev"].map(side => {
        const d = rec.inst.doors[side];
        const vx = d.x - cx, vz = d.z - cz;
        const len = Math.hypot(vx, vz) || 1;
        const ux = vx / len, uz = vz / len;
        const score = { E: ux, W: -ux, N: uz, S: -uz };
        return { side, score, best: Math.max(ux, -ux, uz, -uz) };
      });
      // The more confident door picks first, so the two neighbors never
      // land on the same wall.
      doors.sort((a, b) => b.best - a.best);
      const used = new Set(); const out = {};
      for (const d of doors) {
        const pick = ["E", "W", "N", "S"]
          .sort((a, b) => d.score[b] - d.score[a])
          .find(w => !used.has(w));
        used.add(pick);
        out[d.side] = walls[pick];
      }
      return out;
    }

    function makeWallRift(destDef, destId, wall, bounds) {
      const spanLen = wall.a1 - wall.a0;
      const height = bounds.max.y - bounds.min.y;
      if (!(spanLen > 0) || !(height > 0)) return null;
      const cy = (bounds.min.y + bounds.max.y) / 2;
      const mid = (wall.a0 + wall.a1) / 2;
      const g = new THREE.Group();

      const membraneGeo = new THREE.PlaneGeometry(spanLen, height);
      const membraneMat = new THREE.MeshBasicMaterial({
        color: RIFT_DEFAULT_TINT, transparent: true, opacity: 0.5,
        side: THREE.DoubleSide, depthWrite: false
      });
      const membrane = new THREE.Mesh(membraneGeo, membraneMat);
      membrane.userData = { rift: true, shape: "wall", width: spanLen, height, dest: destId };
      g.add(membrane);

      const coreGeo = new THREE.PlaneGeometry(spanLen * 0.96, height * 0.92);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.28,
        side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.position.z = 0.02;
      g.add(core);

      const rimGeo = new THREE.PlaneGeometry(spanLen + 0.35, height + 0.35);
      const rimMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.9,
        side: THREE.DoubleSide, depthWrite: false
      });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.position.z = -0.02;
      g.add(rim);

      const label = makeLabelSprite(`#${destDef.id} · ${destDef.title}`);
      label.position.set(0, height / 2 + 0.85, 0);
      g.add(label);

      // Local +Z points into the world; the segment is skinned
      // WALL_INSET inside the wall plane so it never z-fights the
      // scene's own boundary wall.
      const inset = wall.plane + wall.sign * WALL_INSET;
      if (wall.axis === "z") {
        g.position.set(mid, cy, inset);
        g.rotation.y = wall.sign > 0 ? 0 : Math.PI;
      } else {
        g.position.set(inset, cy, mid);
        g.rotation.y = wall.sign > 0 ? Math.PI / 2 : -Math.PI / 2;
      }
      return {
        group: g, membrane, core, rim, label,
        memWobble: wobbleBase(membraneGeo),
        rimWobble: wobbleBase(rimGeo),
        phase: Math.random() * Math.PI * 2,
        yaw: g.rotation.y,
        wall, wallWidth: spanLen, wallHeight: height,
        armed: false // arms once the player is seen WALL_ARM_DEPTH inside
      };
    }

    // ---------------------------------------------------------------------
    // Ground sampling: highest mesh surface at (x,z) not above refY + cap.
    // ---------------------------------------------------------------------
    function sampleGround(rec, x, z, originLift, cap) {
      raycaster.set(new THREE.Vector3(x, originLift, z), DOWN);
      raycaster.far = 300;
      const hits = raycaster.intersectObjects(rec.meshes, false);
      for (const h of hits) {
        if (cap !== Infinity && h.point.y > cap) continue;
        return h.point.y;
      }
      return null;
    }

    // ---------------------------------------------------------------------
    // Player + input
    // ---------------------------------------------------------------------
    const player = { x: 0, z: 0, groundY: 0, yaw: 0, pitch: 0 };
    const keys = new Set();
    let current = null;
    let transition = null;
    let lastTransitionMs = 0;
    let lastTransitionPeakFov = BASE_FOV;
    let lastTransitionFrames = 0;

    const MOVE_KEYS = ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
    window.addEventListener("keydown", e => {
      if (MOVE_KEYS.includes(e.code)) { keys.add(e.code); e.preventDefault(); }
      if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.add("Shift");
      if (e.code === "KeyP") togglePhoto();
      if (e.code === "KeyJ") toggleJournal();
      if (e.code === "Enter" && document.body.classList.contains("photo")) snap();
      if (e.code === "Escape") {
        document.body.classList.remove("photo");
        journalPanel.classList.remove("open");
        el("journalBtn").classList.remove("on");
      }
    });
    window.addEventListener("keyup", e => {
      keys.delete(e.code);
      if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.delete("Shift");
    });
    window.addEventListener("blur", () => keys.clear());

    // Drag look (mouse, or touch on the right half) + floating joystick
    // (touch on the left half).
    let lookPointer = null, joyPointer = null;
    const joyVec = { x: 0, y: 0 };
    const joyOrigin = { x: 0, y: 0 };

    const cvs = renderer.domElement;
    cvs.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch" && e.clientX < window.innerWidth / 2 && joyPointer === null) {
        joyPointer = e.pointerId;
        joyOrigin.x = e.clientX; joyOrigin.y = e.clientY;
        joyEl.style.display = "block";
        joyEl.style.left = e.clientX + "px";
        joyEl.style.top = e.clientY + "px";
        joyNub.style.transform = "translate(-50%,-50%)";
      } else if (lookPointer === null) {
        lookPointer = e.pointerId;
        cvs.setPointerCapture(e.pointerId);
      }
    });
    cvs.addEventListener("pointermove", e => {
      if (e.pointerId === lookPointer) {
        player.yaw -= e.movementX * 0.0042;
        player.pitch = THREE.MathUtils.clamp(player.pitch - e.movementY * 0.0042, -1.25, 1.25);
      } else if (e.pointerId === joyPointer) {
        const dx = e.clientX - joyOrigin.x, dy = e.clientY - joyOrigin.y;
        const len = Math.hypot(dx, dy), max = 48;
        const s = len > max ? max / len : 1;
        joyVec.x = (dx * s) / max; joyVec.y = (dy * s) / max;
        joyNub.style.transform = `translate(calc(-50% + ${dx * s}px), calc(-50% + ${dy * s}px))`;
      }
    });
    function endPointer(e) {
      if (e.pointerId === lookPointer) lookPointer = null;
      if (e.pointerId === joyPointer) {
        joyPointer = null; joyVec.x = 0; joyVec.y = 0;
        joyEl.style.display = "none";
      }
    }
    cvs.addEventListener("pointerup", endPointer);
    cvs.addEventListener("pointercancel", endPointer);

    function inputVector() {
      let f = 0, s = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) f -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) s += 1;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) s -= 1;
      f += -joyVec.y; s += joyVec.x;
      const len = Math.hypot(f, s);
      if (len > 1) { f /= len; s /= len; }
      return { f, s };
    }

    // ---------------------------------------------------------------------
    // Title card / env
    // ---------------------------------------------------------------------
    let titleTimer = 0;
    function showTitle(def) {
      tcNum.textContent = "#" + def.id;
      tcTitle.textContent = def.title;
      tcSub.textContent = `${def.sub} · ${def.system}`;
      tcWhisper.textContent = current && current.inst.relic
        ? (relicFound(def.id) ? "✦ Relic found" : "✧ A relic is hidden here")
        : "";
      stIdx.textContent = `#${def.id} / ${defs.length}`;
      stName.textContent = def.title;
      titlecard.classList.add("show");
      clearTimeout(titleTimer);
      titleTimer = setTimeout(() => titlecard.classList.remove("show"), 2600);
    }

    function applyEnv(env) {
      scene.background = new THREE.Color(env.background);
      scene.fog.color.setHex(env.fogColor);
      scene.fog.density = env.fogDensity;
    }

    // ---------------------------------------------------------------------
    // World switching + the time-bend transition
    // ---------------------------------------------------------------------
    function setCurrent(rec, spawnOverride) {
      if (current) current.group.visible = false;
      current = rec;
      rec.group.visible = true;
      if (rec.relicProp) rec.relicProp.group.visible = !relicFound(rec.id);
      glitchVisitReset();
      applyEnv(rec.inst.env);
      if (spawnOverride) {
        player.x = spawnOverride.x; player.z = spawnOverride.z;
        if (spawnOverride.yaw !== undefined) player.yaw = spawnOverride.yaw;
        player.pitch = 0;
        // Diorama spawns/anchors can land outside the world's own bounds
        // (the converter's target±14 formula knows nothing of them); a
        // player outside the bounds can never arm or cross that wall's
        // passage, so every entry is clamped just inside the walls.
        const b = rec.bounds || worldBounds(rec);
        if (b) {
          if (b.max.x - b.min.x > 3) player.x = THREE.MathUtils.clamp(player.x, b.min.x + 1.2, b.max.x - 1.2);
          if (b.max.z - b.min.z > 3) player.z = THREE.MathUtils.clamp(player.z, b.min.z + 1.2, b.max.z - 1.2);
        }
        const gy = sampleGround(rec, player.x, player.z, 40, 15);
        player.groundY = gy === null ? 0 : gy;
      }
      // Lane A: every entry (boot, rift swap, travel, ring rebuild) marks
      // the world visited, refreshes the star, and snapshots the position —
      // this one hook is what "save on portal crossing" hangs off.
      markVisited(rec.id);
      refreshStar();
      snapshotSave();
      showTitle(rec.def);
      sweepLoaded();
    }

    async function beginTransition(portal) {
      if (transition || !current) return;
      const dest = await ensureLoaded(portal.destId);
      if (transition) return;
      transition = {
        start: performance.now(), side: portal.side, wallName: portal.wallName || null, dest,
        fromId: current.id, swapped: false,
        t: 0, x: 0, frames: 0, peakFov: BASE_FOV
      };
      const c = new THREE.Color(dest.inst.env.fogColor);
      flashEl.style.setProperty("--flash", `#${c.getHexString()}`);
    }

    function doSwap() {
      const { side, wallName, dest } = transition;
      if (wallName) {
        const arrivalWall = OPP_WALL[wallName];
        const db = worldBounds(dest);
        const anchor = db ? anchorForWall(dest.inst, db, arrivalWall) : dest.inst.doors.next;
        const cx = db ? (db.min.x + db.max.x) / 2 : 0;
        const cz = db ? (db.min.z + db.max.z) / 2 : 0;
        const adx = cx - anchor.x, adz = cz - anchor.z;
        const adl = Math.hypot(adx, adz) || 1;
        const ain = { x: adx / adl, z: adz / adl };
        setCurrent(dest, {
          x: anchor.x + ain.x * 2.6,
          z: anchor.z + ain.z * 2.6,
          yaw: Math.atan2(-ain.x, -ain.z)
        });
        const arrivalPortal = dest.portals.find(p => p.wallName === arrivalWall);
        if (arrivalPortal) arrivalPortal.armed = false;
        transition.swapped = true;
        return;
      }
      const arrivalDoor = side === "next" ? dest.inst.doors.prev : dest.inst.doors.next;
      // Arrive just inside the new world, facing its heart.
      const dx = 0 - arrivalDoor.x, dz = 0 - arrivalDoor.z;
      const dl = Math.hypot(dx, dz) || 1;
      const inward = { x: dx / dl, z: dz / dl };
      const yaw = Math.atan2(-inward.x, -inward.z);
      setCurrent(dest, {
        x: arrivalDoor.x + inward.x * 2.6,
        z: arrivalDoor.z + inward.z * 2.6,
        yaw
      });
      // The rift we just stepped out of stays inert until we walk away.
      const arrivalPortal = dest.portals.find(p => (side === "next" ? p.side === "prev" : p.side === "next"));
      if (arrivalPortal) arrivalPortal.armed = false;
      transition.swapped = true;
    }

    function bendTimeScale(x, now) {
      // Slow/stutter while the rift tears, easing back to normal.
      if (x < SWAP_AT) return Math.floor(now / 70) % 2 === 0 ? 0.06 : 0.3;
      return 0.55;
    }

    // ---------------------------------------------------------------------
    // THE GLITCH — one entity for the whole walk, walker-owned.
    // PURE 3D GEOMETRY ONLY (same discipline as the relic: no sprites, no
    // textured planes or billboards — the body is boxes, the eyes are two
    // tiny emissive spheres). Near-black primitives read as a silhouette
    // in every world.
    //
    // THE RULE (Cherie's mechanic): while it is OBSERVED — inside the
    // camera frustum AND within 70 units — it NEVER moves, not a
    // millimeter. When the player looks away and sees it again, it has
    // silently halved the distance: 40 → 20 → 10 → 5 … If a halving would
    // take it inside 2.4 units, it instead waits at 2.4 for one frozen
    // observed beat — and the next time it leaves the frustum it is GONE
    // in a glitch-burst. It also dissolves if stared at continuously for
    // 6 s (nerve rewarded). It never touches the player, and crossing a
    // rift ends any encounter.
    //
    // SCHEDULE — it does NOT haunt every room. A room-visit counter ticks
    // on every world entry (boot or rift). At walk start, and again after
    // each finished encounter, the next haunting is rolled uniformly from
    // {3, 4, 5}: the Glitch can only materialize in the room whose visit
    // number matches the roll, and there only 30–60 s into that visit
    // (never in a visit's first 20 s). Every other room: nothing, ever.
    // ---------------------------------------------------------------------
    const GLITCH_SPAWN_MIN = 30, GLITCH_SPAWN_MAX = 60; // s into the haunted room
    const GLITCH_OBSERVE_DIST = 70;
    const GLITCH_FINAL_DIST = 2.4;
    const GLITCH_STARE_LIMIT = 6;
    const HAUNT_GAP = () => 3 + Math.floor(Math.random() * 3); // uniform {3,4,5}

    const glitch = {
      group: null, mats: [],
      active: false, state: "idle", // idle | approach | finale | fading
      observed: false,
      encounters: 0, burstFired: 0, lastBurstAt: 0, burstUntil: 0,
      visits: 0,                                    // room entries so far
      hauntVisit: 3 + Math.floor(Math.random() * 3), // rolled at walk start
      visitTime: 0, spawnDelay: 45, spawnedThisVisit: false,
      wasObserved: false, unobservedTime: 0, stareTime: 0, fadeT: 0
    };

    function makeGlitch() {
      const g = new THREE.Group();
      const bodyMat = new THREE.MeshBasicMaterial({ color: 0x060607 });
      const limbMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0d });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xd6dcea });
      const add = (geo, mat, x, y, z) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        g.add(m);
        return m;
      };
      // Legs — too long.
      add(new THREE.BoxGeometry(0.15, 1.45, 0.15), limbMat, -0.14, 0.725, 0);
      add(new THREE.BoxGeometry(0.15, 1.45, 0.15), limbMat, 0.14, 0.725, 0);
      // Torso — stretched.
      add(new THREE.BoxGeometry(0.52, 1.1, 0.24), bodyMat, 0, 2.0, 0);
      // Arms — hanging past the knees; the left one is longer. Wrong.
      const armL = add(new THREE.BoxGeometry(0.11, 1.6, 0.11), limbMat, -0.37, 1.72, 0);
      armL.rotation.z = 0.05;
      const armR = add(new THREE.BoxGeometry(0.11, 1.38, 0.11), limbMat, 0.37, 1.83, 0);
      armR.rotation.z = -0.05;
      // Head — tall, tilted a few degrees off true.
      const head = new THREE.Group();
      head.position.y = 2.55;
      head.rotation.z = 0.07;
      g.add(head);
      const skull = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.55, 0.3), bodyMat);
      skull.position.y = 0.28;
      head.add(skull);
      // Eyes — geometry only: two faint pale spheres.
      for (const s of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeMat);
        eye.position.set(s * 0.08, 0.34, 0.16);
        head.add(eye);
      }
      g.userData.mats = [bodyMat, limbMat, eyeMat];
      return g;
    }

    function glitchFacePlayer() {
      if (!glitch.group) return;
      glitch.group.lookAt(player.x, glitch.group.position.y, player.z);
    }

    function glitchGroundY(x, z) {
      if (!current) return player.groundY;
      const gy = sampleGround(current, x, z, 40, 15);
      return gy === null ? player.groundY : gy;
    }

    function spawnGlitch(dist = 40, exact = false) {
      if (!current) return;
      if (!glitch.group) { glitch.group = makeGlitch(); glitch.mats = glitch.group.userData.mats; }
      if (!glitch.group.parent) scene.add(glitch.group);
      const jitter = exact ? 0 : (Math.random() - 0.5) * 0.6;
      const ang = player.yaw + jitter;
      const fx = -Math.sin(ang), fz = -Math.cos(ang); // forward for yaw (0 faces -Z)
      const x = player.x + fx * dist, z = player.z + fz * dist;
      glitch.group.position.set(x, glitchGroundY(x, z), z);
      for (const m of glitch.mats) { m.transparent = false; m.opacity = 1; }
      glitch.group.visible = true;
      glitchFacePlayer();
      glitch.active = true;
      glitch.state = "approach";
      glitch.wasObserved = false;
      glitch.observed = false;
      glitch.unobservedTime = 0;
      glitch.stareTime = 0;
      glitch.fadeT = 0;
      glitch.encounters++;
    }

    function endGlitch() {
      glitch.active = false;
      glitch.state = "idle";
      glitch.observed = false;
      glitch.wasObserved = false;
      if (glitch.group) glitch.group.visible = false;
    }

    // Roll the next haunting: 3–5 room entries after the current one.
    function scheduleNextHaunt() {
      glitch.hauntVisit = glitch.visits + HAUNT_GAP();
    }

    function glitchBurst() {
      glitch.burstFired++;
      glitch.lastBurstAt = performance.now();
      glitch.burstUntil = glitch.lastBurstAt + 150;
    }

    // One look-away cycle: silently halve the distance to the player — or,
    // from the finale distance, vanish in a burst.
    function glitchRelocate() {
      if (!glitch.active || !glitch.group || glitch.state === "fading") return;
      const p = glitch.group.position;
      const dx = p.x - player.x, dz = p.z - player.z;
      const dist = Math.hypot(dx, dz);
      if (glitch.state === "finale" || dist === 0) {
        endGlitch();
        glitchBurst();
        scheduleNextHaunt();
        return;
      }
      if (dist / 2 < GLITCH_FINAL_DIST) {
        const s = GLITCH_FINAL_DIST / dist;
        p.set(player.x + dx * s, 0, player.z + dz * s);
        glitch.state = "finale";
      } else {
        p.set((p.x + player.x) / 2, 0, (p.z + player.z) / 2);
      }
      p.y = glitchGroundY(p.x, p.z);
      glitchFacePlayer();
      glitch.wasObserved = false;
      glitch.unobservedTime = 0;
    }

    // Called on every world entry (boot or rift): the room-visit counter
    // ticks, any live encounter ends, and the in-room clock restarts.
    function glitchVisitReset() {
      const fledEncounter = glitch.active;
      if (glitch.active) endGlitch();
      glitch.visits++;
      glitch.visitTime = 0;
      glitch.spawnedThisVisit = false;
      glitch.stareTime = 0;
      glitch.unobservedTime = 0;
      glitch.wasObserved = false;
      glitch.observed = false;
      // Fleeing an encounter counts as finishing it; rushing through the
      // haunted room before it materialized spends the haunting too.
      // Either way the next one is rolled 3–5 rooms out.
      if (fledEncounter || glitch.visits > glitch.hauntVisit) scheduleNextHaunt();
      // If THIS room is the haunted one, roll when it will materialize:
      // 30–60 s in (which also honors "never in the first 20 s").
      glitch.spawnDelay = GLITCH_SPAWN_MIN + Math.random() * (GLITCH_SPAWN_MAX - GLITCH_SPAWN_MIN);
    }

    const _glitchFrustum = new THREE.Frustum();
    const _glitchMat4 = new THREE.Matrix4();
    const _glitchPoint = new THREE.Vector3();

    // Runs once per frame after the camera is placed.
    function updateGlitch(dt) {
      // Spawn scheduling — ONLY in the haunted room (this visit's number
      // matches the roll), and only 30–60 s into that visit.
      if (!glitch.active && !glitch.spawnedThisVisit && current &&
          glitch.visits === glitch.hauntVisit) {
        glitch.visitTime += dt;
        if (glitch.visitTime >= glitch.spawnDelay) {
          glitch.spawnedThisVisit = true;
          spawnGlitch(35 + Math.random() * 10);
        }
      }
      if (!glitch.active || !glitch.group) { glitch.observed = false; return; }

      // Observed = inside the camera frustum AND within 70 units.
      const p = glitch.group.position;
      const dist = Math.hypot(player.x - p.x, player.z - p.z);
      camera.updateMatrixWorld();
      _glitchMat4.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      _glitchFrustum.setFromProjectionMatrix(_glitchMat4);
      _glitchPoint.set(p.x, p.y + 1.7, p.z);
      glitch.observed = dist <= GLITCH_OBSERVE_DIST && _glitchFrustum.containsPoint(_glitchPoint);

      if (glitch.state === "fading") {
        glitch.fadeT += dt;
        const o = Math.max(0, 1 - glitch.fadeT / 0.45);
        for (const m of glitch.mats) m.opacity = o;
        if (glitch.fadeT >= 0.45) { endGlitch(); scheduleNextHaunt(); }
        return;
      }

      if (glitch.observed) {
        // Observed: it NEVER moves. Only the stare clock runs.
        glitch.wasObserved = true;
        glitch.unobservedTime = 0;
        glitch.stareTime += dt;
        if (glitch.stareTime >= GLITCH_STARE_LIMIT) {
          // Nerve rewarded: a continuous 6 s stare dissolves it.
          glitch.state = "fading";
          glitch.fadeT = 0;
          for (const m of glitch.mats) m.transparent = true;
        }
      } else {
        glitch.stareTime = 0;
        if (glitch.wasObserved) {
          glitch.unobservedTime += dt;
          // It left the frustum after being seen: by the time it is seen
          // again it will be half as far away.
          if (glitch.unobservedTime > 0.03) glitchRelocate();
        }
      }
    }

    // ---------------------------------------------------------------------
    // Photo mode + snapshot
    // ---------------------------------------------------------------------
    function togglePhoto() {
      document.body.classList.toggle("photo");
      el("photoBtn").classList.toggle("on", document.body.classList.contains("photo"));
    }
    el("photoBtn").addEventListener("click", togglePhoto);

    function snap() {
      if (!current) return;
      renderer.render(scene, camera);
      const def = current.def;
      const name = `world-${def.id}-${def.title.toLowerCase().replace(/[^a-z0-9]+/g, "-")}.png`;
      renderer.domElement.toBlob(blob => {
        if (!blob) return;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, "image/png");
    }
    el("snapBtn").addEventListener("click", snap);

    // ---------------------------------------------------------------------
    // Relic pickup + hot/cold signal (visual only — the walker has no
    // audio system and none is added for this)
    // ---------------------------------------------------------------------
    let signalPhase = 0;

    function collectRelic() {
      const r = current.inst.relic;
      if (!save.relics.includes(current.id)) save.relics.push(current.id);
      save.relicMeta[current.id] = { name: r.name, at: Date.now() };
      journalSave();
      if (current.relicProp) current.relicProp.group.visible = false;
      updateRelicCounter();
      if (journalPanel.classList.contains("open")) renderJournal();
      // Pickup flash — a gold pulse over the rift-flash layer.
      flashEl.style.setProperty("--flash", "#f3b744");
      flashEl.style.transition = "none";
      flashEl.style.opacity = "0.8";
      requestAnimationFrame(() => {
        flashEl.style.transition = "opacity .55s ease";
        flashEl.style.opacity = "0";
      });
    }

    function updateRelicSignal(dt) {
      const has = current && current.inst.relic && !relicFound(current.id);
      if (!has) {
        signalRow.classList.add("found");
        signalText.textContent = current && current.inst.relic ? "Relic found" : "No relic here";
        signalDot.style.opacity = "0.3";
        signalDot.style.transform = "scale(0.75)";
        return;
      }
      signalRow.classList.remove("found");
      signalText.textContent = "Relic signal";
      const r = current.inst.relic;
      const d = Math.hypot(player.x - r.x, player.z - r.z);
      if (d < 1.6) { collectRelic(); return; }
      // Pulse rate climbs steeply inside ~45 units: hot/cold.
      const prox = THREE.MathUtils.clamp(1 - d / 45, 0, 1);
      signalPhase += dt * (0.7 + prox * prox * 5.5);
      const pulse = 0.5 + 0.5 * Math.sin(signalPhase * Math.PI * 2);
      signalDot.style.opacity = String(0.3 + 0.7 * pulse);
      signalDot.style.transform = `scale(${0.75 + (0.35 + prox * 0.65) * pulse})`;
    }

    // ---------------------------------------------------------------------
    // Main loop
    // ---------------------------------------------------------------------
    const clock = new THREE.Clock();
    let elapsed = 0;
    let preloadTimer = 0;
    let saveTimer = 0;
    const lastSnap = { x: Infinity, z: Infinity, yaw: Infinity };
    let burstWasActive = false;
    let burstSkipFrame = false;

    function tick() {
      requestAnimationFrame(tick);
      const rawDelta = clock.getDelta();
      const dt = Math.min(rawDelta, 0.05);
      const now = performance.now();
      elapsed += dt;

      if (!current) { renderer.render(scene, camera); return; }

      // --- saved state: snapshot ~every 5 s, only when actually moved ---
      saveTimer -= dt;
      if (saveTimer <= 0) {
        saveTimer = 5;
        if (Math.abs(player.x - lastSnap.x) > 0.05 ||
            Math.abs(player.z - lastSnap.z) > 0.05 ||
            Math.abs(player.yaw - lastSnap.yaw) > 0.01) {
          lastSnap.x = player.x; lastSnap.z = player.z; lastSnap.yaw = player.yaw;
          snapshotSave();
        }
      }

      // --- transition state (time-bend) ---
      // Progress accumulates frame time, so the bend lasts ~0.6s of screen
      // time even when frames are slow (it never stretches into seconds).
      let worldDt = dt, ts = 1;
      if (transition) {
        // The bend clock runs on game-time: each frame contributes at most
        // 100ms, the same convention as the world-update dt clamp (50ms).
        // On a slow renderer the effect simply spans more presented frames
        // (see the 0.22/frame progress clamp below) instead of reporting a
        // multi-second "duration" for a 0.6s game-time effect.
        transition.t += Math.min(rawDelta, 0.1);
        transition.frames++;
        // Progress follows accumulated time, but a single frame may advance
        // it by at most 0.22 — the bend always spans several presented
        // frames, so the FOV punch and flash stay visible even when frames
        // are slow (on a 60fps display the time term dominates anyway).
        const xTime = transition.t / (BEND_MS / 1000);
        transition.x = Math.min(xTime, transition.x + 0.22);
        const x = transition.x;
        ts = bendTimeScale(Math.min(x, 1), now);
        worldDt = dt * ts;
        const punch = Math.sin(Math.PI * Math.min(x * 1.12, 1));
        camera.fov = BASE_FOV + 20 * punch;
        if (camera.fov > transition.peakFov) transition.peakFov = camera.fov;
        camera.updateProjectionMatrix();
        flashEl.style.opacity = String(Math.pow(Math.sin(Math.PI * Math.min(x, 1)), 2) * 0.85);
        cvs.style.filter = `saturate(${1 + 0.5 * punch}) hue-rotate(${10 * punch}deg)`;
        if (x >= SWAP_AT && !transition.swapped) doSwap();
        if (x >= 1) {
          lastTransitionMs = transition.t * 1000;
          lastTransitionPeakFov = transition.peakFov;
          lastTransitionFrames = transition.frames;
          transition = null;
          camera.fov = BASE_FOV;
          camera.updateProjectionMatrix();
          flashEl.style.opacity = "0";
          cvs.style.filter = "";
        }
      }

      if (!transition && pendingRingRebuild) {
        pendingRingRebuild = false;
        applyRingChange();
      }

      // --- current world ambient animation ---
      current.t += worldDt;
      current.inst.update(current.t, worldDt);

      // --- rift animation: wobble, shimmer, gentle Y billboard ---
      for (const p of current.portals) {
        if (p.wall) {
          // Wall membranes are fixed skins: no wobble, no billboard —
          // just a breathing shimmer on the membrane itself.
          p.membrane.material.opacity = 0.44 + 0.08 * Math.sin(elapsed * 2.2 + p.phase);
          continue;
        }
        applyWobble(p.membrane.geometry, p.memWobble, elapsed, p.phase, 0.05);
        applyWobble(p.rim.geometry, p.rimWobble, elapsed, p.phase + 0.7, 0.07);
        p.core.scale.set(RIFT_W / 2 * (1 + 0.08 * Math.sin(elapsed * 3.1 + p.phase)),
                         RIFT_H / 2 * (1 + 0.08 * Math.sin(elapsed * 3.1 + p.phase)), 1);
        p.label.position.y = RIFT_H + 0.85 + Math.sin(elapsed * 1.6 + p.phase) * 0.09;
        const targetYaw = Math.atan2(player.x - p.group.position.x, player.z - p.group.position.z);
        let dy = targetYaw - p.yaw;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        p.yaw += dy * Math.min(1, dt * 3.5);
        p.group.rotation.y = p.yaw;
      }

      // --- relic prop animation (current world only) ---
      if (current.relicProp && current.relicProp.group.visible) {
        const rp = current.relicProp;
        rp.core.rotation.y += worldDt * 1.4;
        rp.core.rotation.x += worldDt * 0.5;
        rp.ringA.rotation.z += worldDt * 0.9;
        rp.ringA.rotation.x = Math.sin(elapsed * 0.7) * 0.5;
        rp.ringB.rotation.y += worldDt * 0.7;
        rp.ringB.rotation.z = Math.cos(elapsed * 0.6) * 0.4;
        rp.group.position.y = current.relicGroundY + 1.05 + Math.sin(elapsed * 1.8) * 0.14;
        rp.light.intensity = 6.5 + Math.sin(elapsed * 2.6) * 2.2;
      }

      // --- fog drift (env may be mutated by the world's update) ---
      scene.fog.density = current.inst.env.fogDensity;

      if (!transition) {
        // --- movement ---
        const { f, s } = inputVector();
        const speed = keys.has("Shift") ? RUN_SPEED : WALK_SPEED;
        const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
        // forward = (-sin yaw, -cos yaw); right = (cos yaw, -sin yaw)
        player.x += ((-sin) * f + cos * s) * speed * dt;
        player.z += ((-cos) * f + (-sin) * s) * speed * dt;

        // --- ground following ---
        raycaster.set(new THREE.Vector3(player.x, player.groundY + EYE + 3, player.z), DOWN);
        raycaster.far = 60;
        const hits = raycaster.intersectObjects(current.meshes, false);
        for (const h of hits) {
          if (h.point.y > player.groundY + 1.1) continue;
          if (h.point.y < player.groundY - 30) continue;
          player.groundY += (h.point.y - player.groundY) * Math.min(1, dt * 14);
          break;
        }

        // --- portal arming, preload, triggers ---
        preloadTimer -= dt;
        for (const p of current.portals) {
          if (p.wall) {
            // Whole-wall passage: sd is the player's depth inside the
            // wall plane (positive = inside); travel fires on CROSSING
            // the plane (sd <= 0) anywhere within the wall's span.
            const w = p.wall;
            const coord = w.axis === "x" ? player.x : player.z;
            const along = w.axis === "x" ? player.z : player.x;
            const sd = w.sign * (coord - w.plane);
            const within = along >= w.a0 && along <= w.a1;
            if (!p.armed && sd > WALL_ARM_DEPTH) p.armed = true;
            if (p.armed && sd <= 0 && within) { beginTransition(p); break; }
            if (preloadTimer <= 0 && within && Math.abs(sd) < PRELOAD_DIST) ensureLoaded(p.destId);
            continue;
          }
          const d = Math.hypot(player.x - p.group.position.x, player.z - p.group.position.z);
          if (!p.armed && d > REARM_DIST) p.armed = true;
          if (p.armed && d < TRIGGER_DIST) { beginTransition(p); break; }
          if (preloadTimer <= 0 && d < PRELOAD_DIST) ensureLoaded(p.destId);
        }
        if (preloadTimer <= 0) preloadTimer = 0.15;

        // --- relic pickup + signal ---
        updateRelicSignal(dt);
      }

      camera.position.set(player.x, player.groundY + EYE, player.z);
      camera.rotation.set(player.pitch, player.yaw, 0);

      // --- the Glitch (never during a rift bend) ---
      if (!transition) updateGlitch(dt);

      // --- glitch-burst: 150 ms of invert/hue jolt, frame skips, FOV punch ---
      const inBurst = now < glitch.burstUntil;
      if (inBurst && !transition) {
        cvs.style.filter = `invert(0.85) hue-rotate(${Math.round(Math.sin(now * 0.11) * 50)}deg) saturate(1.7)`;
        if (Math.abs(camera.fov - (BASE_FOV + 3)) > 0.01) {
          camera.fov = BASE_FOV + 3;
          camera.updateProjectionMatrix();
        }
        burstWasActive = true;
        burstSkipFrame = !burstSkipFrame;
        if (burstSkipFrame) return; // dropped frame
      } else if (burstWasActive) {
        burstWasActive = false;
        if (!transition) {
          cvs.style.filter = "";
          if (camera.fov !== BASE_FOV) {
            camera.fov = BASE_FOV;
            camera.updateProjectionMatrix();
          }
        }
      }

      renderer.render(scene, camera);
    }

    // ---------------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------------
    (async function boot() {
      defs = await (await fetch("worlds.json")).json();
      // Ring order = manifest order sorted by numeric id — no world list is
      // hardcoded anywhere in this host; the manifest is the only source.
      defs.sort((a, b) => (parseInt(a.id, 10) || 0) - (parseInt(b.id, 10) || 0));
      defs.forEach(d => defById.set(d.id, d));
      updateRelicCounter();
      // Ring before any world is built: portal destinations bake at build
      // time, so the active route must be settled first (Lane A).
      ringIds = computeRing();
      // Resume (Lane A): return to the saved world when it still exists.
      // The exact spot is restored only if the ground is still there and
      // within ±4 units of the saved height — worlds get regenerated, and
      // a stale save falls back to the world's normal spawn with relics,
      // visited and favorites intact. A stale save never soft-locks.
      let startId = defs[0].id;
      let spawnOverride = null;
      if (save.world && defById.has(save.world)) {
        startId = save.world;
        if (Array.isArray(save.pos)) {
          const sx = save.pos[0], sy = save.pos[1], sz = save.pos[2];
          if (Number.isFinite(sx) && Number.isFinite(sz)) {
            const probe = await ensureLoaded(startId);
            const gy = sampleGround(probe, sx, sz, 40, 15);
            if (gy !== null && (!Number.isFinite(sy) || Math.abs(gy - sy) <= 4)) {
              spawnOverride = { x: sx, z: sz, yaw: Number.isFinite(save.yaw) ? save.yaw : 0 };
            }
          }
        }
      }
      const first = await ensureLoaded(startId);
      setCurrent(first, spawnOverride || { ...first.inst.spawn });
      // Preload both neighbours so the first crossings are instant.
      preloadNeighbors(first.id);
      el("loading").classList.add("done");
      tick();
    })().catch(err => {
      console.error("Back Roms failed to boot:", err);
      el("loading").firstElementChild.style.display = "none";
      el("loading").lastElementChild.textContent = "Failed to load — " + err.message;
    });

    // Persist on the way out (Lane A): pagehide is the reliable mobile
    // signal; visibilitychange covers tab kills that never fire pagehide.
    window.addEventListener("pagehide", snapshotSave);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") snapshotSave();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    // ---------------------------------------------------------------------
    // BackRomsState — Lane B's (map) interface to this save (Lane A owns
    // the store; the map reads/writes through here, never around it).
    //   get()          -> deep copy of the v2 save (storage-synced first)
    //   set(patch)     -> merge durable fields (favorites, visited, routes,
    //                     activeRoute) and persist; returns a Promise that
    //                     resolves after any ring rebuild. world/pos/yaw/
    //                     relics are walker-owned and ignored in patches.
    //   travelTo(id)   -> jump the player to a world now, arriving at its
    //                     normal spawn; Promise<boolean> success.
    // activeRoute's primary form is an integer index into routes (or
    // null); a raw [ids] list is tolerated. A route change — including
    // editing the ACTIVE route's world list — rebuilds every built world
    // so baked portal destinations follow the new ring; if a rift bend is
    // in flight the rebuild is deferred to the first frame after it, and
    // routes written directly to storage by the map are adopted (and the
    // ring rebuilt) on the walker's next save sync.
    // ---------------------------------------------------------------------
    async function applyRingChange() {
      if (!defs.length) return;
      ringIds = computeRing();
      const curId = current ? current.id : null;
      for (const id of [...instances.keys()]) disposeWorld(id);
      const targetId = curId && defById.has(curId) ? curId
        : (ringIds && ringIds.length ? ringIds[0] : defs[0].id);
      const rec = await ensureLoaded(targetId);
      if (targetId === curId) {
        setCurrent(rec, { x: player.x, z: player.z, yaw: player.yaw });
      } else {
        setCurrent(rec, { ...rec.inst.spawn });
      }
      preloadNeighbors(targetId);
    }

    window.BackRomsState = {
      get() {
        syncFromStorage();
        return JSON.parse(JSON.stringify(save));
      },
      async set(patch) {
        if (!patch || typeof patch !== "object") return;
        if (Array.isArray(patch.favorites)) {
          save.favorites = patch.favorites.filter(x => typeof x === "string");
        }
        if (Array.isArray(patch.visited)) {
          save.visited = patch.visited.filter(x => typeof x === "string");
        }
        if (Array.isArray(patch.routes)) save.routes = normalizeRoutes(patch.routes);
        if ("activeRoute" in patch) save.activeRoute = normalizeActiveRoute(patch.activeRoute);
        // Persist the patch BEFORE any storage sync, so the sync inside
        // later saveNow() calls can never stomp it with older stored data.
        persistSave(null);
        refreshStar();
        if (defs.length) {
          const eff = JSON.stringify(computeRing() || defs.map(d => d.id));
          if (eff !== JSON.stringify(ringOrder())) {
            if (transition) pendingRingRebuild = true;
            else await applyRingChange();
          }
        }
      },
      async travelTo(id) {
        if (!defById.has(id) || transition) return false;
