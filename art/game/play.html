        if (current && current.id === id) return true;
        const rec = await ensureLoaded(id);
        if (transition) return false;
        setCurrent(rec, { ...rec.inst.spawn });
        preloadNeighbors(id);
        return true;
      }
    };

    // Lane B (map overlay) host wiring: a map tap on a visited world
    // rifts the player there via the walker's own travelTo. BackRomsMap
    // reads onTravel at tap time; mapview.js loads at end of body.
    if (window.BackRomsMap) {
      window.BackRomsMap.onTravel = (id) => { window.BackRomsState.travelTo(id); };
    }

    // ---------------------------------------------------------------------
    // Test hooks
    // ---------------------------------------------------------------------
    window.__walker = {
      get currentId() { return current ? current.id : null; },
      loadedIds() { return [...instances.keys()]; },
      get disposeCount() { return disposeCount; },
      get lastTransitionMs() { return lastTransitionMs; },
      get lastTransitionPeakFov() { return lastTransitionPeakFov; },
      get lastTransitionFrames() { return lastTransitionFrames; },
      get transitioning() { return !!transition; },
      fov() { return camera.fov; },
      player() { return { x: player.x, z: player.z, groundY: player.groundY, yaw: player.yaw, pitch: player.pitch }; },
      doors() {
        if (!current) return null;
        const d = current.inst.doors;
        const out = {};
        for (const k of ["next", "prev", "east", "west"]) if (d[k]) out[k] = { ...d[k] };
        return out;
      },
      grid() {
        if (!current) return null;
        return { E: gridNeighbor(current.id, "E"), W: gridNeighbor(current.id, "W"),
                 N: gridNeighbor(current.id, "N"), S: gridNeighbor(current.id, "S") };
      },
      teleport(x, z) { player.x = x; player.z = z; },
      portalInfo() {
        if (!current) return [];
        return current.portals.map(p => ({
          side: p.side, dest: p.destId, shape: p.wall ? "wall" : "oval",
          width: p.wall ? p.wallWidth : RIFT_W, height: p.wall ? p.wallHeight : RIFT_H,
          tint: "#" + p.membrane.material.color.getHexString()
        }));
      },
      relicInfo() {
        if (!current || !current.inst.relic) return null;
        const r = current.inst.relic;
        return {
          id: current.id, name: r.name, x: r.x, z: r.z,
          found: relicFound(current.id),
          distance: Math.hypot(player.x - r.x, player.z - r.z),
          propVisible: current.relicProp ? current.relicProp.group.visible : false,
          propPos: current.relicProp
            ? { x: current.relicProp.group.position.x, y: current.relicProp.group.position.y, z: current.relicProp.group.position.z }
            : null
        };
      },
      relicCount() { return { found: foundCount(), total: defs.length }; },
      // Legacy v1-shaped view (existing tests/tools): found relics only.
      journal() {
        const out = {};
        for (const id of save.relics) {
          const m = save.relicMeta[id] || {};
          out[id] = { found: true, name: m.name || "Relic", at: m.at || 0 };
        }
        return out;
      },
      save() { return JSON.parse(JSON.stringify(save)); },
      ring() { return ringOrder().slice(); },
      setYaw(yaw) { player.yaw = yaw; }
    };

    // ---------------------------------------------------------------------
    // Glitch test hooks
    // ---------------------------------------------------------------------
    window.__glitch = {
      get active() { return glitch.active; },
      get state() { return glitch.state; },
      get observed() { return glitch.observed; },
      get encounters() { return glitch.encounters; },
      get burstFired() { return glitch.burstFired; },
      get lastBurstAt() { return glitch.lastBurstAt; },
      // Haunting schedule: room entries so far, and how many more room
      // entries until the haunted room (0 = THIS room is the haunted one).
      get visits() { return glitch.visits; },
      get roomsUntil() { return glitch.hauntVisit - glitch.visits; },
      get nextHauntIn() { return glitch.hauntVisit - glitch.visits; },
      get hauntedNow() { return glitch.visits === glitch.hauntVisit; },
      get timeInRoom() { return glitch.visitTime; },
      // Test-only: force the roll — the haunted room becomes the one
      // reached after n more room entries (0 = the current room).
      forceRoomsUntil(n) {
        glitch.hauntVisit = glitch.visits + Math.max(0, Math.floor(Number(n) || 0));
        if (glitch.hauntVisit === glitch.visits) glitch.spawnedThisVisit = false;
      },
      // Test-only: fast-forward the in-room clock (the spawn check runs
      // against it exactly as if those seconds of frames had elapsed).
      debugAdvance(seconds) {
        glitch.visitTime += Math.max(0, Number(seconds) || 0);
        updateGlitch(0);
      },
      distance() {
        if (!glitch.active || !glitch.group) return -1;
        return Math.hypot(player.x - glitch.group.position.x, player.z - glitch.group.position.z);
      },
      position() {
        if (!glitch.active || !glitch.group) return null;
        const p = glitch.group.position;
        return { x: p.x, y: p.y, z: p.z };
      },
      forceSpawn(dist = 40) { spawnGlitch(dist, true); },
      forceLookCycle() { glitchRelocate(); }
    };
  </script>
</body>
</html>
