    function updateCamera() {
      const horizontal = Math.cos(controls.pitch) * controls.radius;
      camera.position.set(
        controls.target.x + Math.sin(controls.yaw) * horizontal,
        controls.target.y + Math.sin(controls.pitch) * controls.radius,
        controls.target.z + Math.cos(controls.yaw) * horizontal

      camera.lookAt(controls.target);

    function voxel(x, y, z, sx = 1, sy = 1, sz = 1, material, rotationY = 0) {
      dummy.position.set(x, y, z);
      dummy.rotation.y = rotationY;
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();

      if (!batches.has(material)) batches.set(material, []);
      batches.get(material).push(dummy.matrix.clone());
    }

    function flushVoxels() {
      for (const [material, matrices] of batches) {
        const mesh = new THREE.Mesh(
          new THREE.InstancedMesh(box, material, matrices.length),
          material

        matrices.forEach((matrix, i) => mesh.setMatrixAt(i, matrix));
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
