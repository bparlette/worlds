<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Interior</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111820;
      font-family: sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #info {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      padding: 12px 15px;
      color: #dce8ef;
      background: rgba(12, 19, 27, 0.72);
      border: 1px solid rgba(157, 201, 222, 0.24);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #info h1 {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    #info p {
      margin: 0;
      color: #8ca4b4;
      font-size: 12px;
    }

    #help {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 10;
      padding: 8px 11px;
      color: #b7c8d3;
      background: rgba(12, 19, 27, 0.65);
      border: 1px solid rgba(157, 201, 222, 0.18);
      border-radius: 6px;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>Voxel Interior</h1>
    <p>Procedural voxel diorama with instanced cube geometry.</p>
  </div>
  <div id="help">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    // -------------------------------------------------------------------------
    // Renderer and scene
    // -------------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17212b);
    scene.fog = new THREE.Fog(0x17212b, 18, 38);

    const camera = new THREE.PerspectiveCamera(
      43,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const hemi = new THREE.HemisphereLight(0xbad9e8, 0x26321f, 1.45);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1cf, 3.1);
    sun.position.set(7, 12, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -13;
    sun.shadow.camera.right = 13;
    sun.shadow.camera.top = 13;
    sun.shadow.camera.bottom = -13;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x78b9d6, 1.1);
    fill.position.set(-8, 5, -6);
    scene.add(fill);

    // -------------------------------------------------------------------------
    // Voxel helpers
    // -------------------------------------------------------------------------

    const V = 0.48;
    const cubeGeometry = new THREE.BoxGeometry(V, V, V);
    const tempObject = new THREE.Object3D();

    const materials = {
      darkMetal: new THREE.MeshStandardMaterial({
        color: 0x26343a,
        roughness: 0.82,
        metalness: 0.48
      }),
      greenMetal: new THREE.MeshStandardMaterial({
        color: 0x35544b,
        roughness: 0.76,
        metalness: 0.36
      }),
      paleMetal: new THREE.MeshStandardMaterial({
        color: 0x9bb0b3,
        roughness: 0.58,
        metalness: 0.48
      }),
      floor: new THREE.MeshStandardMaterial({
        color: 0x9a7145,
        roughness: 0.93
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x1f6d3b,
        roughness: 0.95
      }),
      moss: new THREE.MeshStandardMaterial({
        color: 0x327a42,
        roughness: 1
      }),
      rust: new THREE.MeshStandardMaterial({
        color: 0x98542d,
        roughness: 0.95
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x111719,
        roughness: 0.8
      })
    };

    function voxel(x, y, z, material, castShadow = true, receiveShadow = true) {
      const mesh = new THREE.Mesh(cubeGeometry, material);
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      scene.add(mesh);
      return mesh;
    }

    function voxelBatch(positions, material, castShadow = true) {
      const data = [];

      for (const p of positions) {
        data.push({
          x: p[0],
          y: p[1],
          z: p[2],
          sx: p[3] ?? V,
          sy: p[4] ?? V,
          sz: p[5] ?? V
        });
      }

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const mesh = new THREE.InstancedMesh(
        geometry,
        material,
        data.length
      );

      for (let i = 0; i < data.length; i++) {
        const d = data[i];

        tempObject.position.set(d.x, d.y, d.z);
        tempObject.scale.set(d.sx, d.sy, d.sz);
        tempObject.updateMatrix();

        mesh.setMatrixAt(i, tempObject.matrix);
      }

      mesh.instanceMatrix.needsUpdate = true;
      mesh.castShadow = castShadow;
      mesh.receiveShadow = true;
      scene.add(mesh);

      return mesh;
    }

    function horizontalLayer(y, positions, material) {
      return voxelBatch(
        positions.map(([x, z]) => [x, y, z]),
        material
      );
    }

    // -------------------------------------------------------------------------
    // Ground slab and lower floor
    // -------------------------------------------------------------------------

    voxelBatch(
      [
        [-7.2, -0.35, -7.2],
        [7.2, -0.35, -7.2],
        [-7.2, -0.35, 7.2],
        [7.2, -0.35, 7.2]

      materials.black

    const lowerFloorPositions = [

      [-7.2, 0.02, 7.2],
      [7.2, 0.02, 7.2]

    voxelBatch(

      materials.floor

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------

        [
          [x, 1.1, z],
          [x, 1.6, z]
        ],
        materials.paleMetal
      );

      voxelBatch(
        [
          [x, 2.3, z]
        ],
        materials.darkMetal
      );

      voxelBatch(
        [
          [x - 0.2, 1.35, z],
          [x + 0.2, 1.35, z]

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------

      [-6.7, 0.1, 3.7],
      [-6.7, 0.1, 4.2],
      [-6.7, 0.1, 4.7],
      [-6.7, 0.1, 5.2],
      [-6.7, 0.1, 5.7],
      [-6.7, 0.1, 6.2],
      [-6.7, 0.1, 6.7],
      [-6.7, 0.1, 7.2],
      [-5.2, 0.1, 2.7],
      [-4.7, 0.1, 2.7],
      [-4.2, 0.1, 2.7],
      [-3.7, 0.1, 2.7],
      [-3.2, 0.1, 2.7],
      [-2.7, 0.1, 2.7],
      [-2.2, 0.1, 2.7],
      [-1.7, 0.1, 2.7],
      [-1.2, 0.1, 2.7],
      [-0.7, 0.1, 2.7],
      [-0.2, 0.1, 2.7],
      [0.2, 0.1, 2.7],
      [0.7, 0.1, 2.7],
      [1.2, 0.1, 2.7],
      [1.7, 0.1, 2.7],
      [2.2, 0.1, 2.7],
      [2.7, 0.1, 2.7],
      [3.2, 0.1, 2.7],
      [3.7, 0.1, 2.7],
      [4.2, 0.1, 2.7],
      [4.7, 0.1, 2.7],
      [5.2, 0.1, 2.7],
      [5.7, 0.1, 2.7],
      [6.2, 0.1, 2.7],
      [6.7, 0.1, 2.7]
    ];

    horizontalLayer(0.12, mossPositions, materials.moss);

    // Darker green patches.
    const darkMossPositions = [
      [-6.7, 0.1, 2.2],
      [-6.7, 0.1, 2.7],
      [-6.7, 0.1, 3.2],
      [-6.7, 0.1, 3.7],
      [-6.7, 0.1, 4.2],
      [-6.7, 0.1, 4.7],
      [-6.7, 0.1, 5.2],
      [-6.7, 0.1, 5.7],
      [-6.7, 0.1, 6.2],
      [-6.7, 0.1, 6.7],
      [-6.7, 0.1, 7.2],
      [-5.2, 0.1, 2.2],
      [-4.7, 0.1, 2.2],
      [-4.2, 0.1, 2.2],
      [-3.7, 0.1, 2.2],
      [-3.2, 0.1, 2.2],
      [-2.7, 0.1, 2.2],
      [-2.2, 0.1, 2.2],
      [-1.7, 0.1, 2.2],
      [-1.2, 0.1, 2.2],
      [-0.7, 0.1, 2.2],
      [-0.2, 0.1, 2.2],
      [0.2, 0.1, 2.2],
      [0.7, 0.1, 2.2],
      [1.2, 0.1, 2.2],
      [1.7, 0.1, 2.2],
      [2.2, 0.1, 2.2],
      [2.7, 0.1, 2.2],
      [3.2, 0.1, 2.2],
      [3.7, 0.1, 2.2],
      [4.2, 0.1, 2.2],
      [4.7, 0.1, 2.2],
      [5.2, 0.1, 2.2],
      [5.7, 0.1, 2.2],
      [6.2, 0.1, 2.2],
      [6.7, 0.1, 2.2]
    ];

    horizontalLayer(0.13, darkMossPositions, materials.grass);

    // -------------------------------------------------------------------------
    // Decorative crates / boxes
    // -------------------------------------------------------------------------

    const cratePositions = [
      [-5.2, 0.45, -6.7],
      [-4.7, 0.45, -6.7],
      [-4.2, 0.45, -6.7],
      [4.7, 0.45, -6.7],
      [5.2, 0.45, -6.7],
      [5.7, 0.45, -6.7],
      [-6.7, 0.45, -5.2],
      [-6.7, 0.45, -5.7],
      [6.7, 0.45, -5.2],
      [6.7, 0.45, -5.7]
    ];

    for (const [x, y, z] of cratePositions) {
      voxelBatch(
        [
          [x, y, z]
        ],
        materials.rust
      );
    }

    // -------------------------------------------------------------------------
    // Ceiling lights
    // -------------------------------------------------------------------------

    const lightPositions = [
      [-3.7, 4.65, -3.7],
      [0, 4.65, -3.7],
      [3.7, 4.65, -3.7]
    ];

    for (const [x, y, z] of lightPositions) {
      voxelBatch(
        [
          [x, y, z]
        ],
        materials.paleMetal
      );

      const glow = new THREE.PointLight(0xffd58a, 1.3, 5.5, 2);
      glow.position.set(x, y - 0.15, z);
      scene.add(glow);
    }

    // -------------------------------------------------------------------------
    // Custom orbit camera controls
    // -------------------------------------------------------------------------

    let azimuth = 0.48;
    let polar = 1.24;
    let radius = 18.5;
    const target = new THREE.Vector3(0, 1.2, -0.8);

    function updateCamera() {
      const sinPolar = Math.sin(polar);

      camera.position.set(
        target.x + radius * sinPolar * Math.sin(azimuth),
        target.y + radius * Math.cos(polar),
        target.z + radius * sinPolar * Math.cos(azimuth)
      );

      camera.lookAt(target);
    }

    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      azimuth -= deltaX * 0.006;
      polar = THREE.MathUtils.clamp(
        polar + deltaY * 0.005,
        0.48,
        1.48
      );

      updateCamera();
    });

    function stopDragging(event) {
      dragging = false;
      if (event.pointerId !== undefined && renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", stopDragging);
    renderer.domElement.addEventListener("pointercancel", stopDragging);

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      radius = THREE.MathUtils.clamp(
        radius + event.deltaY * 0.012,
        10,
        28
      );
      updateCamera();
    }, { passive: false });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    updateCamera();

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      // Gentle light shimmer.
      for (let i = 0; i < lightPositions.length; i++) {
        const [x, y, z] = lightPositions[i];
        const light = scene.getObjectByPosition(new THREE.Vector3(x, y - 0.15, z));

        if (light && light.isPointLight) {
          light.intensity = 1.15 + Math.sin(elapsed * 0.7 + i) * 0.12;
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
