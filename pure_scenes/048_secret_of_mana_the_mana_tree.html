<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Island Adventure</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b8c0bd;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .title-card {
      position: fixed;
      top: 24px;
      left: 26px;
      z-index: 2;
      padding: 15px 19px;
      color: #28342f;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow: 0 12px 35px rgba(31, 43, 35, 0.16);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .title-card h1 {
      margin: 0 0 4px;
      font-size: 21px;
      letter-spacing: 0.02em;
    }

    .title-card p {
      margin: 0;
      font-size: 13px;
      color: #657269;
    }

    .hint {
      position: fixed;
      right: 22px;
      bottom: 20px;
      z-index: 2;
      padding: 9px 12px;
      color: #344039;
      background: rgba(255, 255, 255, 0.68);
      border-radius: 999px;
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .title-card {
        top: 14px;
        left: 14px;
      }

      .title-card h1 {
        font-size: 17px;
      }

      .hint {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="scene"></div>

  <div class="title-card">
    <h1>Little Voxel Island</h1>
    <p>A tiny world of friends, forest magic, and flying birds.</p>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js";

    const container = document.getElementById("scene");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8c0bd);
    scene.fog = new THREE.Fog(0xb8c0bd, 15, 32);

    const camera = new THREE.PerspectiveCamera(
      38,
      innerWidth / innerHeight,
      0.1,
      100
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xf5fbff, 0x60714d, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1cf, 3.6);
    sun.position.set(6, 10, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8d9ff, 1.2);
    fill.position.set(-6, 5, -4);
    scene.add(fill);

    // Shared materials
    const materials = {
      grass: new THREE.MeshStandardMaterial({
        color: 0x6fa84b,
        roughness: 0.9
      }),
      grassDark: new THREE.MeshStandardMaterial({
        color: 0x477d37,
        roughness: 0.95
      }),
      grassLight: new THREE.MeshStandardMaterial({
        color: 0x8bc65d,
        roughness: 0.88
      }),
      soil: new THREE.MeshStandardMaterial({
        color: 0x8a6540,
        roughness: 1
      }),
      water: new THREE.MeshStandardMaterial({
        color: 0x4f9e9d,
        roughness: 0.34,
        metalness: 0.08,
        transparent: true,
        opacity: 0.9
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x3f9f45,
        roughness: 0.85
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x68bd4d,
        roughness: 0.8
      }),
      leafDark: new THREE.MeshStandardMaterial({
        color: 0x286b35,
        roughness: 0.9
      }),
      trunk: new THREE.MeshStandardMaterial({
        color: 0x795039,
        roughness: 0.95
      }),
      skin: new THREE.MeshStandardMaterial({
        color: 0xf3b277,
        roughness: 0.72
      }),
      skinLight: new THREE.MeshStandardMaterial({
        color: 0xffd29c,
        roughness: 0.7
      }),
      hair: new THREE.MeshStandardMaterial({
        color: 0x6d3528,
        roughness: 0.82
      }),
      hairLight: new THREE.MeshStandardMaterial({
        color: 0xb56c3b,
        roughness: 0.8
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xf0b84b,
        roughness: 0.4,
        metalness: 0.25
      }),
      pink: new THREE.MeshStandardMaterial({
        color: 0xf287ad,
        roughness: 0.68
      }),
      pinkDark: new THREE.MeshStandardMaterial({
        color: 0xc9547f,
        roughness: 0.72
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x4f91bd,
        roughness: 0.6
      }),
      cream: new THREE.MeshStandardMaterial({
        color: 0xf8e6c2,
        roughness: 0.75
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xf04d56,
        roughness: 0.55
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x25302d,
        roughness: 0.8
      })
    };

    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
    const voxelBatches = {
      grass: [],
      grassLight: [],
      grassDark: [],
      soil: [],
      leaf: [],
      leafLight: [],
      leafDark: [],
      trunk: [],
      skin: [],
      skinLight: [],
      hair: [],
      hairLight: [],
      gold: [],
      pink: [],
      pinkDark: [],
      blue: [],
      cream: [],
      red: [],
      black: []
    };

    function addVoxel(x, y, z, sx = 1, sy = 1, sz = 1, materialKey = "grass", rotationY = 0) {
      const key = `${materialKey}:${x.toFixed(2)}:${y.toFixed(2)}:${z.toFixed(2)}:${sx.toFixed(2)}:${sy.toFixed(2)}:${sz.toFixed(2)}:${rotationY.toFixed(2)}`;

      if (!voxelBatches[materialKey].has(key)) {
        voxelBatches[materialKey].add(key);
      }
    }

    function buildVoxels() {
      const groups = {};
      const dummy = new THREE.Object3D();

      for (const [materialKey, keys] of Object.entries(voxelBatches)) {
        groups[materialKey] = new THREE.Group();

        for (const key of keys) {
          const [mat, x, y, z, sx, sy, sz, rotY] = key.split(":");

          dummy.position.set(x, y, z);
          dummy.rotation.y = rotY;
          dummy.scale.set(sx, sy, sz);
          dummy.updateMatrix();

          const mesh = new THREE.Mesh(cubeGeometry, materials[mat]);
          mesh.position.copy(dummy.position);
          mesh.rotation.y = rotY;
          mesh.scale.copy(dummy.scale);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          groups[materialKey].add(mesh);
        }

        scene.add(groups[materialKey]);
      }
    }

    // Island: stepped voxel foundation
    const islandRadiusX = 3.25;
    const islandRadiusZ = 2.75;
    const islandHeight = 1.35;

    for (let x = -4; x <= 4; x++) {
      for (let z = -3; z <= 3; z++) {
        const distance = Math.sqrt((x / islandRadiusX) ** 2 + (z / islandRadiusZ) ** 2);

        if (distance <= 1.08) {
          addVoxel(
            x * 0.52,
            -islandHeight * 0.5,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "soil"
          );
        }

        if (distance <= 0.92) {
          addVoxel(
            x * 0.52,
            -islandHeight * 0.25,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "grassDark"
          );
        }

        if (distance <= 0.78) {
          addVoxel(
            x * 0.52,
            islandHeight * 0.25,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "grass"
          );
        }
      }
    }

    // Water ring around the island
    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      const x = Math.cos(angle) * 4.35;
      const z = Math.sin(angle) * 3.75;

      addVoxel(x, -0.18, z, 0.65, 0.36, 0.65, "water");
      addVoxel(
        x * 1.08,
        -0.36,
        z * 1.08,
        0.55,
        0.2,
        0.55,
        "leafDark"
      );
    }

    // Lily pads
    const padPositions = [
      [-2.2, 0.38, 0.55],
      [2.15, 0.38, -0.65],
      [0.3, 0.38, 2.05],
      [-0.8, 0.38, -2.15],
      [2.65, 0.38, 1.2]
    ];

    for (const [x, y, z] of padPositions) {
      addVoxel(x, y, z, 0.8, 0.16, 0.8, "leafLight");
      addVoxel(x + 0.2, y + 0.1, z, 0.28, 0.18, 0.28, "leaf");
    }

    // Tree trunk
    const trunkWidth = 0.7;
    const trunkHeight = 3.2;

    for (let y = 0.25; y < 3.2; y += 0.42) {
      const radius = 0.52 - y * 0.07;
      const centerX = 0;
      const centerZ = 0.15;

      for (let ix = -2; ix <= 2; ix++) {
        for (let iz = -2; iz <= 2; iz++) {
          const dx = ix * 0.35;
          const dz = iz * 0.35;
          const radial = Math.sqrt((dx / radius) ** 2 + ((dz - centerZ) / radius) ** 2);

          if (radial <= 1) {
            addVoxel(
              centerX + dx,
              y,
              centerZ + dz,
              0.34,
              0.39,
              0.34,
              "trunk"
            );
          }
        }
      }
    }

    // Tree canopy, built as layered cubic clusters
    const treeCanopy = [
      { y: 3.55, rx: 1.55, rz: 1.45, mat: "leaf" },
      { y: 4.05, rx: 1.25, rz: 1.15, mat: "leafLight" },
      { y: 4.55, rx: 0.9, rz: 0.85, mat: "leaf" },
      { y: 5.05, rx: 0.6, rz: 0.6, mat: "leafDark" }
    ];

    for (const layer of treeCanopy) {
      for (let ix = -3; ix <= 3; ix++) {
        for (let iz = -3; iz <= 3; iz++) {
          const dx = ix * 0.34;
          const dz = iz * 0.34;
          const radial = Math.sqrt((dx / layer.rx) ** 2 + (dz / layer.rz) ** 2);

          if (radial <= 1) {
            addVoxel(
              dx,
              layer.y,
              0.15 + dz,
              0.32,
              0.34,
              0.32,
              layer.mat
            );
          }
        }
      }
    }

    // Hanging vines
    for (const [x, z, length] of [
      [-0.7, 0.7, 1.3],
      [0.65, 0.7, 1.5],
      [0.15, -0.75, 1.25]
    ]) {
      for (let y = 3.35; y > 1.9; y -= 0.24) {
        addVoxel(x, y, z, 0.15, 0.22, 0.15, "leafDark");
      }
    }

    // Red birds flying around the tree
    const birdGroup = new THREE.Group();
    const birdMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xf04d56, roughness: 0.6 }),
      new THREE.MeshStandardMaterial({ color: 0xff7d72, roughness: 0.65 })
    ];

    function createBird(scale = 1, rotation = 0) {
      const bird = new THREE.Group();
      bird.scale.setScalar(scale);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.24, 0.16, 0.42),
        birdMaterials[0]
      );
      body.rotation.y = Math.PI / 2;
      bird.add(body);

      const tail = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.04, 0.38),
        birdMaterials[1]
      );
      tail.position.set(0.22, 0, 0);
      tail.rotation.y = -Math.PI / 2;
      bird.add(tail);

      const wing = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.06, 0.28),
        birdMaterials[0]
      );
      wing.position.set(0.05, 0.04, 0.15);
      wing.rotation.y = 0.2;
      bird.add(wing);

      bird.rotation.y = rotation;
      return bird;
    }

    const birds = [
      createBird(0.8, 0.4),
      createBird(0.65, -1.2),
      createBird(0.5, 2.1),
      createBird(0.45, 3.2),
      createBird(0.35, -2.5)
    ];

    for (const bird of birds) {
      birdGroup.add(bird);
      scene.add(birdGroup);
    }

    // Character builder
    function makeCharacter({
      x,
      z,
      rotation,
      skinMaterial = "skin",
      hairMaterial = "hair",
      shirtMaterial = "blue",
      skirtMaterial = "pink",
      headRadius = 0.42,
      bodyHeight = 0.95,
      legs = 2,
      arms = 2
    }) {
      const character = new THREE.Group();
      character.position.set(x, 0, z);
      character.rotation.y = rotation;

      const bodyGroup = new THREE.Group();
      character.add(bodyGroup);

      // Legs
      for (let i = 0; i < legs; i++) {
        const legX = -0.18 + i * 0.36;
        addVoxel(
          legX,
          0.18,
          0,
          0.2,
          0.36,
          0.24,
          "black",
          0
        );
        addVoxel(
          legX,
          0.43,
          0,
          0.16,
          0.16,
          0.2,
          "black"
        );
      }

      // Torso
      addVoxel(0, 0.78, 0, 0.5, 0.55, 0.34, shirtMaterial);
      addVoxel(0, 1.02, 0, 0.48, 0.16, 0.35, "cream");

      // Neck
      addVoxel(0, 1.22, 0, 0.16, 0.16, 0.16, "skinLight");

      // Head
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.43, 16, 12),
        skinMaterial
      );
      head.position.set(0, 1.55, 0);
      head.scale.set(1, 1.08, 0.92);
      head.castShadow = true;
      bodyGroup.add(head);

      // Hair cap / crown
      const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.44, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.58),
        hairMaterial
      );
      hair.position.set(0, 1.62, -0.015);
      hair.scale.set(1, 0.92, 0.94);
      hair.castShadow = true;
      bodyGroup.add(hair);

      // Hair bangs
      addVoxel(-0.27, 1.67, 0.04, 0.23, 0.24, 0.24, hairMaterial);
      addVoxel(0.27, 1.67, 0.04, 0.23, 0.24, 0.24, hairMaterial);
      addVoxel(0, 1.72, 0.08, 0.28, 0.16, 0.2, hairMaterial);

      // Eyes
      const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0x273832,
        roughness: 0.35
      });

      for (const side of [-1, 1]) {
        addVoxel(
          side * 0.205,
          1.57,
          0.33,
          0.075,
          0.075,
          0.045,
          "black"
        );
        addVoxel(
          side * 0.205,
          1.57,
          0.356,
          0.055,
          0.055,
          0.025,
          "cream"
        );
      }

      // Nose
      addVoxel(0, 1.51, 0.39, 0.08, 0.08, 0.055, "black");

      // Arms
      for (let i = 0; i < arms; i++) {
        const side = i === 0 ? -1 : 1;
        addVoxel(
          side * 0.36,
          0.91,
          0.02,
          0.19,
          0.46,
          0.2,
          shirtMaterial
        );
        addVoxel(
          side * 0.5,
          0.72,
          0.02,
          0.16,
          0.18,
          0.17,
          "cream"
        );
      }

      // Character-specific accessories
      if (shirtMaterial === "pink") {
        // Pink fairy dress
        addVoxel(0, 0.65, 0, 0.48, 0.72, 0.42, "pink");
        addVoxel(0, 0.38, 0, 0.62, 0.28, 0.48, "pinkDark");
        addVoxel(0, 0.16, 0, 0.7, 0.14, 0.56, "pink");

        // Wings
        const wingMaterial = new THREE.MeshStandardMaterial({
          color: 0xf7b7d5,
          roughness: 0.75,
          side: THREE.DoubleSide
        });

        for (const side of [-1, 1]) {
          const wing = new THREE.Mesh(
            new THREE.BoxGeometry(0.52, 0.18, 0.34),
            wingMaterial
          );
          wing.position.set(side * 0.46, 1.08, 0.02);
          wing.rotation.z = side * -0.18;
          wing.castShadow = true;
          bodyGroup.add(wing);
        }

        // Crown
        addVoxel(0, 1.88, 0, 0.48, 0.18, 0.34, "gold");
        addVoxel(-0.15, 1.98, 0, 0.12, 0.22, 0.12, "gold");
        addVoxel(0.15, 1.98, 0, 0.12, 0.22, 0.12, "gold");
        addVoxel(0, 2.08, 0, 0.28, 0.12, 0.12, "gold");
      } else if (shirtMaterial === "blue") {
        // Hero tunic
        addVoxel(0, 0.69, 0, 0.52, 0.62, 0.4, "blue");
        addVoxel(0, 0.44, 0, 0.62, 0.25, 0.48, "gold");
        addVoxel(0, 0.2, 0, 0.68, 0.12, 0.54, "blue");

        // Belt
        addVoxel(0, 0.4, 0.02, 0.7, 0.1, 0.5, "gold");
        addVoxel(0, 0.4, 0.29, 0.25, 0.12, 0.08, "gold");
      } else if (shirtMaterial === "cream") {
        // Priestess robe
        addVoxel(0, 0.68, 0, 0.48, 0.85, 0.4, "cream");
        addVoxel(0, 0.35, 0, 0.6, 0.25, 0.46, "gold");
        addVoxel(0, 0.12, 0, 0.68, 0.12, 0.54, "cream");

        // Staff
        addVoxel(0.48, 0.95, 0, 0.1, 1.2, 0.1, "wood");
        addVoxel(0.48, 1.65, 0, 0.22, 0.22, 0.22, "gold");
        addVoxel(0.48, 1.8, 0, 0.3, 0.1, 0.3, "blue");
      }

      scene.add(character);
      return character;
    }

    const fairy = makeCharacter({
      x: -0.95,
      z: 0.05,
      rotation: -0.55,
      skinMaterial: "skinLight",
      hairMaterial: "hairLight",
      shirtMaterial: "pink",
      headRadius: 0.43,
      bodyHeight: 0.95
    });

    const hero = makeCharacter({
      x: 0.05,
      z: 0.35,
      rotation: 0.55,
      skinMaterial: "skin",
      hairMaterial: "hair",
      shirtMaterial: "blue",
      headRadius: 0.46,
      bodyHeight: 1.02,
      legs: 2,
      arms: 2
    });

    const healer = makeCharacter({
      x: 1.05,
      z: -0.25,
      rotation: -0.45,
      skinMaterial: "skin",
      hairMaterial: "hairLight",
      shirtMaterial: "cream",
      headRadius: 0.42,
      bodyHeight: 0.95
    });

    // Small glowing magic crystal
    const crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.24),
      new THREE.MeshStandardMaterial({
        color: 0x75e8ff,
        emissive: 0x28b9d8,
        emissiveIntensity: 1.4,
        roughness: 0.25,
        metalness: 0.1
      })
    );
    crystal.position.set(1.55, 0.78, -0.75);
    crystal.scale.y = 1.5;
    crystal.castShadow = true;
    scene.add(crystal);

    // Tiny flowers
    const flowerColors = [0xf2a85b, 0xf4d56f, 0xd889c8, 0x9bdbc8];

    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2 + 0.4;
      const radius = 0.7 + (i % 4) * 0.16;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      addVoxel(
        x,
        0.55,
        z,
        0.09,
        0.28,
        0.09,
        "leafDark"
      );

      const flowerMaterial = new THREE.MeshStandardMaterial({
        color: flowerColors[i % flowerColors.length],
        roughness: 0.7
      });

      const bloom = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 8, 6),
        flowerMaterial
      );
      bloom.position.set(x, 0.72, z);
      bloom.scale.y = 0.7;
      bloom.castShadow = true;
      scene.add(bloom);
    }

    // Build the instanced voxel groups
    buildVoxels();

    // Gentle floating animation for the island
    const island = new THREE.Group();
    scene.add(island);

    // Recreate island elements under island group
    const islandElements = [];

    // We need rebuild the scene with island group.
    // Since buildVoxels already added to scene, remove everything and rebuild.
    scene.traverse((object) => {
      if (object.isMesh) {
        scene.remove(object);
      }
    });

    voxelBatches = {
      grass: [],
      grassLight: [],
      grassDark: [],
      soil: [],
      leaf: [],
      leafLight: [],
      leafDark: [],
      trunk: [],
      skin: [],
      skinLight: [],
      hair: [],
      hairLight: [],
      gold: [],
      pink: [],
      pinkDark: [],
      blue: [],
      cream: [],
      red: [],
      black: []
    };

    // Rebuild island
    for (let x = -4; x <= 4; x++) {
      for (let z = -3; z <= 3; z++) {
        const distance = Math.sqrt((x / islandRadiusX) ** 2 + (z / islandRadiusZ) ** 2);

        if (distance <= 1.08) {
          addVoxel(
            x * 0.52,
            -islandHeight * 0.5,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "soil"
          );
        }

        if (distance <= 0.92) {
          addVoxel(
            x * 0.52,
            -islandHeight * 0.25,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "grassDark"
          );
        }

        if (distance <= 0.78) {
          addVoxel(
            x * 0.52,
            islandHeight * 0.25,
            z * 0.48,
            0.5,
            0.5,
            0.5,
            "grass"
          );
        }
      }
    }

    for (const [x, y, z] of padPositions) {
      addVoxel(x, y, z, 0.8, 0.16, 0.8, "leafLight");
      addVoxel(x + 0.2, y + 0.1, z, 0.28, 0.18, 0.28, "leaf");
    }

    // Rebuild tree
    for (let y = 0.25; y < 3.2; y += 0.42) {
      const radius = 0.52 - y * 0.07;

      for (let ix = -2; ix <= 2; ix++) {
        for (let iz = -2; iz <= 2; iz++) {
          const dx = ix * 0.35;
          const dz = iz * 0.35;
          const radial = Math.sqrt((dx / radius) ** 2 + ((dz - 0.15) / radius) ** 2);

          if (radial <= 1) {
            addVoxel(
              dx,
              y,
              0.15 + dz,
              0.34,
              0.39,
              0.34,
              "trunk"
            );
          }
        }
      }
    }

    const treeCanopy = [
      { y: 3.55, rx: 1.55, rz: 1.45, mat: "leaf" },
      { y: 4.05, rx: 1.25, rz: 1.15, mat: "leafLight" },
      { y: 4.55, rx: 0.9, rz: 0.85, mat: "leaf" },
      { y: 5.05, rx: 0.6, rz: 0.6, mat: "leafDark" }
    ];

    for (const layer of treeCanopy) {
      for (let ix = -3; ix <= 3; ix++) {
        for (let iz = -3; iz <= 3; iz++) {
          const dx = ix * 0.34;
          const dz = iz * 0.34;
          const radial = Math.sqrt((dx / layer.rx) ** 2 + (dz / layer.rz) ** 2);

          if (radial <= 1) {
            addVoxel(
              dx,
              layer.y,
              0.15 + dz,
              0.32,
              0.34,
              0.32,
              layer.mat
            );
          }
        }
      }
    }

    for (const [x, z, length] of [
      [-0.7, 0.7, 1.3],
      [0.65, 0.7, 1.5],
      [0.15, -0.75, 1.25]
    ]) {
      for (let y = 3.35; y > 1.9; y -= 0.24) {
        addVoxel(x, y, z, 0.15, 0.22, 0.15, "leafDark");
      }
    }

    // Rebuild characters
    fairy = makeCharacter({
      x: -0.95,
      z: 0.05,
      rotation: -0.55,
      skinMaterial: "skinLight",
      hairMaterial: "hairLight",
      shirtMaterial: "pink",
      headRadius: 0.43,
      bodyHeight: 0.95
    });

    hero = makeCharacter({
      x: 0.05,
      z: 0.35,
      rotation: 0.55,
      skinMaterial: "skin",
      hairMaterial: "hair",
      shirtMaterial: "blue",
      headRadius: 0.46,
      bodyHeight: 1.02,
      legs: 2,
      arms: 2
    });

    healer = makeCharacter({
      x: 1.05,
      z: -0.25,
      rotation: -0.45,
      skinMaterial: "skin",
      hairMaterial: "hairLight",
      shirtMaterial: "cream",
      headRadius: 0.42,
      bodyHeight: 0.95
    });

    // Rebuild birds
    const birdGroup = new THREE.Group();
    const birdMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xf04d56, roughness: 0.6 }),
      new THREE.MeshStandardMaterial({ color: 0xff7d72, roughness: 0.65 })
    ];

    function createBird(scale = 1, rotation = 0) {
      const bird = new THREE.Group();
      bird.scale.setScalar(scale);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.24, 0.16, 0.42),
        birdMaterials[0]
      );
      body.rotation.y = Math.PI / 2;
      bird.add(body);

      const tail = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.04, 0.38),
        birdMaterials[1]
      );
      tail.position.set(0.22, 0, 0);
      tail.rotation.y = -Math.PI / 2;
      bird.add(tail);

      const wing = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.06, 0.28),
        birdMaterials[0]
      );
      wing.position.set(0.05, 0.04, 0.15);
      wing.rotation.y = 0.2;
      bird.add(wing);

      bird.rotation.y = rotation;
      return bird;
    }

    const birdData = [
      { position: [-1.2, 4.6, -0.4], scale: 0.8, rotation: 0.4 },
      { position: [0.5, 5.35, -0.7], scale: 0.65, rotation: -1.2 },
      { position: [1.5, 4.35, 0.6], scale: 0.5, rotation: 2.1 },
      { position: [-0.4, 5.7, 0.3], scale: 0.45, rotation: 3.2 },
      { position: [0.1, 4.0, 1.1], scale: 0.35, rotation: -2.5 }
    ];

    for (const data of birdData) {
      const bird = createBird(data.scale, data.rotation);
      bird.position.set(...data.position);
      birdGroup.add(bird);
    }

    // Add all rebuilt elements to island
    const islandObjects = [
      ...scene.children,
      fairy,
      hero,
      healer,
      birdGroup,
      crystal
    ];

    for (const object of islandObjects) {
      island.add(object);
    }

    // Camera controls implemented directly
    let azimuth = 0.68;
    let polar = 1.12;
    let radius = 10.8;
    let target = new THREE.Vector3(0, 1.8, 0);

    function updateCamera() {
      const sinPolar = Math.sin(polar);

      camera.position.set(
        target.x + radius * sinPolar * Math.sin(azimuth),
        target.y + radius * Math.cos(polar),
        target.z + radius * sinPolar * Math.cos(azimuth)
      );

      camera.lookAt(target);
    }

    updateCamera();

    const pointer = new THREE.Vector2();
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      azimuth -= deltaX * 0.006;
      polar = THREE.MathUtils.clamp(polar - deltaY * 0.005, 0.45, 1.45);

      updateCamera();
    });

    function stopDragging(event) {
      dragging = false;
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", stopDragging);
    renderer.domElement.addEventListener("pointercancel", stopDragging);

    renderer.domElement.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        radius = THREE.MathUtils.clamp(radius + event.deltaY * 0.008, 6.5, 15);
        updateCamera();
      },
      { passive: false }
    });

    // Responsive resize
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    // Animation
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      // Island bob
      island.position.y = Math.sin(elapsed * 1.35) * 0.055;
      island.rotation.z = Math.sin(elapsed * 0.85) * 0.018;
      island.rotation.x = Math.cos(elapsed * 0.7) * 0.012;

      // Bird flapping and movement
      for (let i = 0; i < birdGroup.children.length; i++) {
        const bird = birdGroup.children[i];
        bird.position.y += Math.sin(elapsed * 1.4 + i) * 0.0025;

        const wing = bird.children[2];
        wing.rotation.z = Math.sin(elapsed * 8 + i) * 0.2;
        bird.rotation.y += Math.cos(elapsed * 1.4 + i) * 0.00035;
      }

      // Crystal pulse
      crystal.scale.set(
        0.24 * (1 + Math.sin(elapsed * 2.1) * 0.08),
        0.36 * (1 + Math.sin(elapsed * 2.1) * 0.1),
        0.24 * (1 + Math.sin(elapsed * 2.1) * 0.08)
      );

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
